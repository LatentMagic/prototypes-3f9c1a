<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="../../../" />
<title>Fund circle — mobile fit options</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="swell.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7E7E2; }
  #root { min-height: 100vh; }

  /* micro-dot sweep (lifted from circlists.html) */
  @keyframes circ-micro-reveal { 0% { transform: translateX(0);} 64% { transform: translateX(86px);} 100% { transform: translateX(86px);} }
  .circ-micro-halo-static { display: none; }
  .circ-micro-reveal { animation: circ-micro-reveal 3800ms cubic-bezier(0.45,0,0.15,1) infinite; }
  @media (prefers-reduced-motion: reduce) {
    .circ-micro-reveal { animation: none !important; display: none !important; }
    .circ-micro-halo-static { display: block !important; }
  }

  .circ-btn { transition: background var(--duration-base) var(--ease-quiet), opacity var(--duration-base); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-btn-primary:active { background: var(--color-accent-press) !important; }
  .circ-iconbtn:hover { background: var(--color-surface-sunken) !important; }
  .circ-disc:hover { background: var(--color-surface-sunken) !important; }

  /* studio */
  .studio { min-height: 100vh; padding: 40px clamp(20px,4vw,64px) 96px; }
  .studio-head { max-width: 1100px; margin: 0 auto 8px; }
  .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent); font-weight: 500; margin: 0 0 10px; }
  .studio-head h1 { font-family: var(--font-sans); font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: var(--color-fg-1); margin: 0 0 10px; }
  .studio-head p { font-family: var(--font-sans); font-size: 15px; line-height: 1.55; color: var(--color-fg-2); margin: 0; max-width: 720px; }

  .rail { display: flex; gap: 40px; overflow-x: auto; padding: 40px 4px 24px; scroll-snap-type: x proximity; }
  .col { scroll-snap-align: start; flex: 0 0 auto; width: 393px; }
  .col-head { margin: 0 0 18px; padding: 0 2px; }
  .col-tag { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; color: var(--color-fg-1); margin-bottom: 8px; }
  .col-tag .n { width: 22px; height: 22px; border-radius: 50%; background: var(--color-fg-1); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .col-head h2 { font-family: var(--font-sans); font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: var(--color-fg-1); margin: 0 0 5px; }
  .col-head p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0; }
  .verdict { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .verdict.fits { color: var(--color-accent); }
  .verdict.scroll { color: var(--color-fg-3); }
  .verdict .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* phone */
  .phone { width: 393px; height: 812px; background: #0A0A0A; border-radius: 46px; padding: 8px; box-shadow: 0 30px 60px rgba(10,10,10,.22), 0 8px 20px rgba(10,10,10,.12); }
  .screen { position: relative; width: 100%; height: 100%; background: var(--color-page); border-radius: 38px; overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { flex: 0 0 auto; height: 46px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 34px; font-family: var(--font-sans); }
  .statusbar .time { font-weight: 600; font-size: 14px; color: var(--color-fg-1); letter-spacing: .01em; }
  .statusbar .sys { display: flex; align-items: center; gap: 6px; color: var(--color-fg-1); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .scrollhint { pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState } = React;

// ---- primitives (self-contained copies from app/primitives.jsx) -----------
const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  'chevron-down': '<polyline points="6 9 12 15 18 9"></polyline>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
  list: '<line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>',
  eye: '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle>',
};
const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.5, style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', ...style }} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
);
const MicroDot = ({ size = 10 }) => {
  const uid = React.useId().replace(/:/g, '');
  const clipId = `mc-${uid}`, gradId = `mg-${uid}`;
  return (
    <svg width={size} height={size} viewBox="-2 -2 52 52" aria-hidden="true" style={{ display: 'block', flexShrink: 0 }}>
      <defs>
        <clipPath id={clipId}><circle cx="24" cy="24" r="22.5" /></clipPath>
        <linearGradient id={gradId} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="var(--color-sage)" stopOpacity="0" />
          <stop offset="0.5" stopColor="var(--color-sage)" stopOpacity="1" />
          <stop offset="1" stopColor="var(--color-sage)" stopOpacity="0" />
        </linearGradient>
      </defs>
      <circle className="circ-micro-halo-static" cx="24" cy="24" r="22.5" fill="var(--color-sage)" />
      <g clipPath={`url(#${clipId})`}><rect className="circ-micro-reveal" x="-32" y="-10" width="26" height="68" fill={`url(#${gradId})`} /></g>
      <circle cx="24" cy="24" r="14.25" fill="var(--color-accent)" />
      <circle cx="24" cy="24" r="14.925" fill="none" stroke="#fff" strokeWidth="1.35" />
    </svg>
  );
};
const Button = ({ variant = 'primary', full, size = 'md', onClick, children, style = {} }) => {
  const pad = size === 'lg' ? '14px 22px' : '11px 18px';
  const minH = size === 'lg' ? 52 : 44;
  const vs = {
    primary: { background: 'var(--color-accent)', color: '#fff' },
    secondary: { background: 'var(--color-surface)', color: 'var(--color-fg-1)', border: '1px solid var(--color-border-1)', fontWeight: 500 },
  }[variant];
  return (
    <button onClick={onClick} className={'circ-btn circ-btn-' + variant} style={{
      fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: size === 'lg' ? 16 : 14, lineHeight: 1,
      padding: pad, borderRadius: 'var(--radius-md)', border: 0, minHeight: minH, width: full ? '100%' : 'auto',
      cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, whiteSpace: 'nowrap',
      ...vs, ...style,
    }}>{children}</button>
  );
};

// ---- shared content --------------------------------------------------------
const SPACE = 'Backend Pod';
const EMAIL = 'sam.rivera@gmail.com';
const FEATURES = [
  { icon: 'users', label: 'You fund the circle as its champion' },
  { icon: 'users', label: 'Up to 10 members, all invited free' },
  { icon: 'list', label: 'Shared list, private read-state' },
];

const XBtn = ({ onClick }) => (
  <button onClick={onClick} aria-label="Exit" className="circ-iconbtn" style={{
    background: 'transparent', border: 0, padding: 8, margin: 0, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40,
    borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)',
  }}><Icon name="x" size={20} /></button>
);
const BackBtn = ({ onClick }) => (
  <button onClick={onClick} aria-label="Back" className="circ-iconbtn" style={{
    background: 'transparent', border: 0, padding: 8, margin: 0, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40,
    borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)',
  }}><Icon name="arrow-left" size={20} /></button>
);
const Eyebrow = () => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 12, letterSpacing: '0.06em',
    textTransform: 'uppercase', color: 'var(--color-accent)' }}>
    <span>New circle</span><MicroDot size={10} /><span style={{ fontWeight: 700 }}>{SPACE}</span>
  </div>
);
const secureLine = (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, color: 'var(--color-fg-3)' }}>
    <Icon name="lock" size={13} />
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout · powered by a payment provider</span>
  </div>
);
const Price = ({ big = 48 }) => (
  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10 }}>
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: big, letterSpacing: '-0.03em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, letterSpacing: '0.02em', color: 'var(--color-fg-2)', lineHeight: 1.35, textAlign: 'left' }}>per circle<br />/ month</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', marginLeft: 6, padding: '2px 8px', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap' }}>Founding rate</span>
  </div>
);
const FeatureRow = ({ f, compact }) => (
  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
    <span style={{ marginTop: 1, color: 'var(--color-accent)', flex: 'none' }}><Icon name="check" size={compact ? 18 : 20} /></span>
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 400, fontSize: compact ? 15 : 16, lineHeight: 1.4, color: 'var(--color-fg-1)' }}>{f.label}</span>
  </div>
);

// ============================================================================
// VARIANT 0 — CURRENT (the broken baseline, for reference)
// ============================================================================
const Current = () => (
  <div style={{ height: '100%', overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
    <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'flex-end', padding: '12px 16px', flex: 'none' }}><XBtn /></header>
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '24px 20px 40px' }}>
      <div style={{ maxWidth: 408, width: '100%', textAlign: 'center' }}>
        <div style={{ marginBottom: 16 }}><Eyebrow /></div>
        <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 32, lineHeight: 1.15, letterSpacing: '-0.025em', color: 'var(--color-fg-1)', margin: '0 0 10px' }}>Fund your circle.</h1>
        <p style={{ fontFamily: 'var(--font-sans)', fontSize: 16, lineHeight: 1.55, color: 'var(--color-fg-2)', margin: '0 auto 32px', maxWidth: 420 }}>Everyone you invite joins free.</p>
        <div style={{ background: 'var(--color-surface)', border: '1px solid var(--color-border-1)', borderRadius: 'var(--radius-lg)', padding: 32, boxShadow: 'var(--shadow-raised)' }}>
          <div style={{ marginBottom: 24 }}><Price /></div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 28, width: 'fit-content', marginInline: 'auto', textAlign: 'left' }}>{FEATURES.map(f => <FeatureRow key={f.label} f={f} />)}</div>
          <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-3)', marginBottom: 20 }}>Billed to {EMAIL}. Cancel anytime.</div>
          <Button variant="primary" full size="lg">Fund this circle</Button>
          <div style={{ marginTop: 14 }}>{secureLine}</div>
        </div>
        <div style={{ textAlign: 'left', marginTop: 20 }}>
          <button className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: '8px 6px', margin: '0 0 0 -6px', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, minHeight: 40, fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 14, color: 'var(--color-fg-2)' }}><Icon name="arrow-left" size={16} /> Back</button>
        </div>
      </div>
    </div>
  </div>
);

// ============================================================================
// VARIANT 1 — TIGHTEN IN PLACE (least change)
// Same composition, flattened card + reduced scale. Fits, minimal restructure.
// ============================================================================
const Tighten = () => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}><BackBtn /><XBtn /></header>
    <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '8px 24px 24px', textAlign: 'center' }}>
      <div style={{ marginBottom: 14 }}><Eyebrow /></div>
      <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: '0 0 20px' }}>Fund your circle</h1>
      <div style={{ marginBottom: 22 }}><Price big={44} /></div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 22, width: '100%', maxWidth: 300, textAlign: 'left' }}>{FEATURES.map(f => <FeatureRow key={f.label} f={f} compact />)}</div>
      <Button variant="primary" full size="lg" style={{ maxWidth: 320 }}>Fund this circle</Button>
      <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', margin: '12px 0 12px' }}>Billed to {EMAIL}. Cancel anytime.</div>
      {secureLine}
    </div>
  </div>
);

// ============================================================================
// VARIANT 2 — SCROLL BODY + STICKY CTA (most robust)
// Nav row (back + X). Body scrolls freely. Price+button pinned to a footer bar.
// ============================================================================
const StickyCTA = () => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none', borderBottom: '1px solid var(--color-border-2)' }}><BackBtn /><XBtn /></header>
    <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', padding: '28px 24px 24px', textAlign: 'center' }}>
      <div style={{ marginBottom: 16 }}><Eyebrow /></div>
      <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 30, lineHeight: 1.15, letterSpacing: '-0.025em', color: 'var(--color-fg-1)', margin: '0 0 10px' }}>Fund your circle.</h1>
      <p style={{ fontFamily: 'var(--font-sans)', fontSize: 16, lineHeight: 1.55, color: 'var(--color-fg-2)', margin: '0 auto 28px', maxWidth: 340 }}>Everyone you invite joins free.</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 14, width: '100%', maxWidth: 320, marginInline: 'auto', textAlign: 'left' }}>{FEATURES.map(f => <FeatureRow key={f.label} f={f} />)}</div>
    </div>
    <div style={{ flex: 'none', borderTop: '1px solid var(--color-border-1)', background: 'var(--color-surface)', padding: '16px 24px 24px', boxShadow: '0 -4px 16px rgba(10,10,10,0.04)' }}>
      <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'center', gap: 8, marginBottom: 12 }}>
        <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, letterSpacing: '-0.02em', color: 'var(--color-fg-1)' }}>£3</span>
        <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--color-fg-2)' }}>/ month</span>
        <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', padding: '2px 8px', borderRadius: 'var(--radius-pill)' }}>Founding rate</span>
      </div>
      <Button variant="primary" full size="lg">Fund this circle</Button>
      <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', textAlign: 'center', marginTop: 10 }}>Billed to {EMAIL}. Cancel anytime.</div>
    </div>
  </div>
);

// ============================================================================
// VARIANT 3 — NAV BAR, NO HERO (tightest single screen)
// Drop the big headline; eyebrow + name IS the heading. Everything visible.
// ============================================================================
const NoHero = () => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}>
      <BackBtn />
      <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 15, color: 'var(--color-fg-1)' }}>Fund your circle</span>
      <XBtn />
    </header>
    <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '8px 24px 24px' }}>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 22 }}><Eyebrow /></div>
      <div style={{ background: 'var(--color-surface)', border: '1px solid var(--color-border-1)', borderRadius: 'var(--radius-lg)', padding: '28px 24px', boxShadow: 'var(--shadow-raised)' }}>
        <div style={{ marginBottom: 24 }}><Price big={44} /></div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 13, marginBottom: 24 }}>{FEATURES.map(f => <FeatureRow key={f.label} f={f} compact />)}</div>
        <Button variant="primary" full size="lg">Fund this circle</Button>
        <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', textAlign: 'center', margin: '14px 0 12px' }}>Billed to {EMAIL}. Cancel anytime.</div>
        {secureLine}
      </div>
    </div>
  </div>
);

// ============================================================================
// VARIANT 4 — PROGRESSIVE DISCLOSURE
// Price + CTA shown immediately; features behind a "What's included" expander.
// ============================================================================
const Disclose = () => {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}><BackBtn /><XBtn /></header>
      <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '8px 24px 24px', textAlign: 'center' }}>
        <div style={{ marginBottom: 16 }}><Eyebrow /></div>
        <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 28, lineHeight: 1.15, letterSpacing: '-0.025em', color: 'var(--color-fg-1)', margin: '0 0 24px' }}>Fund your circle.</h1>
        <div style={{ marginBottom: 20 }}><Price /></div>
        <div style={{ width: '100%', maxWidth: 320 }}>
          <button onClick={() => setOpen(o => !o)} className="circ-disc" aria-expanded={open} style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, background: 'transparent', border: '1px solid var(--color-border-1)', borderRadius: 'var(--radius-md)', padding: '12px 16px', cursor: 'pointer', fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 14, color: 'var(--color-fg-1)', marginBottom: open ? 12 : 20 }}>
            <span>What's included</span>
            <Icon name="chevron-down" size={18} style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform var(--duration-slow) var(--ease-quiet)', color: 'var(--color-fg-2)' }} />
          </button>
          {open && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12, textAlign: 'left', padding: '4px 4px 20px' }}>{FEATURES.map(f => <FeatureRow key={f.label} f={f} compact />)}</div>
          )}
          <Button variant="primary" full size="lg">Fund this circle</Button>
          <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', margin: '14px 0 12px' }}>Billed to {EMAIL}. Cancel anytime.</div>
          {secureLine}
        </div>
      </div>
    </div>
  );
};

// ============================================================================
// VARIANT 5 — ORDER-SUMMARY REFRAME
// Reframed as a compact review list (rows), calmer + denser. Fits comfortably.
// ============================================================================
const SummaryRow = ({ icon, label, value, sub }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 0', borderTop: '1px solid var(--color-border-2)' }}>
    <span style={{ color: 'var(--color-fg-3)', flex: 'none' }}><Icon name={icon} size={18} /></span>
    <div style={{ flex: 1, minWidth: 0, textAlign: 'left' }}>
      <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 15, color: 'var(--color-fg-1)' }}>{label}</div>
      {sub && <div style={{ fontFamily: 'var(--font-sans)', fontSize: 13, color: 'var(--color-fg-3)', marginTop: 1 }}>{sub}</div>}
    </div>
    {value && <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 14, color: 'var(--color-fg-2)', flex: 'none' }}>{value}</span>}
  </div>
);
const OrderSummary = () => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}><BackBtn /><XBtn /></header>
    <div style={{ flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '8px 24px 24px' }}>
      <div style={{ display: 'flex', justifyContent: 'center', marginBottom: 14 }}><Eyebrow /></div>
      <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: '0 0 20px', textAlign: 'center' }}>Fund your circle</h1>
      <div style={{ background: 'var(--color-surface)', border: '1px solid var(--color-border-1)', borderRadius: 'var(--radius-lg)', padding: '4px 20px 20px', boxShadow: 'var(--shadow-raised)', marginBottom: 20 }}>
        <SummaryRow icon="users" label="Up to 10 members" sub="All invited free" />
        <SummaryRow icon="list" label="Shared list" sub="Private read-state" />
        <SummaryRow icon="lock" label="You champion it" sub="Cancel anytime" />
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', padding: '16px 0 6px', borderTop: '1px solid var(--color-border-1)', marginTop: 4 }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 15, color: 'var(--color-fg-1)' }}>Total</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 12, color: 'var(--color-accent)' }}>founding rate</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 30, letterSpacing: '-0.02em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: 13, color: 'var(--color-fg-2)' }}>/ mo</span>
          </div>
        </div>
      </div>
      <Button variant="primary" full size="lg">Fund this circle</Button>
      <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', textAlign: 'center', margin: '14px 0 12px' }}>Billed to {EMAIL}</div>
      {secureLine}
    </div>
  </div>
);

// ---- phone frame -----------------------------------------------------------
const Phone = ({ children }) => (
  <div className="phone">
    <div className="screen">
      <div className="statusbar">
        <span className="time">9:41</span>
        <span className="sys">
          <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
          <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.4"/></svg>
        </span>
      </div>
      <div className="app">{children}</div>
    </div>
  </div>
);

const COLS = [
  { n: '0', name: 'Current', desc: 'Vertically-centred; card + hero + Back overflow the viewport and clip. The bug.', fits: false, el: <Current /> },
  { n: '1', name: 'Tighten in place', desc: 'Least change. Flatten the card, drop a size step, snug the spacing. Same page, now it fits.', fits: true, el: <Tighten /> },
  { n: '2', name: 'Scroll body + sticky CTA', desc: 'Nav row (back + X), body scrolls, price & button pinned to a footer. Survives any content length.', fits: true, el: <StickyCTA /> },
  { n: '3', name: 'Nav bar, no hero', desc: 'Headline moves into the top bar; card leads directly. Tightest one-screen read.', fits: true, el: <NoHero /> },
  { n: '4', name: 'Progressive disclosure', desc: 'Price + CTA up front; features tuck behind “What’s included”. Shortest default height.', fits: true, el: <Disclose /> },
  { n: '5', name: 'Order-summary reframe', desc: 'Reads as a review list. Denser, calmer register; big headline traded for compact rows.', fits: true, el: <OrderSummary /> },
];

const App = () => (
  <div className="studio">
    <div className="studio-head">
      <p className="kicker">Create circle → Fund circle · mobile audit</p>
      <h1>Fund circle — five ways to fit one mobile screen</h1>
      <p>The fund step is centred in a full-height flex, so on a phone the card, headline and Back button overrun the viewport and clip. Each option below keeps the X, keeps Back, and keeps the flow from Create a circle — they differ in how they earn the vertical space. Frames are a 393×812 phone; scroll a frame to test overflow.</p>
    </div>
    <div className="rail">
      {COLS.map(c => (
        <div className="col" key={c.n}>
          <div className="col-head">
            <div className="col-tag"><span className="n">{c.n}</span> Option {c.n}</div>
            <h2>{c.name}</h2>
            <p>{c.desc}</p>
            <div className={'verdict ' + (c.fits ? 'fits' : 'scroll')}><span className="dot"></span>{c.fits ? 'Fits one screen' : 'Overflows / clips'}</div>
          </div>
          <Phone>{c.el}</Phone>
        </div>
      ))}
    </div>
  </div>
);

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
