<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create → Fund — wizard, refined</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="swell.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7E7E2; }
  #root { min-height: 100vh; }
  @keyframes circ-micro-reveal { 0% { transform: translateX(0);} 64% { transform: translateX(86px);} 100% { transform: translateX(86px);} }
  .circ-micro-halo-static { display: none; }
  .circ-micro-reveal { animation: circ-micro-reveal 3800ms cubic-bezier(0.45,0,0.15,1) infinite; }
  @media (prefers-reduced-motion: reduce) { .circ-micro-reveal { animation: none !important; display: none !important; } .circ-micro-halo-static { display: block !important; } }
  .circ-btn { transition: background var(--duration-base) var(--ease-quiet), opacity var(--duration-base); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-iconbtn:hover { background: var(--color-surface-sunken) !important; }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 44px clamp(20px,4vw,56px) 120px; }
  .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent); font-weight: 500; margin: 0 0 12px; }
  .lede h1 { font-family: var(--font-sans); font-weight: 600; font-size: 32px; letter-spacing: -0.02em; color: var(--color-fg-1); margin: 0 0 12px; }
  .lede p { font-family: var(--font-sans); font-size: 15.5px; line-height: 1.6; color: var(--color-fg-2); margin: 0 0 10px; max-width: 780px; }

  .fix { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 24px; }
  .fix .card { flex: 1 1 220px; background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-lg); padding: 18px 20px; }
  .fix .card b { display: block; font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--color-fg-1); margin-bottom: 6px; }
  .fix .card p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0; }

  .sec { margin-top: 60px; }
  .sec-head { border-top: 2px solid var(--color-fg-1); padding-top: 16px; margin-bottom: 4px; }
  .sec-head .tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-1); }
  .sec-head h2 { font-family: var(--font-sans); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--color-fg-1); margin: 6px 0 8px; }
  .sec-head p { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--color-fg-2); margin: 0; max-width: 820px; }

  .rail { display: flex; gap: 44px; overflow-x: auto; padding: 32px 4px 20px; align-items: flex-start; }
  .opt { flex: 0 0 auto; }
  .opt-head { max-width: 380px; margin: 0 0 18px; }
  .opt-head .n { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-fg-1); margin-bottom: 8px; }
  .opt-head .n b { width: 22px; height: 22px; border-radius: 50%; background: var(--color-fg-1); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-weight: 700; font-size: 12px; }
  .opt-head h3 { font-family: var(--font-sans); font-weight: 600; font-size: 18px; color: var(--color-fg-1); margin: 0 0 5px; letter-spacing: -0.01em; }
  .opt-head p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0; }

  .pair { display: flex; align-items: center; gap: 16px; }
  .arrow { flex: 0 0 auto; color: var(--color-fg-3); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .arrow .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .04em; text-transform: uppercase; color: var(--color-fg-3); }

  .phone { background: #0A0A0A; border-radius: 44px; padding: 7px; box-shadow: 0 26px 52px rgba(10,10,10,.18), 0 6px 16px rgba(10,10,10,.10); flex: 0 0 auto; }
  .screen { position: relative; width: 372px; height: 720px; background: var(--color-page); border-radius: 37px; overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { flex: 0 0 auto; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px 0 30px; }
  .statusbar .time { font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--color-fg-1); }
  .statusbar .sys { display: flex; align-items: center; gap: 6px; color: var(--color-fg-1); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .caption { text-align: center; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--color-fg-3); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
};
const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.5, style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', ...style }} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
);
const Button = ({ children, style = {} }) => (
  <button className="circ-btn circ-btn-primary" style={{
    fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 16, lineHeight: 1, padding: '14px 22px',
    borderRadius: 'var(--radius-md)', border: 0, minHeight: 52, width: '100%', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8,
    background: 'var(--color-accent)', color: '#fff', ...style,
  }}>{children}</button>
);
const EMAIL = 'sam.rivera@googlemail.com';
const SPACE = 'Backend Pod';

const IconBtn = ({ name, label }) => (
  <button aria-label={label} className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: 8, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40, borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)' }}><Icon name={name} size={20} /></button>
);
// Header: progress lives HERE (in the chrome), never in the body — so the body
// always opens on the title, no eyebrow.
const Chrome = ({ back, center }) => (
  <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}>
    {back ? <IconBtn name="arrow-left" label="Back" /> : <span style={{ width: 40 }} />}
    <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>{center}</div>
    <IconBtn name="x" label="Exit" />
  </header>
);
const Body = ({ children }) => (
  <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'safe center', padding: '4px 24px 28px', textAlign: 'center' }}>
    <div style={{ maxWidth: 340, width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>{children}</div>
  </div>
);
const Title = ({ children, mb = 20 }) => (
  <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: `0 0 ${mb}px` }}>{children}</h1>
);
const Field = ({ value = '', placeholder = 'e.g. Backend Pod' }) => (
  <div style={{ width: '100%', textAlign: 'left', marginBottom: 8 }}>
    <label style={{ display: 'block', marginBottom: 6, fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-2)' }}>Circle name</label>
    <div style={{ width: '100%', fontFamily: 'var(--font-sans)', fontSize: 16, color: value ? 'var(--color-fg-1)' : 'var(--color-fg-3)', border: '1px solid var(--color-accent)', boxShadow: '0 0 0 3px var(--color-accent-ring)', borderRadius: 'var(--radius-md)', padding: '12px 14px', minHeight: 44, background: 'var(--color-surface)' }}>{value || placeholder}</div>
  </div>
);
const Price = () => (
  <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center', columnGap: 10, rowGap: 8 }}>
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 44, letterSpacing: '-0.03em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, letterSpacing: '0.02em', color: 'var(--color-fg-2)', lineHeight: 1.35, textAlign: 'left' }}>per circle<br />/ month</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', marginLeft: 6, padding: '2px 8px', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap' }}>Founding rate</span>
  </div>
);
const Features = () => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: '100%', maxWidth: 300, textAlign: 'left' }}>
    {['You fund the circle as its champion', 'Up to 10 members, all invited free', 'Shared list, private read-state'].map((f, i) => (
      <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
        <span style={{ marginTop: 1, color: 'var(--color-accent)', flex: 'none' }}><Icon name="check" size={18} /></span>
        <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 400, fontSize: 15, lineHeight: 1.4, color: 'var(--color-fg-1)' }}>{f}</span>
      </div>
    ))}
  </div>
);
const FinePrint = () => (
  <>
    <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', margin: '12px 0', maxWidth: 280 }}>Billed to {EMAIL}. <span style={{ whiteSpace: 'nowrap' }}>Cancel anytime.</span></div>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, color: 'var(--color-fg-3)' }}>
      <Icon name="lock" size={13} />
      <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout · powered by a payment provider</span>
    </div>
  </>
);

// ---- the three "upper thing" treatments (the ONLY difference) --------------
const Dots = ({ i }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
    {[0, 1].map(k => <span key={k} style={{ width: k === i ? 22 : 7, height: 7, borderRadius: 4, background: k === i ? 'var(--color-accent)' : 'var(--color-border-1)' }} />)}
  </div>
);
const StepText = ({ i }) => (
  <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-3)' }}>Step {i + 1} of 2</span>
);
const Bar = ({ i }) => (
  <div style={{ flex: 'none', height: 2, background: 'var(--color-border-2)' }}>
    <div style={{ height: '100%', width: i === 0 ? '50%' : '100%', background: 'var(--color-accent)', transition: 'width .3s var(--ease-quiet)' }} />
  </div>
);

// ---- the two bodies (identical across all three treatments) ----------------
const NameBody = () => (
  <Body>
    <Title mb={8}>Name your circle</Title>
    <p style={{ fontFamily: 'var(--font-sans)', fontSize: 15, lineHeight: 1.5, color: 'var(--color-fg-2)', margin: '0 0 22px', maxWidth: 300 }}>A shared list for up to 10 — everyone you invite joins free.</p>
    <Field value={SPACE} />
    <Button style={{ maxWidth: 320, marginTop: 8 }}>Continue<Icon name="arrow-right" size={18} /></Button>
  </Body>
);
const FundBody = () => (
  <Body>
    <Title>Fund {SPACE}</Title>
    <div style={{ marginBottom: 22 }}><Price /></div>
    <div style={{ marginBottom: 22 }}><Features /></div>
    <Button style={{ maxWidth: 320 }}>Fund this circle</Button>
    <FinePrint />
  </Body>
);

// screen shells per treatment
const Screen1 = ({ treat }) => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <Chrome center={treat === 'dots' ? <Dots i={0} /> : treat === 'text' ? <StepText i={0} /> : null} />
    {treat === 'bar' && <Bar i={0} />}
    <NameBody />
  </div>
);
const Screen2 = ({ treat }) => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <Chrome back center={treat === 'dots' ? <Dots i={1} /> : treat === 'text' ? <StepText i={1} /> : null} />
    {treat === 'bar' && <Bar i={1} />}
    <FundBody />
  </div>
);

const Phone = ({ children }) => (
  <div className="phone"><div className="screen">
    <div className="statusbar">
      <span className="time">9:41</span>
      <span className="sys">
        <svg width="17" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
        <svg width="24" height="12" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.4"/></svg>
      </span>
    </div>
    <div className="app">{children}</div>
  </div></div>
);
const Flow = ({ treat }) => (
  <div className="pair">
    <div><Phone><Screen1 treat={treat} /></Phone><div className="caption">Step 1 · Name</div></div>
    <div className="arrow"><Icon name="arrow-right" size={22} /><span className="lbl">then</span></div>
    <div><Phone><Screen2 treat={treat} /></Phone><div className="caption">Step 2 · Fund</div></div>
  </div>
);
const Opt = ({ n, title, desc, treat }) => (
  <div className="opt">
    <div className="opt-head">
      <div className="n"><b>{n}</b> Option {n}</div>
      <h3>{title}</h3>
      <p>{desc}</p>
    </div>
    <Flow treat={treat} />
  </div>
);

const App = () => (
  <div className="wrap">
    <p className="kicker">Create → Fund · wizard, refined</p>
    <div className="lede">
      <h1>One wizard. One upper element. No eyebrow.</h1>
      <p>Path B is gone — splicing two screens together was bloat. This keeps both screens almost exactly as they are and binds them with the lightest possible thread. Three shared moves fix the disconnect; the only thing that changes between the options below is <b>how progress is shown</b>.</p>
      <div className="fix">
        <div className="card"><b>Progress moves into the chrome</b><p>The step indicator lives in the header, so the body always opens on the title. That's what removes the “eyebrow-on-eyebrow” pile-up.</p></div>
        <div className="card"><b>The name lives in the title</b><p>“Fund <em>Backend Pod</em>” — so the circle identity is carried by the H1. No separate eyebrow, no chip.</p></div>
        <div className="card"><b>Both steps share the shell</b><p>Same centered layout, same back + X chrome, verb-led titles (“Name…” → “Fund…”). It reads as one flow.</p></div>
      </div>
    </div>

    <div className="sec">
      <div className="sec-head"><div className="tag">Pick the upper element</div><h2>Same flow, three ways to show the step</h2><p>Bodies are identical. React to the progress treatment only — the rest is settled.</p></div>
      <div className="rail">
        <Opt n="1" treat="dots" title="Segmented dots" desc="Two dots in the header centre; the active one elongates. Quietest, most ambient — reads as progress without words." />
        <Opt n="2" treat="text" title="“Step 1 of 2” label" desc="A plain sentence-case count in the header centre. Most explicit about there being two steps; zero decoration." />
        <Opt n="3" treat="bar" title="Thin progress bar" desc="A 2px accent bar under the header, filling 50% → 100%. Nothing in the header centre — the calmest body, progress felt at the edge." />
      </div>
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
