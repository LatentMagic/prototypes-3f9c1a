<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Permanent hairline — edge-aligned actions</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html,body{margin:0;background:var(--color-page)}
  #root{max-width:760px;margin:0 auto;padding:48px 24px 120px}
  .pg-eyebrow{font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-fg-3);margin-bottom:10px}
  .pg-title{font:var(--weight-semibold) var(--text-3xl)/1.15 var(--font-sans);letter-spacing:var(--tracking-tight);margin:0 0 12px}
  .pg-sub{font:var(--weight-regular) var(--text-md)/1.55 var(--font-sans);color:var(--color-fg-2);max-width:64ch;margin:0}
  .pg-sub b{font-weight:var(--weight-semibold);color:var(--color-fg-1)}
  .stack-wrap{position:relative;width:600px;max-width:100%;margin-top:40px}
  .guide{position:absolute;top:-8px;bottom:-8px;right:21px;width:0;border-right:1px dashed var(--color-accent);opacity:.55;pointer-events:none}
  .guide-left{position:absolute;top:-8px;bottom:-8px;right:83px;width:0;border-right:1px dashed var(--color-accent);opacity:.35;pointer-events:none}
  .guide-band{position:absolute;top:-8px;bottom:-8px;right:21px;width:62px;background:var(--color-accent);opacity:.05;pointer-events:none}
  .guide-lbl{position:absolute;top:-30px;right:0;transform:translateX(50%);font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);color:var(--color-accent);white-space:nowrap}
  .stack{display:flex;flex-direction:column;gap:12px}
  .lbl{font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-fg-3);margin:6px 0 -4px}

  .circ-card{background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);display:flex;flex-direction:column}
  /* Icon buttons keep a full 44px hit target; the hover STATE LAYER is inset
     (per Material/HIG icon-button spec) so adjacent controls read as separate
     without moving the glyphs or breaking edge alignment. */
  .circ-cardaction{background:transparent;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--color-fg-3);position:relative;transition:color var(--duration-base)}
  .circ-cardaction:hover{color:var(--color-fg-1)}
  .circ-cardaction-icon{padding:8px;min-width:44px;min-height:44px}
  .circ-cardaction-icon::before{content:'';position:absolute;inset:5px;border-radius:var(--radius-md);transition:background var(--duration-base);pointer-events:none}
  .circ-cardaction-icon:hover::before{background:var(--color-surface-sunken)}
  .circ-cardaction-icon svg{position:relative;z-index:1}
  .rx-pill{background:transparent;border:0;cursor:pointer;display:inline-flex;align-items:center;position:relative;transition:color var(--duration-base)}
  .rx-pill::before{content:'';position:absolute;inset:5px;border-radius:var(--radius-md);transition:background var(--duration-base);pointer-events:none}
  .rx-pill:hover::before{background:var(--color-surface-sunken)}
  .rx-pill>span{position:relative;z-index:1}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  trash: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>',
};
const Icon = ({ name, size = 18 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', display: 'block' }}
    dangerouslySetInnerHTML={{ __html: ICONS[name] }} />
);
const ArrowsOut = ({ size = 13 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ stroke: 'var(--color-fg-3)', strokeWidth: 1.6, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round', flexShrink: 0 }}>
    <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" /><line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
  </svg>
);
const AV_TONES = ['#5a5a56', '#54655f', '#645749', '#565f77'];
const initials = (n) => { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase(); };
const hash = (s) => { let h=0; s=String(s); for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
const Avatar = ({ name, size = 28 }) => (
  <span style={{ width: size, height: size, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: AV_TONES[hash(name) % AV_TONES.length], color: '#fff', font: `var(--weight-semibold) ${Math.round(size*0.4)}px/1 var(--font-sans)` }}>{initials(name)}</span>
);

const NUDGE = -13; // pulls the cluster so DELETE's glyph edge lands on the image edge

const Huddle = ({ glyphs }) => (
  <span style={{ display: 'inline-flex', alignItems: 'center' }}>
    {glyphs.map((g, i) => <span key={i} style={{ fontSize: 16, lineHeight: 1, width: 17, height: 17, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginLeft: i === 0 ? 0 : -4 }}>{g}</span>)}
  </span>
);
const DeleteBtn = () => <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>;

// The door's OPEN icon (arrows) keeps its center 22px from the door's right edge,
// so it lands in the exact same position as the tick. Its left padding tightens to
// 6px when glyphs are present so the emoji huddle hugs the arrows as one conjoined
// button, and relaxes to a full 44px touch target when the door is bare.
const Door = ({ glyphs }) => (
  <button className="rx-pill" aria-label="How the circle landed" style={{ minHeight: 44, padding: 0 }}>
    {glyphs.length > 0 && <span style={{ display: 'inline-flex', alignItems: 'center', paddingLeft: 8 }}><Huddle glyphs={glyphs} /></span>}
    <span style={{ height: 44, paddingLeft: glyphs.length > 0 ? 6 : 15.5, paddingRight: 15.5, display: 'inline-flex', alignItems: 'center' }}><ArrowsOut /></span>
  </button>
);

const Card = ({ tab, glyphs = [], image = true, attribution = 'Added by Marcus T.', title }) => (
  <article className="circ-card">
    <div style={{ display: 'flex', gap: 'var(--space-4)', alignItems: 'flex-start' }}>
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 6 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
          <span style={{ width: 15, height: 15, borderRadius: 3, flexShrink: 0, background: '#2f3d3b' }} />
          <span style={{ font: 'var(--weight-semibold) 13px/1 var(--font-sans)', color: 'var(--color-fg-2)' }}>The Go Blog</span>
        </div>
        <span style={{ font: 'var(--weight-semibold) 16px/1.3 var(--font-sans)', letterSpacing: '-0.01em', color: 'var(--color-fg-1)', textWrap: 'pretty', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{title}</span>
      </div>
      {image && <span style={{ flexShrink: 0, width: 60, height: 60, borderRadius: 'var(--radius-md)', border: '1px solid var(--color-border-2)', background: 'linear-gradient(135deg,#33413f,#54655f)' }} />}
    </div>
    <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)', marginTop: 'var(--space-3)' }}>
      <Avatar name="Marcus T." size={28} />
      <span style={{ flex: 1, minWidth: 0, font: 'var(--weight-semibold) 14px/1.3 var(--font-sans)', color: 'var(--color-fg-1)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{attribution}</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 0, marginRight: NUDGE }}>
        {tab === 'read'
          ? <Door glyphs={glyphs} />
          : <button className="circ-cardaction circ-cardaction-icon" aria-label="Mark as read"><Icon name="check" size={18} /></button>}
        <DeleteBtn />
      </div>
    </div>
  </article>
);

const App = () => (
  <React.Fragment>
    <div className="pg-eyebrow">BIZ-80 · Read tab · knock-up</div>
    <h1 className="pg-title">Permanent hairline, edge-locked actions</h1>
    <p className="pg-sub">The essential rule, enforced: the action <b>icons</b> — tick, delete, and the door’s open (arrows) icon — sit <b>within the image’s horizontal band</b> (the tinted strip between the two guides). Delete’s right edge locks to the image’s right edge; the icons are pulled tight so the pair spans exactly the image’s width, and the permanent hairline falls on the image’s centerline. The only thing allowed to break the band is the <b>emoji huddle</b>, which extends outward to the left into the attribution — so no glyph count ever pushes the icons off the image, and no adaptive rule is needed.</p>
    <div className="stack-wrap">
      <div className="stack">
        <div className="lbl">Active · tick + delete</div>
        <Card tab="active" image={true} title="Errors Are Values: Handling Failure the Go Way" />
        <div className="lbl">Read · one glyph</div>
        <Card tab="read" glyphs={['\u2764\uFE0F']} image={true} title="Continuous Delivery Pipelines, End to End" />
        <div className="lbl">Read · three glyphs (attribution ellipsizes, delete holds)</div>
        <Card tab="read" glyphs={['\u2764\uFE0F', '\uD83D\uDD25', '\uD83D\uDC4D']} image={true} attribution="Added by Christopher Alexander" title="How DNS Resolvers Actually Work Under Load" />
        <div className="lbl">Read · all skips (bare arrows)</div>
        <Card tab="read" glyphs={[]} image={true} title="On Naming Things You Later Regret" />
        <div className="lbl">Read · three glyphs, no image (aligns to content edge)</div>
        <Card tab="read" glyphs={['\u2764\uFE0F', '\uD83D\uDD25', '\uD83D\uDC4D']} image={false} title="Appropriate Uses For SQLite in Production Systems" />
      </div>
    </div>
  </React.Fragment>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
