<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="../../../" />
<title>Create → Fund — beneath the button</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="swell.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7E7E2; }
  #root { min-height: 100vh; }
  .circ-btn { transition: background var(--duration-base) var(--ease-quiet); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-iconbtn:hover { background: var(--color-surface-sunken) !important; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 44px clamp(20px,4vw,56px) 120px; }
  .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent); font-weight: 500; margin: 0 0 12px; }
  .lede h1 { font-family: var(--font-sans); font-weight: 600; font-size: 32px; letter-spacing: -0.02em; color: var(--color-fg-1); margin: 0 0 12px; }
  .lede p { font-family: var(--font-sans); font-size: 15.5px; line-height: 1.6; color: var(--color-fg-2); margin: 0 0 10px; max-width: 820px; }
  .lede b { color: var(--color-fg-1); }

  .sec { margin-top: 52px; }
  .sec-head { border-top: 2px solid var(--color-fg-1); padding-top: 16px; margin-bottom: 4px; }
  .sec-head .tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-1); }
  .sec-head h2 { font-family: var(--font-sans); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--color-fg-1); margin: 6px 0 8px; }
  .sec-head p { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--color-fg-2); margin: 0; max-width: 840px; }

  .rail { display: flex; gap: 34px; overflow-x: auto; padding: 28px 4px 20px; align-items: flex-start; }
  .opt { flex: 0 0 auto; width: 358px; }
  .opt-head { margin: 0 0 16px; }
  .opt-head .n { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-fg-1); margin-bottom: 8px; }
  .opt-head .n b { width: 22px; height: 22px; border-radius: 50%; background: var(--color-fg-1); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-weight: 700; font-size: 12px; }
  .opt-head h3 { font-family: var(--font-sans); font-weight: 600; font-size: 17px; color: var(--color-fg-1); margin: 0 0 5px; letter-spacing: -0.01em; }
  .opt-head p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0 0 8px; }
  .trade { font-family: var(--font-sans); font-size: 12px; line-height: 1.45; color: var(--color-fg-3); padding-left: 16px; position: relative; }
  .trade::before { content: '↳'; position: absolute; left: 0; color: var(--color-fg-3); }
  .caption { text-align: center; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--color-fg-3); }

  .phone { background: #0A0A0A; border-radius: 44px; padding: 7px; box-shadow: 0 22px 44px rgba(10,10,10,.15), 0 6px 16px rgba(10,10,10,.10); width: 358px; }
  .p-screen { position: relative; width: 344px; height: 680px; background: var(--color-page); border-radius: 37px; overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { flex: 0 0 auto; height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; }
  .statusbar .time { font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--color-fg-1); }
  .statusbar .sys { display: flex; align-items: center; gap: 6px; color: var(--color-fg-1); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .note { display: flex; gap: 12px; align-items: flex-start; background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 14px 16px; max-width: 840px; margin-top: 22px; }
  .note .k { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--color-accent); flex: 0 0 auto; margin-top: 2px; }
  .note p { font-family: var(--font-sans); font-size: 13px; line-height: 1.55; color: var(--color-fg-2); margin: 0; }
  .note b { color: var(--color-fg-1); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
};
const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.5, style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', ...style }} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
);
const Button = ({ children }) => (
  <button className="circ-btn circ-btn-primary" style={{
    fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 16, lineHeight: 1.2, padding: '14px 22px',
    borderRadius: 'var(--radius-md)', border: 0, minHeight: 52, width: '100%', maxWidth: 300, cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: 'var(--color-accent)', color: '#fff',
  }}>{children}</button>
);
const EMAIL = 'sam.rivera@googlemail.com', SPACE = 'Backend Pod';
const Name = () => <b style={{ color: 'var(--color-fg-1)', fontWeight: 600 }}>{SPACE}</b>;

const IconBtn = ({ name, label }) => (
  <button aria-label={label} className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: 8, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40, borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)' }}><Icon name={name} size={20} /></button>
);
// dots fixed dead-centre — never shifted by anything
const Chrome = () => (
  <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}>
    <IconBtn name="arrow-left" label="Back" />
    <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
        <span style={{ width: 7, height: 7, borderRadius: 4, background: 'var(--color-border-1)' }} />
        <span style={{ width: 22, height: 7, borderRadius: 4, background: 'var(--color-accent)' }} />
      </div>
    </div>
    <IconBtn name="x" label="Exit" />
  </header>
);
const Body = ({ children }) => (
  <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'safe center', padding: '4px 22px 26px', textAlign: 'center' }}>
    <div style={{ maxWidth: 340, width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>{children}</div>
  </div>
);
const Price = () => (
  <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center', columnGap: 10, rowGap: 8 }}>
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 44, letterSpacing: '-0.03em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, letterSpacing: '0.02em', color: 'var(--color-fg-2)', lineHeight: 1.35, textAlign: 'left' }}>per circle<br />/ month</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', marginLeft: 6, padding: '2px 8px', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap' }}>Founding rate</span>
  </div>
);
const Features = () => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: '100%', maxWidth: 290, textAlign: 'left' }}>
    {['You fund the circle as its champion', 'Up to 10 members, all invited free', 'Shared list, private read-state'].map((f, i) => (
      <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
        <span style={{ marginTop: 1, color: 'var(--color-accent)', flex: 'none' }}><Icon name="check" size={18} /></span>
        <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 400, fontSize: 15, lineHeight: 1.4, color: 'var(--color-fg-1)' }}>{f}</span>
      </div>
    ))}
  </div>
);
const microStyle = { fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', lineHeight: 1.5 };
const nowrap = { whiteSpace: 'nowrap' };

// The five layouts differ ONLY around the CTA.
const Variants = {
  // 0 — current: the vomit (two full lines beneath)
  current: {
    beneath: (
      <>
        <div style={{ ...microStyle, margin: '12px 0', maxWidth: 280 }}>Billed to {EMAIL}. <span style={nowrap}>Cancel anytime.</span></div>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, color: 'var(--color-fg-3)' }}><Icon name="lock" size={13} /><span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout · powered by a payment provider</span></div>
      </>
    ),
  },
  // 1 — one line: name bold, lock glyph, provider sentence dropped
  oneline: {
    beneath: (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7, margin: '14px 0 0', maxWidth: 300 }}>
        <Icon name="lock" size={13} style={{ color: 'var(--color-fg-3)', flex: 'none' }} />
        <span style={microStyle}><Name /> · £3/mo · <span style={nowrap}>cancel anytime</span></span>
      </div>
    ),
  },
  // 2 — confirmation ABOVE the button; only a tiny secure line beneath
  leadin: {
    above: <div style={{ ...microStyle, fontSize: 13.5, color: 'var(--color-fg-2)', margin: '0 0 14px', maxWidth: 300 }}>You’ll fund <Name /> at £3 / month</div>,
    beneath: (
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, margin: '14px 0 0', color: 'var(--color-fg-3)' }}>
        <Icon name="lock" size={13} /><span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout</span>
      </div>
    ),
  },
  // 3 — minimal: one short line, everything provider-side deferred to checkout
  minimal: {
    beneath: <div style={{ ...microStyle, margin: '14px 0 0' }}><Name /> · <span style={nowrap}>cancel anytime</span></div>,
  },
  // 4 — quiet card footer: name+price on one row, secure micro on the next,
  //     boxed subtly so it reads as a settled block, not stray lines
  block: {
    beneath: (
      <div style={{ width: '100%', maxWidth: 300, marginTop: 16, borderTop: '1px solid var(--color-border-2)', paddingTop: 14, display: 'flex', flexDirection: 'column', gap: 6 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 14, color: 'var(--color-fg-1)' }}>{SPACE}</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-2)' }}>£3 / mo</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: 'var(--color-fg-3)' }}><Icon name="lock" size={12} /><span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout · cancel anytime</span></div>
      </div>
    ),
  },
};
const Step2 = ({ v }) => {
  const cfg = Variants[v];
  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
      <Chrome />
      <Body>
        <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: '0 0 20px' }}>Fund your circle</h1>
        <div style={{ marginBottom: 22 }}><Price /></div>
        <div style={{ marginBottom: 22 }}><Features /></div>
        {cfg.above || null}
        <Button>Fund this circle</Button>
        {cfg.beneath}
      </Body>
    </div>
  );
};
const Phone = ({ children }) => (
  <div className="phone"><div className="p-screen">
    <div className="statusbar"><span className="time">9:41</span>
      <span className="sys">
        <svg width="17" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
        <svg width="24" height="12" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.4"/></svg>
      </span>
    </div>
    <div className="app">{children}</div>
  </div></div>
);

const OPTS = [
  { n: '0', v: 'current', title: 'Current — the vomit', desc: 'Two full-sentence lines beneath the button: “Billed to … Cancel anytime.” plus “Secure checkout · powered by a payment provider.” This is what feels like too much.', trade: 'Baseline, for contrast. No name; two stacked sentences.' },
  { n: '1', v: 'oneline', title: 'One line, name bolded', desc: 'Collapse to a single quiet line: lock · Backend Pod · £3/mo · cancel anytime. The provider sentence is dropped — you meet the provider on the next screen anyway.', trade: 'Name is factual + bold (your O5 instinct), and the pile is gone.' },
  { n: '2', v: 'leadin', title: 'Confirm above, secure below', desc: 'A short “You’ll fund Backend Pod at £3 / month” sits above the button as confirmation; beneath is only a tiny “Secure checkout”. Splits the two jobs.', trade: 'Reads as a confirmation, not decoration. Adds one line above.' },
  { n: '3', v: 'minimal', title: 'Minimal', desc: 'Just “Backend Pod · cancel anytime” beneath. Billing detail + security are deferred to the actual checkout, where they belong.', trade: 'Calmest possible. Risk: no security cue at the funding step.' },
  { n: '4', v: 'block', title: 'Settled footer', desc: 'A quiet bordered footer: Backend Pod / £3 mo on one row, “Secure checkout · cancel anytime” below. The stray lines become one deliberate block.', trade: 'Feels intentional, not leftover. Slightly more structure.' },
];

const App = () => (
  <div className="wrap">
    <p className="kicker">Create → Fund · the area beneath “Fund this circle”</p>
    <div className="lede">
      <h1>Kill the vomit under the button — and let the name live there</h1>
      <p>You're right: the real mess is the microcopy stacked beneath the button, and it's there wherever the name goes. So this round leaves the dots <b>immutable</b> (dead-centre, never shifted), keeps “Fund your circle” as the heading, and reworks only the region around the button — folding the name in <b>factually and bolded</b> (the O5 mechanism you liked) while cutting the pile down.</p>
    </div>
    <div className="sec">
      <div className="sec-head"><div className="tag">Step 2 · beneath the CTA</div><h2>Five ways to calm it down</h2><p>Option 0 is today's version for contrast. React to how minimal the rest feel.</p></div>
      <div className="rail">
        {OPTS.map(o => (
          <div className="opt" key={o.n}>
            <div className="opt-head">
              <div className="n"><b>{o.n}</b> {o.n === '0' ? 'Today' : 'Option ' + o.n}</div>
              <h3>{o.title}</h3>
              <p>{o.desc}</p>
              <div className="trade">{o.trade}</div>
            </div>
            <Phone><Step2 v={o.v} /></Phone>
            <div className="caption">Step 2 · {o.title}</div>
          </div>
        ))}
      </div>
      <div className="note"><span className="k">The bet</span><p>The provider checkout (the next screen) already carries the full billing + security detail — so repeating “powered by a payment provider” here is the redundancy that reads as vomit. Cutting it is safe. My lean: <b>Option 1</b> (one bold line) or <b>Option 4</b> (settled footer).</p></div>
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
