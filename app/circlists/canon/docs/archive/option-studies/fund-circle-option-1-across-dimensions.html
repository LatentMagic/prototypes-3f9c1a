<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fund circle — Option 1 across dimensions</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="swell.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7E7E2; }
  #root { min-height: 100vh; }
  @keyframes circ-micro-reveal { 0% { transform: translateX(0);} 64% { transform: translateX(86px);} 100% { transform: translateX(86px);} }
  .circ-micro-halo-static { display: none; }
  .circ-micro-reveal { animation: circ-micro-reveal 3800ms cubic-bezier(0.45,0,0.15,1) infinite; }
  @media (prefers-reduced-motion: reduce) { .circ-micro-reveal { animation: none !important; display: none !important; } .circ-micro-halo-static { display: block !important; } }
  .circ-btn { transition: background var(--duration-base) var(--ease-quiet); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-iconbtn:hover { background: var(--color-surface-sunken) !important; }

  .studio { min-height: 100vh; padding: 40px clamp(20px,4vw,56px) 96px; }
  .studio-head { max-width: 1000px; margin: 0 auto 4px; }
  .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent); font-weight: 500; margin: 0 0 10px; }
  .studio-head h1 { font-family: var(--font-sans); font-weight: 600; font-size: 30px; letter-spacing: -0.02em; color: var(--color-fg-1); margin: 0 0 10px; }
  .studio-head p { font-family: var(--font-sans); font-size: 15px; line-height: 1.55; color: var(--color-fg-2); margin: 0; max-width: 740px; }

  .rail { display: flex; align-items: flex-start; gap: 44px; overflow-x: auto; padding: 44px 4px 24px; }
  .col { flex: 0 0 auto; }
  .col-head { margin: 0 0 16px; padding: 0 2px; max-width: 340px; }
  .dev { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .dev h2 { font-family: var(--font-sans); font-weight: 600; font-size: 17px; letter-spacing: -0.01em; color: var(--color-fg-1); margin: 0; }
  .dev .dim { font-family: var(--font-mono); font-size: 12px; color: var(--color-fg-3); }
  .col-head p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0; }
  .verdict { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 4px 9px; border-radius: var(--radius-pill); }
  .verdict.fits { color: var(--color-accent); background: var(--color-accent-soft); border: 1px solid var(--color-accent); }
  .verdict.tight { color: #92600b; background: #fdf6e3; border: 1px solid #e0b64a; }
  .verdict.scroll { color: var(--color-fg-2); background: var(--color-surface-sunken); border: 1px solid var(--color-border-1); }
  .verdict .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .phone { background: #0A0A0A; border-radius: 44px; padding: 7px; box-shadow: 0 30px 60px rgba(10,10,10,.20), 0 8px 20px rgba(10,10,10,.10); }
  .screen { position: relative; background: var(--color-page); border-radius: 37px; overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { flex: 0 0 auto; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px 0 32px; }
  .statusbar .time { font-family: var(--font-sans); font-weight: 600; font-size: 14px; color: var(--color-fg-1); }
  .statusbar .sys { display: flex; align-items: center; gap: 6px; color: var(--color-fg-1); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState, useRef, useLayoutEffect } = React;

const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
  list: '<line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line>',
};
const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.5, style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', ...style }} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
);
const MicroDot = ({ size = 10 }) => {
  const uid = React.useId().replace(/:/g, '');
  const clipId = `mc-${uid}`, gradId = `mg-${uid}`;
  return (
    <svg width={size} height={size} viewBox="-2 -2 52 52" aria-hidden="true" style={{ display: 'block', flexShrink: 0 }}>
      <defs>
        <clipPath id={clipId}><circle cx="24" cy="24" r="22.5" /></clipPath>
        <linearGradient id={gradId} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stopColor="var(--color-sage)" stopOpacity="0" /><stop offset="0.5" stopColor="var(--color-sage)" stopOpacity="1" /><stop offset="1" stopColor="var(--color-sage)" stopOpacity="0" />
        </linearGradient>
      </defs>
      <circle className="circ-micro-halo-static" cx="24" cy="24" r="22.5" fill="var(--color-sage)" />
      <g clipPath={`url(#${clipId})`}><rect className="circ-micro-reveal" x="-32" y="-10" width="26" height="68" fill={`url(#${gradId})`} /></g>
      <circle cx="24" cy="24" r="14.25" fill="var(--color-accent)" />
      <circle cx="24" cy="24" r="14.925" fill="none" stroke="#fff" strokeWidth="1.35" />
    </svg>
  );
};
const Button = ({ onClick, children, style = {} }) => (
  <button onClick={onClick} className="circ-btn circ-btn-primary" style={{
    fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 16, lineHeight: 1, padding: '14px 22px',
    borderRadius: 'var(--radius-md)', border: 0, minHeight: 52, width: '100%', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: 'var(--color-accent)', color: '#fff', ...style,
  }}>{children}</button>
);

const SPACE = 'Backend Pod', EMAIL = 'sam.rivera@gmail.com';
const FEATURES = [
  'You fund the circle as its champion',
  'Up to 10 members, all invited free',
  'Shared list, private read-state',
];

// ---- Option 1: Tighten in place. Back+X at top, no card, safe-centred. ------
const Option1 = ({ scrollRef, contentRef }) => (
  <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
    <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', flex: 'none' }}>
      <button aria-label="Back" className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: 8, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40, borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)' }}><Icon name="arrow-left" size={20} /></button>
      <button aria-label="Exit" className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: 8, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40, borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)' }}><Icon name="x" size={20} /></button>
    </header>
    <div ref={scrollRef} style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'safe center', padding: '8px 24px 24px', textAlign: 'center' }}>
     <div ref={contentRef} style={{ width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 12, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--color-accent)', marginBottom: 14 }}>
        <span>New circle</span><MicroDot size={10} /><span style={{ fontWeight: 700 }}>{SPACE}</span>
      </div>
      <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: '0 0 20px' }}>Fund your circle</h1>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 10, marginBottom: 22 }}>
        <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 44, letterSpacing: '-0.03em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
        <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-2)', lineHeight: 1.35, textAlign: 'left' }}>per circle<br />/ month</span>
        <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', marginLeft: 6, padding: '2px 8px', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap' }}>Founding rate</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 22, width: '100%', maxWidth: 300, textAlign: 'left' }}>
        {FEATURES.map((f, i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
            <span style={{ marginTop: 1, color: 'var(--color-accent)', flex: 'none' }}><Icon name="check" size={18} /></span>
            <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 400, fontSize: 15, lineHeight: 1.4, color: 'var(--color-fg-1)' }}>{f}</span>
          </div>
        ))}
      </div>
      <Button style={{ maxWidth: 320 }}>Fund this circle</Button>
      <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', margin: '12px 0' }}>Billed to {EMAIL}. Cancel anytime.</div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, color: 'var(--color-fg-3)' }}>
        <Icon name="lock" size={13} />
        <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout · powered by a payment provider</span>
      </div>
     </div>
    </div>
  </div>
);

const Phone = ({ w, h, onFit }) => {
  const scrollRef = useRef(null);
  const contentRef = useRef(null);
  const [state, setState] = useState(null); // 'fits' | 'tight' | 'scroll'
  useLayoutEffect(() => {
    const scrollEl = scrollRef.current, contentEl = contentRef.current;
    if (!scrollEl || !contentEl) return;
    // Compare the CONTENT's natural height against the space available to it.
    // (scrollHeight is unusable here: `justify-content: safe center` clamps it
    // to clientHeight whenever content fits.) Padding on the scroll box is
    // 8px top + 24px bottom = 32px, inside clientHeight.
    const PAD = 32;
    const measure = () => {
      const avail = scrollEl.clientHeight - PAD;
      const need = contentEl.offsetHeight;
      const slack = avail - need;
      const v = slack < 0 ? 'scroll' : slack < 28 ? 'tight' : 'fits';
      setState({ v, slack }); onFit && onFit(v);
    };
    measure();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    const ro = new ResizeObserver(measure); ro.observe(scrollEl); ro.observe(contentEl);
    return () => ro.disconnect();
  }, []);
  return (
    <>
      <div className="phone">
        <div className="screen" style={{ width: w, height: h }}>
          <div className="statusbar">
            <span className="time">9:41</span>
            <span className="sys">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
              <svg width="26" height="13" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.4"/></svg>
            </span>
          </div>
          <div className="app"><Option1 scrollRef={scrollRef} contentRef={contentRef} /></div>
        </div>
      </div>
      <Badge state={state} />
    </>
  );
};
const Badge = ({ state }) => {
  if (!state) return null;
  const { v, slack } = state;
  const map = {
    fits: { cls: 'fits', label: 'Fits comfortably' },
    tight: { cls: 'tight', label: 'Fits — no headroom' },
    scroll: { cls: 'scroll', label: 'Overflows — scrolls' },
  }[v];
  const detail = v === 'scroll' ? `${-slack}px over` : `${slack}px spare`;
  return <div className={'verdict ' + map.cls} style={{ marginTop: 14 }}><span className="dot"></span>{map.label} · {detail}</div>;
};

// device screen heights (the true screen, before browser chrome)
const DEVICES = [
  { name: 'Android compact', dim: '360 × 640', w: 360, h: 640, note: 'Smallest real Android. The pinch point — every pixel counts here.' },
  { name: 'iPhone SE', dim: '375 × 667', w: 375, h: 667, note: 'Smallest current iPhone. The one to design the floor against.' },
  { name: 'Safari + chrome', dim: '390 × 664', w: 390, h: 664, note: 'iPhone 14 with the address bar showing — real usable height, not the full 844.' },
  { name: 'iPhone 14', dim: '390 × 844', w: 390, h: 844, note: 'Mainstream size, full screen.' },
  { name: 'iPhone 15', dim: '393 × 852', w: 393, h: 852, note: 'Current baseline.' },
  { name: 'iPhone 15 Pro Max', dim: '430 × 932', w: 430, h: 932, note: 'Largest. Plenty of air.' },
];

const App = () => (
  <div className="studio">
    <div className="studio-head">
      <p className="kicker">Option 1 · Tighten in place — dimension check</p>
      <h1>Does the tightened fund step hold up on small screens?</h1>
      <p>Same composition, back moved up beside the X, no card — just trimmed. Each frame is a real device screen height (including the tight Safari-with-chrome case), and the badge is measured live: it compares the content's natural height against the space the screen actually gives it, and reports the leftover headroom in pixels. Green = comfortable, amber = fits but no breathing room, grey = overflows and scrolls (the safety net: it top-aligns and scrolls rather than clipping). The verdict: the trimmed step clears every size tested — the smallest phones still keep ~130px spare — so the amber and grey states are guards for future growth, not today's reality.</p>
    </div>
    <div className="rail">
      {DEVICES.map((d, i) => (
        <div className="col" key={i}>
          <div className="col-head">
            <div className="dev"><h2>{d.name}</h2><span className="dim">{d.dim}</span></div>
            <p>{d.note}</p>
          </div>
          <Phone w={d.w} h={d.h} />
        </div>
      ))}
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
