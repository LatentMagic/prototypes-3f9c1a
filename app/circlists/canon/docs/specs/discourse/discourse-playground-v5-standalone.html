<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circlists — Discourse playground v5</title>
<style>/* ============================================================================
   Circlists Design Tokens — Pulse Modernist
   ----------------------------------------------------------------------------
   The token layer. Every colour, type, spacing, radius, and shadow value lives
   here as a CSS custom property. Identity work happens by editing these values
   — never by hard-coding alternatives in component CSS.
   ============================================================================ */

/* Webfonts — Inter (primary) + JetBrains Mono (mono accent) via Google Fonts.
   For self-hosting, drop .woff2 files into /fonts and replace these imports
   with @font-face declarations pointing to the local files. The variable names
   below do not change. */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root {
  /* ------------------------------------------------------------------------ */
  /* Colour — accent                                                          */
  /* ------------------------------------------------------------------------ */
  --color-accent:           #047857;  /* Pulse Green — Penguin / Braun lineage */
  --color-accent-hover:     #036549;  /* 4% darker  */
  --color-accent-press:     #024F3A;  /* 8% darker  */
  --color-accent-ring:      rgba(4, 120, 87, 0.30);
  --color-accent-soft:      #ECFDF5;  /* Reserved — focus-ring bg only */

  /* Sage — the mark's halo. Opaque brand colour (reads at 16px favicon on any
     ground); NOT the accent, never a status or action colour. Brand mark only. */
  --color-sage:             #8BBFAD;

  /* NOT approved fallbacks. Kept in case a fallback is needed later — never use without raising it to the user first. */
  --color-accent-warm:      #0D9488;  /* deep chromatic teal */
  --color-accent-cool:      #166534;  /* deep forest hunter  */

  /* ------------------------------------------------------------------------ */
  /* Colour — neutrals (warm-neutral, paper-leaning)                          */
  /* ------------------------------------------------------------------------ */
  --color-page:             #FAFAF7;  /* off-white page background */
  --color-surface:          #FFFFFF;  /* card / popover surface     */
  --color-surface-raised:   #FFFFFF;  /* identical for now; reserved */
  --color-surface-sunken:   #F5F5F2;  /* hover area on cards        */

  --color-fg-1:             #0A0A0A;  /* near-black, body & titles  */
  --color-fg-2:             #525252;  /* secondary text             */
  --color-fg-3:             #6E6E6B;  /* tertiary, captions, meta — AA 4.5:1 on cream/white */
  --color-fg-inverse:       #FFFFFF;  /* on accent fills            */

  --color-border-1:         #DCDCD8;  /* card borders, default      */
  --color-border-2:         #E8E8E5;  /* separators, hairlines      */
  --color-border-strong:    #0A0A0A;  /* deliberate emphasis only   */

  /* Destructive — used in v1 ONLY on the last-member Leave primary action.   */
  --color-destructive:      #991B1B;
  --color-destructive-hover:#7F1818;
  --color-destructive-press:#641212;
  --color-destructive-ring: rgba(153, 27, 27, 0.30);

  /* Scrims (dialog / sheet overlays) — flat, no blur */
  --color-scrim:            rgba(10, 10, 10, 0.40);

  /* ------------------------------------------------------------------------ */
  /* Type — families                                                          */
  /* ------------------------------------------------------------------------ */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
  /* Display alias — same family as sans for now; reserved for future divergence */
  --font-display: var(--font-sans);

  /* Page-surface alias — semantic name used by app shells */
  --color-canvas: var(--color-page);

  /* Weights — exact named steps in use */
  --weight-regular:  400;
  --weight-medium:   500;
  --weight-semibold: 600;
  --weight-bold:     700;

  /* ------------------------------------------------------------------------ */
  /* Type scale — sizes (4px grid) + line-heights + tracking                  */
  /* ------------------------------------------------------------------------ */
  --text-xs:    12px;   /* mono caption, badges */
  --text-sm:    13px;   /* secondary body, meta */
  --text-base:  15px;   /* body                 */
  --text-md:    16px;   /* card body / dialog body */
  --text-lg:    18px;   /* card titles (mobile) */
  --text-xl:    20px;   /* card titles (desktop) */
  --text-2xl:   24px;   /* dialog titles, page H2 */
  --text-3xl:   32px;   /* page titles (Create Space, Empty-state primary) */
  --text-4xl:   40px;   /* hero / brand moments only */

  --leading-tight:  1.25;
  --leading-snug:   1.35;
  --leading-normal: 1.5;
  --leading-relaxed:1.6;

  --tracking-tight: -0.01em;   /* large titles */
  --tracking-normal: 0;        /* body */
  --tracking-wide:   0.02em;   /* mono badges, all-caps eyebrows (rare) */

  /* ------------------------------------------------------------------------ */
  /* Spacing scale — 4px base                                                 */
  /* ------------------------------------------------------------------------ */
  --space-0:   0;
  --space-1:   4px;
  --space-2:   8px;
  --space-3:   12px;
  --space-4:   16px;
  --space-5:   20px;
  --space-6:   24px;
  --space-8:   32px;
  --space-10:  40px;
  --space-12:  48px;
  --space-16:  64px;
  --space-20:  80px;
  --space-24:  96px;

  /* ------------------------------------------------------------------------ */
  /* Radii                                                                    */
  /* ------------------------------------------------------------------------ */
  --radius-sm:  4px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-pill: 9999px;   /* reserved — content-type badges only, NOT buttons */

  /* ------------------------------------------------------------------------ */
  /* Shadows — three steps                                                    */
  /* ------------------------------------------------------------------------ */
  --shadow-flat:    none;
  --shadow-raised:  0 1px 2px rgba(10, 10, 10, 0.04), 0 1px 3px rgba(10, 10, 10, 0.04);
  --shadow-overlay: 0 16px 32px rgba(10, 10, 10, 0.08), 0 4px 8px rgba(10, 10, 10, 0.06);

  /* Focus ring — composed from accent + offset */
  --ring-width: 2px;
  --ring-offset: 2px;
  --ring-color: var(--color-accent-ring);

  /* ------------------------------------------------------------------------ */
  /* Motion                                                                   */
  /* ------------------------------------------------------------------------ */
  --duration-instant: 0ms;
  --duration-fast:    100ms;
  --duration-base:    150ms;
  --duration-slow:    200ms;
  --ease-quiet:       cubic-bezier(0.16, 1, 0.3, 1);

  /* ------------------------------------------------------------------------ */
  /* Layout                                                                   */
  /* ------------------------------------------------------------------------ */
  --max-feed-width: 720px;
  --rail-width:     240px;
  --top-bar-height: 56px;
  --tap-target-min: 44px;
}

/* ============================================================================
   Semantic / element styles
   These give every common element a default that matches Pulse Modernist.
   Override per-component as needed, but stay inside the token scale.
   ============================================================================ */

html, body {
  background: var(--color-page);
  color: var(--color-fg-1);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--leading-normal);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

/* ---- Headings ---- */
h1, .h1 {
  font: var(--weight-semibold) var(--text-3xl) / var(--leading-tight) var(--font-sans);
  letter-spacing: var(--tracking-tight);
  color: var(--color-fg-1);
  margin: 0;
}
h2, .h2 {
  font: var(--weight-semibold) var(--text-2xl) / var(--leading-snug) var(--font-sans);
  letter-spacing: var(--tracking-tight);
  color: var(--color-fg-1);
  margin: 0;
}
h3, .h3 {
  font: var(--weight-semibold) var(--text-xl) / var(--leading-snug) var(--font-sans);
  color: var(--color-fg-1);
  margin: 0;
}
h4, .h4 {
  font: var(--weight-semibold) var(--text-lg) / var(--leading-snug) var(--font-sans);
  color: var(--color-fg-1);
  margin: 0;
}

/* ---- Body & helpers ---- */
p, .p {
  font: var(--weight-regular) var(--text-md) / var(--leading-relaxed) var(--font-sans);
  color: var(--color-fg-1);
  margin: 0;
}
.body-sm {
  font: var(--weight-regular) var(--text-sm) / var(--leading-normal) var(--font-sans);
  color: var(--color-fg-2);
}
.meta {
  font: var(--weight-medium) var(--text-sm) / var(--leading-normal) var(--font-sans);
  color: var(--color-fg-3);
}

/* ---- Card-specific (the load-bearing typography of the product) ---- */
.card-title {
  font: var(--weight-semibold) var(--text-lg) / var(--leading-snug) var(--font-sans);
  letter-spacing: var(--tracking-tight);
  color: var(--color-fg-1);
}
@media (min-width: 1024px) {
  .card-title { font-size: var(--text-xl); }
}

.attribution {
  /* NON-NEGOTIABLE: weight equal to title, never caption-sized, never greyed-out */
  font: var(--weight-semibold) var(--text-md) / var(--leading-snug) var(--font-sans);
  color: var(--color-fg-1);
}

.domain {
  font: var(--weight-medium) var(--text-sm) / var(--leading-normal) var(--font-mono);
  color: var(--color-fg-2);
  letter-spacing: 0;
}

.badge {
  font: var(--weight-medium) var(--text-xs) / 1 var(--font-mono);
  color: var(--color-fg-2);
  letter-spacing: var(--tracking-wide);
  text-transform: lowercase;
}

/* ---- Code / inline mono ---- */
code, kbd, samp, pre, .mono {
  font-family: var(--font-mono);
  font-size: 0.92em;
}

/* ---- Links ---- */
a {
  color: var(--color-fg-1);
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  text-decoration-color: var(--color-border-1);
}
a:hover { text-decoration-color: var(--color-fg-1); }
a:focus-visible {
  outline: var(--ring-width) solid var(--color-accent);
  outline-offset: var(--ring-offset);
  border-radius: 2px;
}

/* ---- Buttons (token-only base; UI kits compose on top) ---- */
button { font-family: inherit; }

/* ---- Focus ring (universal default) ---- */
:focus-visible {
  outline: var(--ring-width) solid var(--color-accent);
  outline-offset: var(--ring-offset);
  border-radius: var(--radius-sm);
}

/* ---- Reduced motion ---- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
<style>/* ==========================================================================
   The Swell — hover / focus / animation classes for swell-reactions.jsx.
   Load AFTER the design tokens (colors_and_type.css). Everything else the
   mechanism needs is inline in the JSX; only pseudo-states and keyframes
   (which can't be inlined) live here.
   ========================================================================== */

/* Reaction door — borderless at rest, sunken pill on hover/focus (the card's
   own hover language). It must NOT look like a button until touched. */
/* Hover/focus fill is an INSET state layer (matches the card icon actions) so
   the door reads as separate from the adjacent delete, with a real gap at the
   hairline — the glyphs and edge alignment never move. */
.circ-swell-door { position: relative; }
.circ-swell-door > * { position: relative; z-index: 1; }
.circ-swell-door::before { content: ''; position: absolute; inset: 5px; border-radius: var(--radius-md); transition: background var(--duration-fast) var(--ease-quiet); pointer-events: none; }
.circ-swell-door:hover::before, .circ-swell-door:focus-visible::before { background: var(--color-surface-sunken); }
.circ-swell-door:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-accent); border-radius: var(--radius-md); }

/* Review-modal roster rows (tap to pin a glyph's name). Focus ring is SOLID
   accent, not the 30%-opacity ring token — a keyboard/SR user tabbing the
   roster must see where they are (WCAG 1.4.11, 3:1 min). */
.circ-swell-rrow:hover { background: var(--color-surface-sunken) !important; }
.circ-swell-rrow:focus-visible { box-shadow: 0 0 0 2px var(--color-accent); }
/* Disc glyphs (role=button) in the review circle — same visible-focus rule. */
.circ-swell-glyph:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-accent); }

/* Modal close (x). */
.circ-rx-close { transition: background var(--duration-base), color var(--duration-base); }
.circ-rx-close:hover { background: var(--color-surface-sunken) !important; color: var(--color-fg-1) !important; }
.circ-rx-close:active { background: #E8E8E5 !important; }

/* Input-step actions. */
.circ-swell-skip:hover { color: var(--color-fg-1) !important; }
.circ-swell-done:hover { background: var(--color-accent-hover) !important; }
.circ-swell-done:active { background: var(--color-accent-press) !important; }

/* Accessible input controls (always present under the drag-pad): the depth
   slider (the pad) and the glyph radiogroup. Visible focus is required — the
   pad's own puck/palette also reflect the state, but the ring is what a keyboard
   user lands on. Circle rings match the round hit targets. */
.circ-swell-pad:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-accent); }
.circ-swell-radio:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-accent); }
.circ-swell-rrow:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-accent); }

/* Dialog / scrim fade-in. */
@keyframes circ-anim-fade { from { opacity: 0; } to { opacity: 1; } }
.circ-anim-fade { animation: circ-anim-fade var(--duration-base, 150ms) var(--ease-quiet) both; }

/* Input pad's high-intensity "held breath" tremor (rides in via --breath-peak;
   ~1.0 = imperceptible). Only applied by SwellPad when breath opt is on. */
@keyframes circ-swell-breath { 0%, 100% { transform: scale(1); } 50% { transform: scale(var(--breath-peak, 1)); } }
.circ-swell-breath { animation: circ-swell-breath 1700ms ease-in-out infinite; will-change: transform; }

@media (prefers-reduced-motion: reduce) {
  .circ-anim-fade { animation-duration: 0ms; }
  .circ-swell-breath { animation: none; }
}
</style>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#EFEFEC}
a{color:var(--color-fg-1)}
a:hover{color:var(--color-fg-1)}
#root{min-height:100vh}
/* The app fills the window (no bezel): open this on a phone and it IS the app.
   The direction rail stands in for the circle rail, so it follows the app's
   rail exactly — docked at >= 1024, and below that behind the top bar's
   circles-menu button in the app's own MobileDrawer (app/shell.jsx). */
.pg-page{display:flex;min-height:100dvh}
.pg-rail{width:336px;flex-shrink:0;background:var(--color-page);border-right:1px solid var(--color-border-1);padding:20px 14px 40px;position:sticky;top:0;align-self:flex-start;height:100dvh;overflow-y:auto;overscroll-behavior:contain}
.pg-railitem{display:block;width:100%;text-align:left;cursor:pointer;border:0;background:transparent;border-radius:var(--radius-md);padding:11px 12px;font-family:var(--font-sans);color:var(--color-fg-1);transition:background var(--duration-base)}
.pg-railitem:hover{background:var(--color-surface)}
.pg-ghost{background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-md);padding:7px 11px;font-family:var(--font-sans);font-weight:600;font-size:12.5px;color:var(--color-fg-1);cursor:pointer;white-space:nowrap}
.pg-ghost:hover{background:var(--color-surface-sunken)}
/* The surface carries the transform, so sheets and the Swell pin to the app
   column and not to the page. GOTCHA #5. */
.pgd-surface{position:relative;flex:1;min-width:0;height:100dvh;overflow:hidden;background:var(--color-canvas);transform:translateZ(0)}
.pgd-screen{width:100%;height:100%;overflow-y:auto;--circ-vh:100%}
/* Forced-mobile posture: the app's own phone frame, verbatim from circlists.html.
   Only ever used when Viewport is set to Mobile by hand. */
.circ-stage{flex:1;min-width:0;min-height:100dvh;background:#1c1c1a;background-image:radial-gradient(circle at 50% 0%,#2a2a27 0%,#161614 70%);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.circ-phone{width:402px;max-width:100%;height:min(872px,calc(100dvh - 48px));background:#050505;border-radius:52px;padding:11px;box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 0 2px #2c2c2c,inset 0 0 0 2px #000;overflow:hidden}
.circ-phone-clip{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--color-canvas);transform:translateZ(0)}
.circ-phone-screen{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;--circ-vh:100%}
.circ-phone-screen::-webkit-scrollbar{width:0;height:0}
/* ---- reused app card + chrome states (copied from circlists.html) ---- */
.circ-card{container-type:inline-size}
.circ-cardaction{background:transparent;border:0;cursor:pointer;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;padding:8px 10px;min-height:44px;font-family:var(--font-sans);font-weight:500;font-size:13px;color:var(--color-fg-2);transition:background var(--duration-base),color var(--duration-base)}
.circ-cardaction:hover{background:var(--color-surface-sunken);color:var(--color-fg-1)}
.circ-cardaction-icon{padding:8px;min-width:44px;justify-content:center;position:relative}
.circ-cardaction-icon:hover{background:transparent}
.circ-cardaction-icon::before{content:'';position:absolute;inset:5px;border-radius:var(--radius-md);transition:background var(--duration-base);pointer-events:none}
.circ-cardaction-icon:hover::before{background:var(--color-surface-sunken)}
.circ-cardaction-icon>svg{position:relative;z-index:1}
.circ-cardtitle:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--color-border-strong)}
.circ-cardtitle:focus-visible{outline:var(--ring-width) solid var(--color-accent);outline-offset:2px;border-radius:2px}
.circ-thumblink{transition:filter var(--duration-base)}
.circ-thumblink:hover{filter:brightness(1.05)}
.circ-appnav-item:active:not(:disabled){background:var(--color-surface-sunken)}
.circ-appnav-add:active:not(:disabled) .circ-appnav-adddot{background:var(--color-accent-press) !important}
.circ-topaction:hover{background:var(--color-surface-sunken)}
.circ-btn-primary:hover:not(:disabled){background:var(--color-accent-hover) !important}
.circ-btn-primary:active:not(:disabled){background:var(--color-accent-press) !important}
.circ-btn-secondary:hover{background:var(--color-surface-sunken) !important}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:var(--ring-width) solid var(--color-accent);outline-offset:var(--ring-offset)}
textarea:focus-visible,input:focus-visible{outline-offset:0;border-color:var(--color-accent) !important}
/* ---- v4 treatment states ---- */
.d4-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.04em;color:var(--color-fg-3)}
.d4-note{margin:0;font-family:var(--font-sans);font-size:13.5px;line-height:1.5;color:var(--color-fg-3);text-wrap:pretty}
.d4-quiet:hover{color:var(--color-fg-1) !important}
.d4-respond:hover,.d4-chip:hover,.d4-point:hover{background:var(--color-surface-sunken)}
.d4-initials{flex-shrink:0;font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.04em;color:var(--color-fg-3);padding-top:2px;min-width:20px}
/* Marginalia: notes sit OUTSIDE the measure, beside the card body where there
   is room and in a left-ruled gutter beneath it where there is not. */
.d4-mgrid{display:grid;grid-template-columns:1fr;gap:14px}
.d4-mnote{border-left:1px solid var(--color-border-1);padding-left:12px}
@container (min-width:520px){.d4-mgrid{grid-template-columns:1fr 200px;gap:22px;align-items:start}}
.d4-labels{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.d4-lcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.d4-lhead{display:inline-flex;align-items:center;gap:6px}
.d4-lcol-right{text-align:right}
.d4-lcol-right .d4-lhead{justify-content:flex-end}
@media (max-width:560px){.d4-labels{grid-template-columns:1fr;justify-items:start;gap:20px}.d4-labels>*:nth-child(2){justify-self:center;order:-1}.d4-lcol-right{text-align:left}.d4-lcol-right .d4-lhead{justify-content:flex-start}}
.d4-flipper{position:relative;display:grid;transform-style:preserve-3d;transition:transform 420ms var(--ease-quiet)}
.d4-face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:visibility 0s linear 210ms}
.d4-back{transform:rotateY(180deg)}
@keyframes d4-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d4-rise{animation:d4-rise 320ms var(--ease-quiet) both}
/* The table, set as a page: attribution in the margin, paragraphs in the column. */
.d4-tentry{background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-lg);padding:var(--space-6) var(--space-6)}
.d4-tturn{display:grid;grid-template-columns:104px 1fr;gap:20px}
.d4-tby{font-family:var(--font-sans);font-weight:600;font-size:12.5px;line-height:1.5;color:var(--color-fg-3);padding-top:3px}
.d4-ttext{margin:0;font-family:var(--font-sans);font-weight:400;font-size:16px;line-height:1.6;color:var(--color-fg-1);text-wrap:pretty}
@media (max-width:680px){.d4-tentry{padding:var(--space-5) var(--space-4)}.d4-tturn{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){.d4-flipper{transition:none}}
/* app posture: full-page push layers (verbatim from circlists.html) */
@keyframes circ-push-in{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes circ-push-out{from{transform:translateX(0)}to{transform:translateX(100%)}}
.circ-push-in{animation:circ-push-in var(--duration-slow) var(--ease-quiet) both;will-change:transform}
.circ-push-out{animation:circ-push-out var(--duration-slow) var(--ease-quiet) both;will-change:transform}
@media (prefers-reduced-motion:reduce){.circ-push-in,.circ-push-out{animation-duration:1ms}}
</style>
