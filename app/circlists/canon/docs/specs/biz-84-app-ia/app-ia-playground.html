<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Circlists — App IA playground</title>
<link rel="stylesheet" href="../../../tokens.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #EFEFEC; }
  a { color: var(--color-accent); }
  a:hover { color: var(--color-accent-hover); }
  #root { min-height: 100vh; }

  .pg-page { display: grid; grid-template-columns: 312px minmax(0, 1fr); min-height: 100vh; }
  .pg-rail { background: var(--color-page); border-right: 1px solid var(--color-border-1); padding: 20px 14px; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; }
  .pg-railitem { display: block; width: 100%; text-align: left; cursor: pointer; border: 0; background: transparent; border-radius: var(--radius-md); padding: 11px 12px; font-family: var(--font-sans); color: var(--color-fg-1); transition: background var(--duration-base); }
  .pg-railitem:hover { background: var(--color-surface); }
  .pg-main { display: flex; flex-direction: column; min-width: 0; }
  .pg-head { position: sticky; top: 0; z-index: 20; background: var(--color-page); border-bottom: 1px solid var(--color-border-1); padding: 12px 20px; }
  .pg-levers { display: flex; align-items: flex-end; gap: 14px; overflow-x: auto; padding-bottom: 2px; }
  .pg-levers::-webkit-scrollbar { height: 6px; }
  .pg-levers::-webkit-scrollbar-thumb { background: var(--color-border-1); border-radius: 3px; }
  .pg-ghost { background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 8px 12px; font-family: var(--font-sans); font-weight: 600; font-size: 12.5px; color: var(--color-fg-1); cursor: pointer; }
  .pg-ghost:hover { background: var(--color-surface-sunken); }
  .pg-stage { flex: 1; display: flex; align-items: flex-start; gap: 28px; padding: 26px 20px 40px; }
  .pg-side { width: 372px; flex-shrink: 0; }

  /* Phone frame — same geometry as the prototype's app posture. The CLIP layer
     carries the transform, so position:fixed overlays pin to the screen bounds
     (and get clipped by the corner radius) instead of riding the scrolled feed. */
  .pg-phone { width: 402px; flex-shrink: 0; height: min(872px, calc(100vh - 128px)); background: var(--color-fg-1); border-radius: 52px; padding: 10px; box-shadow: 0 24px 48px rgba(10,10,10,0.18); overflow: hidden; }
  .pg-phone-clip { position: relative; width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: var(--color-canvas); transform: translateZ(0); }
  .pg-phone-screen { width: 100%; height: 100%; overflow-y: auto; }
  .pg-phone-screen::-webkit-scrollbar, .pg-phone-layer::-webkit-scrollbar { width: 0; height: 0; }

  /* reused app chrome states */
  .circ-appnav-item:active { background: var(--color-surface-sunken); }
  .circ-appnav-add:active .circ-appnav-adddot { background: var(--color-accent-press) !important; }
  .circ-appsheet-row:hover { background: var(--color-surface-sunken); }
  .circ-appsheet-row:active { background: var(--color-border-2); }
  .circ-topaction:hover { background: var(--color-surface-sunken); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-btn-primary:active { background: var(--color-accent-press) !important; }

  @media (max-width: 1180px) { .pg-side { display: none; } }
  @media (max-width: 900px) { .pg-page { grid-template-columns: 1fr; } .pg-rail { position: static; height: auto; } }
</style>
</head>
<body>
<div id="root"></div>

</body>
</html>
