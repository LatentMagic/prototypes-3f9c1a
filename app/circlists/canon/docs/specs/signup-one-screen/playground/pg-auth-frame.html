<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<base href="../../../../" />
<title>Sign-up and sign-in frame · playground</title>
<link rel="icon" type="image/svg+xml" href="brand/assets/favicon.svg" />
<link rel="stylesheet" href="tokens.css" />
<style>
*{box-sizing:border-box}
:root{--circ-vh:100dvh}
html,body{margin:0;background:var(--color-canvas);color:var(--color-fg-1);-webkit-font-smoothing:antialiased}
a{color:var(--color-accent)}a:hover{color:var(--color-accent-hover)}
.circ-btn-primary:hover:not(:disabled){background:var(--color-accent-hover)!important}
.circ-btn-secondary:hover:not(:disabled){background:var(--color-surface-sunken)!important}
.circ-btn-apple:hover{background:#1f1f1f!important}
.circ-iconbtn:hover{background:var(--color-surface-sunken)!important}
.circ-textlink:hover{text-decoration:underline;text-underline-offset:2px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:var(--ring-width) solid var(--color-accent);outline-offset:var(--ring-offset)}
input:focus-visible{outline-offset:0;border-color:var(--color-accent)!important}
/* circlists.html: the Create circle page's body spacing, by posture */
.circ-wizard-body{justify-content:flex-start;padding:clamp(16px,4vh,44px) 22px 32px}
@media (min-width:760px){.circ-wizard-body{padding:clamp(40px,9vh,92px) 24px 48px}}
[data-circ-posture="mobile"] .circ-wizard-body{padding:clamp(16px,4vh,44px) 22px 32px}
[data-circ-posture="desktop"] .circ-wizard-body{padding:clamp(40px,9vh,92px) 24px 48px}
/* the same rules against the screen being drawn (--af-vh = 1% of its height), not this window */
[data-circ-posture="mobile"][style*="--af-vh"] .circ-wizard-body{padding:clamp(16px,calc(var(--af-vh) * 4),44px) 22px 32px}
[data-circ-posture="desktop"][style*="--af-vh"] .circ-wizard-body{padding:clamp(40px,calc(var(--af-vh) * 9),92px) 24px 48px}
/* the page-level body in this rig: a page, not a scroller */
.af-body{flex:1 0 auto}
[data-circ-posture][style*="--af-vh"] .af-body{flex:1 0 auto}
[data-circ-posture="mobile"][style*="--af-vh"] .circ-wizard-body.af-body-tight{padding-top:8px;padding-bottom:24px}
[data-circ-posture="mobile"][style*="--af-vh"] .circ-wizard-body.af-body-brand{padding-top:40px}
[data-circ-posture="desktop"][style*="--af-vh"] .circ-wizard-body.af-body-tight{padding-top:clamp(24px,calc(var(--af-vh) * 6),72px)}
/* circlists.html: the forced-mobile phone frame, verbatim */
.circ-stage{min-height:100vh;width:100%;background:#1c1c1a;background-image:radial-gradient(circle at 50% 0%,#2a2a27 0%,#161614 70%);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.circ-phone{width:402px;max-width:100%;height:min(872px,calc(100vh - 48px));background:#050505;border-radius:52px;padding:11px;box-shadow:0 40px 80px rgba(0,0,0,0.5),0 0 0 2px #2c2c2c,inset 0 0 0 2px #000;overflow:hidden}
.circ-phone-clip{position:relative;width:100%;height:100%;border-radius:42px;overflow:hidden;background:var(--color-canvas);transform:translateZ(0)}
.circ-phone-screen{width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;--circ-vh:100%}
.circ-phone-screen::-webkit-scrollbar{width:0;height:0}
.af-measure{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none}
/* circlists.html: the Config launcher and modal, verbatim */
  /* ---- config launcher (prototype aid) ---- */
  .circ-config-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 300; }
  /* One pill, two halves: settings you HOLD (Config) and states you GO to
     (States, app/states-ui.jsx). Icon-only keeps it out of the way; each half
     keeps its own 44px hit target, and the whole pill still drags. */
  .circ-launcher { display: inline-flex; align-items: stretch; background: var(--color-fg-1); border-radius: var(--radius-pill); box-shadow: var(--shadow-overlay); overflow: hidden; }
  .circ-launcher-half { display: inline-flex; align-items: center; justify-content: center; width: 46px; min-height: 44px; padding: 0; background: transparent; border: 0; color: #fff; cursor: inherit; }
  .circ-launcher-half + .circ-launcher-half { box-shadow: inset 1px 0 0 rgba(255,255,255,0.2); }
  .circ-launcher-half:hover { background: rgba(255,255,255,0.1); }
  .circ-launcher-half[data-open] { color: var(--color-accent); background: rgba(255,255,255,0.08); }
  .circ-launcher-half:focus-visible { outline-offset: -3px; }
  .circ-qa-work + .circ-qa-work { margin-top: 20px; }
  .circ-qa-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .circ-qa-stale { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); }

  /* ---- config modal (prototype aid) ---- */
  .circ-config-scrim {
    position: fixed; inset: 0; z-index: 400;
    background: color-mix(in srgb, var(--color-scrim) 52%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    transition: opacity var(--duration-slow) ease-in-out;
    overscroll-behavior: contain;
  }
  .circ-config-modal {
    width: min(760px, 100%); max-height: min(84vh, 720px);
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--color-surface) 74%, transparent);
    backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid var(--color-border-1);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay);
    transition: opacity var(--duration-base) var(--ease-quiet), transform var(--duration-base) var(--ease-quiet);
  }
  .circ-config-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: var(--space-5) var(--space-5) var(--space-4);
    border-bottom: 1px solid var(--color-border-2); flex-shrink: 0;
  }
  .circ-config-title {
    font-family: var(--font-sans); font-weight: 600; font-size: var(--text-xl);
    letter-spacing: -0.01em; color: var(--color-fg-1);
  }
  .circ-config-subtitle {
    font-family: var(--font-sans); font-weight: 400; font-size: var(--text-sm);
    color: var(--color-fg-3); margin-top: 2px;
  }
  .circ-config-close {
    background: transparent; border: 0; padding: 8px; margin: -8px; cursor: pointer;
    color: var(--color-fg-2); border-radius: var(--radius-sm); display: inline-flex; flex-shrink: 0;
  }
  .circ-config-close:hover { background: var(--color-surface-sunken); color: var(--color-fg-1); }
  .circ-config-body { padding: var(--space-5); overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
  .circ-config-eyebrow {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-3);
    margin-bottom: var(--space-3);
  }
  .circ-config-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 44px; padding: 6px 0;
  }
  .circ-config-row-label {
    font-family: var(--font-sans); font-weight: 500; font-size: var(--text-sm); color: var(--color-fg-1);
  }
  .circ-config-hint {
    font-family: var(--font-sans); font-weight: 400; font-size: 12.5px; line-height: 1.5;
    color: var(--color-fg-3); margin: -2px 0 var(--space-3);
  }
  .circ-config-sep { height: 1px; background: var(--color-border-2); margin: var(--space-2) 0 var(--space-5); }
  .circ-config-btn-secondary {
    background: var(--color-surface); color: var(--color-fg-1); border: 1px solid var(--color-border-1);
    font-family: var(--font-sans); font-weight: 500; font-size: 13px; cursor: pointer;
    padding: 8px 14px; border-radius: var(--radius-md); min-height: 36px;
  }
  .circ-config-btn-secondary:hover { background: var(--color-surface-sunken); }
  .circ-config-stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--color-surface-sunken); border-radius: var(--radius-md); padding: 3px; flex-shrink: 0; }
  .circ-config-stepper button { width: 28px; height: 28px; border: none; background: var(--color-surface); border-radius: calc(var(--radius-md) - 3px); font: 600 14px/1 var(--font-sans); color: var(--color-fg-1); cursor: pointer; }
  .circ-config-stepper button:hover { background: var(--color-surface-raised, var(--color-surface)); }
  .circ-config-stepper span { min-width: 24px; text-align: center; font: 600 13px/1 var(--font-sans); color: var(--color-fg-1); }
  .circ-config-seg {
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--color-surface-sunken); border-radius: var(--radius-md); flex-shrink: 0;
  }
  .circ-config-seg-btn {
    background: transparent; border: 0; cursor: pointer; border-radius: var(--radius-sm);
    padding: 7px 12px; min-height: 30px;
    font-family: var(--font-sans); font-weight: 500; font-size: 13px; color: var(--color-fg-2);
    transition: background var(--duration-base), color var(--duration-base);
  }
  .circ-config-seg-btn[data-active] { background: var(--color-accent); color: #fff; }
  .circ-config-seg-btn:not([data-active]):hover { background: var(--color-border-2); }
/* the launcher sits above this rig's strip */
.circ-config-wrap{bottom:calc(var(--af-strip, 0px) + 16px)}
/* rig strip: tooling, not product */
.af-strip{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1c1c1a;color:#f2f1ec;padding:10px clamp(10px,2vw,20px) calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;font:500 13px var(--font-sans);box-shadow:0 -1px 0 #33332f}
.af-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.af-opts{display:flex;flex-wrap:wrap;gap:6px}
.af-opts button,.af-seg button,.af-ghost{min-height:36px;padding:0 12px;border-radius:var(--radius-md);border:1px solid #44443f;background:transparent;color:#f2f1ec;font:500 13px var(--font-sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.af-opts button b{font:600 12px var(--font-mono);color:#8BBFAD}
.af-opts button[data-on],.af-seg button[data-on]{background:#f2f1ec;color:#1c1c1a;border-color:#f2f1ec}
.af-opts button[data-on] b{color:var(--color-accent)}
.af-opts button:hover:not([data-on]),.af-seg button:hover:not([data-on]),.af-ghost:hover{background:#2c2c29}
.af-seg{display:flex;gap:0}
.af-seg button{border-radius:0;margin-left:-1px}
.af-seg button:first-child{border-radius:var(--radius-md) 0 0 var(--radius-md);margin-left:0}
.af-seg button:last-child{border-radius:0 var(--radius-md) var(--radius-md) 0}
.af-read{font:500 12px var(--font-mono);color:#f2b8b8}
.af-read[data-v="fits"],.af-tab span[data-v="fits"]{color:#8BBFAD}
.af-read[data-v="hair"],.af-tab span[data-v="hair"]{color:#f5c27a}
.af-spacer{flex:1}
.af-why{max-width:80ch;font:400 13px/1.5 var(--font-sans);color:#dcdbd4}
.af-why p{margin:0 0 4px;text-wrap:pretty}
.af-why span{font:500 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:#9a9992;margin-right:6px}
.af-tab{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:50;min-height:36px;padding:0 12px;border:0;border-radius:var(--radius-md);background:#1c1c1a;color:#f2f1ec;font:500 12.5px var(--font-sans);cursor:pointer;display:inline-flex;gap:8px;align-items:center;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.af-tab span{font:500 11.5px var(--font-mono);color:#f2b8b8}
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app/primitives.jsx"></script>
<script type="text/babel" src="app/brand-motion.jsx"></script>
<script type="text/babel" src="app/wizard.jsx"></script>
<script type="text/babel" src="app/auth.jsx"></script>
<script type="text/babel" src="app/config.jsx"></script>
<script type="text/babel" src="docs/specs/signup-one-screen/playground/pg-auth-frame-pages.jsx"></script>
<script type="text/babel" src="docs/specs/signup-one-screen/playground/pg-auth-frame.jsx"></script>
</body>
</html>
