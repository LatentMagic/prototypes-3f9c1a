<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../../../../" />
<title>Option board — Include cards in Active</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--color-surface-sunken);color:var(--color-fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--color-accent)}a:hover{color:var(--color-accent-hover)}
button:focus-visible,[tabindex]:focus-visible{outline:var(--ring-width) solid var(--color-accent);outline-offset:var(--ring-offset)}
.circ-lens-trigger:hover{background:var(--color-surface-sunken)}
.circ-lens-seg:focus-visible{outline:var(--ring-width) solid var(--ring-color);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.circ-lens-seg[role="radio"]:not([aria-checked="true"]):hover{background:var(--color-border-2)!important}.circ-lens-seg[role="checkbox"]:not([aria-checked="true"]):hover{background:var(--color-surface-sunken)!important}}
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 96px}
.eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-3)}
h1{font:600 26px/1.2 var(--font-sans);letter-spacing:-.015em;margin:10px 0 0}
.lede{font:400 15px/1.6 var(--font-sans);color:var(--color-fg-2);max-width:68ch;margin:12px 0 0;text-wrap:pretty}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:28px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:780px){.grid{grid-template-columns:minmax(0,1fr)}}
.opthead{display:flex;align-items:baseline;gap:10px}
.num{font:500 12px/1 var(--font-mono);color:var(--color-fg-3);letter-spacing:.06em}
.name{font:600 17px/1.2 var(--font-sans);letter-spacing:-.01em}
.claim{font:400 13px/1.6 var(--font-sans);color:var(--color-fg-2);margin:8px 0 0;text-wrap:pretty}
.cost{font:400 13px/1.6 var(--font-sans);color:var(--color-fg-3);margin:4px 0 0;text-wrap:pretty}
.fact{font:500 12px/1.4 var(--font-mono);color:var(--color-fg-2);margin:10px 0 0}
.frame{margin-top:14px;width:100%;max-width:372px;height:700px;background:var(--color-page);border:1px solid var(--color-border-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised);overflow:hidden;position:relative}
.pg-opt-2 #circ-lens-display{display:none}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app/seed-data.jsx"></script>
<script type="text/babel" src="app/primitives.jsx"></script>
<script type="text/babel" src="app/brand-motion.jsx"></script>
<script type="text/babel" src="app/feed-sort.jsx"></script>
<script type="text/babel" src="app/feed-lens.jsx"></script>
<script type="text/babel" src="app/feed-saved.jsx"></script>
<script type="text/babel" src="app/talk-parts.jsx"></script>
<script type="text/babel" src="app/feed-history.jsx"></script>
<script type="text/babel" src="app/shell.jsx"></script>
<script type="text/babel" src="docs/specs/lm-786-history/playground/wb-include-switch.jsx"></script>
</body>
</html>
