<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create → Fund — desktop, not a modal</title>
<link rel="stylesheet" href="../../../tokens.css" />
<link rel="stylesheet" href="../../../swell.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7E7E2; }
  #root { min-height: 100vh; }
  .circ-btn { transition: background var(--duration-base) var(--ease-quiet); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-iconbtn:hover { background: var(--color-surface-sunken) !important; }
  a { color: var(--color-accent); } a:hover { color: var(--color-accent-hover); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 44px clamp(20px,4vw,56px) 120px; }
  .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent); font-weight: 500; margin: 0 0 12px; }
  .lede h1 { font-family: var(--font-sans); font-weight: 600; font-size: 32px; letter-spacing: -0.02em; color: var(--color-fg-1); margin: 0 0 12px; }
  .lede p { font-family: var(--font-sans); font-size: 15.5px; line-height: 1.6; color: var(--color-fg-2); margin: 0 0 10px; max-width: 820px; }
  .lede b { color: var(--color-fg-1); }
  .diag { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 860px; margin-top: 22px; }
  .diag div { background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 14px 16px; }
  .diag h4 { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--color-accent); margin: 0 0 6px; }
  .diag p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0; }
  .sec { margin-top: 48px; }
  .sec-head { border-top: 2px solid var(--color-fg-1); padding-top: 16px; }
  .sec-head .tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-1); }
  .sec-head h2 { font-family: var(--font-sans); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--color-fg-1); margin: 6px 0 8px; }
  .sec-head p { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--color-fg-2); margin: 0; max-width: 820px; }
  .sec-head b { color: var(--color-fg-1); }
  .verdict { font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; margin-top: 10px; display: inline-block; padding: 3px 9px; border-radius: var(--radius-pill); }
  .v-yes { color: var(--color-accent); background: var(--color-accent-soft); border: 1px solid var(--color-accent); }
  .v-no { color: var(--color-fg-2); background: var(--color-surface-sunken); border: 1px solid var(--color-border-1); }
  .rail { display: flex; gap: 30px; overflow-x: auto; padding: 22px 4px 6px; align-items: flex-start; }
  .caption { margin-top: 11px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--color-fg-3); }
  .caption b { color: var(--color-fg-1); font-weight: 600; }
  .win { width: 780px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 48px rgba(10,10,10,.16), 0 6px 16px rgba(10,10,10,.10); flex: 0 0 auto; border: 1px solid var(--color-border-1); }
  .win-bar { height: 38px; background: var(--color-surface-sunken); border-bottom: 1px solid var(--color-border-2); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .win-bar .tl { width: 11px; height: 11px; border-radius: 50%; }
  .win-bar .url { margin-left: 14px; flex: 1; max-width: 280px; height: 22px; border-radius: 6px; background: var(--color-page); border: 1px solid var(--color-border-2); display: flex; align-items: center; padding: 0 10px; font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-3); }
  .win-body { height: 560px; background: var(--color-page); overflow: hidden; position: relative; }
  .phone { background: #0A0A0A; border-radius: 44px; padding: 7px; box-shadow: 0 22px 44px rgba(10,10,10,.15), 0 6px 16px rgba(10,10,10,.10); width: 330px; flex: 0 0 auto; }
  .p-screen { position: relative; width: 316px; height: 626px; background: var(--color-page); border-radius: 37px; overflow: hidden; display: flex; flex-direction: column; }
  .statusbar { flex: 0 0 auto; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 26px; }
  .statusbar .time { font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--color-fg-1); }
  .statusbar .sys { display: flex; align-items: center; gap: 6px; color: var(--color-fg-1); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
};
const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.5, style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', ...style }} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
);
const EMAIL = 'sam.rivera@googlemail.com';
const NAME = 'Backend Pod';
const COL = 300; // the one true content column — identical on mobile and desktop

const Button = ({ children }) => (
  <button className="circ-btn circ-btn-primary" style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 16, lineHeight: 1.2, padding: '14px 22px', borderRadius: 'var(--radius-md)', border: 0, minHeight: 52, width: '100%', maxWidth: COL, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: 'var(--color-accent)', color: '#fff' }}>{children}</button>
);
const IconBtn = ({ name, label }) => (
  <button aria-label={label} className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: 8, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40, borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)' }}><Icon name={name} size={20} /></button>
);
const StepDots = ({ i }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
    {[0, 1].map(k => <span key={k} style={{ width: k === i ? 22 : 7, height: 7, borderRadius: 4, background: k === i ? 'var(--color-accent)' : 'var(--color-border-1)' }} />)}
  </div>
);
const Chrome = ({ back, pad = '10px 12px', width = null, border = false }) => (
  <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: pad, flex: 'none', width: '100%', borderBottom: border ? '1px solid var(--color-border-2)' : 0 }}>
    <div style={{ display: 'flex', width: '100%', maxWidth: width || 'none', margin: '0 auto', alignItems: 'center', justifyContent: 'space-between' }}>
      {back ? <IconBtn name="arrow-left" label="Back" /> : <span style={{ width: 40 }} />}
      <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}><StepDots i={back ? 1 : 0} /></div>
      <IconBtn name="x" label="Exit" />
    </div>
  </header>
);
const Title = ({ children }) => (
  <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 26, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: '0 0 16px' }}>{children}</h1>
);
const CreateContent = () => (
  <>
    <Title>Create a circle</Title>
    <p style={{ fontFamily: 'var(--font-sans)', fontSize: 15, lineHeight: 1.5, color: 'var(--color-fg-2)', margin: '0 0 24px' }}>A shared list for up to 10 people. You fund it as champion; everyone joins free.</p>
    <div style={{ width: '100%', textAlign: 'left', marginBottom: 16 }}>
      <label style={{ display: 'block', marginBottom: 6, fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-2)' }}>Circle name</label>
      <div style={{ width: '100%', fontFamily: 'var(--font-sans)', fontSize: 16, color: 'var(--color-fg-1)', border: '1px solid var(--color-accent)', boxShadow: '0 0 0 3px var(--color-accent-ring)', borderRadius: 'var(--radius-md)', padding: '12px 14px', minHeight: 44, background: 'var(--color-surface)' }}>{NAME}</div>
    </div>
    <Button>Continue<Icon name="arrow-right" size={18} /></Button>
  </>
);
const Price = () => (
  <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center', columnGap: 10, rowGap: 8 }}>
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 44, letterSpacing: '-0.03em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, letterSpacing: '0.02em', color: 'var(--color-fg-2)', lineHeight: 1.35, textAlign: 'left' }}>per circle<br />/ month</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', marginLeft: 6, padding: '2px 8px', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap' }}>Founding rate</span>
  </div>
);
const Features = () => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: '100%', maxWidth: 290, textAlign: 'left' }}>
    {['You fund the circle as its champion', 'Up to 10 members, all invited free', 'Shared list, private read-state'].map((f, i) => (
      <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
        <span style={{ marginTop: 1, color: 'var(--color-accent)', flex: 'none' }}><Icon name="check" size={18} /></span>
        <span style={{ fontFamily: 'var(--font-sans)', fontSize: 15, lineHeight: 1.4, color: 'var(--color-fg-1)' }}>{f}</span>
      </div>
    ))}
  </div>
);
const Footer = () => (
  <div style={{ margin: '14px 0 0', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3, fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', lineHeight: 1.5 }}>
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}><Icon name="lock" size={13} style={{ color: 'var(--color-fg-3)', flex: 'none' }} /><span>Billed to {EMAIL}</span></span>
    <span>Cancel anytime</span>
  </div>
);
const FundContent = () => (
  <>
    <Title>Fund your circle</Title>
    <div style={{ marginBottom: 22 }}><Price /></div>
    <div style={{ marginBottom: 22 }}><Features /></div>
    <Button>Fund this circle</Button>
    <Footer />
  </>
);
const Column = ({ step }) => (
  <div style={{ maxWidth: COL, width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center' }}>{step === 0 ? <CreateContent /> : <FundContent />}</div>
);

/* ---------- Mobile (locked — reference only) ---------- */
const Mobile = ({ step }) => (
  <div className="phone"><div className="p-screen">
    <div className="statusbar"><span className="time">9:41</span>
      <span className="sys">
        <svg width="17" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
        <svg width="24" height="12" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.4"/></svg>
      </span>
    </div>
    <div className="app">
      <div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}>
        <Chrome back={step === 1} />
        <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'safe center', padding: '4px 22px 26px' }}><Column step={step} /></div>
      </div>
    </div>
  </div></div>
);
const Win = ({ url = 'circlists.com/create', children }) => (
  <div className="win">
    <div className="win-bar">
      <span className="tl" style={{ background: '#f0685f' }} /><span className="tl" style={{ background: '#f5bd4f' }} /><span className="tl" style={{ background: '#61c454' }} />
      <span className="url">{url}</span>
    </div>
    <div className="win-body">{children}</div>
  </div>
);

/* ---------- Current: the panel that reads as a modal ---------- */
const Current = ({ step }) => (
  <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 28 }}>
    <div style={{ width: 404, background: 'var(--color-surface)', border: '1px solid var(--color-border-1)', borderRadius: 20, boxShadow: '0 8px 28px rgba(10,10,10,.07), 0 2px 8px rgba(10,10,10,.05)', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <Chrome back={step === 1} pad="12px 12px 2px" />
      <div style={{ display: 'flex', justifyContent: 'center', padding: '10px 48px 44px' }}><Column step={step} /></div>
    </div>
  </div>
);

/* ---------- A · Bare page — chrome at the page corners, nothing behind it ---------- */
const OptA = ({ step }) => (
  <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: 'var(--color-page)' }}>
    <Chrome back={step === 1} pad="14px 18px" />
    <div style={{ flex: 1, minHeight: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 24px 40px' }}><Column step={step} /></div>
  </div>
);

/* ---------- B · Full-height column — white band floor to ceiling ---------- */
const OptB = ({ step }) => (
  <div style={{ position: 'absolute', inset: 0, display: 'flex', justifyContent: 'center', background: 'var(--color-page)' }}>
    <div style={{ width: 460, background: 'var(--color-surface)', borderLeft: '1px solid var(--color-border-1)', borderRight: '1px solid var(--color-border-1)', display: 'flex', flexDirection: 'column' }}>
      <Chrome back={step === 1} pad="14px 14px" />
      <div style={{ flex: 1, minHeight: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 24px 40px' }}><Column step={step} /></div>
    </div>
  </div>
);

/* ---------- C · Page bar — full-width app bar, cream body beneath ---------- */
const OptC = ({ step }) => (
  <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: 'var(--color-page)' }}>
    <div style={{ background: 'var(--color-surface)', flex: 'none' }}><Chrome back={step === 1} pad="12px 20px" border /></div>
    <div style={{ flex: 1, minHeight: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 24px 40px' }}><Column step={step} /></div>
  </div>
);

/* ---------- D · Page bar + inset column rule — bar chrome, column given quiet edges ---------- */
const OptD = ({ step }) => (
  <div style={{ position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', background: 'var(--color-page)' }}>
    <div style={{ background: 'var(--color-surface)', flex: 'none' }}><Chrome back={step === 1} pad="12px 20px" width={460} border /></div>
    <div style={{ flex: 1, minHeight: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 24px 40px' }}>
      <div style={{ width: 460, background: 'var(--color-surface)', border: '1px solid var(--color-border-2)', borderRadius: 'var(--radius-md)', display: 'flex', justifyContent: 'center', padding: '40px 24px' }}><Column step={step} /></div>
    </div>
  </div>
);

const OPTIONS = [
  ['A', 'Bare page · chrome at the page corners', OptA, 'No surface at all — the cream page IS the screen, exactly as on mobile. Back / dots / exit sit at the top edge of the page; the 300px column is centred in what remains. Nothing has an outline, so nothing can be mistaken for a dialog. The risk the panel was invented to solve — a lone column adrift in space — is handled by the chrome anchoring the top edge and the column staying narrow.', 'yes', 'Closest to mobile · zero modal read'],
  ['B', 'Full-height column · white runs floor to ceiling', OptB, 'A 460px white band from the top of the viewport to the bottom, hairline on its two vertical edges only, no radius and no shadow. It contains and centres the text exactly like the panel did, but because it touches both page edges it can only read as a region of the page — a modal never touches the edges. Cream is still visible either side, so the surface still reads as a surface.', 'yes', 'Contained · cannot read as a modal'],
  ['C', 'Page bar · full-width chrome, cream body', OptC, 'A real app bar across the whole viewport with a hairline underneath carrying back / dots / exit, then the same centred column on cream. The bar is what tells you this is a page — pages have bars, dialogs have corners. Furthest from the modal read, and the most conventional "this is a route" signal in the app.', 'yes', 'Strongest "this is a page" signal'],
  ['D', 'Page bar + a quiet column surface', OptD, 'C, plus the column keeps a soft surface behind it — hairline, small radius, no shadow, chrome outside it in the bar. You still get the contained block of text, but the container is subordinate to a page bar rather than floating alone. Test of whether the containment you liked survives without the modal read, or whether any box at all still looks like a dialog.', 'no', 'Keeps a box — judge if it still reads dialog'],
];

const App = () => (
  <div className="wrap">
    <p className="kicker">Create → Fund · desktop · stays a full page route</p>
    <div className="lede">
      <h1>The desktop step is a page. Stop it looking like a modal.</h1>
      <p>Mobile is locked and unchanged. The desktop panel reads as a dialog for three specific reasons, and each is removable without giving up the thing you actually wanted — <b>a contained, evenly aligned column of text at the same width as mobile</b>. Every option below keeps that 300px column and the two-step chrome; they differ only in what holds it.</p>
      <div className="diag">
        <div><h4>Shadow</h4><p>A cast shadow says "floating above something." A page never floats — it <b>is</b> the something.</p></div>
        <div><h4>Four free edges</h4><p>Cream on all four sides with a radius is the exact silhouette of a dialog. Surfaces that belong to a page touch its edges.</p></div>
        <div><h4>An X in the corner of a box</h4><p>Exit inside a floating rectangle reads "dismiss this overlay" rather than "leave this page."</p></div>
      </div>
    </div>

    <div className="sec">
      <div className="sec-head"><div className="tag">The problem</div><h2>Current desktop panel</h2><p>Shown for comparison. Note the URL is a real route — there is nothing behind this panel to return to, which is precisely why the floating treatment misleads.</p></div>
      <div className="rail">
        <div><Win><Current step={0} /></Win><div className="caption"><b>Step 1</b> · Create</div></div>
        <div><Win url="circlists.com/create/fund"><Current step={1} /></Win><div className="caption"><b>Step 2</b> · Fund</div></div>
      </div>
    </div>

    {OPTIONS.map(([k, title, C, body, v, vt]) => (
      <div className="sec" key={k}>
        <div className="sec-head"><div className="tag">Option {k}</div><h2>{title}</h2><p>{body}</p><span className={'verdict ' + (v === 'yes' ? 'v-yes' : 'v-no')}>{vt}</span></div>
        <div className="rail">
          <div><Win><C step={0} /></Win><div className="caption"><b>Step 1</b> · Create</div></div>
          <div><Win url="circlists.com/create/fund"><C step={1} /></Win><div className="caption"><b>Step 2</b> · Fund</div></div>
        </div>
      </div>
    ))}

    <div className="sec">
      <div className="sec-head"><div className="tag">Locked</div><h2>Mobile — unchanged, for alignment</h2><p>Same 300px column, same chrome, same order. Whichever desktop option wins, the text block is identical to this one — that is the "aligned with mobile" requirement, and all four options satisfy it.</p></div>
      <div className="rail">
        <div><Mobile step={0} /><div className="caption"><b>Step 1</b> · Create</div></div>
        <div><Mobile step={1} /><div className="caption"><b>Step 2</b> · Fund</div></div>
      </div>
    </div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
