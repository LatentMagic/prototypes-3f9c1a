<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../../../../" />
<title>Option board — the held link</title>
<link rel="stylesheet" href="tokens.css">
<style>
*{box-sizing:border-box}
:root{--circ-vh:100vh}
body{margin:0;background:var(--color-surface-sunken);color:var(--color-fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
a{color:var(--color-accent)}a:hover{color:var(--color-accent-hover)}
.wrap{max-width:1200px;margin:0 auto;padding:40px 24px 96px}
.eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-3)}
h1{font:600 26px/1.2 var(--font-sans);letter-spacing:-.015em;margin:10px 0 0}
.lede{font:400 15px/1.6 var(--font-sans);color:var(--color-fg-2);max-width:64ch;margin:12px 0 0;text-wrap:pretty}
.seg{display:flex;gap:4px;margin-top:20px;background:var(--color-border-2);padding:4px;border-radius:var(--radius-md);width:max-content}
.seg button{border:0;background:transparent;font:500 13px/1 var(--font-sans);color:var(--color-fg-2);padding:10px 14px;border-radius:var(--radius-sm);cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--color-surface);color:var(--color-fg-1);box-shadow:var(--shadow-raised)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;margin-top:28px}
@media (max-width:1140px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.opthead{display:flex;align-items:baseline;gap:10px}
.num{font:500 12px/1 var(--font-mono);color:var(--color-fg-3);letter-spacing:.06em}
.name{font:600 17px/1.2 var(--font-sans);letter-spacing:-.01em}
.claim{font:400 13px/1.6 var(--font-sans);color:var(--color-fg-2);margin:8px 0 0;text-wrap:pretty}
.cost{font:400 13px/1.6 var(--font-sans);color:var(--color-fg-3);margin:4px 0 0;text-wrap:pretty}
.frame{--circ-vh:620px;margin-top:14px;width:100%;max-width:360px;border:1px solid var(--color-border-1);border-radius:var(--radius-lg);box-shadow:var(--shadow-raised);overflow:hidden}
.circ-appsheet-row:hover{background:#FCFCFA}
.hl{font:400 13px/1.4 var(--font-mono);color:var(--color-fg-1);white-space:nowrap;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;text-align:left;width:100%}
.hl:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.hl-bare{scrollbar-width:none;padding:4px 0}
.hl-bare::-webkit-scrollbar{display:none}
.rule{height:1px;background:var(--color-border-2);width:100%}
.hl-strip{background:var(--color-surface-sunken);border:1px solid var(--color-border-1);border-radius:var(--radius-sm);padding:10px 12px}
.hl-base{scrollbar-width:none;padding:8px 0 10px;border-bottom:1px solid var(--color-border-strong)}
.hl-base::-webkit-scrollbar{display:none}
.lbl{font:500 11px/1 var(--font-mono);letter-spacing:var(--tracking-wide);color:var(--color-fg-3);text-align:left;width:100%}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="app/seed-data.jsx"></script>
<script type="text/babel" src="app/primitives.jsx"></script>
<script type="text/babel" src="app/brand-motion.jsx"></script>
<script type="text/babel" src="app/liveliness.jsx"></script>
<script type="text/babel" src="app/talk-parts.jsx"></script>
<script type="text/babel" src="app/home.jsx"></script>
<script type="text/babel" src="app/wizard.jsx"></script>
<script type="text/babel">
const HL_KEY = 'pg_held_link_v1';
const HL_LINKS = {
  long: 'https://www.nytimes.com/2026/09/21/technology/ai-agents-software-engineering-teams.html?unlocked_article_code=1.8U0.aB3x&smid=url-share&utm_source=ios',
  short: 'https://github.com/rust-lang/rfcs/pull/3668',
};
const HL_SPACES = [
  { id: 'a', name: 'Platform pod', funded: true, unseen: true, members: [{ name: 'You' }, { name: 'Sam M.' }, { name: 'Priya K.' }, { name: 'Dan R.' }] },
  { id: 'b', name: 'Thursday book club', funded: true, members: [{ name: 'You' }, { name: 'Ellie' }, { name: 'Marcus' }] },
  { id: 'c', name: 'Us two', funded: true, members: [{ name: 'You' }, { name: 'Jo' }] },
  { id: 'd', name: 'Rust study group', funded: false, members: [{ name: 'You' }, { name: 'Tom' }, { name: 'Aisha' }, { name: 'Lee' }, { name: 'Ren' }] },
];

// Fades the right edge while more link lies beyond it; none on the left.
const HL_FADE = 48;
const HlScroll = ({ className, link }) => {
  const [edge, setEdge] = React.useState({ start: true, end: false });
  const ref = React.useRef(null);
  const read = () => { const el = ref.current; if (!el) return; setEdge({ start: el.scrollLeft <= 2, end: el.scrollLeft + el.clientWidth >= el.scrollWidth - 2 }); };
  React.useEffect(() => { if (ref.current) ref.current.scrollLeft = 0; read(); }, [link]);
  const r = edge.end ? '#000 100%' : `#000 calc(100% - ${HL_FADE}px), transparent 100%`;
  const mask = `linear-gradient(90deg, #000 0, ${r})`;
  return <div ref={ref} tabIndex={0} role="region" aria-label="Shared link" dir="ltr" title={link} onScroll={read} className={className} style={{ WebkitMaskImage: mask, maskImage: mask }}>{link}</div>;
};

const HL_OPTIONS = [
  { n: '01', name: 'Ruled', claim: 'No box. Bare mono line that scrolls sideways, fading at the edge; a hairline separates the link from the circles.', cost: 'The fade is the only cue that it scrolls.',
    render: (link) => (<React.Fragment><HlScroll className="hl hl-bare" link={link} /><div className="rule" style={{ margin: '16px 0 24px' }}></div></React.Fragment>) },
  { n: '02', name: 'Sunken strip', claim: 'What is in the app now. Grey inset box, visible scrollbar.', cost: 'A box above a stack of boxes.',
    render: (link) => (<div style={{ width: '100%', marginBottom: 20 }}><div className="hl hl-strip">{link}</div></div>) },
  { n: '03', name: 'Baseline', claim: 'A field drawn the way a form draws one: small label, the link, one underline. The underline is the divider.', cost: 'Reads as editable to some.',
    render: (link) => (<div style={{ width: '100%', marginBottom: 24, display: 'flex', flexDirection: 'column', gap: 6 }}><div className="lbl">Link</div><HlScroll className="hl hl-base" link={link} /></div>) },
  { n: '04', name: 'Strip, ruled', claim: 'The sunken strip from 02, with the hairline from 01 between the link and the circles.', cost: 'Box and rule both; the rule may read as one mark too many.',
    render: (link) => (<React.Fragment><div style={{ width: '100%' }}><div className="hl hl-strip">{link}</div></div><div className="rule" style={{ margin: '20px 0 20px' }}></div></React.Fragment>) },
];

const HlPicker = ({ option, link }) => (
  <WizardShell flow={null} onExit={() => {}}>
    <WizardTitle mb={option.n === '03' ? 20 : 12}>Add to which circle?</WizardTitle>
    {option.render(link)}
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, width: '100%', textAlign: 'left' }}>
      {HL_SPACES.map((s) => <CircleRow key={s.id} space={s} onSelect={() => {}} />)}
    </div>
  </WizardShell>
);

const HlBoard = () => {
  const [len, setLen] = React.useState(() => { try { return JSON.parse(localStorage.getItem(HL_KEY)).len || 'long'; } catch (e) { return 'long'; } });
  React.useEffect(() => { localStorage.setItem(HL_KEY, JSON.stringify({ len })); }, [len]);
  const link = HL_LINKS[len];
  return (
    <div className="wrap">
      <div className="eyebrow">LM-771 · Share intake</div>
      <h1>The held link</h1>
      <p className="lede">Ways to show the whole link on the picker without it wrapping. Everything else is the shipped picker: title, column, rows.</p>
      <div className="seg" role="group" aria-label="Link length">
        <button aria-pressed={len === 'long'} onClick={() => setLen('long')}>Long link</button>
        <button aria-pressed={len === 'short'} onClick={() => setLen('short')}>Short link</button>
      </div>
      <div className="grid">
        {HL_OPTIONS.map((o) => (
          <div key={o.n}>
            <div className="opthead"><span className="num">{o.n}</span><span className="name">{o.name}</span></div>
            <p className="claim">{o.claim}</p>
            <p className="cost">{o.cost}</p>
            <div className="frame"><HlPicker option={o} link={link} /></div>
          </div>
        ))}
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<HlBoard />);
</script>
</body>
</html>
