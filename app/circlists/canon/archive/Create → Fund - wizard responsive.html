<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Create → Fund — responsive + naming</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="swell.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #E7E7E2; }
  #root { min-height: 100vh; }
  @keyframes circ-micro-reveal { 0% { transform: translateX(0);} 64% { transform: translateX(86px);} 100% { transform: translateX(86px);} }
  .circ-micro-halo-static { display: none; }
  .circ-micro-reveal { animation: circ-micro-reveal 3800ms cubic-bezier(0.45,0,0.15,1) infinite; }
  @media (prefers-reduced-motion: reduce) { .circ-micro-reveal { animation: none !important; display: none !important; } .circ-micro-halo-static { display: block !important; } }
  .circ-btn { transition: background var(--duration-base) var(--ease-quiet); }
  .circ-btn-primary:hover { background: var(--color-accent-hover) !important; }
  .circ-iconbtn:hover { background: var(--color-surface-sunken) !important; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 44px clamp(20px,4vw,56px) 120px; }
  .kicker { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-accent); font-weight: 500; margin: 0 0 12px; }
  .lede h1 { font-family: var(--font-sans); font-weight: 600; font-size: 32px; letter-spacing: -0.02em; color: var(--color-fg-1); margin: 0 0 12px; }
  .lede p { font-family: var(--font-sans); font-size: 15.5px; line-height: 1.6; color: var(--color-fg-2); margin: 0 0 10px; max-width: 800px; }

  .sec { margin-top: 60px; }
  .sec-head { border-top: 2px solid var(--color-fg-1); padding-top: 16px; margin-bottom: 4px; }
  .sec-head .tag { font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-1); }
  .sec-head h2 { font-family: var(--font-sans); font-weight: 600; font-size: 22px; letter-spacing: -0.01em; color: var(--color-fg-1); margin: 6px 0 8px; }
  .sec-head p { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--color-fg-2); margin: 0; max-width: 840px; }
  .subhead { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-fg-2); margin: 30px 0 4px; }

  .rail { display: flex; gap: 40px; overflow-x: auto; padding: 24px 4px 20px; align-items: flex-start; }
  .opt { flex: 0 0 auto; }
  .opt-head { max-width: 340px; margin: 0 0 16px; }
  .opt-head .n { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-fg-1); margin-bottom: 8px; }
  .opt-head .n b { width: 22px; height: 22px; border-radius: 50%; background: var(--color-fg-1); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-sans); font-weight: 700; font-size: 12px; }
  .opt-head h3 { font-family: var(--font-sans); font-weight: 600; font-size: 17px; color: var(--color-fg-1); margin: 0 0 5px; letter-spacing: -0.01em; }
  .opt-head p { font-family: var(--font-sans); font-size: 13px; line-height: 1.5; color: var(--color-fg-2); margin: 0; }
  .caption { text-align: center; margin-top: 10px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; color: var(--color-fg-3); }

  .phone { background: #0A0A0A; border-radius: 44px; padding: 7px; box-shadow: 0 24px 48px rgba(10,10,10,.16), 0 6px 16px rgba(10,10,10,.10); flex: 0 0 auto; }
  .p-screen { position: relative; width: 344px; height: 700px; background: var(--color-page); border-radius: 37px; overflow: hidden; display: flex; flex-direction: column; }

  .win { width: 940px; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 48px rgba(10,10,10,.16), 0 6px 16px rgba(10,10,10,.10); flex: 0 0 auto; border: 1px solid var(--color-border-1); }
  .win-bar { height: 40px; background: var(--color-surface-sunken); border-bottom: 1px solid var(--color-border-2); display: flex; align-items: center; gap: 8px; padding: 0 14px; }
  .win-bar .tl { width: 11px; height: 11px; border-radius: 50%; }
  .win-bar .url { margin-left: 14px; flex: 1; max-width: 320px; height: 22px; border-radius: 6px; background: var(--color-page); border: 1px solid var(--color-border-2); display: flex; align-items: center; padding: 0 10px; font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-3); }
  .win-body { height: 600px; background: var(--color-page); overflow: hidden; display: flex; flex-direction: column; }

  .statusbar { flex: 0 0 auto; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px 0 28px; }
  .statusbar .time { font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--color-fg-1); }
  .statusbar .sys { display: flex; align-items: center; gap: 6px; color: var(--color-fg-1); }
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }

  .note { display: flex; gap: 12px; align-items: flex-start; background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 14px 16px; max-width: 840px; margin-top: 20px; }
  .note .k { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--color-accent); flex: 0 0 auto; margin-top: 2px; }
  .note p { font-family: var(--font-sans); font-size: 13px; line-height: 1.55; color: var(--color-fg-2); margin: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const ICONS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  x: '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>',
  'arrow-left': '<line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline>',
  'arrow-right': '<line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>',
  lock: '<rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>',
};
const Icon = ({ name, size = 20, color = 'currentColor', strokeWidth = 1.5, style = {} }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block', ...style }} aria-hidden="true"
    dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
);
const MicroDot = ({ size = 10 }) => {
  const uid = React.useId().replace(/:/g, '');
  const c = `mc-${uid}`, g = `mg-${uid}`;
  return (
    <svg width={size} height={size} viewBox="-2 -2 52 52" aria-hidden="true" style={{ display: 'block', flexShrink: 0 }}>
      <defs><clipPath id={c}><circle cx="24" cy="24" r="22.5" /></clipPath>
      <linearGradient id={g} x1="0" y1="0" x2="1" y2="0"><stop offset="0" stopColor="var(--color-sage)" stopOpacity="0" /><stop offset="0.5" stopColor="var(--color-sage)" stopOpacity="1" /><stop offset="1" stopColor="var(--color-sage)" stopOpacity="0" /></linearGradient></defs>
      <circle className="circ-micro-halo-static" cx="24" cy="24" r="22.5" fill="var(--color-sage)" />
      <g clipPath={`url(#${c})`}><rect className="circ-micro-reveal" x="-32" y="-10" width="26" height="68" fill={`url(#${g})`} /></g>
      <circle cx="24" cy="24" r="14.25" fill="var(--color-accent)" /><circle cx="24" cy="24" r="14.925" fill="none" stroke="#fff" strokeWidth="1.35" />
    </svg>
  );
};
const Button = ({ children, full = true, style = {} }) => (
  <button className="circ-btn circ-btn-primary" style={{
    fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 16, lineHeight: 1, padding: '14px 24px',
    borderRadius: 'var(--radius-md)', border: 0, minHeight: 52, width: full ? '100%' : 'auto', cursor: 'pointer',
    display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: 'var(--color-accent)', color: '#fff', ...style,
  }}>{children}</button>
);
const EMAIL = 'sam.rivera@googlemail.com', SPACE = 'Backend Pod';

const IconBtn = ({ name, label }) => (
  <button aria-label={label} className="circ-iconbtn" style={{ background: 'transparent', border: 0, padding: 8, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: 40, minHeight: 40, borderRadius: 'var(--radius-md)', color: 'var(--color-fg-2)' }}><Icon name={name} size={20} /></button>
);
const Dots = ({ i }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
    {[0, 1].map(k => <span key={k} style={{ width: k === i ? 22 : 7, height: 7, borderRadius: 4, background: k === i ? 'var(--color-accent)' : 'var(--color-border-1)' }} />)}
  </div>
);
const Chrome = ({ back, i, pad = '10px 12px' }) => (
  <header style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: pad, flex: 'none' }}>
    {back ? <IconBtn name="arrow-left" label="Back" /> : <span style={{ width: 40 }} />}
    <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}><Dots i={i} /></div>
    <IconBtn name="x" label="Exit" />
  </header>
);
const Title = ({ children, mb = 20, size = 26 }) => (
  <h1 style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: size, lineHeight: 1.2, letterSpacing: '-0.02em', color: 'var(--color-fg-1)', margin: `0 0 ${mb}px` }}>{children}</h1>
);
const Sub = ({ children, mb = 22 }) => (
  <p style={{ fontFamily: 'var(--font-sans)', fontSize: 15, lineHeight: 1.5, color: 'var(--color-fg-2)', margin: `0 0 ${mb}px`, maxWidth: 320 }}>{children}</p>
);
const Field = ({ value = '' }) => (
  <div style={{ width: '100%', textAlign: 'left', marginBottom: 8 }}>
    <label style={{ display: 'block', marginBottom: 6, fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 13, color: 'var(--color-fg-2)' }}>Circle name</label>
    <div style={{ width: '100%', fontFamily: 'var(--font-sans)', fontSize: 16, color: 'var(--color-fg-1)', border: '1px solid var(--color-accent)', boxShadow: '0 0 0 3px var(--color-accent-ring)', borderRadius: 'var(--radius-md)', padding: '12px 14px', minHeight: 44, background: 'var(--color-surface)' }}>{value}</div>
  </div>
);
const Price = () => (
  <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', justifyContent: 'center', columnGap: 10, rowGap: 8 }}>
    <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 44, letterSpacing: '-0.03em', color: 'var(--color-accent)', lineHeight: 1 }}>£3</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 13, letterSpacing: '0.02em', color: 'var(--color-fg-2)', lineHeight: 1.35, textAlign: 'left' }}>per circle<br />/ month</span>
    <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 500, fontSize: 11, letterSpacing: '0.02em', color: 'var(--color-accent)', background: 'var(--color-accent-soft)', border: '1px solid var(--color-accent)', marginLeft: 6, padding: '2px 8px', borderRadius: 'var(--radius-pill)', whiteSpace: 'nowrap' }}>Founding rate</span>
  </div>
);
const Features = () => (
  <div style={{ display: 'flex', flexDirection: 'column', gap: 12, width: '100%', maxWidth: 300, textAlign: 'left' }}>
    {['You fund the circle as its champion', 'Up to 10 members, all invited free', 'Shared list, private read-state'].map((f, i) => (
      <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 12 }}>
        <span style={{ marginTop: 1, color: 'var(--color-accent)', flex: 'none' }}><Icon name="check" size={18} /></span>
        <span style={{ fontFamily: 'var(--font-sans)', fontWeight: 400, fontSize: 15, lineHeight: 1.4, color: 'var(--color-fg-1)' }}>{f}</span>
      </div>
    ))}
  </div>
);
const FinePrint = () => (
  <>
    <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12.5, color: 'var(--color-fg-3)', margin: '12px 0', maxWidth: 280 }}>Billed to {EMAIL}. <span style={{ whiteSpace: 'nowrap' }}>Cancel anytime.</span></div>
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, color: 'var(--color-fg-3)' }}>
      <Icon name="lock" size={13} /><span style={{ fontFamily: 'var(--font-sans)', fontWeight: 500, fontSize: 12 }}>Secure checkout · powered by a payment provider</span>
    </div>
  </>
);
const Chip = () => (
  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 8, background: 'var(--color-surface)', border: '1px solid var(--color-border-1)', borderRadius: 'var(--radius-pill)', padding: '6px 14px 6px 8px' }}>
    <MicroDot size={16} /><span style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 14, color: 'var(--color-fg-1)', whiteSpace: 'nowrap' }}>{SPACE}</span>
  </div>
);

// content column — align = 'center' (mobile) | 'top' (desktop)
const Col = ({ children, align }) => (
  <div style={{ flex: 1, minHeight: 0, overflowY: 'auto', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: align === 'top' ? 'flex-start' : 'safe center', padding: align === 'top' ? '56px 24px 40px' : '4px 24px 28px', textAlign: 'center' }}>
    <div style={{ maxWidth: 380, width: '100%', display: 'flex', flexDirection: 'column', alignItems: 'center' }}>{children}</div>
  </div>
);

// name treatments for step 2 (nameMode): 'chip' | 'prose' | 'hero'
const NameStep = ({ align, nameMode }) => (
  <Col align={align}>
    {nameMode === 'hero' ? <>
      <Title size={28} mb={8}>{SPACE}</Title>
      <Sub mb={22}>Fund your circle to bring it to life.</Sub>
    </> : nameMode === 'prose' ? <>
      <Title mb={10}>Fund your circle</Title>
      <Sub mb={22}>You're funding <b style={{ color: 'var(--color-fg-1)', fontWeight: 600 }}>{SPACE}</b> — everyone you invite joins free.</Sub>
    </> : <>
      <div style={{ marginBottom: 16 }}><Chip /></div>
      <Title mb={22}>Fund your circle</Title>
    </>}
    <div style={{ marginBottom: 22 }}><Price /></div>
    <div style={{ marginBottom: 22 }}><Features /></div>
    <Button style={{ maxWidth: 320 }}>Fund this circle</Button>
    <FinePrint />
  </Col>
);
const CreateStep = ({ align }) => (
  <Col align={align}>
    <Title mb={8}>Name your circle</Title>
    <Sub mb={20}>A shared list for up to 10 — everyone you invite joins free.</Sub>
    <Field value={SPACE} />
    <Button style={{ maxWidth: 320, marginTop: 8 }}>Continue<Icon name="arrow-right" size={18} /></Button>
  </Col>
);

const StatusBar = () => (
  <div className="statusbar"><span className="time">9:41</span>
    <span className="sys">
      <svg width="17" height="11" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4.5" width="3" height="7.5" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity="0.35"/></svg>
      <svg width="24" height="12" viewBox="0 0 26 13" fill="none"><rect x="0.5" y="0.5" width="21" height="12" rx="3" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="16" height="9" rx="1.5" fill="currentColor"/><rect x="23" y="4" width="2" height="5" rx="1" fill="currentColor" opacity="0.4"/></svg>
    </span>
  </div>
);
const Phone = ({ children }) => (
  <div className="phone"><div className="p-screen"><StatusBar /><div className="app">{children}</div></div></div>
);
const Win = ({ children }) => (
  <div className="win">
    <div className="win-bar">
      <span className="tl" style={{ background: '#f0685f' }} /><span className="tl" style={{ background: '#f5bd4f' }} /><span className="tl" style={{ background: '#61c454' }} />
      <span className="url">circlists.com/create</span>
    </div>
    <div className="win-body">{children}</div>
  </div>
);

const MobileFlow = ({ nameMode }) => (
  <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
    <div><Phone><div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}><Chrome i={0} /><CreateStep align="center" /></div></Phone><div className="caption">Step 1 · centered</div></div>
    <div><Phone><div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}><Chrome back i={1} /><NameStep align="center" nameMode={nameMode} /></div></Phone><div className="caption">Step 2 · centered</div></div>
  </div>
);
const DeskFlow = ({ nameMode }) => (
  <div style={{ display: 'flex', gap: 40, alignItems: 'flex-start' }}>
    <div><Win><div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}><Chrome i={0} pad="14px 18px" /><CreateStep align="top" /></div></Win><div className="caption">Step 1 · top-aligned, button spans the column only</div></div>
    <div><Win><div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}><Chrome back i={1} pad="14px 18px" /><NameStep align="top" nameMode={nameMode} /></div></Win><div className="caption">Step 2 · top-aligned</div></div>
  </div>
);

const App = () => {
  const [mode, setMode] = React.useState('chip');
  const modes = [['chip', 'Circle chip'], ['prose', 'Named in prose'], ['hero', 'Name as hero']];
  return (
    <div className="wrap">
      <p className="kicker">Create → Fund · dots locked · responsive + naming</p>
      <div className="lede">
        <h1>Same wizard, now on desktop — and fixing the name</h1>
        <p>Dots stay (prettiest, and they signal the wizard). Two things to resolve: how the flow behaves on <b>desktop</b>, and how step 2 shows the name you typed without “Fund Backend Pod” reading like the screen's own title.</p>
      </div>

      <div className="sec">
        <div className="sec-head"><div className="tag">Responsive behaviour</div><h2>Centered on mobile, pinned to the top on desktop</h2><p>Industry-standard for a short wizard: on a phone the content centers in the viewport; on desktop it sits toward the top of the page. The content column stays a fixed narrow width in both, so the primary button spans <b>the column</b>, never the whole desktop width — that's the full-width button you liked, kept safe on desktop.</p></div>
        <div className="subhead">Desktop — top-aligned, narrow column</div>
        <div className="rail"><DeskFlow nameMode={mode} /></div>
        <div className="subhead">Mobile — centered</div>
        <div className="rail"><MobileFlow nameMode={mode} /></div>
        <div className="note"><span className="k">The rule</span><p>One column, one button width. Vertical placement is the only responsive change: <b>center</b> under ~640px, <b>top</b> (≈56px down) above it. Nothing else moves — no separate desktop layout to maintain.</p></div>
      </div>

      <div className="sec">
        <div className="sec-head"><div className="tag">Naming on step 2</div><h2>Make the entered name obvious — pick one</h2><p>“Fund your circle” goes back to being the heading (an action, parallel to “Name your circle”). The name you typed is shown separately so it reads as <em>your value</em>, not the screen's name. Toggle to preview each in the frames above.</p></div>
        <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginTop: 20 }}>
          {modes.map(([k, label], n) => (
            <button key={k} onClick={() => setMode(k)} style={{ cursor: 'pointer', textAlign: 'left', background: mode === k ? 'var(--color-fg-1)' : 'var(--color-surface)', color: mode === k ? '#fff' : 'var(--color-fg-1)', border: '1px solid ' + (mode === k ? 'var(--color-fg-1)' : 'var(--color-border-1)'), borderRadius: 'var(--radius-md)', padding: '14px 18px', width: 260, transition: 'all .15s' }}>
              <div style={{ fontFamily: 'var(--font-mono)', fontSize: 11, fontWeight: 600, letterSpacing: '.05em', textTransform: 'uppercase', opacity: .7, marginBottom: 5 }}>Option {n + 1}</div>
              <div style={{ fontFamily: 'var(--font-sans)', fontWeight: 600, fontSize: 15, marginBottom: 4 }}>{label}</div>
              <div style={{ fontFamily: 'var(--font-sans)', fontSize: 12.5, lineHeight: 1.45, color: mode === k ? 'rgba(255,255,255,.75)' : 'var(--color-fg-2)' }}>{k === 'chip' ? 'A pill with the circle mark + name under the heading. Reads as an object you\u2019re funding.' : k === 'prose' ? 'The name sits inside a sentence: “You\u2019re funding Backend Pod.” Explicit, no new component.' : 'The name becomes the hero (H1); the action drops to the subline and button.'}</div>
            </button>
          ))}
        </div>
        <div className="rail" style={{ marginTop: 8 }}>
          <div><Phone><div style={{ height: '100%', display: 'flex', flexDirection: 'column' }}><Chrome back i={1} /><NameStep align="center" nameMode={mode} /></div></Phone><div className="caption">Step 2 preview · {modes.find(m => m[0] === mode)[1]}</div></div>
        </div>
        <div className="note"><span className="k">My lean</span><p><b>Circle chip.</b> It's the one that unambiguously says “this is the circle” without a sentence to read or an eyebrow to stack, and the mark ties it to the brand. Prose is the safest/lightest; hero is boldest but risks the “are we already on the circle's page?” read.</p></div>
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
