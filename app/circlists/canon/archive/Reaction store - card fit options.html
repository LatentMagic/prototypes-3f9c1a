<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reaction store — card fit options</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html,body{margin:0;background:var(--color-page)}
  #root{max-width:760px;margin:0 auto;padding:48px 24px 120px}
  .pg-head{margin-bottom:40px}
  .pg-eyebrow{font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-fg-3);margin-bottom:10px}
  .pg-title{font:var(--weight-semibold) var(--text-3xl)/1.15 var(--font-sans);letter-spacing:var(--tracking-tight);color:var(--color-fg-1);margin:0 0 12px}
  .pg-sub{font:var(--weight-regular) var(--text-md)/1.55 var(--font-sans);color:var(--color-fg-2);max-width:60ch;margin:0}
  .opt{margin-top:44px}
  .opt-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .opt-n{font:var(--weight-semibold) var(--text-sm)/1 var(--font-mono);color:var(--color-accent);flex-shrink:0;min-width:24px}
  .opt-name{font:var(--weight-semibold) var(--text-lg)/1.2 var(--font-sans);color:var(--color-fg-1)}
  .opt-note{font:var(--weight-regular) var(--text-sm)/1.5 var(--font-sans);color:var(--color-fg-2);margin:0 0 16px 36px;max-width:64ch}
  .opt-note b{font-weight:var(--weight-semibold);color:var(--color-fg-1)}
  .ref-tag{display:inline-block;font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-fg-3);border:1px solid var(--color-border-1);border-radius:var(--radius-sm);padding:5px 8px;margin-left:8px}
  .ref-tag.bad{color:var(--color-destructive);border-color:var(--color-destructive)}

  .circ-card{background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);display:flex;flex-direction:column}
  .circ-cardaction{background:transparent;border:0;cursor:pointer;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;color:var(--color-fg-3);transition:background var(--duration-base),color var(--duration-base)}
  .circ-cardaction:hover{background:var(--color-surface-sunken);color:var(--color-fg-1)}
  .circ-cardaction-icon{padding:8px;min-width:44px;min-height:44px;justify-content:center}
  .circ-cardtitle{cursor:pointer}
  .circ-cardtitle:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--color-border-strong)}
  .circ-thumblink{transition:filter var(--duration-base);cursor:pointer}
  .circ-thumblink:hover{filter:brightness(1.05)}
  .rx-pill{background:transparent;border:0;cursor:pointer;border-radius:var(--radius-md);display:inline-flex;align-items:center;transition:background var(--duration-base)}
  .rx-pill:hover{background:var(--color-surface-sunken)}
  .rx-link{background:transparent;border:0;cursor:pointer;color:var(--color-fg-2);font:var(--weight-medium) var(--text-sm)/1 var(--font-sans);padding:6px 4px;border-radius:var(--radius-sm)}
  .rx-link:hover{color:var(--color-fg-1);text-decoration:underline;text-underline-offset:2px}

  /* modal */
  .rx-scrim{position:fixed;inset:0;background:var(--color-scrim);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .rx-modal{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);max-width:380px;width:100%;padding:28px}
  .rx-modal h3{margin:0 0 4px}
  .rx-modal .sub{font:var(--weight-regular) var(--text-sm)/1.5 var(--font-sans);color:var(--color-fg-2);margin:0 0 20px}
  .rx-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--color-border-2)}
  .rx-row .g{font-size:22px;width:28px;text-align:center}
  .rx-row .nm{flex:1;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-sans);color:var(--color-fg-1)}
  .rx-row .dp{font:var(--weight-regular) var(--text-xs)/1 var(--font-mono);color:var(--color-fg-3)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;

// ---- icons -----------------------------------------------------------------
const PATHS = {
  check: '<polyline points="20 6 9 17 4 12"></polyline>',
  trash: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>',
  chevron: '<polyline points="9 18 15 12 9 6"></polyline>',
};
const Icon = ({ name, size = 18, sw = 1.5, style }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ fill: 'none', stroke: 'currentColor', strokeWidth: sw, strokeLinecap: 'round', strokeLinejoin: 'round', display: 'block', ...style }}
    dangerouslySetInnerHTML={{ __html: PATHS[name] }} />
);
// arrows-out (the real door's "opens a view" cue)
const ArrowsOut = ({ size = 13 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ stroke: 'var(--color-fg-3)', strokeWidth: 1.6, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round', flexShrink: 0 }}>
    <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" /><line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
  </svg>
);
// bespoke "responses / swell" glyph — concentric ripple, roughly the mark's shape
const SwellGlyph = ({ size = 20, sw = 1.6 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ fill: 'none', stroke: 'currentColor', strokeWidth: sw, strokeLinecap: 'round', display: 'block' }}>
    <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none" />
    <path d="M6.5 12a5.5 5.5 0 0 1 11 0" /><path d="M3 12a9 9 0 0 1 18 0" />
  </svg>
);

// ---- avatar ----------------------------------------------------------------
const AV_TONES = ['#5a5a56', '#54655f', '#645749', '#565f77', '#66505d', '#4a5548'];
const initials = (n) => { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase(); };
const hash = (s) => { let h=0; s=String(s); for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
const Avatar = ({ name, size = 28, accent = false }) => (
  <span style={{ width: size, height: size, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
    background: accent ? 'var(--color-accent)' : AV_TONES[hash(name) % AV_TONES.length], color: '#fff',
    font: `var(--weight-semibold) ${Math.round(size*0.4)}px/1 var(--font-sans)` }}>{initials(name)}</span>
);

// ---- sample data -----------------------------------------------------------
const ITEM = {
  url: 'https://newsletter.pragmaticengineer.com/p/the-calm-company',
  title: 'The calm company: how we cut our notifications by 90%',
  source: 'The Pragmatic Engineer',
  host: 'pragmaticengineer.com',
  attribution: 'Added by Marcus T.',
  tint: 'linear-gradient(135deg,#33413f,#54655f)',
};
// reactions: 3 distinct glyphs, 6 people, spoken depth
const RX = [
  { name: 'Marcus T.', glyph: '\u2764\uFE0F', depth: 'deeply' },
  { name: 'Ada L.',    glyph: '\u2764\uFE0F', depth: 'moderately' },
  { name: 'Sol R.',    glyph: '\u2764\uFE0F', depth: 'a little' },
  { name: 'Priya N.',  glyph: '\uD83D\uDD25', depth: 'deeply' },
  { name: 'Jae K.',    glyph: '\uD83D\uDD25', depth: 'moderately' },
  { name: 'You',       glyph: '\uD83D\uDC4D', depth: 'a little' },
];
const distinctGlyphs = (() => { const s=[]; RX.forEach(r=>{ if(!s.includes(r.glyph)) s.push(r.glyph); }); return s; })();
const TOTAL = RX.length;
const DOMINANT = '\u2764\uFE0F';

// ---- shared card scaffolding ----------------------------------------------
// slots: topRight, belowBody, imageBadge, footerReaction (JSX left of delete),
//        footerActions (overrides the default reaction+delete cluster), belowFooter
const Card = ({ slots = {}, openModal, activeRef }) => {
  const S = slots;
  return (
    <article className="circ-card">
      <div style={{ display: 'flex', gap: 'var(--space-4)', alignItems: 'flex-start' }}>
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
            <span style={{ width: 15, height: 15, borderRadius: 3, flexShrink: 0, background: '#2f3d3b', display: 'inline-flex' }} />
            <span style={{ font: 'var(--weight-semibold) 13px/1 var(--font-sans)', color: 'var(--color-fg-2)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{ITEM.source}</span>
            {S.topRight && <span style={{ marginLeft: 'auto', flexShrink: 0 }}>{S.topRight}</span>}
          </div>
          <span className="circ-cardtitle" onClick={openModal} style={{ font: 'var(--weight-semibold) 16px/1.3 var(--font-sans)', letterSpacing: '-0.01em', color: 'var(--color-fg-1)', textDecoration: 'none', textWrap: 'pretty', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{ITEM.title}</span>
        </div>
        <span className="circ-thumblink" onClick={openModal} style={{ position: 'relative', flexShrink: 0, display: 'block', width: 60, height: 60, borderRadius: 'var(--radius-md)', overflow: 'hidden', border: '1px solid var(--color-border-2)', background: ITEM.tint }}>
          {S.imageBadge}
        </span>
      </div>
      {S.belowBody}
      <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)', marginTop: 'var(--space-3)' }}>
        {S.footerFull ? S.footerFull : (<React.Fragment>
        <Avatar name="Marcus T." size={28} />
        <span style={{ flex: 1, minWidth: 0, font: 'var(--weight-semibold) 14px/1.3 var(--font-sans)', color: 'var(--color-fg-1)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{ITEM.attribution}</span>
        {S.footerActions
          ? S.footerActions
          : (
            <div style={{ display: 'flex', alignItems: 'center', gap: 2, marginRight: -12 }}>
              {S.footerReaction}
              <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>
            </div>
          )}</React.Fragment>)}
      </div>
      {S.belowFooter}
    </article>
  );
};

// reusable bits -------------------------------------------------------------
const GlyphHuddle = ({ size = 16 }) => (
  <span style={{ display: 'inline-flex', alignItems: 'center' }}>
    {distinctGlyphs.map((g, i) => (
      <span key={i} style={{ fontSize: size, lineHeight: 1, width: size + 1, height: size + 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginLeft: i === 0 ? 0 : -4 }}>{g}</span>
    ))}
  </span>
);
// the original door, verbatim: glyph huddle + the arrows-out “opens a view” cue.
const OriginalDoor = ({ open, style }) => (
  <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 8, padding: 8, minHeight: 44, ...style }}>
    <GlyphHuddle /><ArrowsOut />
  </button>
);
const Delete = () => <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>;
const Hairline = () => <span style={{ width: 1, height: 20, background: 'var(--color-border-2)', flexShrink: 0 }} />;
const AttribFooter = () => (
  <React.Fragment>
    <Avatar name="Marcus T." size={28} />
    <span style={{ flexShrink: 0, font: 'var(--weight-semibold) 14px/1.3 var(--font-sans)', color: 'var(--color-fg-1)' }}>{ITEM.attribution}</span>
  </React.Fragment>
);

// ---- the ten options -------------------------------------------------------
const OPTIONS = [
  {
    name: 'The current door (Read tab today)',
    note: 'For reference — the wide glyph huddle + arrows-out cue dropped into the action cluster. It breaks the tidy tick/delete column and reads as one more button rather than a summary.',
    tag: 'current', bad: true,
    slots: (open) => ({
      footerReaction: (
        <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 8, padding: 8, margin: '-8px -8px -8px 0', minHeight: 44 }}>
          <GlyphHuddle /><ArrowsOut />
        </button>
      ),
    }),
  },
  {
    name: 'Count pill',
    note: 'Collapse the huddle to the single <b>dominant glyph + total</b> in one recessive pill. Same footprint as an icon button, so the right-edge column holds. The spread of glyphs lives in the modal.',
    slots: (open) => ({
      footerReaction: (
        <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 5, padding: '0 10px', height: 44, marginRight: 2 }}>
          <span style={{ fontSize: 16 }}>{DOMINANT}</span>
          <span style={{ font: 'var(--weight-semibold) 13px/1 var(--font-mono)', color: 'var(--color-fg-2)' }}>{TOTAL}</span>
        </button>
      ),
    }),
  },
  {
    name: 'Purpose-built icon + badge',
    note: 'A dedicated <b>ripple glyph</b> (roughly the mark\u2019s shape) as a plain 44px icon button matching tick and delete, with a small count badge. The column is <b>pixel-identical</b> to the Active tab — the door just swaps which glyph sits in the tick\u2019s slot.',
    slots: (open) => ({
      footerReaction: (
        <button className="circ-cardaction circ-cardaction-icon" onClick={open} aria-label="How the circle landed" style={{ position: 'relative', color: 'var(--color-fg-3)' }}>
          <SwellGlyph size={20} />
          <span style={{ position: 'absolute', top: 4, right: 4, minWidth: 15, height: 15, padding: '0 3px', borderRadius: 8, background: 'var(--color-fg-2)', color: '#fff', font: 'var(--weight-semibold) 10px/15px var(--font-mono)', textAlign: 'center' }}>{TOTAL}</span>
        </button>
      ),
    }),
  },
  {
    name: 'Up on the source line',
    note: 'Move the summary to the <b>top-right of the meta row</b>, opposite the source. Reactions read as part of the card\u2019s identity, and the footer drops to a clean single <b>delete</b> — the action column stays quiet.',
    slots: (open) => ({
      topRight: (
        <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 6, padding: '4px 6px' }}>
          <GlyphHuddle size={15} />
          <span style={{ font: 'var(--weight-semibold) 12px/1 var(--font-mono)', color: 'var(--color-fg-3)' }}>{TOTAL}</span>
        </button>
      ),
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 2, marginRight: -12 }}>
          <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>
        </div>
      ),
    }),
  },
  {
    name: 'Badge on the preview image',
    note: 'Anchor a small reaction chip to the <b>corner of the preview</b>. \u201CReceived by many\u201D sits on the media it responds to, and the footer actions are left completely alone.',
    slots: (open) => ({
      imageBadge: (
        <button onClick={(e) => { e.stopPropagation(); open(); }} aria-label="How the circle landed" style={{ position: 'absolute', left: 4, bottom: 4, display: 'inline-flex', alignItems: 'center', gap: 3, padding: '2px 6px 2px 4px', border: 0, cursor: 'pointer', borderRadius: 'var(--radius-pill)', background: 'rgba(255,255,255,0.94)', boxShadow: '0 1px 2px rgba(0,0,0,0.2)' }}>
          <span style={{ fontSize: 13 }}>{DOMINANT}</span>
          <span style={{ font: 'var(--weight-semibold) 11px/1 var(--font-mono)', color: 'var(--color-fg-1)' }}>{TOTAL}</span>
        </button>
      ),
    }),
  },
  {
    name: 'On the attribution row (its old home, refined)',
    note: 'Return it to \u201Cadded by one \u2192 <b>received by many</b>\u201D — a borderless read-out just after the attribution, set off by a hairline from the delete action so it reads as information, not a third button.',
    slots: (open) => ({
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginRight: -12 }}>
          <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 6, padding: '6px 4px' }}>
            <GlyphHuddle size={16} />
            <span style={{ font: 'var(--weight-regular) 13px/1 var(--font-sans)', color: 'var(--color-fg-3)' }}>{TOTAL} responded</span>
          </button>
          <span style={{ width: 1, height: 20, background: 'var(--color-border-2)' }} />
          <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>
        </div>
      ),
    }),
  },
  {
    name: 'Full-width strip below',
    note: 'A dedicated thin row <b>under the footer</b>, spanning the card. Spends a little vertical space to buy full width — the glyphs, a plain-language summary, and an open chevron all breathe.',
    slots: (open) => ({
      belowFooter: (
        <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ display: 'flex', width: '100%', alignItems: 'center', gap: 10, marginTop: 'var(--space-3)', padding: '10px 12px', borderTop: '1px solid var(--color-border-2)', borderRadius: 0 }}>
          <GlyphHuddle size={17} />
          <span style={{ font: 'var(--weight-medium) 13px/1 var(--font-sans)', color: 'var(--color-fg-2)' }}>{TOTAL} in the circle responded</span>
          <span style={{ marginLeft: 'auto', color: 'var(--color-fg-3)', display: 'inline-flex' }}><Icon name="chevron" size={16} /></span>
        </button>
      ),
    }),
  },
  {
    name: 'Vertical token — mirror the column',
    note: 'The Active tab stacks tick + delete. Here the door collapses to <b>one round token</b> (dominant glyph in a soft ring, +N) sitting in that same slot, so Read and Active share the exact same two-slot right-edge column.',
    slots: (open) => ({
      footerReaction: (
        <button onClick={open} aria-label="How the circle landed" style={{ position: 'relative', width: 44, height: 44, border: 0, background: 'transparent', cursor: 'pointer', borderRadius: 'var(--radius-sm)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center' }}>
          <span style={{ width: 30, height: 30, borderRadius: '50%', border: '1.5px solid var(--color-border-1)', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 15 }}>{DOMINANT}</span>
          <span style={{ position: 'absolute', top: 2, right: 2, minWidth: 15, height: 15, padding: '0 3px', borderRadius: 8, background: 'var(--color-fg-2)', color: '#fff', font: 'var(--weight-semibold) 10px/15px var(--font-mono)', textAlign: 'center' }}>{TOTAL}</span>
        </button>
      ),
    }),
  },
  {
    name: 'Faces, not emoji',
    note: 'Lead with the <b>people</b>, not the glyphs — a stack of reactor avatars + a quiet count. Emphasises \u201Cmany read this\u201D and drops emoji clutter from the card; the glyph spread stays in the modal.',
    slots: (open) => ({
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginRight: -12 }}>
          <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 8, padding: '4px 6px' }}>
            <span style={{ display: 'inline-flex' }}>
              {RX.slice(0, 3).map((r, i) => (
                <span key={i} style={{ marginLeft: i === 0 ? 0 : -8, borderRadius: '50%', border: '2px solid var(--color-surface)', display: 'inline-flex' }}><Avatar name={r.name} size={24} /></span>
              ))}
            </span>
            <span style={{ font: 'var(--weight-medium) 13px/1 var(--font-sans)', color: 'var(--color-fg-3)' }}>+{TOTAL - 3}</span>
          </button>
          <span style={{ width: 1, height: 20, background: 'var(--color-border-2)' }} />
          <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>
        </div>
      ),
    }),
  },
  {
    name: 'Distribution bar',
    note: 'Turn the store into a tiny <b>proportion bar</b> — one calm segment per glyph, weighted by how many chose it, capped with the total. Analytics-forward and the most compact horizontally.',
    slots: (open) => {
      const counts = distinctGlyphs.map(g => RX.filter(r => r.glyph === g).length);
      const tones = ['var(--color-accent)', '#8BBFAD', '#c9c9c3'];
      return {
        footerReaction: (
          <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 8, padding: '6px 8px', marginRight: 2 }}>
            <span style={{ display: 'inline-flex', width: 56, height: 8, borderRadius: 4, overflow: 'hidden' }}>
              {counts.map((c, i) => <span key={i} style={{ flex: c, background: tones[i] }} />)}
            </span>
            <span style={{ font: 'var(--weight-semibold) 13px/1 var(--font-mono)', color: 'var(--color-fg-2)' }}>{TOTAL}</span>
          </button>
        ),
      };
    },
  },
  {
    name: 'Plain text link',
    note: 'The most minimal: no glyphs on the card at all, just a quiet <b>\u201C{TOTAL} responses\u201D</b> text link on the attribution row. Every glyph and depth is revealed only on open — the card stays purely typographic.',
    slots: (open) => ({
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: -12 }}>
          <button className="rx-link" onClick={open}>{TOTAL} responses</button>
          <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><Icon name="trash" size={17} /></button>
        </div>
      ),
    }),
  },

  // ---- second round: built on the user's steers ----------------------------
  {
    name: 'Original door + hairline only',
    note: 'The minimal diff you asked for: keep the door <b>exactly as it was</b> (huddle + arrows-out), just set it off from delete with the little vertical rule. Does that one line give enough separation to stop it reading as another button?',
    round: 2,
    slots: (open) => ({
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: -12 }}>
          <OriginalDoor open={open} style={{ margin: 0 }} />
          <Hairline />
          <Delete />
        </div>
      ),
    }),
  },
  {
    name: 'Door in the middle, delete under the image',
    note: 'Your \u201Cliterally in the middle\u201D idea: attribution stays left, <b>delete centres under the image</b>, and the <b>original door floats in the open middle</b> instead of being shunted against delete. It gets room without a redesign.',
    round: 2,
    slots: (open) => ({
      footerFull: (
        <React.Fragment>
          <AttribFooter />
          <div style={{ flex: 1, display: 'flex', justifyContent: 'center' }}><OriginalDoor open={open} style={{ margin: 0 }} /></div>
          <div style={{ marginRight: -8 }}><Delete /></div>
        </React.Fragment>
      ),
    }),
  },
  {
    name: 'Original door, up on the source line',
    note: 'Option 04\u2019s placement but with the <b>real door</b> — huddle + arrows — not a reinvented icon. The footer drops to delete alone (which can centre under the image). The summary sits with the content it summarises.',
    round: 2,
    slots: (open) => ({
      topRight: <OriginalDoor open={open} style={{ margin: '-8px -8px -8px 0' }} />,
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 2, marginRight: -12 }}>
          <Delete />
        </div>
      ),
    }),
  },
  {
    name: 'Door stretched into a long band',
    note: 'The \u201Cmake it longer so it stops looking cramped\u201D move, kept <b>inline</b>: the door grows to fill the gap between attribution and delete — huddle left, a quiet <b>{TOTAL} responded</b>, arrows at the far right. It reads as a summary strip, not a jammed button.',
    round: 2,
    slots: (open) => ({
      footerFull: (
        <React.Fragment>
          <AttribFooter />
          <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 10, padding: '8px 12px', margin: '0 8px' }}>
            <GlyphHuddle size={16} />
            <span style={{ font: 'var(--weight-medium) 13px/1 var(--font-sans)', color: 'var(--color-fg-3)' }}>{TOTAL} responded</span>
            <span style={{ marginLeft: 'auto', display: 'inline-flex' }}><ArrowsOut /></span>
          </button>
          <div style={{ marginRight: -12 }}><Delete /></div>
        </React.Fragment>
      ),
    }),
  },
  {
    name: 'Door as a summary line above the footer',
    note: 'Lift the original door onto <b>its own line between the body and the footer</b>, right-aligned under the image. The attribution + delete footer stays completely untouched — the column never moves — and \u201Creceived by many\u201D sits right beneath the media.',
    round: 2,
    slots: (open) => ({
      belowBody: (
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 'var(--space-2)' }}>
          <OriginalDoor open={open} style={{ margin: '0 -8px 0 0' }} />
        </div>
      ),
      footerActions: (
        <div style={{ display: 'flex', alignItems: 'center', gap: 2, marginRight: -12 }}>
          <Delete />
        </div>
      ),
    }),
  },
];

// ---- modal (proves the door still opens) -----------------------------------
const Modal = ({ onClose }) => (
  <div className="rx-scrim" onClick={onClose}>
    <div className="rx-modal" onClick={(e) => e.stopPropagation()}>
      <h3>How the circle landed</h3>
      <p className="sub">{TOTAL} of the circle responded to this link.</p>
      {RX.map((r, i) => (
        <div key={i} className="rx-row">
          <span className="g">{r.glyph}</span>
          <span className="nm">{r.name}</span>
          <span className="dp">{r.depth}</span>
        </div>
      ))}
      <div style={{ marginTop: 20, textAlign: 'right' }}>
        <button className="circ-cardaction" onClick={onClose} style={{ padding: '8px 12px', color: 'var(--color-fg-2)' }}>Close</button>
      </div>
    </div>
  </div>
);

const App = () => {
  const [modal, setModal] = useState(false);
  const open = () => setModal(true);
  return (
    <React.Fragment>
      <div className="pg-head">
        <div className="pg-eyebrow">BIZ-80 · Read tab</div>
        <h1 className="pg-title">Where the reaction store lives</h1>
        <p className="pg-sub">Ten ways the Swell door could sit in the enriched card. Every card is in the Read state with the same six responses (three distinct glyphs). The tension: the door was a summary of what the circle felt, but in the new card it landed among the actions and broke the tidy right-edge column. Click any treatment to confirm it still opens the review.</p>
      </div>
      {OPTIONS.map((o, i) => (
        <React.Fragment key={i}>
          {o.round === 2 && OPTIONS[i - 1] && OPTIONS[i - 1].round !== 2 && (
            <div style={{ marginTop: 56, paddingTop: 8, borderTop: '2px solid var(--color-border-1)' }}>
              <div className="pg-eyebrow" style={{ marginTop: 20 }}>Round two · your steers</div>
              <p className="pg-sub" style={{ fontSize: 14 }}>Every one keeps the original door — glyph huddle + the arrows-out \u201cthis opens\u201d cue.</p>
            </div>
          )}
          <section className="opt">
            <div className="opt-head">
              <span className="opt-n">{String(i + 1).padStart(2, '0')}</span>
              <span className="opt-name">{o.name}</span>
              {o.tag && <span className={'ref-tag' + (o.bad ? ' bad' : '')}>{o.tag}</span>}
            </div>
            <p className="opt-note" dangerouslySetInnerHTML={{ __html: o.note.replace('{TOTAL}', TOTAL) }} />
            <Card slots={o.slots(open)} openModal={open} />
          </section>
        </React.Fragment>
      ))}
      {modal && <Modal onClose={() => setModal(false)} />}
    </React.Fragment>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
