<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<base href="../../../" />
<title>Option 12 — desktop + mobile</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  html,body{margin:0;background:var(--color-page)}
  #root{max-width:900px;margin:0 auto;padding:48px 24px 120px}
  .pg-eyebrow{font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-fg-3);margin-bottom:10px}
  .pg-title{font:var(--weight-semibold) var(--text-3xl)/1.15 var(--font-sans);letter-spacing:var(--tracking-tight);margin:0 0 12px}
  .pg-sub{font:var(--weight-regular) var(--text-md)/1.55 var(--font-sans);color:var(--color-fg-2);max-width:64ch;margin:0}
  .band{margin-top:48px;padding-top:8px;border-top:2px solid var(--color-border-1)}
  .band-h{font:var(--weight-semibold) var(--text-xl)/1.2 var(--font-sans);margin:20px 0 4px}
  .row{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;margin-top:24px}
  .col{display:flex;flex-direction:column;gap:10px}
  .col-lbl{font:var(--weight-semibold) var(--text-sm)/1.3 var(--font-sans);color:var(--color-fg-1)}
  .col-lbl .tag{font:var(--weight-medium) var(--text-xs)/1 var(--font-mono);letter-spacing:var(--tracking-wide);text-transform:uppercase;color:var(--color-fg-3);border:1px solid var(--color-border-1);border-radius:var(--radius-sm);padding:4px 6px;margin-left:8px}
  .col-lbl .tag.bad{color:var(--color-destructive);border-color:var(--color-destructive)}
  .col-lbl .tag.good{color:var(--color-accent);border-color:var(--color-accent)}
  .col-note{font:var(--weight-regular) var(--text-sm)/1.5 var(--font-sans);color:var(--color-fg-2);max-width:34ch}
  .col-note b{font-weight:var(--weight-semibold);color:var(--color-fg-1)}
  /* viewport shells */
  .vp-desktop{width:600px;max-width:100%}
  .vp-mobile{width:360px;background:var(--color-page);border:1px solid var(--color-border-1);border-radius:26px;padding:14px;box-shadow:var(--shadow-raised)}
  .vp-mobile .notch{width:80px;height:5px;border-radius:3px;background:var(--color-border-1);margin:2px auto 12px}

  .circ-card{background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-5);display:flex;flex-direction:column}
  .circ-cardaction{background:transparent;border:0;cursor:pointer;border-radius:var(--radius-sm);display:inline-flex;align-items:center;gap:6px;color:var(--color-fg-3);transition:background var(--duration-base),color var(--duration-base)}
  .circ-cardaction:hover{background:var(--color-surface-sunken);color:var(--color-fg-1)}
  .circ-cardaction-icon{padding:8px;min-width:44px;min-height:44px;justify-content:center}
  .circ-cardtitle{cursor:pointer}
  .circ-cardtitle:hover{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--color-border-strong)}
  .circ-thumblink{cursor:pointer;transition:filter var(--duration-base)}
  .circ-thumblink:hover{filter:brightness(1.05)}
  .rx-pill{background:transparent;border:0;cursor:pointer;border-radius:var(--radius-md);display:inline-flex;align-items:center;transition:background var(--duration-base)}
  .rx-pill:hover{background:var(--color-surface-sunken)}
  .rx-scrim{position:fixed;inset:0;background:var(--color-scrim);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
  .rx-modal{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-overlay);max-width:380px;width:100%;padding:28px}
  .rx-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--color-border-2)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { useState } = React;
const TRASH = '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"></path>';
const TrashIcon = ({ size = 17 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ fill: 'none', stroke: 'currentColor', strokeWidth: 1.5, strokeLinecap: 'round', strokeLinejoin: 'round', display: 'block' }}
    dangerouslySetInnerHTML={{ __html: TRASH }} />
);
const ArrowsOut = ({ size = 13 }) => (
  <svg viewBox="0 0 24 24" width={size} height={size} aria-hidden="true"
    style={{ stroke: 'var(--color-fg-3)', strokeWidth: 1.6, fill: 'none', strokeLinecap: 'round', strokeLinejoin: 'round', flexShrink: 0 }}>
    <polyline points="15 3 21 3 21 9" /><polyline points="9 21 3 21 3 15" /><line x1="21" y1="3" x2="14" y2="10" /><line x1="3" y1="21" x2="10" y2="14" />
  </svg>
);
const AV_TONES = ['#5a5a56', '#54655f', '#645749', '#565f77', '#66505d'];
const initials = (n) => { const p = String(n).trim().split(/\s+/); return ((p[0]||'')[0] + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase(); };
const hash = (s) => { let h=0; s=String(s); for (let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; };
const Avatar = ({ name, size = 28 }) => (
  <span style={{ width: size, height: size, borderRadius: '50%', flexShrink: 0, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: AV_TONES[hash(name) % AV_TONES.length], color: '#fff', font: `var(--weight-semibold) ${Math.round(size*0.4)}px/1 var(--font-sans)` }}>{initials(name)}</span>
);
const ITEM = { title: 'The calm company: how we cut our notifications by 90%', source: 'The Pragmatic Engineer', attribution: 'Added by Marcus T.', name: 'Marcus T.', tint: 'linear-gradient(135deg,#33413f,#54655f)' };
const RX = [
  { name: 'Marcus T.', glyph: '\u2764\uFE0F', depth: 'deeply' },
  { name: 'Ada L.', glyph: '\u2764\uFE0F', depth: 'moderately' },
  { name: 'Sol R.', glyph: '\u2764\uFE0F', depth: 'a little' },
  { name: 'Priya N.', glyph: '\uD83D\uDD25', depth: 'deeply' },
  { name: 'Jae K.', glyph: '\uD83D\uDD25', depth: 'moderately' },
  { name: 'You', glyph: '\uD83D\uDC4D', depth: 'a little' },
];
const GLYPHS = ['\u2764\uFE0F', '\uD83D\uDD25', '\uD83D\uDC4D'];
const TOTAL = RX.length;

const Huddle = () => (
  <span style={{ display: 'inline-flex', alignItems: 'center' }}>
    {GLYPHS.map((g, i) => <span key={i} style={{ fontSize: 16, lineHeight: 1, width: 17, height: 17, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginLeft: i === 0 ? 0 : -4 }}>{g}</span>)}
  </span>
);
const Door = ({ open }) => (
  <button className="rx-pill" onClick={open} aria-label="How the circle landed" style={{ gap: 8, padding: 8, minHeight: 44 }}><Huddle /><ArrowsOut /></button>
);
const Delete = () => <button className="circ-cardaction circ-cardaction-icon" aria-label="Delete"><TrashIcon /></button>;
const Hairline = () => <span style={{ width: 1, height: 20, background: 'var(--color-border-2)', flexShrink: 0 }} />;

// attrib modes: 'full' = "Added by Marcus T." | 'name' = "Marcus T." | 'wrap' = actions on own row
const Card = ({ open, attrib = 'full' }) => {
  const label = attrib === 'name' ? ITEM.name : ITEM.attribution;
  const actions = (
    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginRight: -12 }}>
      <Door open={open} /><Hairline /><Delete />
    </div>
  );
  return (
    <article className="circ-card">
      <div style={{ display: 'flex', gap: 'var(--space-4)', alignItems: 'flex-start' }}>
        <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column', gap: 6 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, minWidth: 0 }}>
            <span style={{ width: 15, height: 15, borderRadius: 3, flexShrink: 0, background: '#2f3d3b' }} />
            <span style={{ font: 'var(--weight-semibold) 13px/1 var(--font-sans)', color: 'var(--color-fg-2)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{ITEM.source}</span>
          </div>
          <span className="circ-cardtitle" onClick={open} style={{ font: 'var(--weight-semibold) 16px/1.3 var(--font-sans)', letterSpacing: '-0.01em', color: 'var(--color-fg-1)', textWrap: 'pretty', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical', overflow: 'hidden' }}>{ITEM.title}</span>
        </div>
        <span className="circ-thumblink" onClick={open} style={{ flexShrink: 0, display: 'block', width: 60, height: 60, borderRadius: 'var(--radius-md)', border: '1px solid var(--color-border-2)', background: ITEM.tint }} />
      </div>
      {attrib === 'wrap' ? (
        <React.Fragment>
          <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)', marginTop: 'var(--space-3)' }}>
            <Avatar name={ITEM.name} size={28} />
            <span style={{ flex: 1, minWidth: 0, font: 'var(--weight-semibold) 14px/1.3 var(--font-sans)', color: 'var(--color-fg-1)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{ITEM.attribution}</span>
          </div>
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 'var(--space-1)' }}>{actions}</div>
        </React.Fragment>
      ) : (
        <div style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-3)', marginTop: 'var(--space-3)' }}>
          <Avatar name={ITEM.name} size={28} />
          <span style={{ flex: 1, minWidth: 0, font: 'var(--weight-semibold) 14px/1.3 var(--font-sans)', color: 'var(--color-fg-1)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{label}</span>
          {actions}
        </div>
      )}
    </article>
  );
};

const Modal = ({ onClose }) => (
  <div className="rx-scrim" onClick={onClose}>
    <div className="rx-modal" onClick={(e) => e.stopPropagation()}>
      <h3 style={{ margin: '0 0 4px' }}>How the circle landed</h3>
      <p style={{ font: 'var(--weight-regular) var(--text-sm)/1.5 var(--font-sans)', color: 'var(--color-fg-2)', margin: '0 0 20px' }}>{TOTAL} of the circle responded.</p>
      {RX.map((r, i) => (
        <div key={i} className="rx-row"><span style={{ fontSize: 22, width: 28, textAlign: 'center' }}>{r.glyph}</span><span style={{ flex: 1, font: 'var(--weight-medium) var(--text-sm)/1.3 var(--font-sans)' }}>{r.name}</span><span style={{ font: 'var(--weight-regular) var(--text-xs)/1 var(--font-mono)', color: 'var(--color-fg-3)' }}>{r.depth}</span></div>
      ))}
      <div style={{ marginTop: 20, textAlign: 'right' }}><button className="circ-cardaction" onClick={onClose} style={{ padding: '8px 12px', color: 'var(--color-fg-2)' }}>Close</button></div>
    </div>
  </div>
);

const Mobile = ({ children }) => <div className="vp-mobile"><div className="notch" />{children}</div>;

const App = () => {
  const [modal, setModal] = useState(false);
  const open = () => setModal(true);
  return (
    <React.Fragment>
      <div className="pg-eyebrow">BIZ-80 · Option 12 · Read tab</div>
      <h1 className="pg-title">Original door + hairline, across viewports</h1>
      <p className="pg-sub">Option 12 in the real card at desktop and mobile width. On mobile the door + rule + delete leave the attribution too little room, so “Added by Marcus T.” clips to an ellipsis. Three considered treatments below. All tap targets stay 44px; text meets AA on white.</p>

      <div className="band">
        <div className="pg-eyebrow" style={{ marginTop: 20 }}>Desktop · 600px column</div>
        <div className="band-h">Fits comfortably</div>
        <div className="row"><div className="col vp-desktop"><Card open={open} attrib="full" /></div></div>
      </div>

      <div className="band">
        <div className="pg-eyebrow" style={{ marginTop: 20 }}>Mobile · 360px</div>
        <div className="band-h">The truncation problem, and three fixes</div>
        <div className="row">
          <div className="col">
            <div className="col-lbl">A · As-is<span className="tag bad">problem</span></div>
            <Mobile><Card open={open} attrib="full" /></Mobile>
            <p className="col-note">“Added by Marcus T.” clips mid-name — the ellipsis reads as broken, not intentional.</p>
          </div>
          <div className="col">
            <div className="col-lbl">B · Name only<span className="tag good">recommended</span></div>
            <Mobile><Card open={open} attrib="name" /></Mobile>
            <p className="col-note">Drop <b>“Added by”</b> — the avatar already says whose it is. Short, never clips, and the door keeps its full width.</p>
          </div>
          <div className="col">
            <div className="col-lbl">C · Actions drop below</div>
            <Mobile><Card open={open} attrib="wrap" /></Mobile>
            <p className="col-note">Keep the full phrase; move the door + delete onto their own row. No clipping, at the cost of one line of height.</p>
          </div>
        </div>
      </div>
      {modal && <Modal onClose={() => setModal(false)} />}
    </React.Fragment>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
