<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../../../" />
<title>Circlists · Champion role — consolidated (variations)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --color-accent:#047857;--color-accent-soft:#ECFDF5;--color-sage:#8BBFAD;
  --color-page:#FAFAF7;--color-surface:#FFFFFF;--color-surface-sunken:#F5F5F2;
  --color-fg-1:#0A0A0A;--color-fg-2:#525252;--color-fg-3:#6E6E6B;
  --color-border-1:#DCDCD8;--color-border-2:#E8E8E5;
  --color-destructive:#991B1B;--color-scrim:rgba(10,10,10,0.40);
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono','IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
  --radius-md:8px;--radius-lg:12px;
  --shadow-overlay:0 16px 32px rgba(10,10,10,.08),0 4px 8px rgba(10,10,10,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#EDEDE8;color:var(--color-fg-1);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;display:flex}
a{color:var(--color-fg-1)}

#nav{width:344px;flex:0 0 344px;height:100vh;overflow-y:auto;background:var(--color-surface);border-right:1px solid var(--color-border-1);padding:28px 0 40px}
#nav .brandrow{display:flex;align-items:center;gap:10px;padding:0 24px 4px}
#nav .brandrow .wm{font-weight:700;font-size:18px;letter-spacing:-.02em}
#nav .brandrow .wm .tittle{color:var(--color-accent)}
#nav h1{font-size:15px;font-weight:600;margin:14px 0 4px;padding:0 24px;letter-spacing:-.01em}
#nav .sub{padding:0 24px;font-size:12.5px;line-height:1.5;color:var(--color-fg-3);margin:0 0 18px}
.famhead{padding:18px 24px 6px;font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.10em;text-transform:uppercase;color:var(--color-fg-3)}
.navitem{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:2px solid transparent;cursor:pointer;padding:11px 24px 11px 22px;font-family:var(--font-sans)}
.navitem:hover{background:var(--color-surface-sunken)}
.navitem.active{background:var(--color-accent-soft);border-left-color:var(--color-accent)}
.navitem .t{display:flex;align-items:baseline;gap:8px}
.navitem .num{font-family:var(--font-mono);font-size:11px;color:var(--color-fg-3);flex:0 0 auto;width:22px}
.navitem.active .num{color:var(--color-accent)}
.navitem .title{font-size:13.5px;font-weight:600;line-height:1.3}
.navitem.active .title{color:var(--color-accent)}
.navitem .note{font-size:12px;line-height:1.45;color:var(--color-fg-3);margin:3px 0 0 30px}

#stage{flex:1;height:100vh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:28px 40px 80px}
.stagehead{width:100%;max-width:760px;flex-shrink:0;margin:0 0 14px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.stagehead .eyebrow{font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-accent)}
.stagehead .h{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:2px 0 0}
.stagehead .rationale{font-size:13px;line-height:1.55;color:var(--color-fg-2);max-width:360px;text-align:right}

.window{width:100%;max-width:760px;flex-shrink:0;background:var(--color-page);border:1px solid var(--color-border-1);border-radius:14px;box-shadow:var(--shadow-overlay);overflow:hidden}
.topbar{height:56px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--color-border-2);background:var(--color-surface)}
.topbar .back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;background:transparent;color:var(--color-fg-2);cursor:pointer;border-radius:8px}
.topbar .back:hover{background:var(--color-surface-sunken)}
.topbar .tbtitle{font-size:15px;font-weight:600;letter-spacing:-.01em}
.topbar .spacer{flex:1}
.content{padding:20px 24px 32px;max-width:720px;margin:0 auto}

.ct-title{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
.ct-meta{font-size:14px;color:var(--color-fg-2);margin:0 0 18px;line-height:1.5}
.ct-meta .nm{color:var(--color-fg-1);font-weight:500}
.ct-meta-2{font-size:13px;color:var(--color-fg-3);margin:0 0 18px;line-height:1.5}

.sectionlabel-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px}
.sl{font-size:13px;font-weight:600;color:var(--color-fg-2)}
.listhelper{font-size:12.5px;color:var(--color-fg-3)}

.mlist{background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-lg);margin-bottom:18px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--color-border-2)}
.mrow:first-child{border-top:0}
.avatar{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11.5px;background:var(--color-surface-sunken);color:var(--color-fg-1);border:1px solid var(--color-border-1)}
.avatar.you{background:var(--color-accent);color:#fff;border:0}
.mrow .mname{font-size:14px;font-weight:600}
.mrow .memail{font-size:12px;color:var(--color-fg-3)}
.mrow .grow{min-width:0;flex:1}
.mright{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
.badge-champ{font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3)}
.badge-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--color-fg-3)}
.pillrow{display:flex;gap:5px}
.pill{font-family:var(--font-mono);font-size:10px;font-weight:500;letter-spacing:.03em;color:var(--color-fg-3);border:1px solid var(--color-border-1);border-radius:9999px;padding:2px 8px;text-transform:uppercase}

/* consolidated micro-copy lines (no card) */
.metaline{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;color:var(--color-fg-3);margin:0 0 18px;padding:0 2px}
.metaline .ic{flex:0 0 auto;margin-top:1px}
.afterline{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;color:var(--color-fg-3);margin:2px 0 0;padding:0 2px}
.afterline .ic{flex:0 0 auto;margin-top:1px}

.support{font-size:13px;color:var(--color-fg-3);margin:24px 0 0}
.support a{font-family:var(--font-mono);font-weight:500;color:var(--color-fg-3);text-decoration:none}
</style>
</head>
<body>
<nav id="nav">
  <div class="brandrow"><svg width="22" height="22" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22.5" fill="var(--color-sage)"></circle><circle cx="24" cy="24" r="14.25" fill="var(--color-accent)"></circle><circle cx="24" cy="24" r="14.925" fill="none" stroke="#fff" stroke-width="1.35"></circle></svg><span class="wm">Circl<span class="tittle">i</span>sts</span></div>
  <h1>Champion role — consolidated</h1>
  <p class="sub">No extra card. The "invites &amp; funds" fact is folded into space it already owns — the member-count line, the roster row, the Champion badge. Email stays put. Click to preview.</p>
  <div id="navlist"></div>
</nav>
<main id="stage">
  <div class="stagehead">
    <div><div class="eyebrow" id="s-tag"></div><div class="h" id="s-title"></div></div>
    <div class="rationale" id="s-rationale"></div>
  </div>
  <div class="window">
    <div class="topbar">
      <button class="back" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button>
      <span class="tbtitle">Settings</span>
      <span class="spacer"></span>
      <span class="mark"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22.5" fill="var(--color-sage)"></circle><circle cx="24" cy="24" r="14.25" fill="var(--color-accent)"></circle><circle cx="24" cy="24" r="14.925" fill="none" stroke="#fff" stroke-width="1.35"></circle></svg></span>
    </div>
    <div class="content" id="content"></div>
  </div>
</main>

<script>
const ICON={
 users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path>',
 crown:'<path d="M3 7l4 5 5-7 5 7 4-5v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"></path>'
};
function ic(n,s,c){c=c||'currentColor';s=s||15;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}

const MEMBERS=[
 {name:'You',you:true,email:'sam.rivera@gmail.com',ini:'YO'},
 {name:'Joe M.',champ:true,email:'joe.m@example.com',ini:'JM'},
 {name:'Priya N.',ini:'PN'},
 {name:'Sam R.',ini:'SR'}
];
function memberList(v){
 const rows=MEMBERS.map(m=>{
  const showEmail=(m.you||m.champ)&&m.email;
  const sub=showEmail?'<div class="memail">'+m.email+'</div>':'';
  let right='';
  if(m.champ){
   const inner=(v.champRight!==undefined)?v.champRight:'<span class="badge-champ">Champion</span>';
   right=inner?'<div class="mright">'+inner+'</div>':'';
  }
  return '<div class="mrow"><span class="avatar'+(m.you?' you':'')+'">'+m.ini+'</span><div class="grow"><div class="mname">'+m.name+'</div>'+sub+'</div>'+right+'</div>';
 }).join('');
 const helper=v.listHelper?'<span class="listhelper">'+v.listHelper+'</span>':'';
 return '<div class="sectionlabel-row"><span class="sl">Members</span>'+helper+'</div><div class="mlist">'+rows+'</div>';
}
const SUPPORT='<p class="support"><a href="mailto:support@circlists.com">support@circlists.com</a></p>';
const DEF_META='4 of 10 members · Championed by <span class="nm">Joe M.</span>';

const V=[
 {fam:'A · Into the count line',id:'A1',title:'One-line expansion',
  note:'Your steer, most direct: the count line does the whole job in one sentence.',
  rationale:'The "Championed by" clause was already the moment — so let it carry the duties too. One line, nothing added below.',
  meta:'4 of 10 members · <span class="nm">Joe M.</span> champions this circle — invites members and manages funding.'},

 {fam:'A · Into the count line',id:'A2',title:'Two-tier meta',
  note:'Keeps the clean count line, adds one muted sub-line beneath. Name said once.',
  rationale:'Separates identity (line 1) from responsibility (line 2, quieter). Reads as header meta, never a card.',
  meta:DEF_META,
  metaSub:'The champion invites new members and manages this circle\u2019s funding.'},

 {fam:'A · Into the count line',id:'A3',title:'Relative clause',
  note:'Rewrites the existing champion clause in place — one continuous phrase.',
  rationale:'Nothing new appears; the sentence you already had simply finishes its thought.',
  meta:'4 of 10 members · Championed by <span class="nm">Joe M.</span>, who invites members and manages funding.'},

 {fam:'B · Into the roster row',id:'B1',title:'Descriptive Champion badge',
  note:'Identity leaves the count line entirely and lives on Joe\u2019s row: badge + a quiet sub-label.',
  rationale:'Consolidates hardest — the count line drops to just "4 of 10 members"; the badge already there gains the duties.',
  meta:'4 of 10 members',
  champRight:'<span class="badge-champ">Champion</span><span class="badge-sub">invites &amp; funds</span>'},

 {fam:'B · Into the roster row',id:'B2',title:'Role pills on the champion',
  note:'Same move as B1, but duties render as two small tokens under the badge.',
  rationale:'Pills make the two responsibilities scannable and parallel without a sentence or a card.',
  meta:'4 of 10 members',
  champRight:'<span class="badge-champ">Champion</span><div class="pillrow"><span class="pill">Invites</span><span class="pill">Funding</span></div>'},

 {fam:'B · Into the roster row',id:'B3',title:'List-header helper',
  note:'Uses the empty right side of the "Members" label as the home for the fact.',
  rationale:'Puts the fact beside the list it\u2019s about; the count line stays clean and the row badge stays a plain "Champion".',
  meta:'4 of 10 members',
  listHelper:'Joe M. invites &amp; funds'},

 {fam:'C · Micro-copy',id:'C1',title:'Generic helper line',
  note:'One muted line under the header — role word only, Joe\u2019s name not repeated.',
  rationale:'Avoids saying "Joe M." and "champion" twice; a single quiet line, sitting in header space, no box.',
  meta:DEF_META,
  before:'<div class="metaline"><span class="ic">'+ic('crown',15)+'</span><span>The champion invites new members and manages this circle\u2019s funding.</span></div>'},

 {fam:'C · Micro-copy',id:'C2',title:'Parenthetical clause',
  note:'Tucks the duties into the existing clause as a light aside.',
  rationale:'The count line absorbs both duties inside brackets — minimal, single-line, no vertical cost at all.',
  meta:'4 of 10 members · Championed by <span class="nm">Joe M.</span> (invites members · manages funding)'},

 {fam:'D · Distributed / terse',id:'D1',title:'Line in the action slot',
  note:'Where the champion sees the invite + funding controls, a member sees one plain line instead.',
  rationale:'Answers "why can\u2019t I invite or fund here?" exactly where the question arises — no card, just a line in that slot.',
  meta:DEF_META,
  after:'<div class="afterline"><span class="ic">'+ic('users',15)+'</span><span>Inviting new members and managing funding are handled by the champion.</span></div>'},

 {fam:'D · Distributed / terse',id:'D2',title:'Terse — drops "champion"',
  note:'Most compact wording: skips the role word altogether, names the person and the two duties.',
  rationale:'If the badge below already says "Champion", the count line needn\u2019t — so it just states what Joe does.',
  meta:'4 of 10 members · <span class="nm">Joe M.</span> handles invites &amp; funding.'}
];

const listEl=document.getElementById('navlist');
let curFam='';
V.forEach((v,i)=>{
 if(v.fam!==curFam){curFam=v.fam;const h=document.createElement('div');h.className='famhead';h.textContent=v.fam;listEl.appendChild(h);}
 const b=document.createElement('button');
 b.className='navitem';b.dataset.i=i;
 b.innerHTML='<div class="t"><span class="num">'+v.id+'</span><span class="title">'+v.title+'</span></div><div class="note">'+v.note+'</div>';
 b.onclick=()=>select(i);
 listEl.appendChild(b);
});

function select(i){
 const v=V[i];
 document.querySelectorAll('.navitem').forEach(n=>n.classList.toggle('active',+n.dataset.i===i));
 document.getElementById('s-tag').textContent=v.fam;
 document.getElementById('s-title').textContent=v.id+' · '+v.title;
 document.getElementById('s-rationale').textContent=v.rationale;
 const meta=v.meta||DEF_META;
 const html='<h1 class="ct-title">Tuesday Book Club</h1>'
  +'<p class="ct-meta"'+(v.metaSub?' style="margin-bottom:4px"':'')+'>'+meta+'</p>'
  +(v.metaSub?'<p class="ct-meta-2">'+v.metaSub+'</p>':'')
  +(v.before||'')
  +memberList(v)
  +(v.after||'')
  +SUPPORT;
 document.getElementById('content').innerHTML=html;
 document.getElementById('stage').scrollTop=0;
}
select(0);
</script>
</body>
</html>
