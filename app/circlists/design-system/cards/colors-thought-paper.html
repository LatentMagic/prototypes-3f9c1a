<!-- @dsCard group="Colors" viewport="720x190" name="Thought paper" subtitle="The sheet a thought is written on" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3)}.v{font:400 12px/1.4 var(--font-mono);color:var(--color-fg-2)}.r{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}.sw{display:flex;flex-direction:column;gap:4px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px var(--font-sans);margin-top:6px}.note{font:400 12px/1.4 var(--font-sans);color:var(--color-fg-3)}</style></head>
<body><div class="g"><div class="sw"><div class="chip" style="background:var(--color-paper);border:1px solid var(--color-border-2)"></div><div class="n">Paper</div><div class="v">#F2F1EB</div></div><div class="sw"><div class="chip" style="background:var(--color-paper-hover);border:1px solid var(--color-border-2)"></div><div class="n">Paper hover</div><div class="v">#F8F7F4</div><div class="note">Lightens</div></div><div class="sw"><div class="chip" style="background:var(--color-paper-border);border:1px solid var(--color-border-2)"></div><div class="n">Edge</div><div class="v">#DEDCD3</div></div><div class="sw"><div class="chip" style="background:var(--color-paper-border-hover);border:1px solid var(--color-border-2)"></div><div class="n">Edge hover</div><div class="v">#CFCDC2</div><div class="note">Deepens</div></div></div></body></html>
