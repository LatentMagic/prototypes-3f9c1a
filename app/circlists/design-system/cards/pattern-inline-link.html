<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:20px}.solo{font:500 13px/1.5 var(--font-mono);color:var(--color-fg-1)}.door{font-family:var(--font-sans);color:var(--color-accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:color-mix(in oklab,var(--color-accent) 35%,transparent);transition:text-decoration-color var(--duration-base) var(--ease-quiet)}.door:hover,.door:focus-visible{text-decoration-color:var(--color-accent)}@media (prefers-reduced-motion:reduce){.door{transition:none}}</style></head>
<body><div class="stack"><div><p class="l">Standalone · bare a rule, JetBrains Mono</p><a href="mailto:support@circlists.com" class="solo">support@circlists.com</a></div><div><p class="l">Inline · .circ-doorlink, Inter</p><p style="font:400 14px/1.5 var(--font-sans);color:var(--color-fg-3)">The champion manages this circle’s membership and funding. When you want to, <a href="#" class="door" onclick="event.preventDefault()">champion your own</a>.</p><p style="font:400 13px/1.5 var(--font-sans);color:var(--color-fg-2);margin-top:8px">Sized by its sentence — the one documented exception to the 44px floor.</p></div></div></body></html>
