<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.pill{display:inline-flex;align-items:center;gap:7px;background:var(--color-surface);border:1px solid var(--color-border-1);box-shadow:var(--shadow-raised);border-radius:var(--radius-pill);padding:0 18px;min-height:44px;font:600 13px/1 var(--font-sans);color:var(--color-accent);cursor:pointer}.pill:hover{background:var(--color-surface-sunken)}.fdiv{display:flex;align-items:center;gap:12px}.fdiv::after{content:"";flex:1;height:1px;background:var(--color-border-2)}.fl{font:600 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--color-fg-3)}.glow{height:56px;border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-border-1);position:relative}.glow::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--color-arrival-wash)}</style></head>
<body><div class="stack"><div style="display:flex;justify-content:center"><button class="pill"><img src="../assets/brand/mark/circlists-mark.svg" width="10" height="10" alt="">New</button></div><div class="glow" aria-label="arrival wash, mid-play"></div><div class="fdiv"><span class="fl">Earlier</span></div></div></body></html>
