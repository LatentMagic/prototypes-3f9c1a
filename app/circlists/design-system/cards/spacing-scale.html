<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3)}.v{font:400 12px/1.4 var(--font-mono);color:var(--color-fg-2)}.r{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.s{display:flex;flex-direction:column;align-items:center;gap:6px}</style></head>
<body><div class="r" style="align-items:flex-end"><div class="s"><div style="width:4px;height:4px;background:var(--color-accent)"></div><span class="v">4</span></div><div class="s"><div style="width:8px;height:8px;background:var(--color-accent)"></div><span class="v">8</span></div><div class="s"><div style="width:12px;height:12px;background:var(--color-accent)"></div><span class="v">12</span></div><div class="s"><div style="width:16px;height:16px;background:var(--color-accent)"></div><span class="v">16</span></div><div class="s"><div style="width:20px;height:20px;background:var(--color-accent)"></div><span class="v">20</span></div><div class="s"><div style="width:24px;height:24px;background:var(--color-accent)"></div><span class="v">24</span></div><div class="s"><div style="width:32px;height:32px;background:var(--color-accent)"></div><span class="v">32</span></div><div class="s"><div style="width:40px;height:40px;background:var(--color-accent)"></div><span class="v">40</span></div><div class="s"><div style="width:48px;height:48px;background:var(--color-accent)"></div><span class="v">48</span></div><div class="s"><div style="width:64px;height:64px;background:var(--color-accent)"></div><span class="v">64</span></div></div></body></html>
