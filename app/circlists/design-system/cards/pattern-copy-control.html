<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.lbl{font:500 13px var(--font-sans);color:var(--color-fg-2)}.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;max-width:440px}.life{font:400 12.5px var(--font-sans);color:var(--color-fg-3)}.box{width:100%;max-width:440px;display:flex;align-items:center;gap:9px;padding:9px 12px;min-height:44px;background:var(--color-surface);border:1px solid var(--color-border-1);border-radius:var(--radius-md);cursor:pointer;text-align:left}.box:hover{background:var(--color-surface-sunken);border-color:var(--color-border-strong)}.url{flex:1;min-width:0;font:500 13px/1.35 var(--font-mono);color:var(--color-fg-1);word-break:break-all}.gl{color:var(--color-fg-3)}.box:hover .gl{color:var(--color-fg-1)}.dim{background:var(--color-surface-sunken);border-color:var(--color-border-2);cursor:default}</style></head>
<body><div class="stack"><div><div class="hd"><span class="lbl">Invite link</span><span class="life">Valid for 30 days</span></div><button class="box"><span class="url">circlists.com/invite/7f3k9q2mxa</span><span class="gl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></span></button></div><div><p class="l">Before there is a link — present, empty, not a button</p><div class="box dim" style="max-width:440px"></div></div></div></body></html>
