<!-- @dsCard group="Spacing" viewport="720x180" name="Shadows" subtitle="Flat by default · raised for popovers · overlay for dialogs and sheets" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3)}.v{font:400 12px/1.4 var(--font-mono);color:var(--color-fg-2)}.r{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.b{width:180px;height:96px;background:var(--color-surface);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:10px}</style></head>
<body><div class="r" style="gap:28px"><div class="b" style="border:1px solid var(--color-border-1)"><span class="v">flat</span></div><div class="b" style="box-shadow:var(--shadow-raised)"><span class="v">raised</span></div><div class="b" style="box-shadow:var(--shadow-overlay)"><span class="v">overlay</span></div></div></body></html>
