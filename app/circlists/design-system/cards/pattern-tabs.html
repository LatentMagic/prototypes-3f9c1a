<!-- @dsCard group="Patterns" viewport="720x200" name="Tabs" subtitle="Two tabs · the active one in accent" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.bar{background:var(--color-surface);border-bottom:1px solid var(--color-border-2);padding:0 8px 0 16px;display:flex;gap:4px;align-items:center}.t{background:transparent;border:0;padding:15px 14px;cursor:pointer;font:500 14px var(--font-sans);color:var(--color-fg-2);border-bottom:2px solid transparent;margin-bottom:-1px}.t:hover{color:var(--color-fg-1)}.t[aria-current="true"]{font-weight:600;color:var(--color-accent);border-color:var(--color-accent)}.sp{flex:1}.ib{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:var(--radius-md);color:var(--color-fg-2);cursor:pointer}.ib:hover{background:var(--color-surface-sunken)}</style></head>
<body><div class="stack"><div class="bar"><button class="t" aria-current="true">Active</button><button class="t">History</button></div><div class="bar"><button class="t">Active</button><button class="t" aria-current="true">History</button><span class="sp"></span><button class="ib" aria-label="Search History"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><circle cx="11" cy="11" r="7"></circle><line x1="20" y1="20" x2="16.65" y2="16.65"></line></svg></button><button class="ib" aria-label="View options"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="14" y2="17"></line></svg></button></div></div></body></html>
