<!-- @dsCard group="Patterns" viewport="720x170" name="Switch" subtitle="Takes effect where it stands · 3:1 without colour" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.sw{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px;padding:0 4px;max-width:420px}.sw span{font:500 14px var(--font-sans)}.tr{width:40px;height:24px;border-radius:12px;position:relative;border:0;cursor:pointer;padding:0;transition:background var(--duration-base) var(--ease-quiet)}.tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--shadow-raised);transition:transform var(--duration-base) var(--ease-quiet)}.tr[aria-checked="true"]{background:var(--color-accent)}.tr[aria-checked="true"]::after{transform:translateX(16px)}.tr[aria-checked="false"]{background:var(--color-border-3)}</style></head>
<body><div class="sw"><span>Mark as done</span><button class="tr" role="switch" aria-checked="false" aria-label="Mark as done"></button></div><div class="sw"><span>Include cards in Active</span><button class="tr" role="switch" aria-checked="true" aria-label="Include cards in Active"></button></div></body></html>
