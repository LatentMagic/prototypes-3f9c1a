<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.es{text-align:center;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:28px}.es h2{font:600 var(--text-3xl)/1.2 var(--font-sans);letter-spacing:-.01em;margin:0}.es p{margin:0}.door{font-family:var(--font-sans);color:var(--color-accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px;text-decoration-color:color-mix(in oklab,var(--color-accent) 35%,transparent)}.door:hover{text-decoration-color:var(--color-accent)}</style></head>
