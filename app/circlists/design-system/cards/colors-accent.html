<!-- @dsCard group="Colors" viewport="720x170" name="Accent" subtitle="Emerald — primary action, active tab, focus, selection" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3)}.v{font:400 12px/1.4 var(--font-mono);color:var(--color-fg-2)}.r{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}.sw{display:flex;flex-direction:column;gap:4px}.chip{height:64px;border-radius:var(--radius-md)}.n{font:600 13px var(--font-sans);margin-top:6px}.note{font:400 12px/1.4 var(--font-sans);color:var(--color-fg-3)}</style></head>
<body><div class="g"><div class="sw"><div class="chip" style="background:var(--color-accent);"></div><div class="n">Emerald</div><div class="v">#047857</div><div class="note">Accent</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-hover);"></div><div class="n">Hover</div><div class="v">#036549</div><div class="note">4% darker</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-press);"></div><div class="n">Press</div><div class="v">#024F3A</div><div class="note">8% darker</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-ring);border:1px solid var(--color-border-2)"></div><div class="n">Ring</div><div class="v">rgba 30%</div><div class="note">Focus ring colour</div></div><div class="sw"><div class="chip" style="background:var(--color-accent-soft);border:1px solid var(--color-border-2)"></div><div class="n">Soft</div><div class="v">#ECFDF5</div><div class="note">Reserved: focus-ring background only</div></div></div></body></html>
