<!-- @dsCard group="Patterns" viewport="760x440" name="Delete dialog" subtitle="Dialog kind · centred at every width · two reaches, Cancel holds focus" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.scrim{background:var(--color-scrim);padding:32px;border-radius:var(--radius-lg);display:flex;justify-content:center;gap:24px;flex-wrap:wrap}.pn{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);width:320px;box-shadow:var(--shadow-overlay)}.pt{font:600 var(--text-2xl)/1.3 var(--font-sans);letter-spacing:-.01em;margin:0}.ps{font:400 15px/1.55 var(--font-sans);color:var(--color-fg-2);margin:8px 0 0}.st{display:flex;flex-direction:column;gap:8px;margin-top:20px}</style></head>
<body><div class="scrim"><div class="pn" role="dialog" aria-label="Delete this link?"><h2 class="pt">Delete this link?</h2><p class="ps">Choose how far this goes.</p><div class="st"><button class="circ-btn circ-btn-destructive-secondary" style="background:var(--color-surface);color:var(--color-destructive);border:1px solid var(--color-border-1);font-weight:500;font-family:var(--font-sans);font-size:14px;line-height:1;padding:11px 18px;min-height:44px;border-radius:var(--radius-md);cursor:pointer;width:100%">Delete for me</button><button class="circ-btn circ-btn-destructive-secondary" style="background:var(--color-surface);color:var(--color-destructive);border:1px solid var(--color-border-1);font-weight:500;font-family:var(--font-sans);font-size:14px;line-height:1;padding:11px 18px;min-height:44px;border-radius:var(--radius-md);cursor:pointer;width:100%">Delete for everyone</button><button class="circ-btn circ-btn-secondary" style="background:var(--color-surface);color:var(--color-fg-1);border:1px solid var(--color-border-1);font-weight:500;font-family:var(--font-sans);font-size:14px;line-height:1;padding:11px 18px;min-height:44px;border-radius:var(--radius-md);cursor:pointer;width:100%">Cancel</button></div></div><div class="pn"><h2 class="pt">Delete this link?</h2><p class="ps">It goes from your list. Everyone else keeps it.</p><div class="st"><button class="circ-btn circ-btn-destructive-secondary" style="background:var(--color-surface);color:var(--color-destructive);border:1px solid var(--color-border-1);font-weight:500;font-family:var(--font-sans);font-size:14px;line-height:1;padding:11px 18px;min-height:44px;border-radius:var(--radius-md);cursor:pointer;width:100%">Delete for me</button><button class="circ-btn circ-btn-secondary" style="background:var(--color-surface);color:var(--color-fg-1);border:1px solid var(--color-border-1);font-weight:500;font-family:var(--font-sans);font-size:14px;line-height:1;padding:11px 18px;min-height:44px;border-radius:var(--radius-md);cursor:pointer;width:100%">Cancel</button></div></div></div></body></html>
