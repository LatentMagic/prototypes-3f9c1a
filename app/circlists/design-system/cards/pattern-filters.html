<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 10px;border-radius:var(--radius-sm);cursor:pointer;max-width:340px;font:500 14px var(--font-sans)}.row:hover{background:var(--color-surface-sunken)}.row[aria-checked="true"]{font-weight:600}.fx{width:24px;height:24px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}.row .ck{margin-left:auto;color:var(--color-accent)}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;align-items:stretch;border:1px solid var(--color-border-1);border-radius:var(--radius-md);background:var(--color-surface);overflow:hidden}.chip button{min-height:44px;background:transparent;border:0;cursor:pointer;font:500 13px var(--font-sans);color:var(--color-fg-1);display:inline-flex;align-items:center;gap:6px}.chip .lb{padding:0 10px 0 12px}.chip .rm{width:44px;justify-content:center;border-left:1px solid var(--color-border-2);color:var(--color-fg-3)}.chip button:hover{background:var(--color-surface-sunken)}</style></head>
<body><div class="stack"><div><p class="l">Filter</p><div class="row" role="checkbox" aria-checked="true"><span class="fx"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"></path></svg></span>Saved<span class="ck"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div><div class="row" role="checkbox" aria-checked="false"><span class="fx"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span>Watching</div><div class="row" role="checkbox" aria-checked="true"><span style="width:24px;height:24px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font:600 9px var(--font-sans);background:var(--color-accent);color:#fff">You</span>You<span class="ck"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><polyline points="20 6 9 17 4 12"></polyline></svg></span></div><div class="row" role="checkbox" aria-checked="false"><span style="width:24px;height:24px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font:600 9px var(--font-sans);background:var(--color-surface-sunken);border:1px solid var(--color-border-1);color:var(--color-fg-1)">SM</span>Sam M.</div></div><div class="chips"><span class="chip"><button class="lb">Saved</button><button class="rm" aria-label="Remove Saved"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></span><span class="chip"><button class="lb">You</button><button class="rm" aria-label="Remove You"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></span></div></div></body></html>
