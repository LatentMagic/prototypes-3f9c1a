<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--color-page)}.l{font:500 11px/1.3 var(--font-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-3);margin:0 0 8px}.stack{display:flex;flex-direction:column;gap:16px}.fab{width:56px;height:56px;border-radius:50%;background:var(--color-accent);color:#fff;border:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-overlay);cursor:pointer}.fab:hover{background:var(--color-accent-hover)}</style></head>
<body><div style="display:flex;gap:24px;align-items:center"><button class="fab" aria-label="Add a link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg></button><button class="fab" aria-label="Added"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><polyline points="20 6 9 17 4 12"></polyline></svg></button><span style="font:400 14px/1.5 var(--font-sans);color:var(--color-fg-2);max-width:380px">A successful add from History confirms on the button: the tick draws on, holds, and settles back to plus. Colour never changes.</span></div></body></html>
