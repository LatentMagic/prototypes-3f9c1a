<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pass-ended block: options</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:16px;max-width:560px}h1{font-size:20px}h2{font-size:16px;margin:28px 0 4px}h3{font-size:14px;font-weight:600;margin:14px 0 6px;color:#555}a{display:inline-block;min-height:44px;line-height:44px;padding:0 16px;margin:0 8px 8px 0;border:1px solid #888;border-radius:8px;color:inherit;text-decoration:none}</style></head><body>
<h1>The Pass-ended block in the real Game page</h1><p>Each link opens the real prototype page. The card never changes size or place; only what sits inside it. Pick a game, then how the block sits in its card, then text link or button.</p>
<script>
var states=[['Had the Pass: 36,000 Summers Ago','library-hunter-pass-ended'],['Had the Pass: Casebook','library-casebook-pass-ended'],['Never had it: 36,000 Summers Ago','library-hunter-never']];
var lays=[['As now',''],['Action at the foot','foot'],['Centred in the card','middle'],['Centred both ways (as the old card)','centred']];
var acts=[['Text link','link'],['Secondary button','button']];
var h='';states.forEach(function(s){h+='<h2>'+s[0]+'</h2>';lays.forEach(function(l){h+='<h3>'+l[0]+'</h3>';acts.forEach(function(a){h+='<a href="index.html?state='+s[1]+(l[1]?'&layout='+l[1]:'')+'&action='+a[1]+'">'+a[0]+'</a>';});});});
document.write(h);
</script></body></html>
