<script>
  // The app's own stylesheet, read live from index.html so the cards never drift from the build.
  (function () {
    var x = new XMLHttpRequest(); x.open('GET', 'index.html', false); x.send();
    var m = x.responseText.match(/<style>([\s\S]*?)<\/style>/);
    if (m) { var s = document.createElement('style'); s.textContent = m[1]; document.head.appendChild(s); }
  })();
</script>
<style>
  .pg { max-width: 1200px; margin: 0 auto; padding: 24px 16px 72px; display: grid; gap: 32px; }
  .pg h1 { margin: 0; font: 700 28px/1.1 var(--font-heading); letter-spacing: -.01em; }
  .pg-grid { display: grid; gap: 24px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); align-items: start; }
  .pg-opt { display: grid; gap: 12px; align-content: start; min-width: 0; }
  .pg-opt h2 { margin: 0; font: 700 18px/1.2 var(--font-heading); display: flex; gap: 12px; align-items: baseline; }
  .pg-opt h2 b { font-variant-numeric: tabular-nums; color: var(--muted); }
  .pg-facts { display: grid; gap: 4px; font: 400 14px/1.45 var(--font-text); color: var(--muted); }
  .pg-facts b { color: var(--text); font-weight: 600; }
  .pg-none { border: 1px dashed var(--control-edge); padding: 24px; color: var(--muted); }
  .pg { --fz: color-mix(in srgb, var(--off-white) 38%, var(--card)); }
  .lb-wk.is-tone > i { background: var(--fz); box-shadow: none; }
  .lb-legend i.pg-k-tone { background: var(--fz); box-shadow: none; }
  .lb-legend { flex-wrap: wrap; gap: 4px 16px; }
</style>
