<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="../../../../">
<title>Salvage cover, options 1 to 3</title>
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/fonts.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/colors.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/typography.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/spacing.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/motion.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/effects.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/base.css">
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/components/components.css">
<link rel="stylesheet" href="tokens.css">
<style>
  body { margin: 0; background: var(--page); color: var(--text); font: 400 15px/1.5 var(--font-text); }
  main { max-width: 1180px; margin: 0 auto; padding: 32px 20px 64px; display: grid; gap: 40px; }
  h1 { margin: 0; font: 700 28px/1.2 var(--font-heading); letter-spacing: -.01em; }
  .lede { margin: 8px 0 0; color: var(--muted); max-width: 64ch; text-wrap: pretty; }
  .opt { display: grid; gap: 16px; padding-top: 24px; border-top: 1px solid var(--line); }
  .opt h2 { margin: 0; font: 700 20px/1.25 var(--font-heading); }
  .opt p { margin: 0; max-width: 64ch; text-wrap: pretty; }
  .cost { color: var(--muted); }
  .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; align-items: start; }
  .cell { display: grid; gap: 8px; align-content: start; }
  .cap { font: 600 13px/1.3 var(--font-text); color: var(--muted); }
  .live { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1.6fr) auto; gap: 16px; align-items: start; }
  @media (max-width: 720px) { .live { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  a.mcp-art-host { display: block; color: inherit; text-decoration: none; }
  .lead { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); }
  .lead .mcp-art { width: 40px; height: 30px; flex: none; }
  .f .mcp-art i { transition: none !important; }
  /* The centred 4:3 stage, as index.html draws it (.gs-st). */
  .gs-st { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: min(100cqw, 133.333cqh); aspect-ratio: 4 / 3; container-type: size; --u: .625cqw; }
  .gs-st > i { left: calc(var(--u) * var(--x)); top: calc(var(--u) * var(--y)); width: calc(var(--u) * var(--w)); height: calc(var(--u) * var(--h)); }

  /* Shared board: a 5 by 3 patch of a 24-unit grid. Misses in cream; the wreck lies in the middle row, columns 2 to 4. */
  .peg { --w: 12; --h: 12; --s: 0; border-radius: 50%; }
  .miss { --fill: var(--cover-cream); }
  .hit { --fill: var(--cover-orange); }
  .m1 { --x: 26; --y: 54; } .m2 { --x: 98; --y: 30; } .m3 { --x: 50; --y: 78; } .m4 { --x: 122; --y: 78; }
  .h1 { --x: 50; --y: 54; } .h2 { --x: 74; --y: 54; } .h3 { --x: 98; --y: 54; }
  .hull { --x: 46; --y: 50; --w: 68; --h: 20; --fill: var(--cover-lilac); --s: 50; border-radius: calc(var(--u) * 10); transform: scale(var(--on)); }

  /* 1 Revealed: the last dive lands as a peg; the wreck under the three hits shows itself, 50ms behind. */
  .o1 .h3 { transform: scale(var(--on)); }

  /* 2 Marked sunk: the board's own marks. Each hit is a cross (two bars); the bars turn upright and thicken until the cross is a solid square. The not-dived dot grows into a square 50ms behind. Three squares edge to edge: the sunk mark, three long. */
  .ring { --w: 14; --h: 14; --fill: transparent; --s: 0; box-sizing: border-box; border: max(var(--u) * 3, 1.5px) solid var(--cover-cream); border-radius: 50%; }
  .r1 { --x: 25; --y: 53; } .r2 { --x: 97; --y: 29; } .r3 { --x: 49; --y: 77; } .r4 { --x: 121; --y: 77; }
  .bh { --w: 25; --h: 6; --y: 57; --fill: var(--cover-orange); --s: 0; transform: rotate(calc((1 - var(--on)) * 45deg)) scaleY(calc(1 + var(--on) * 3)); }
  .bv { --w: 6; --h: 24; --y: 48; --fill: var(--cover-orange); --s: 0; transform: rotate(calc((1 - var(--on)) * 45deg)) scaleX(calc(1 + var(--on) * 3)); }
  .bh.c1 { --x: 43.5; } .bh.c2 { --x: 67.5; } .bv.c1 { --x: 53; } .bv.c2 { --x: 77; }
  .dot { --x: 99; --y: 55; --w: 10; --h: 10; --s: 50; --fill: color-mix(in srgb, var(--cover-orange) calc(var(--on) * 100%), var(--cover-cream)); border-radius: calc((1 - var(--on)) * 50%); transform: scale(calc(1 + var(--on) * 1.5)); }
  .mcp-art i.dot { transition: transform var(--time-art) var(--ease-art), border-radius var(--time-art) var(--ease-art), background-color var(--time-art) var(--ease-art); }

  /* 3 Aimed: a ring aims at the empty square. It closes onto it and fills orange, becoming the hit; the wreck shows beneath, 50ms behind. */
  .aim { --x: 86; --y: 42; --w: 36; --h: 36; --fill: transparent; --s: 0; box-sizing: border-box; border-radius: 50%; border: solid color-mix(in srgb, var(--cover-orange) calc(var(--on) * 100%), var(--cover-cream)); border-width: max(calc(var(--u) * (3 + var(--on) * 15)), 1.5px); transform: scale(calc(1 - var(--on) * .6667)); }
  .mcp-art i.aim { transition: transform var(--time-art) var(--ease-art), border-width var(--time-art) var(--ease-art), border-color var(--time-art) var(--ease-art); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Salvage cover, options 1 to 3</h1>
    <p class="lede">Each cover is the board partway through a game: misses in cream, two hits in a row, one square of the wreck still to find. Hovering is the last dive. Hover the cards to see the motion; the strips show rest, halfway and end. Halfway leaves out the 50ms stagger.</p>
  </header>
  <div id="opts"></div>
</main>
<script>
const BODY = {
  o1: '<i class="peg miss m1"></i><i class="peg miss m2"></i><i class="peg miss m3"></i><i class="peg miss m4"></i><i class="hull"></i><i class="peg hit h1"></i><i class="peg hit h2"></i><i class="peg hit h3"></i>',
  o2: '<i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="ring r4"></i><i class="bh c1"></i><i class="bv c1"></i><i class="bh c2"></i><i class="bv c2"></i><i class="dot"></i>',
  o3: '<i class="peg miss m1"></i><i class="peg miss m2"></i><i class="peg miss m3"></i><i class="peg miss m4"></i><i class="hull"></i><i class="peg hit h1"></i><i class="peg hit h2"></i><i class="aim"></i>',
};
const OPTS = [
  { id: 'o1', name: 'Revealed', story: 'You only ever see your pegs. The last dive lands as an orange peg, and the wreck under the three hits shows itself in lilac.', cost: 'The wreck appears only on hover; the resting cover is pegs alone.' },
  { id: 'o2', name: 'Marked sunk', story: 'The board’s own marks, as the share text uses them. Two hits (✕) and a square not yet dived (·) turn into the sunk mark (■), one block three long.', cost: 'The busiest resting cover; the crosses have to read as hits at 40px.' },
  { id: 'o3', name: 'Aimed', story: 'A ring aims at the empty square. It closes onto it and fills orange, so the aim becomes the hit, and the wreck shows beneath.', cost: 'A ring closing to a dot is near Daily Mystery’s bullseye.' },
];
const art = (id, ar, extra = '') => `<div class="mcp-art ${extra}" style="aspect-ratio:${ar}"><div class="gs-st ${id}">${BODY[id]}</div></div>`;
document.getElementById('opts').innerHTML = OPTS.map((o, n) => `
  <section class="opt" id="${n + 1}">
    <h2>${n + 1} · ${o.name}</h2>
    <p>${o.story}</p>
    <p class="cost">Cost: ${o.cost}</p>
    <div class="row">
      ${[['Rest', 0], ['Halfway', .5], ['End', 1]].map(([c, v]) => `<div class="cell"><span class="cap">${c}</span><div class="f" style="--on:${v}">${art(o.id, '4/3')}</div></div>`).join('')}
    </div>
    <div class="live">
      <div class="cell"><span class="cap">Hover · card, 4:3</span><a href="#" class="mcp-art-host">${art(o.id, '4/3')}</a></div>
      <div class="cell"><span class="cap">Hover · square</span><a href="#" class="mcp-art-host">${art(o.id, '1')}</a></div>
      <div class="cell"><span class="cap">Hover · wide, 3:1</span><a href="#" class="mcp-art-host">${art(o.id, '3/1')}</a></div>
      <div class="cell"><span class="cap">Hover · 40px row lead</span><a href="#" class="mcp-art-host lead">${art(o.id, '4/3')}<span>Salvage</span></a></div>
    </div>
  </section>`).join('');
document.addEventListener('click', (e) => { if (e.target.closest('a.mcp-art-host')) e.preventDefault(); });
</script>
</body>
</html>
