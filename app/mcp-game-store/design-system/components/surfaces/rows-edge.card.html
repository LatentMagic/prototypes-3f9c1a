<!-- @dsCard group="Components · Layout" viewport="900x1320" name="ListRow edge cases" subtitle="Rows that broke earlier rows, at 320, 440 and 1024. A change to ListRow passes this first." -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0;color:var(--text);font:400 16px/1.5 var(--font-text)}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}.cell{display:grid;gap:8px;align-content:start;min-width:0}.box{background:var(--card);border:1px solid var(--line)}.cov{display:block;width:100%;height:100%}.key{margin:0;padding-left:20px;display:grid;gap:2px;font-size:14px;color:var(--muted);max-width:90ch}.key b{color:var(--text);font-weight:600}.check{font:600 13px/1.3 var(--font-text)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {ListRow,RowList}=window.MCPGameStoreDesignSystem_ef1abd;
const C=({bg,ink})=><svg className="cov" viewBox="0 0 48 36"><rect width="48" height="36" style={{fill:'var(--cover-bg-'+bg+')'}}/><rect x="16" y="10" width="16" height="16" style={{fill:'var(--cover-'+ink+')'}}/></svg>;
const esc=<C bg="indigo" ink="amber"/>,groups=<C bg="forest" ink="teal"/>,word=<C bg="wine" ink="amber"/>,delve=<C bg="forest" ink="orange"/>,cb=<C bg="wine" ink="teal"/>;
const f=()=>{};
const Edge=()=><RowList label="Edge cases">
<ListRow onClick={f} lead={esc} title="Escape" result={['Escaped in 5 moves','5 moves']} tone="ok" when="12:00"/>
<ListRow onClick={f} lead={groups} title="#89" game="Daily Groups" result={['All 4 groups, no mistakes, first try in a row','All 4 groups, no mistakes','No mistakes']} tone="ok" when="09:16"/>
<ListRow onClick={f} lead={word} title="#213" game="Daily Word" result={['Solved in 3 of 6','3 of 6']} tone="ok"/>
<ListRow onClick={f} lead={delve} title="The Drum Room" game="Delve" when="18:30" replay/>
<ListRow onClick={f} lead={cb} title="Supercalifragilisticexpialidociousmysterycase" game="Casebook" result="Solved" tone="ok" when="20:10"/>
<ListRow onClick={f} lead={esc} title="The Locked Study" game="Escape" result={['Escaped in 5 moves','5 moves']} tone="ok" when={['Yesterday, 23:59','23:59']} note="Replay 3"/>
<ListRow onClick={f} title="The Night Train to Fort William" game="Casebook" result="Played" when="28 Sep"/>
<ListRow onClick={f} title="The Widow’s Lantern" when="5 Oct"/>
</RowList>;
function Check(){
  const [msg,setMsg]=React.useState('Checking…');
  React.useEffect(()=>{const t=setTimeout(()=>{const rows=[...document.querySelectorAll('.mcp-row.is-slots')];const bad=rows.filter((r)=>Math.round(r.getBoundingClientRect().height)!==62);const wrap=rows.filter((r)=>{const t=r.querySelector('.mcp-row-title');return t&&t.getBoundingClientRect().height>21;});setMsg(rows.length+' rows · '+(bad.length?bad.length+' not 62px':'all 62px')+' · '+(wrap.length?wrap.length+' titles wrap':'no title wraps'));},600);return()=>clearTimeout(t);},[]);
  return <span className="check">{msg}</span>;
}
function App(){return <div style={{display:'grid',gap:16}}>
<ol className="key">
<li><b>Escape</b>: a game with no edition is its own title, in ink.</li>
<li><b>#89</b>: three result forms; the longest that fits from 440, the last under 440.</li>
<li><b>#213</b>: no when. <b>The Drum Room</b>: Replay with no result, title centred.</li>
<li><b>Supercalifragilistic…</b>: one unbroken word, cut cleanly, the game's name dropped first.</li>
<li><b>The Locked Study</b>: a long when picks "23:59" under 440; note "Replay 3" shows as Replay and warns.</li>
<li><b>The Night Train</b>: a game's name passed without a cover is dropped and warns.</li>
</ol>
<Check/>
<div style={{display:'flex',flexWrap:'wrap',gap:16,alignItems:'start'}}>
<div className="cell" style={{width:320,flex:'none'}}><div className="box"><Edge/></div><span className="cap">320</span></div>
<div className="cell" style={{width:442,flex:'none'}}><div className="box"><Edge/></div><span className="cap">440</span></div>
<div className="cell" style={{width:660,flex:'none',flexBasis:'100%',maxWidth:660}}><div className="box"><Edge/></div><span className="cap">660 (a 1024 page's list measure)</span></div>
</div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
