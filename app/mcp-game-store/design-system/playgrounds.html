<!DOCTYPE html>
<html lang="en-GB"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playgrounds</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font-text);-webkit-font-smoothing:antialiased}
a{color:var(--text);text-decoration:none}a:hover{color:var(--text);text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
.wrap{max-width:840px;margin:0 auto;padding:48px 28px 96px}
.top{display:flex;align-items:baseline;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.top b{font:600 24px/1.2 var(--font-heading)}
.top em{font:400 24px/1.2 var(--font-heading);font-style:normal;color:var(--muted)}
.top .n{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf,.rows{display:grid;margin-top:24px}
.tk{display:grid;grid-template-columns:1fr auto 64px;align-items:center;gap:18px;width:100%;padding:16px 8px;border-top:1px solid var(--line);min-height:56px}
.shelf .tk:last-child,.rows .row:last-child{border-bottom:1px solid var(--line)}
.tk:hover,.row:hover{background:var(--card)}
.tkname{font:500 20px/1.3 var(--font-heading)}
.tkmeta,.tkdate{font-size:14px;color:var(--muted);white-space:nowrap}
.tkdate{text-align:right}
.fold{margin-top:36px;border-top:1px solid var(--line);padding-top:8px}
.fold summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted);min-height:44px}
.fold summary::-webkit-details-marker{display:none}
.fold summary::after{content:'Show';margin-left:auto;color:var(--text)}
.fold[open] summary::after{content:'Hide'}
.fold .shelf,.fold .rows{margin-top:0}
.back{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);min-height:44px;margin-bottom:16px}
.back:hover{color:var(--text)}
h1{font:600 28px/1.2 var(--font-heading);margin:0}
.path{font-size:14px;color:var(--muted);margin:8px 0 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:20px;padding:16px 8px;border-top:1px solid var(--line);min-height:56px}
.row:hover{text-decoration:none}.row:hover .rname{text-decoration:underline}
.rname{font-size:16px;font-weight:500;display:block}
.rnote{display:block;color:var(--muted);font-size:14px;margin-top:4px;text-wrap:pretty}
.rpath{display:block;font-size:13px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}
.open{font-size:14px;font-weight:500;white-space:nowrap}
.empty{padding:16px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;margin-top:24px}
@media (max-width:620px){.wrap{padding:28px 18px 72px}.tk{grid-template-columns:1fr auto;gap:4px 12px}.tkmeta{grid-column:1/-1;grid-row:2}}
</style>
</head><body>
<div class="wrap">
<header class="top"><b id="product">Design system</b><em>playgrounds</em><span class="n" id="n"></span></header>
<div id="out"></div>
</div>
<script>
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const el=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const out=document.getElementById('out');
const MONTH=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const shortDate=s=>{if(!s)return '';const[y,m,d]=s.split('-');return (+d)+' '+MONTH[+m-1]};
const live=a=>(a||[]).filter(e=>e.on!==false);
const count=t=>live(t.entries).length;
let DATA=null;
function tkRow(t){const n=count(t);const b=el('<button class="tk"><span class="tkname">'+esc(t.name)+'</span><span class="tkmeta">'+(n?n+' playground'+(n>1?'s':''):'Documents only')+'</span><span class="tkdate">'+esc(shortDate(t.touched))+'</span></button>');b.addEventListener('click',()=>{location.hash=t.slug});return b}
function shelf(list){const s=el('<div class="shelf"></div>');list.forEach(t=>s.appendChild(tkRow(t)));return s}
function fold(label,n,node){const d=el('<details class="fold"></details>');d.appendChild(el('<summary><span>'+esc(label)+' · '+n+'</span></summary>'));d.appendChild(node);return d}
function home(){
  out.innerHTML='';
  const byDate=(a,b)=>String(b.touched||'').localeCompare(String(a.touched||''));
  const active=DATA.tickets.filter(t=>t.state!=='archive');
  const playable=active.filter(count).sort(byDate),docsOnly=active.filter(t=>!count(t)).sort(byDate);
  if(!DATA.tickets.length)out.appendChild(el('<p class="empty">No playgrounds yet.</p>'));else out.appendChild(shelf(playable));
  if(docsOnly.length)out.appendChild(fold('Documents only',docsOnly.length,shelf(docsOnly)));
}
function rowHtml(e){return '<a class="row" href="'+esc(e.path)+'"><span><span class="rname">'+esc(e.name)+'</span>'+(e.note?'<span class="rnote">'+esc(e.note)+'</span>':'')+'<span class="rpath">'+esc(e.path)+'</span></span><span class="open">Open</span></a>'}
function topic(t){
  out.innerHTML='';
  const back=el('<button class="back">All topics</button>');back.addEventListener('click',()=>{history.pushState('',document.title,location.pathname+location.search);home()});out.appendChild(back);
  out.appendChild(el('<h1>'+esc(t.name)+'</h1>'));
  out.appendChild(el('<p class="path">'+esc((t.base||'docs/specs/')+t.slug+'/')+(t.touched?' · '+esc(shortDate(t.touched)):'')+'</p>'));
  const l=live(t.entries);
  if(l.length){const rows=el('<div class="rows"></div>');l.forEach(e=>rows.appendChild(el(rowHtml(e))));out.appendChild(rows)}
  else out.appendChild(el('<p class="empty">No playground. This topic is documents only: see the folder above.</p>'));
  window.scrollTo(0,0);
}
function route(){const t=DATA.tickets.find(t=>t.state!=='archive'&&t.slug===location.hash.slice(1));t?topic(t):home()}
fetch('playgrounds.json').then(r=>r.json()).then(d=>{
  DATA=d;
  if(d.product){document.getElementById('product').textContent=d.product;document.title=d.product+' playgrounds'}
  const r=d.tickets.filter(t=>t.state!=='archive').reduce((a,t)=>a+count(t),0);
  document.getElementById('n').textContent=r+' playground'+(r===1?'':'s');
  route();window.addEventListener('hashchange',route);
}).catch(()=>{out.appendChild(el('<p class="empty">Could not load playgrounds.json.</p>'))});
</script>
</body></html>
