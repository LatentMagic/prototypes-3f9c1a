<!-- @dsCard group="Brand" viewport="700x250" name="Logo" subtitle="Three green squares and an orange circle lifted out of the fourth slot. Hover: the circle lifts further out, the squares draw in. assets/logo.svg, PNGs in assets/logo" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page);margin:0}
.g{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center}
.lock{display:flex;align-items:center;gap:12px;font:700 28px/1 var(--font-heading);letter-spacing:-.01em;color:var(--text)}
.sz{display:flex;align-items:end;gap:20px}.sz div{display:grid;gap:6px;justify-items:center}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.mk{display:block;position:relative;flex:none;cursor:pointer}.mk-in{position:absolute;left:0;top:0;width:120px;height:120px;transform-origin:0 0}.mk-in i{position:absolute;width:32px;height:32px;background:#4CC38A}.mk-in .tl{left:20px;top:20px}.mk-in .bl{left:20px;top:68px}.mk-in .br{left:68px;top:68px}.mk-in .tr{left:68px;top:20px;background:#D66847;border-radius:50%;transform:translate(10px,-10px)}.lock{cursor:pointer}
</style></head><body><div class="g">
<span data-t data-px="160" role="img" aria-label="MCP Game Store logo"></span>
<div style="display:grid;gap:24px">
<div class="lock" data-t data-px="44">MCP Game Store</div>
<div class="sz"><div><img src="../../assets/logo/logo-16.png" width="16" height="16" alt=""><span class="cap">16</span></div><div><img src="../../assets/logo/logo-32.png" width="32" height="32" alt=""><span class="cap">32</span></div><div><img src="../../assets/logo/logo-180.png" width="64" height="64" alt=""><span class="cap">180 (app icon)</span></div></div>
<span class="cap">Built from square and circle in the shape set. Built-in padding is 20/120 of the box, so set the mark with no extra margin. Hover the mark or the lockup: 440ms in, 330ms back, still under reduced motion.</span>
</div></div>
<script>
const EASE='cubic-bezier(.16,1,.3,1)',DUR=440,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const t0='translate(0px,0px)',KF={tr:['translate(10px,-10px)','translate(28px,-28px)'],tl:[t0,'translate(0px,6px)'],br:[t0,'translate(-6px,0px)']};
document.querySelectorAll('[data-t]').forEach(t=>{const px=+t.dataset.px;t.insertAdjacentHTML('afterbegin',`<span class="mk" style="width:${px}px;height:${px}px"><span class="mk-in" style="transform:scale(${px/120})"><i class="tl"></i><i class="bl"></i><i class="br"></i><i class="tr"></i></span></span>`);
 let live=[];const el=k=>t.querySelector('.mk-in .'+k),clear=()=>{live.forEach(a=>a.cancel());live=[];};
 t.addEventListener('mouseenter',()=>{if(RM)return;clear();for(const k in KF)live.push(el(k).animate(KF[k].map(transform=>({transform})),{duration:DUR,easing:EASE,fill:'both'}));});
 t.addEventListener('mouseleave',()=>{if(RM)return;const b=Object.keys(KF).map(k=>[el(k),getComputedStyle(el(k)).transform,KF[k][0]]);clear();live=b.map(([e,a,z])=>e.animate([{transform:a},{transform:z}],{duration:Math.round(DUR*.75),easing:EASE}));});});
</script></body></html>
