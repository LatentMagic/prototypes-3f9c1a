<!-- @dsCard group="Type" viewport="700x200" name="Body and labels" subtitle="Hanken Grotesk 400 text, 600 labels and buttons" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div style="display:grid;gap:14px;color:var(--text)">
<div style="display:grid;gap:4px"><p style="margin:0;font:var(--type-body)">Play small games by talking to Claude or ChatGPT. New ones arrive every day.</p><span class="cap">Body · 16px / 1.5 · 400</span></div>
<div style="display:grid;gap:4px"><p style="margin:0;font:var(--type-label)">Email</p><span class="cap">Field label · 14px / 1.2 · 600</span></div>
<div style="display:grid;gap:4px"><p style="margin:0;font:var(--type-small)">Free, updated today</p><span class="cap">Small label · 13px / 1.3 · 600</span></div></div></body></html>
