<!-- @dsCard group="Colours" viewport="700x150" name="Status" subtitle="Success, warning, error and delete, with their on-colours" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div class="sw"><div class="s"><i style="background:var(--success);display:grid;place-items:center;font:600 13px var(--font-text);color:var(--success-on)">Text on success</i><span>Success<b>--success · on --success-on</b></span></div><div class="s"><i style="background:var(--warning);display:grid;place-items:center;font:600 13px var(--font-text);color:var(--warning-on)">Text on warning</i><span>Warning<b>--warning · on --warning-on</b></span></div><div class="s"><i style="background:var(--error);display:grid;place-items:center;font:600 13px var(--font-text);color:var(--error-on)">Text on error</i><span>Error and delete<b>--error · on --error-on</b></span></div></div></body></html>
