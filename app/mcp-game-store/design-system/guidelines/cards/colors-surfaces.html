<!-- @dsCard group="Colours" viewport="700x140" name="Backgrounds and lines" subtitle="Page, card, pop-up, line, control edge" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div class="sw"><div class="s"><i style="background:#1B1917"></i><span>Page<b>--page #1B1917</b></span></div><div class="s"><i style="background:#262320"></i><span>Card<b>--card #262320</b></span></div><div class="s"><i style="background:#322E2A"></i><span>Pop-up<b>--popup #322E2A</b></span></div><div class="s"><i style="background:#37332E"></i><span>Line<b>--line #37332E</b></span></div><div class="s"><i style="background:#918B80"></i><span>Control edge<b>--control-edge #918B80</b></span></div></div></body></html>
