<!-- @dsCard group="Spacing" viewport="700x150" name="Sizes and corners" subtitle="48px controls, 44px touch floor, radius 0" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div class="row" style="gap:24px;align-items:flex-end;color:var(--text);font:600 13px var(--font-text)">
<div style="display:grid;gap:8px"><div style="width:120px;height:48px;background:var(--off-white)"></div><span class="cap">Button and field · 48px</span></div>
<div style="display:grid;gap:8px"><div style="width:44px;height:44px;border:1.5px dashed var(--control-edge)"></div><span class="cap">Touch floor · 44px</span></div>
<div style="display:grid;gap:8px"><div style="width:72px;height:72px;background:var(--card);border:1px solid var(--line)"></div><span class="cap">Radius · 0 everywhere</span></div>
<div style="display:grid;gap:8px"><div style="width:120px;height:26px;background:var(--tag-neutral-bg)"></div><span class="cap">Small label · 26px</span></div></div></body></html>
