<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page);margin:0}
.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.c{display:grid;gap:8px;justify-items:center;padding:16px 8px 10px;background:var(--card);border:1px solid var(--line)}
.c svg{width:64px;height:64px}.c span{font:600 13px/1.3 var(--font-text);color:var(--muted)}
</style></head><body><div class="g"><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-green)" fill="currentColor"><rect width="100" height="100"/></svg><span>square</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-orange)" fill="currentColor"><circle cx="50" cy="50" r="50"/></svg><span>circle</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-amber)" fill="currentColor"><polygon points="50,0 100,100 0,100"/></svg><span>triangle</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-teal)" fill="currentColor"><polygon points="0,0 100,100 0,100"/></svg><span>right-triangle</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-lilac)" fill="currentColor"><path d="M0 100A50 50 0 0 1 100 100Z" transform="translate(0,-25)"/></svg><span>half-circle</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-cream)" fill="currentColor"><path d="M0 0A100 100 0 0 1 100 100H0Z"/></svg><span>quarter-circle</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-orange)" fill="currentColor"><polygon points="50,0 100,50 50,100 0,50"/></svg><span>diamond</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-green)" fill="currentColor"><path d="M0 100V50A50 50 0 0 1 100 50V100Z"/></svg><span>arch</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-amber)" fill="currentColor"><rect y="25" width="100" height="50" rx="25"/></svg><span>pill</span></div><div class="c"><svg viewBox="0 0 100 100" style="color:var(--cover-teal)" fill="currentColor"><path fill-rule="evenodd" d="M50 0a50 50 0 1 1 0 100a50 50 0 1 1 0-100Zm0 28a22 22 0 1 0 0 44a22 22 0 1 0 0-44Z"/></svg><span>ring</span></div></div></body></html>
