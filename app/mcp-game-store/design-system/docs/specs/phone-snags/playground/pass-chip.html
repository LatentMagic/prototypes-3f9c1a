<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../../../../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Playground - Pass Chip</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.5 var(--font-text);-webkit-font-smoothing:antialiased}
a{color:var(--off-white)}a:hover{color:#fff}
.pg{max-width:1280px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:32px}
.pg-lede{display:grid;gap:8px;max-width:64ch}.pg-lede h1{margin:0;font:700 28px/1.1 var(--font-heading);letter-spacing:-.01em}.pg-lede p{margin:0;color:var(--muted)}
.pg-grid{display:grid;gap:32px 24px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.pg-opt{display:grid;gap:12px;align-content:start}
.pg-num{font:600 13px/1.3 var(--font-text);letter-spacing:.06em;color:var(--off-white)}
.pg-name{margin:0;font:700 20px/1.2 var(--font-heading)}
.pg-claim,.pg-cost{margin:0;font:400 14px/1.45 var(--font-text);color:var(--muted);text-wrap:pretty}.pg-cost b{color:var(--text);font-weight:600}
.pg-zoom{padding:16px;border:1px solid var(--line);display:flex;justify-content:center}
.pg-zoom .gs-tags{zoom:2}
.pg-art{aspect-ratio:2/1;width:100%;display:grid;place-items:center;background:repeating-linear-gradient(135deg,var(--line) 0 8px,var(--card) 8px 16px);font:400 12px var(--font-mono,ui-monospace,monospace);color:var(--muted)}
.mcp-card{justify-items:stretch;gap:12px}
.pg-title{margin:0;font:700 20px/1.2 var(--font-heading)}
.gs-tags{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mcp-tag{white-space:normal;height:auto;min-height:26px;padding-top:4px;padding-bottom:4px;line-height:1.3}
.mcp-tag svg{width:14px;height:14px;flex:none}
.gs-tagbtn{background:none;border:0;padding:0;min-height:44px;display:inline-flex;align-items:center;cursor:pointer;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent}
.gs-tagbtn:focus-visible{outline:none}.gs-tagbtn:focus-visible .mcp-tag{outline:2px solid var(--off-white);outline-offset:2px}
.pg-card-foot{display:flex;justify-content:flex-start}
/* 0 current */
.t0{background:color-mix(in srgb,var(--text) 14%,var(--page));color:var(--text);border-color:var(--control-edge);border-style:dashed}
.b0:active{opacity:.55}
/* 1 outline */
.t1{background:transparent;color:var(--text);border-color:var(--control-edge);padding-left:8px;padding-right:5px;gap:6px;transition:background-color var(--time-press) var(--ease),transform var(--time-press) var(--ease),border-color var(--time-swap) var(--ease)}
.t1>svg{margin-top:-1px}.t1 .nx{margin-left:-3px}
.b1:active .t1{background:color-mix(in srgb,var(--text) 16%,var(--page));transform:scale(.97)}
@media (hover:hover){.b1:hover .t1{border-color:var(--off-white)}}
/* 2 underlined */
.t2{background:color-mix(in srgb,var(--text) 14%,var(--page));color:var(--off-white)}
.t2 u{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);transition:text-decoration-color var(--time-swap) var(--ease),text-underline-offset var(--time-swap) var(--ease)}
.b2{transition:opacity var(--time-press) var(--ease)}.b2:active{opacity:.55}
@media (hover:hover){.b2:hover .t2 u{text-decoration-color:currentColor;text-underline-offset:5px}.b2:hover .t2{color:#fff}}
/* 3 chevron */
.t3{background:color-mix(in srgb,var(--text) 14%,var(--page));color:var(--text);padding-right:6px;transition:background-color var(--time-press) var(--ease),transform var(--time-press) var(--ease)}
.t3 .nx{transition:transform var(--time-press) var(--ease)}
.b3:active .t3{background:color-mix(in srgb,var(--text) 24%,var(--page));transform:scale(.97)}
@media (hover:hover){.b3:hover .t3{background:color-mix(in srgb,var(--text) 20%,var(--page))}.b3:hover .t3 .nx{transform:translateX(2px)}}
@media (prefers-reduced-motion:reduce){.t1,.t2 u,.t3,.t3 .nx,.b2{transition:none}}
</style></head>
<body>
<main class="pg">
<header class="pg-lede"><h1>Pass chip</h1><p>Each option is shown on a game card at phone width, then at 2× so you can see the edge. The card, the other chips and the button stay the same. The chips work on this page: hover them on a laptop and press them on a phone.</p></header>
<div class="pg-grid" id="pg-grid"></div>
</main>
<template id="pg-ico">
<svg id="lock" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M4.5 11H19.5V21H4.5Z"></path><path d="M8 11V5H16V11"></path><path d="M12 15V17"></path></g></svg>
<svg id="next" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M9 5L16 12L9 19"></path></g></svg>
</template>
<script>
const ic=id=>document.querySelector('#pg-ico').content.getElementById(id).outerHTML.replace(/ id="[^"]+"/,'');
const L=ic('lock'),N='<span class="nx" style="display:inline-flex">'+ic('next')+'</span>';
const OPTS=[
{n:'0',name:'Today: dashed edge',chip:'<span class="mcp-tag t0">'+L+'Pass</span>',claim:'The dashed edge marks it as different from the other chips.',cost:'<b>Cost:</b> at 1.5px the dashes fall between a phone\'s pixels. The line comes out faint and the short sides can vanish. Nothing about it says you can tap it.'},
{n:'1',name:'Outline',chip:'<span class="mcp-tag t1">'+L+'Pass'+N+'</span>',claim:'Uses the Secondary button\'s look: no fill, a solid edge, the same press. The only chip with an edge, so it reads as the one you can press.',cost:'<b>Cost:</b> the heaviest of the three. Beside the card\'s button it is a second button-like thing on the card.'},
{n:'2',name:'Underlined',chip:'<span class="mcp-tag t2">'+L+'<u>Pass</u></span>',claim:'Keeps the chip\'s fill and puts the link look on the word: off-white with an underline, the same as other links in the product.',cost:'<b>Cost:</b> the lightest cue. At a glance it is still a chip, and the underline is short on a four-letter word.'},
{n:'3',name:'Chevron',chip:'<span class="mcp-tag t3">'+L+'Pass'+N+'</span>',claim:'Keeps the chip as it is, drops the edge and adds the next chevron that tappable rows and cards already use. The chevron says it goes somewhere.',cost:'<b>Cost:</b> no edge, so it looks most like the other chips. The chevron alone has to carry it.'}
];
const tags=o=>'<div class="gs-tags"><span class="mcp-tag mcp-tag-daily">Daily</span><span class="mcp-tag mcp-tag-daily">10 minutes</span><button type="button" class="gs-tagbtn b'+o.n+'" aria-label="Pass. See the Pass">'+o.chip+'</button></div>';
document.getElementById('pg-grid').innerHTML=OPTS.map(o=>'<section class="pg-opt"><span class="pg-num">'+o.n+'</span><h2 class="pg-name">'+o.name+'</h2>'+
'<article class="mcp-card"><div class="pg-art">cover</div><h3 class="pg-title">Hunter</h3>'+tags(o)+'<div class="pg-card-foot"><button type="button" class="mcp-btn mcp-btn-main">Play</button></div></article>'+
'<div class="pg-zoom">'+tags(o)+'</div><p class="pg-claim">'+o.claim+'</p><p class="pg-cost">'+o.cost+'</p></section>').join('');
</script>
</body></html>
