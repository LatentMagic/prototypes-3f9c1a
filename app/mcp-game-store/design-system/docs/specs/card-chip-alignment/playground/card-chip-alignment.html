<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0c0c0b;color:#e8e6df;font-family:var(--font-text);-webkit-font-smoothing:antialiased}
a{color:#e8e6df}a:hover{color:#b9b7ad}
.pgc{padding:20px 16px 48px;display:grid;gap:20px;max-width:1300px;margin:0 auto}
.pgc-head{display:grid;gap:10px;font:400 13px/1.45 ui-monospace,Menlo,monospace}
.pgc-head h1{margin:0;font:600 16px/1.3 ui-monospace,Menlo,monospace}
.pgc-head p{margin:0;max-width:96ch;color:#b9b7ad;text-wrap:pretty}
.pgc-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pgc-k{color:#8d8b82;margin-right:6px}
.pgc-b{font:inherit;color:inherit;background:#1d1d1b;border:1px solid #3a3a36;padding:0 12px;min-height:44px;cursor:pointer}
.pgc-b[aria-pressed="true"]{background:#e8e6df;color:#0c0c0b;border-color:#e8e6df}
.pgc-b:focus-visible{outline:2px solid #e8e6df;outline-offset:2px}
.pgc-frame{display:grid;gap:8px}
.pgc-cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font:400 13px/1.45 ui-monospace,Menlo,monospace}
.pgc-cap b{font-weight:600}.pgc-cap span{color:#b9b7ad}
.pgc-fit{overflow:hidden;border:1px solid #3a3a36}
.pgc-stage{background:var(--page)}
/* Product rules the Home band uses (index.html) */
.gs-row4 .mcp-crow-track{--n:4!important}
.gs-grid2{display:grid;gap:16px}
@container gs (min-width:720px){.gs-wrap{padding-inline:24px}.gs-grid2{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}}
.gs-band{display:grid;gap:24px;padding-block:36px}
/* FIX 1, GameCard: the row shares three lines (picture, name and blurb, chips). Each card's chips are centred in the shared chip line, as ratified before card-snug-title. */
.pgx-text{display:contents}
.is-fix .mcp-crow-track:has(>.mcp-gcard){grid-template-rows:repeat(3,auto);row-gap:0}
.is-fix .mcp-crow-track>.mcp-gcard{grid-row:span 3;grid-template-rows:subgrid;align-content:start}
.is-fix .pgx-text{display:grid;align-content:start;row-gap:var(--space-3);min-width:0}
.is-fix .mcp-gcard-tags{align-self:stretch;align-content:center}
/* FIX 2, SoonCard: text from the top, chips on the card's bottom edge. The pair shares one height, so both chip rows sit on one line. */
.is-fix .mcp-soon-body{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-2)}
.is-fix .mcp-soon-tags{margin-top:auto;padding-top:var(--space-2)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
