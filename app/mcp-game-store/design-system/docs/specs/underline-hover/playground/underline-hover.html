<!doctype html><html lang="en-GB"><head><base href="../../../../"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Underline hover</title><link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<style>
body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.5 var(--font-text)}
a{color:var(--off-white)}a:hover{color:#fff}
.pg{max-width:1100px;margin:0 auto;padding:32px 20px 64px;display:grid;gap:40px}
.pg h1{margin:0;font:700 28px/1.2 var(--font-heading)}
.pg-lede{margin:8px 0 0;color:var(--muted);max-width:60ch;text-wrap:pretty}
.pg-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pg-sec{display:grid;gap:16px;border-top:1px solid var(--line);padding-top:24px}
.pg-sec h2{margin:0;font:600 13px/1.3 var(--font-text);letter-spacing:.06em;text-transform:uppercase;color:var(--off-white)}
.pg-sec>p{margin:0;color:var(--muted);max-width:64ch;text-wrap:pretty}
.pg-cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px}
.pg-cell{display:grid;gap:12px;align-content:start}
.pg-cap{font:600 13px/1.3 var(--font-text);color:var(--muted)}
.pg-cap b{color:var(--text);font-weight:600}
.pg-tiles{max-width:420px}
.pg-tiles .mcp-gwall{grid-template-columns:repeat(2,minmax(0,1fr))}
.pg-p{margin:0}
/* 3 · today's guideline card (guidelines/cards/motion-game-art.html) */
.pg-old .mcp-gtile-open{text-decoration:underline 2px transparent;text-underline-offset:5px;transition:text-decoration-color var(--time-press) var(--ease)}
.pg-old .mcp-gtile:has(.mcp-gtile-open:is(:hover,:focus-visible,:active)) .mcp-gtile-open{text-decoration-color:currentColor;text-underline-offset:5px}
/* Proposed: GameTile takes the text-link underline whole */
.pg-new .mcp-gtile-open{transition:color var(--time-swap) var(--ease),text-decoration-color var(--time-swap) var(--ease),text-underline-offset var(--time-swap) var(--ease)}
@media (hover:hover){.pg-new .mcp-gtile-open:hover{color:#fff}}
.pg-new .mcp-gtile-open:active{text-decoration-color:currentColor;text-underline-offset:6px;color:#fff}
.pg-slow{--time-swap:1200ms;--time-press:900ms;--time-art:1600ms}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {GameTile,GameArt,TextLink,Checkbox}=window.MCPGameStoreDesignSystem_ef1abd;
const KEY='pg_underline-hover_v1';
const G=[['word','Daily Word','Puzzle'],['casebook','Casebook','Mystery']];
const stop=e=>e.preventDefault();
const Wall=()=> <div className="pg-tiles"><div className="mcp-gwall">{G.map(([a,n,k])=><GameTile key={n} className="mcp-art-host" art={<GameArt art={a} shape="square"/>} title={<button type="button" className="mcp-gtile-open mcp-art-link">{n}</button>} kind={k}/>)}</div></div>;
const Links=()=> <div className="pg-cell"><TextLink>Show every case</TextLink><p className="pg-p">Read the <a href="#" onClick={stop}>house rules</a> before you start.</p></div>;
function App(){
  const [slow,setSlow]=React.useState(()=>{try{return JSON.parse(localStorage.getItem(KEY))?.slow||false}catch(e){return false}});
  React.useEffect(()=>{localStorage.setItem(KEY,JSON.stringify({slow}))},[slow]);
  return <div className={'pg'+(slow?' pg-slow':'')}>
    <header><h1>Underline hover</h1><p className="pg-lede">Hover each one with the mouse, then press and hold it. The pictures don't change anywhere on this page; only the underline does.</p></header>
    <div className="pg-bar"><label style={{display:'flex',gap:8,alignItems:'center',cursor:'pointer'}}><input type="checkbox" checked={slow} onChange={e=>setSlow(e.target.checked)}/>Slow motion</label></div>
    <section className="pg-sec"><h2>Today: three behaviours</h2>
      <div className="pg-cells">
        <div className="pg-cell"><span className="pg-cap"><b>1 · Text links.</b> Faint at rest; on hover it turns full strength, moves 2px down and the text turns white, over 160ms.</span><Links/></div>
        <div className="pg-cell"><span className="pg-cap"><b>2 · GameTile, shipped.</b> Same at rest and on hover, but it jumps, the text stays the same, and pressing does nothing.</span><Wall/></div>
        <div className="pg-cell pg-old"><span className="pg-cap"><b>3 · The game-art guideline card.</b> Nothing at rest; a thicker line fades in on hover, over 120ms.</span><Wall/></div>
      </div>
    </section>
    <section className="pg-sec"><h2>Proposed: one underline</h2><p>Everything takes the text-link underline (1). Links stay as they are; GameTile eases in the same way, its text turns white and pressing shows it.</p>
      <div className="pg-cells">
        <div className="pg-cell"><span className="pg-cap"><b>Text links</b>, unchanged</span><Links/></div>
        <div className="pg-cell pg-new"><span className="pg-cap"><b>GameTile</b>, matched</span><Wall/></div>
      </div>
    </section>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
