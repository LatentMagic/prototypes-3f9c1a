<!doctype html>
<html lang="en-GB">
<head><base href="../../../../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rows and History: audit and proposal</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="docs/archive/rows-and-history/playground/before.css">
<link rel="stylesheet" href="docs/archive/rows-and-history/playground/after.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.55 var(--font-text)}
a{color:var(--off-white);text-underline-offset:3px}a:hover{color:#fff}
.doc{max-width:1360px;margin:0 auto;padding:48px 24px 120px;display:grid;gap:72px}
.doc h1{margin:0;font:700 clamp(32px,5vw,48px)/1.05 var(--font-heading);letter-spacing:-.015em;text-wrap:balance}
.sec>h2,.doc>header h2{margin:0;font:700 28px/1.15 var(--font-heading);letter-spacing:-.01em}
.pair-h h3,.prose h3,.cost h3{margin:0;font:600 18px/1.3 var(--font-text)}
.doc p,.doc ul,.doc ol{margin:0}
.lede{max-width:68ch;color:var(--muted);text-wrap:pretty}
.prose{display:grid;gap:12px;max-width:72ch}
.prose ul,.prose ol{padding-left:20px;display:grid;gap:6px}
.prose li{text-wrap:pretty}
.muted{color:var(--muted)}
.sec{display:grid;gap:24px;padding-top:40px;border-top:1px solid var(--line)}
.sec-n{font:600 13px/1 var(--font-text);letter-spacing:.06em;color:var(--muted)}
.pair{display:grid;gap:16px}
.pair-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.lbl{display:inline-flex;align-items:center;height:24px;padding:0 8px;font:600 13px/1 var(--font-text);background:color-mix(in srgb,var(--text) 14%,var(--card))}
.lbl.is-after{background:var(--off-white);color:var(--page)}
.frames{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.fr{margin:0;min-width:0;flex:0 1 390px;display:grid;gap:8px}
.fr.is-grow{flex:1 1 600px}
.fr-cap{font:600 13px/1.3 var(--font-text);color:var(--muted)}
.fr-scale{font-weight:400}
.fr-box{overflow:hidden;border:1px solid var(--control-edge);background:var(--page)}
.fr-note{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.fr-key{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.fr-key b{color:var(--text);font-weight:600}
.pg-slot{display:grid;place-items:center;min-height:200px;border:1px dashed var(--control-edge);background:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--text) 4%,transparent) 10px 11px);font:400 13px/1.4 ui-monospace,Menlo,monospace;color:var(--muted);text-align:center;padding:16px}
.verdicts{list-style:none;padding:0;margin:0;display:grid;gap:0;max-width:880px}
.verdicts>li{display:grid;grid-template-columns:72px minmax(0,1fr);gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.verdicts b{font-weight:600}
.v{font:600 13px/1.6 var(--font-text)}
.v.is-change{color:var(--text)}.v.is-leave{color:var(--muted)}
.cost{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px 32px;max-width:1100px}
.cost>div{display:grid;gap:6px;align-content:start}
.cost h3{font-size:15px}
.cost p,.cost li{font-size:15px;color:var(--muted)}
.cost ul{padding-left:18px;display:grid;gap:4px}
.quote{display:grid;gap:8px;padding:16px 20px;background:var(--card);border:1px solid var(--line);font-size:15px;max-width:80ch}
.quote .q-h{font:600 13px/1.3 var(--font-text);color:var(--muted)}
.quote p{text-wrap:pretty}
.quote ul{padding-left:18px;display:grid;gap:6px}
.quote.is-old{background:none}
.quote.is-old p,.quote.is-old li{color:var(--muted)}
.twocol{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));align-items:start}
code{font:400 .9em ui-monospace,Menlo,monospace;background:var(--card);padding:1px 5px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script type="text/babel" src="docs/archive/rows-and-history/playground/rows.jsx"></script>
<script type="text/babel">
const Pair = ({ kind, title, children }) => (
  <div className="pair"><div className="pair-h"><span className={'lbl' + (kind === 'after' ? ' is-after' : '')}>{kind === 'after' ? 'After' : 'Before'}</span><h3>{title}</h3></div>{children}</div>
);
function Doc() {
  return (
    <div className="doc">
      <header className="prose" style={{ gap: 16 }}>
        <span className="sec-n">PROPOSAL · 10 OCTOBER 2026</span>
        <h1>Rows and History</h1>
        <p className="lede">An audit of how the Game Store shows plays, and of what the design system tells an agent about rows. Every Before frame is the product's own CSS and markup, copied from <code>index.html</code> and <code>app/gs-history.jsx</code>, rendered at the width it says. The After frames use the system's tokens and ListRow values.</p>
      </header>

      <section className="sec">
        <span className="sec-n">SUMMARY</span>
        <h2>What I'd change, and what I'd leave</h2>
        <ul className="verdicts">
          <li><span className="v is-change">Change</span><span><b>One row shape at every width.</b> Today a play row has three arrangements (switching at 480 and 720px) and an edition row has a fourth (switching at 560px). Each switch moves the result, the time and the replay mark somewhere new.</span></li>
          <li><span className="v is-change">Change</span><span><b>The result in full.</b> “Solved in 3 of 6” instead of “Solved”. The two-line row has room for it, and it is the fact a player is looking for.</span></li>
          <li><span className="v is-change">Change</span><span><b>“R” becomes “Replay”.</b> A 20px square with a letter in it has to be learnt.</span></li>
          <li><span className="v is-change">Change</span><span><b>Lists keep a measure on desktop.</b> History runs 1152px wide today, so a row's time sits about 900px from its title.</span></li>
          <li><span className="v is-change">Change</span><span><b>The plays card lists editions, with replays as a count.</b> On a phone its latest four are currently three plays of today's word.</span></li>
          <li><span className="v is-change">Change</span><span><b>The system describes parts and how to choose,</b> not a page shape. The rows card and ListRow notes read as “a card, four rows, an All link”.</span></li>
          <li><span className="v is-leave">Leave</span><span><b>Day headings with times under them.</b> “Today”, “Yesterday”, then 08:05 on the row. Clear and short.</span></li>
          <li><span className="v is-leave">Leave</span><span><b>Colour on the icon, words in ink.</b> The product has this right. The system's card colours the words green and red; it should follow the product.</span></li>
          <li><span className="v is-leave">Leave</span><span><b>A line between rows in long lists.</b> The product has it; the system's RowList says “no separators”. With two-line rows, the line is what tells you where one play ends.</span></li>
        </ul>
      </section>

      <section className="sec">
        <span className="sec-n">01 · WHAT'S THERE NOW</span>
        <h2>The rows in the product</h2>
        <div className="prose">
          <p>History and the plays card don't use the system's ListRow. They use <code>.rp</code> (a play) and <code>.ed-row</code> (an edition), and the stylesheet carries seven more row families beside them: <code>.lb-row</code>, <code>.ph-row</code>, <code>.ph-ghead</code>, <code>.dc-lrow</code>, <code>.gs-hrow</code>, <code>.gs-today-item</code> and <code>.rp-two</code>/<code>.rp-sub</code>/<code>.rp-grid</code>, some of which may no longer be used.</p>
          <ul>
            <li><b>The rows answer to the page's width, not their own.</b> They query the <code>gs</code> container. The plays card is 376px wide on a 1200px page, but its rows lay out as if they had the full width.</li>
            <li><b>Fixed columns.</b> 128px for an edition's result, 72px for its tag, a 48px cover that disappears under 720px, a 20px column for the replay mark reserved on every row whether or not any row has one.</li>
            <li><b>Special cases on a phone.</b> Under 480px a play row with a replay mark puts the time on line two; one without puts it in the middle, spanning both lines.</li>
            <li><b>The breakpoints don't agree.</b> Between 480 and 560px an edition stacks into three lines while its replays below stay on one.</li>
          </ul>
        </div>
      </section>

      <section className="sec">
        <span className="sec-n">02 · HISTORY, PLAYED</span>
        <h2>Every play under the day it was played</h2>
        <Pair kind="before" title="Today's rows">
          <div className="frames">
            <Frame w={390} label="390 wide"><BeforePlayed /></Frame>
            <Frame w={1200} grow label="1200 wide"><BeforePlayed /></Frame>
          </div>
          <div className="prose muted"><p>On a phone the replay mark sits top right and the time jumps between lines. On desktop the columns line up, but they line up at the far edge of a 1152px box, and the cover is the only thing telling the games apart at a glance.</p></div>
        </Pair>
        <Pair kind="after" title="A · One shape, with a measure (recommended)">
          <div className="frames">
            <Frame w={390} label="390 wide"><AfterPlayed /></Frame>
            <Frame w={1200} grow label="1200 wide"><AfterPlayed /></Frame>
          </div>
          <div className="cost">
            <div><h3>What it does</h3><p>Title on the first line, as a player says it: “Daily Word #212”. Then one line in a fixed order: result in full, time, Replay. The same at every width; if the line runs out it wraps, it never rearranges. On desktop the list stops at 760px.</p></div>
            <div><h3>What it costs</h3><p>Results no longer sit in a column at the right. They still line up, because every meta line starts at the same left edge, so scanning down for “Missed” works. Desktop leaves the space to the right of the list empty.</p></div>
          </div>
        </Pair>
        <Pair kind="after" title="B · Columns on a wide list">
          <div className="frames">
            <Frame w={390} label="390 wide"><AfterPlayed cols /></Frame>
            <Frame w={1200} grow label="1200 wide"><AfterPlayed cols /></Frame>
          </div>
          <div className="cost">
            <div><h3>What it does</h3><p>On a phone, two lines with fixed slots: title and time on top, result and Replay below. Time and Replay share a right edge, so they line up down the list. When the list itself is 640px or wider, it opens into one line of columns: title, result, time, Replay. One switch, measured on the list, so a narrow card on a wide page keeps the phone shape.</p></div>
            <div><h3>What it costs</h3><p>Two shapes to keep in step, and the switch still moves things. Long results (“All 4 groups, 1 mistake”) need a wide column, which pushes the time away from the title again.</p></div>
          </div>
        </Pair>
      </section>

      <section className="sec">
        <span className="sec-n">03 · HISTORY, EVERY EDITION</span>
        <h2>Each edition once, with its replays beneath</h2>
        <Pair kind="before" title="Today's rows">
          <div className="frames">
            <Frame w={390} label="390 wide"><BeforeEditions /></Frame>
            <Frame w={520} label="520 wide"><BeforeEditions /></Frame>
            <Frame w={1200} grow label="1200 wide"><BeforeEditions /></Frame>
          </div>
          <div className="prose muted"><p>At 390 the edition takes three lines (title, tag, result) and its replays two. At 520 the edition still takes three while its replays take one. On desktop the result sits in a 128px column at the far right, and a replay's title is its date.</p></div>
        </Pair>
        <Pair kind="after" title="The same anatomy, with sub rows">
          <div className="frames">
            <Frame w={390} label="390 wide"><AfterEditions /></Frame>
            <Frame w={1200} grow label="1200 wide"><AfterEditions /></Frame>
          </div>
          <div className="cost">
            <div><h3>What it does</h3><p>An edition is a row like any other: cover, title, result. “Latest” moves to the end slot, where it stays at every width. Its replays hang beneath it at the title's edge, one line each: Replay, result, date and time. A missed edition keeps its name and says “Not played”.</p></div>
            <div><h3>What it costs</h3><p>A replay row is lighter than a play row, so it reads as part of its edition rather than a play of its own. That is the point, but it is a second row style for the system to carry.</p></div>
          </div>
        </Pair>
      </section>

      <section className="sec">
        <span className="sec-n">04 · THE PLAYS CARD</span>
        <h2>Your words, on the Daily Word page</h2>
        <Pair kind="before" title="Today's rows">
          <div className="frames">
            <Frame w={390} label="390 wide"><BeforeLibrary /></Frame>
            <Frame w={1200} grow label="1200 wide"><BeforeLibrary wide /></Frame>
          </div>
          <div className="prose muted"><p>One row per play. On a phone the latest four are three plays of #212 and one of #211. On desktop the card measures the achievements card beside it and shows as many rows as fit.</p></div>
        </Pair>
        <Pair kind="after" title="One row per edition">
          <div className="frames">
            <Frame w={390} label="390 wide, in B"><AfterLibrary cols /></Frame>
            <Frame w={1200} grow label="1200 wide, in B"><AfterLibrary wide cols /></Frame>
          </div>
          <div className="cost">
            <div><h3>With B</h3><p>The card is under 640px wide on every screen, so it always uses B's phone shape: edition and date on top, result and replay count below, the date centred when there are no replays. It matches History on a phone, so the card and the page it links to read the same.</p></div>
            <div><h3>What it does</h3><p>Four rows are four editions: the first play's result, the date, and a count when there were replays. The card answers “how have I been doing”, which is what it sits next to the streak and achievements for. History, one tap away, keeps every play.</p></div>
            <div><h3>What it costs</h3><p>A replay is one tap further away: the row opens the edition's record, which then needs to list its plays. Today the row opens the replay directly.</p></div>
          </div>
        </Pair>
      </section>

      <section className="sec">
        <span className="sec-n">05 · THE DESIGN SYSTEM</span>
        <h2>What the system tells an agent about rows</h2>
        <div className="prose">
          <p>The layout guidelines already say the right thing: principles first, and the components are “one proven answer, not the only shape a page can take”. The ListRow notes and its card undo that.</p>
          <ul>
            <li><b>The card is a page, not a part.</b> A card titled “Your cases”, exactly four rows, an “All cases” link and a caption saying “Latest four, then All cases opens its own page”. An agent reproduces it as the shape of a list.</li>
            <li><b>Rules without reasons.</b> “Title, then one meta line. No gaps mid-row” and “the latest few (3 to 5)” say what, not why, so they don't help with a cover, a replay or a child row. The product had to invent <code>.rp</code> and <code>.ed-row</code> to cover those.</li>
            <li><b>Out of date with the product.</b> A missed edition is titled “Not played” (the product keeps its name). Results are coloured words (the product colours the icon). RowList has no separators (the product has them).</li>
            <li><b>Missing parts.</b> No lead slot for a cover, no sub row, no guidance on the order of facts in the meta line.</li>
          </ul>
        </div>
        <Pair kind="before" title="The List rows card">
          <div className="frames"><Frame w={700} grow label="components/surfaces/rows.card.html, live"><DsCardBefore /></Frame></div>
        </Pair>
        <Pair kind="after" title="A card that shows the parts">
          <div className="frames"><Frame w={700} grow label="Proposed rows card"><DsCardAfter /></Frame></div>
        </Pair>
        <div className="twocol">
          <div className="quote is-old"><span className="q-h">ListRow.prompt.md, now (the rules)</span>
            <ul><li>Spend the row on signal: title, then one meta line. No gaps mid-row, no second paragraph.</li><li>A list that grows without end (history): show the latest few (3 to 5) on the page and an “All…” link in the card's action.</li></ul>
          </div>
          <div className="quote"><span className="q-h">Proposed</span>
            <p>ListRow is one thing in a list of things that each open: plays, editions, saves, search results.</p>
            <ul>
              <li><b>Put a fact in the row only if a player scanning the list would use it to pick a row.</b> Everything else goes on the page the row opens. When two facts compete, keep the one that differs from row to row.</li>
              <li><b>Meta reads in one order:</b> result, when, marker. Write the result in full. Colour goes on the icon; the words stay in ink.</li>
              <li><b>One shape at every width.</b> The meta line wraps before anything moves. On a wide screen give the list a measure rather than more columns.</li>
              <li><b>Plays of one thing sit under it</b> as sub rows, one line each, at the title's edge.</li>
              <li><b>How many to show depends on the place:</b> as many as fit beside a neighbouring card; on a phone, a few and a link to all of them.</li>
            </ul>
          </div>
        </div>
        <div className="prose">
          <h3>Component changes this implies</h3>
          <ul>
            <li><code>ListRow</code> gains <code>lead</code> (a 40×30 cover) and <code>sub</code> (one line, 44px, indented to the title).</li>
            <li><code>RowList</code> draws a line between rows.</li>
            <li><code>layout-and-patterns.md</code>: the ListRow line becomes “whole row is one target, chevron at rest, no inline actions, one shape at every width; see ListRow for what goes where”. The “latest few” line drops its number.</li>
          </ul>
        </div>
      </section>

      <section className="sec">
        <span className="sec-n">06 · YOUR CALL</span>
        <h2>Three decisions before I change anything</h2>
        <ol className="prose" style={{ paddingLeft: 20 }}>
          <li>History on desktop: A (one shape, 760px measure) or B (columns once the list is 640px wide)?</li>
          <li>The plays card: one row per edition with a replay count, or keep one row per play?</li>
          <li>Should I update the system (ListRow, RowList, the card, the guidelines) first, and then write the product handoff that replaces <code>.rp</code> and <code>.ed-row</code>?</li>
        </ol>
      </section>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Doc />);
</script>
</body>
</html>
