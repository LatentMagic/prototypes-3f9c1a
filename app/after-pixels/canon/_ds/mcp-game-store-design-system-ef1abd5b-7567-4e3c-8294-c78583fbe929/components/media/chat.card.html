<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page)}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted);margin-top:8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {ChatPicture}=window.MCPGameStoreDesignSystem_ef1abd;
const mark='../../assets/logo.svg';
const word=[{from:'user',text:'I want to play Daily Word.'},{from:'ai',tool:'daily-word',text:['Today’s Daily Word (5 Oct 2026) is ready. You have six tries to find the hidden five-letter word.','What’s your first guess?']},{from:'user',text:'spain'},{from:'ai',tool:'daily-word',blocks:[{type:'tiles',rows:[{word:'AMAZE',marks:'xxxxx'},{word:'SPAIN',marks:'xxxgx'}]}],text:'First green: I is in the fourth spot. 4 guesses left.'}];
const Up=()=>{const r=React.useRef(null);React.useEffect(()=>{const t=setTimeout(()=>{const b=r.current&&r.current.querySelector('.mcp-chat-body');if(b){b.dispatchEvent(new Event('wheel'));b.scrollTop=40;}},800);return()=>clearTimeout(t);},[]);return <div ref={r}><ChatPicture turns={word} mark={mark} toolBy="After Pixels"/></div>;};
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'start'}}><div><ChatPicture turns={word} mark={mark} toolBy="After Pixels"/><p className="cap">OPENS ON THE LATEST TURN</p></div><div><Up/><p className="cap">SCROLLED UP: TOP FADES, PILL GOES BACK TO THE START</p></div></div>);
</script></body></html>
