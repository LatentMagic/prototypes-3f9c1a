<!-- @dsCard group="Components · Layout" viewport="900x560" name="GameCard" subtitle="The one game card: picture, name, blurb, tags. In every CardRow; its parts line up across the row" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--page);color:var(--text);font:400 16px/1.5 var(--font-text)}.cap{font:600 13px/1.3 var(--font-text);letter-spacing:.06em;color:var(--muted);margin:0 0 12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,280px));gap:24px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {GameCard,GameArt,CardRow,Tag,Icon}=window.MCPGameStoreDesignSystem_ef1abd;
const T=(xs)=>xs.map(x=><Tag key={x} kind={/free/i.test(x)?'free':'daily'}>{x}</Tag>);
const row=[['hunter','36,000 Summers Ago','Grey dawn below Chauvet cave. Go where you like.',['2 hours']],['casebook','Casebook','Ask the question they haven’t prepared for.',['First case free','Weekly','25–40 min']],['word','Daily Word','You already know today’s answer. Start guessing.',['Free','Daily','10 min']]];
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'grid',gap:32}}>
<div><p className="cap">IN A CARDROW: REAL COPY. ONE LINE OF TAGS SITS CENTRED BESIDE TWO. 36,000 SUMMERS AGO NEEDS THE PASS; ITS MARK OPENS THE PASS PAGE</p><CardRow title="More games">{row.map(([a,n,b,t])=><GameCard key={n} pass={a==='hunter'} onPass={a==='hunter'?()=>{}:undefined} art={<GameArt art={a} shape="wide"/>} title={n} blurb={b} tags={T(t)}/>)}</CardRow></div>
<div><p className="cap">PASS MARK: REST, HOVER, PRESSED, FOCUS</p><div style={{display:'flex',gap:24}}>{['','is-hover','is-pressed','is-focus'].map(s=><div key={s} style={{position:'relative',width:120,height:44,background:'var(--cover-bg-indigo)'}}><button type="button" className={'mcp-passmark is-link '+s}><Icon name="lock" size={14}/>Pass</button></div>)}</div></div>
</div>);
</script></body></html>
