<!-- @dsCard group="Components · Layout" viewport="900x1000" name="CardRow" subtitle="GameCards on shared lines: uneven copy, parts still level. Overflowing at phone width; fitting when wide, no arrows." -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--page);color:var(--text);font:400 16px/1.5 var(--font-text)}.cap{font:600 13px/1.3 var(--font-text);letter-spacing:.06em;color:var(--muted);margin:0 0 12px}.phone{width:390px;max-width:100%;padding:16px;border:1px solid var(--line)}.art{aspect-ratio:2/1;width:100%;background:repeating-linear-gradient(135deg,var(--line) 0 8px,var(--card) 8px 16px)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {CardRow,GameCard,Tag}=window.MCPGameStoreDesignSystem_ef1abd;
const G=[['Casebook','Ask the question they haven’t prepared for.',['First case free','Weekly','30–45 min']],['Word','Five letters. Six guesses.',['Free','Daily']],['Groups','Sixteen words hide four groups. Find all four.',['Free','Daily']],['Delve','Get her out before the drums stop.',['First scene free','Weekly']]];
const card=([n,b,t])=><GameCard key={n} art={<div className="mcp-art"><div className="art"></div></div>} title={n} blurb={b} tags={t.map(x=><Tag key={x} kind={/free/i.test(x)?'free':'daily'}>{x}</Tag>)}/>;
ReactDOM.createRoot(document.getElementById('root')).render(<div style={{display:'grid',gap:32}}>
<div><p className="cap">PHONE, OVERFLOWS, WITH A SENTENCE</p><div className="phone"><CardRow title="Free to play" sub="Casebook’s first case and Delve’s first scene are free.">{G.map(card)}</CardRow></div></div>
<div><p className="cap">WIDE, FITS: NO ARROWS</p><CardRow title="Just added">{G.slice(0,3).map(card)}</CardRow></div>
</div>);
</script></body></html>
