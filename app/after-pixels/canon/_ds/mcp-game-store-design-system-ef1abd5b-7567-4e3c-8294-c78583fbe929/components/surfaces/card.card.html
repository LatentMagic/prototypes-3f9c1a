<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}.cell{display:grid;gap:8px;align-content:start;min-width:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.MCPGameStoreDesignSystem_ef1abd;
const {Card,Heading,Tag}=NS;
function App(){const row=(chev,first)=><div style={{display:'grid',gridTemplateColumns:'repeat(4,minmax(0,1fr))',gap:12,alignItems:'start'}}>{[['',first],['is-hover','Hover'],['is-pressed','Press'],['is-focus','Focus']].map(([s,cap])=><div className="cell" key={cap}><Card className={s} chevron={chev} onClick={()=>{}}><span className="cap">Week of 28 September</span><Heading>The Night Train</Heading></Card><span className="cap">{cap}</span></div>)}</div>;
return <div style={{display:'grid',gap:16}}>{row(true,'Clickable: rest')}{row(false,'No chevron: rest')}
<div className="cell" style={{maxWidth:340}}><Card title="Daily Puzzles"><p style={{margin:0}}>A new puzzle every morning.</p><Tag kind="daily">Daily</Tag></Card><span className="cap">Static card: not clickable, so no hover</span></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
