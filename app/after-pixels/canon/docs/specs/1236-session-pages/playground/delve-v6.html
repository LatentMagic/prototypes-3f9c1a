<!doctype html>
<!-- Playground (1236): Delve's character sheet, v6. 1E and 1F, both from v5's 1CB. The main build, loaded live from index.html,
     with delve-v3/v4/v5.html's styles and pg-dv-seed, pg-dv3, pg-dv4, pg-dv5, pg-dv6 before app/main.jsx. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s character sheet, v6 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* Top: hero, then the two bars filling the rest of the width, each one line high. */
  .dv6-top { display: grid; grid-template-columns: auto repeat(2, minmax(0, 1fr)); gap: 8px 32px; align-items: end; }
  .dv6-bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; font: 600 14px/1.2 var(--font-text); color: var(--text); padding-bottom: 3px; }
  .dv6-bar small { font: 600 13px/1 var(--font-text); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .dv6-bar .mcp-prog-top { display: none; }
  /* Groups: one line across the width; one alignment rule for all of them (is-c centred, is-l left). */
  .dv6-gs { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 32px; padding-top: 10px; border-top: 1px solid var(--line); }
  .dv6-g { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .dv6.is-c .dv6-g { justify-items: center; text-align: center; }
  .dv6.is-l .dv6-g { justify-items: start; text-align: left; }
  .dv6-row { margin: 0; display: flex; gap: 8px; }
  /* KEEP: one figure cell for stats and pack: a 36px figure row, one label under, so the labels sit on one line. */
  .dv6-fig { display: grid; grid-template-rows: 36px auto; justify-items: center; align-items: center; gap: 4px; min-width: 32px; }
  .dv6-fig dt, .dv6-fig > span:last-child { font: 600 12px/1 var(--font-text); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
  .dv6-fig dt { order: 2; } .dv6-fig dd { margin: 0; order: 1; }
  .dv6-fig abbr { text-decoration: none; }
  .dv6 .dv6-fig .dv4-sx text { font-size: 20px; }
  .dv6 .dv6-fig .dv4-g { width: 32px; height: 32px; }
  .dv6-fig > span:last-child { color: var(--text); letter-spacing: 0; }
  .dv6-fig.is-used > span:last-child { color: var(--muted); }
  .dv6-abs { display: grid; gap: 8px; }
  .dv6-ab { display: flex; align-items: center; gap: 8px; font: 600 14px/1.2 var(--font-text); color: var(--text); }
  .dv6-ab small { font: 600 13px/1 var(--font-text); color: var(--muted); font-variant-numeric: tabular-nums; }
  .dv6-ab.is-used { color: var(--muted); }
  .dv6.is-c .dv6-ab { justify-content: center; }
  @container dv4 (max-width: 719.98px) {
    .dv6-top { grid-template-columns: minmax(0, 1fr); }
  }
  /* 1G, 1H: one cell anatomy for every piece: a 36px figure, one line under it. */
  /* KEEP: cells in a group are equal width (the widest name's), so boxes sit evenly however long each name is. */
  .dv7-cells { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px 12px; }
  .dv7-cell { display: grid; grid-template-rows: 36px auto; justify-items: center; align-items: center; align-content: start; gap: 6px; min-width: 32px; }
  .dv7-fig { position: relative; display: grid; place-items: center; }
  /* KEEP: armour carries its +1 on the box's corner, so what it does is seen without a tap. */
  .dv7-arm { position: absolute; top: -6px; right: -12px; min-width: 18px; padding: 2px 3px; background: var(--off-white); color: var(--page); font: 700 11px/1 var(--font-text); font-style: normal; text-align: center; font-variant-numeric: tabular-nums; }
  .dv7-cell.is-used .dv7-arm { background: var(--muted); }
  /* KEEP: a name wraps to at most two balanced lines inside its cell, so a long one never runs into the next box. */
  .dv7-lb { max-width: 88px; align-self: start; text-align: center; text-wrap: balance; font: 600 12px/1.2 var(--font-text); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv7-cell.is-used .dv7-lb { color: var(--muted); }
  .dv7 .dv7-cell .dv4-sx text { font-size: 20px; }
  .dv7 .dv7-cell .dv4-g { width: 32px; height: 32px; }
  .dv7 .dv7-cell .dv4-uses { gap: 4px; } .dv7 .dv7-cell .dv4-uses i { width: 14px; height: 14px; }
  .dv7-none { min-height: 54px; display: flex; align-items: center; font: 400 13px/1.2 var(--font-text); color: var(--muted); }
  .dv7-h { display: flex; align-items: baseline; gap: 8px; font: 600 13px/1.2 var(--font-text); color: var(--muted); }
  .dv7-h.is-spread { justify-content: space-between; }
  .dv7-h b { font: 600 13px/1.2 var(--font-text); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv7 .mcp-prog-top { display: none; }
  /* 1G · Columns: three equal columns; the rule spans them; each piece sits under the one above it. */
  .dv7-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 40px; align-items: end; }
  .dv7-grid > .dv7-col { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .dv7-rule { grid-column: 1 / -1; margin: 0; border: 0; border-top: 1px solid var(--line); }
  .dv7-grid > .dv7-rule ~ .dv7-col { align-self: start; }
  /* 1H · Band: groups centred across the card, split by hairlines. */
  /* KEEP: every group grows by the same amount, so the card's slack is shared out between groups, never left beside the hero. */
  /* KEEP: the band never wraps on a desktop card; groups may shrink, never drop to a second row. */
  .dv7-band { display: flex; flex-wrap: nowrap; gap: 0; }
  .dv7-grp { flex: 1 1 auto; min-width: 0; display: grid; gap: 8px; justify-items: center; align-content: start; padding: 0 12px; }
  .dv7-grp:first-child { padding-left: 0; } .dv7-grp:last-child { padding-right: 0; }
  .dv7.is-band .dv7-cells { gap: 8px; }
  .dv7-grp.is-hero { justify-items: center; text-align: center; align-content: start; gap: 6px; }
  .dv7-grp.is-hero { align-content: center; }
  .dv7-hero { margin: 0; display: grid; justify-items: center; gap: 4px; }
  .dv7-hero b { font: 700 22px/1.1 var(--font-heading); letter-spacing: -.01em; color: var(--text); white-space: nowrap; }
  .dv7-hero span { font: 600 14px/1.2 var(--font-text); color: var(--muted); }
  /* KEEP: ~ not +, because the phone's fold button sits between Threat and Stats in the markup. */
  .dv7-grp ~ .dv7-grp { border-left: 1px solid var(--line); }
  .dv7-grp .dv7-h { justify-content: center; }
  .dv7.is-band .dv5-trk { width: 72px; height: 8px; }
  /* ---- 1H on a phone card (under 560px): three folds. Every fold keeps the cells and their sizes; only the arrangement changes. ---- */
  .dv7-sw, .dv7-tog { display: none; }
  @container dv4 (max-width: 559.98px) {
    .dv7-hero b { font-size: 18px; }
    /* M1 · Rows and M3 · Switch share the top row: hero, hit points, threat, and the fold control. */
    /* KEEP: the hero's two columns are wider than the tracks', so a long name clears the hairline into hit points. */
    .fold-m1 .dv7-band, .fold-m3 .dv7-band { display: grid; grid-template-columns: repeat(2, minmax(0, 1.25fr)) repeat(4, minmax(0, 1fr)) 20px; }
    .fold-m1 .dv7-grp, .fold-m3 .dv7-grp { padding: 12px 6px; border-left: 0; }
    .fold-m1 .dv7-grp.is-hero, .fold-m3 .dv7-grp.is-hero { grid-column: 1 / 3; grid-row: 1; padding: 0 12px 12px 0; }
    .fold-m1 .is-hp, .fold-m3 .is-hp { grid-column: 3 / 5; grid-row: 1; padding-top: 0; border-left: 1px solid var(--line); }
    .fold-m1 .is-th, .fold-m3 .is-th { grid-column: 5 / 7; grid-row: 1; padding-top: 0; border-left: 1px solid var(--line); }
    .fold-m1 .dv5-trk, .fold-m3 .dv5-trk { width: 60px; }
    /* KEEP: in the phone's top row a track's cell is as tall as the bar, so heading, bar and count sit together rather than the bar floating in the 36px figure row the band uses on desktop. */
    .fold-m1 :is(.is-hp, .is-th) .dv7-cell, .fold-m3 :is(.is-hp, .is-th) .dv7-cell { grid-template-rows: auto auto; gap: 8px; }
    .fold-m1 :is(.is-hp, .is-th), .fold-m3 :is(.is-hp, .is-th) { align-content: center; }
    /* KEEP: the whole top row folds the rest away; the chevron is its keyboard control and the visible cue. */
    .fold-m1 .dv7-tog, .fold-m3 .dv7-tog { /* KEEP: the chevron's edge sits on the card's content edge, as the hero's does on the left; its 44px target reaches into the card's padding. */
    grid-column: 7; grid-row: 1; align-self: center; justify-self: end; display: grid; place-items: center; width: 44px; height: 44px; margin: 0 -12px 0 0; padding: 0; background: none; border: 0; color: var(--muted); cursor: pointer; }
    .dv7-tog svg { transform: rotate(-90deg); transition: transform var(--time-dropdown, .2s) var(--ease, ease); }
    .dv7.is-shut .dv7-tog svg { transform: rotate(90deg); }
    .dv7-tog:focus-visible { outline: 2px solid var(--off-white); outline-offset: 2px; }
    @media (hover: hover) { .dv7-tog:hover { color: var(--text); } }
    .fold-m1 .is-hero, .fold-m1 .is-hp, .fold-m1 .is-th, .fold-m3 .is-hero, .fold-m3 .is-hp, .fold-m3 .is-th { cursor: pointer; }
    .fold-m1.is-shut .dv7-grp.is-hero, .fold-m1.is-shut .is-hp, .fold-m1.is-shut .is-th, .fold-m3.is-shut .dv7-grp.is-hero, .fold-m3.is-shut .is-hp, .fold-m3.is-shut .is-th { padding-bottom: 0; }
    .is-shut .is-st, .is-shut .is-pk, .is-shut .is-ab, .is-shut .is-in, .is-shut .dv7-sw { display: none !important; }
    /* M1: then the six stats; the pack; abilities beside inspiration. Hairlines between rows. */
    .fold-m1 .is-st, .fold-m1 .is-pk { grid-column: 1 / -1; padding-left: 0; padding-right: 0; }
    .fold-m1 .is-ab { grid-column: 1 / 5; padding-left: 0; padding-bottom: 0; } .fold-m1 .is-in { grid-column: 5 / -1; padding-right: 0; padding-bottom: 0; border-left: 1px solid var(--line); }
    .fold-m1 .is-st, .fold-m1 .is-pk, .fold-m1 .is-ab, .fold-m1 .is-in { border-top: 1px solid var(--line); }
    /* M3: M1's top row, then a three-way switch and the one group it picks (inspiration goes with abilities). */
    .fold-m3 .dv7-sw { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); padding-top: 12px; }
    .fold-m3 .dv7-sw button { min-height: 44px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 14px/1 var(--font-text); cursor: pointer; }
    .fold-m3 .dv7-sw button + button { border-left: 0; }
    .fold-m3 .dv7-sw button[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
    .fold-m3 .dv7-sw button:focus-visible { outline: 2px solid var(--off-white); outline-offset: 2px; }
    .fold-m3 .is-st, .fold-m3 .is-pk { grid-column: 1 / -1; padding-left: 0; padding-right: 0; padding-bottom: 0; }
    .fold-m3 .is-ab { grid-column: 1 / 5; padding-left: 0; padding-bottom: 0; } .fold-m3 .is-in { grid-column: 5 / -1; padding-right: 0; padding-bottom: 0; border-left: 1px solid var(--line); }
    .fold-m3 .is-st:not(.is-on), .fold-m3 .is-pk:not(.is-on), .fold-m3 .is-ab:not(.is-on), .fold-m3 .is-in:not(.is-on) { display: none; }
    /* M2 · Scroll: the band stays the desktop row and the whole of it scrolls sideways. */
    .fold-m2 .dv7-band { overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin; padding-bottom: 8px; }
    .fold-m2 .dv7-grp { flex: none; scroll-snap-align: start; }
  }
  @container dv4 (max-width: 719.98px) { .dv7-grid { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.DV3_NO_BAR = true; window.DV4_NO_BAR = true; window.DV5_NO_BAR = true;
(async () => {
  const D = 'docs/specs/1236-session-pages/playground/';
  const PG = [D + 'pg-dv-seed.jsx', D + 'pg-dv3.jsx', D + 'pg-dv4.jsx', D + 'pg-dv5.jsx', D + 'pg-dv6.jsx'];
  const parse = async (u) => new DOMParser().parseFromString(await (await fetch(u, { cache: 'no-store' })).text(), 'text/html');
  const doc = await parse('index.html');
  // KEEP: v3's, v4's and v5's styles are taken from their own pages, never copied here.
  const prev = await Promise.all(['delve-v3.html', 'delve-v4.html', 'delve-v5.html'].map((f) => parse(D + f)));
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  prev.forEach((d) => d.head.querySelectorAll('style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine)));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
