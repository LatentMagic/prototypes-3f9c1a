<!doctype html>
<!-- Playground (1236): Delve's session page, v2. The main build, loaded live from index.html (its styles and scripts, in its
     order), with pg-dv-seed.jsx and pg-dv2.jsx before app/main.jsx. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s session page, v2 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, Delve v2). ---- */
  body { padding-top: 56px; }
  .gs-root > .gs-top { top: 56px; }
  /* KEEP: inside the phone frame the screen scrolls on its own, so the top bar sticks to its top, not under the playground bar. */
  .kit-phone-clip .gs-root > .gs-top { top: 0; }
  .gs-nav { display: none !important; }
  .kit-stage { min-height: calc(100vh - 56px); box-sizing: border-box; }
  .kit-phone { height: min(872px, calc(100vh - 56px - 48px)); }
  /* KEEP: the bar fits one row at about 1185px; narrower it scrolls sideways. */
  .dv1b { position: fixed; top: 0; left: 0; right: 0; z-index: 400; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 12px; overflow-x: auto; background: #0E0D0C; border-bottom: 1px dashed #FF2EC4; font-family: var(--font-text); color: var(--text); }
  .dv1b-grp { flex: none; display: flex; align-items: center; gap: 4px; }
  .dv1b-lab { font: 600 12px/1 var(--font-text); color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .dv1b-chip { flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 9px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 13px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
  .dv1b-chip[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
  .dv1b-why { position: fixed; top: 64px; right: 12px; z-index: 400; width: min(380px, calc(100vw - 24px)); box-sizing: border-box; padding: 16px; background: #0E0D0C; border: 1px dashed #FF2EC4; color: var(--muted); font: 400 14px/1.45 var(--font-text); display: grid; gap: 8px; }
  .dv1b-why p { margin: 0; }

  /* ---- Shared: the card, the top (result statement + character sheet), the die, the moment, the held roll. ---- */
  .dv2 { container: dv2 / inline-size; display: grid; gap: 24px; min-width: 0; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); padding: 16px; --pad: 16px; }
  @container gs (min-width: 720px) { .dv2 { padding: 24px; --pad: 24px; } }
  .dv2-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 32px; }
  .dv2-res { display: flex; gap: 16px; align-items: center; min-width: 0; flex: 1 1 260px; }
  .dv2-rw { display: grid; gap: 4px; min-width: 0; }
  .dv2-word { margin: 0; font: 700 44px/1 var(--font-heading); letter-spacing: -.01em; }
  @container dv2 (max-width: 479.98px) { .dv2-word { font-size: 36px; } }
  .dv2-word.is-ok { color: var(--success); } .dv2-word.is-bad { color: var(--warning); } .dv2-word.is-live { color: var(--text); }
  .dv2-word.is-sm { font-size: 28px; flex: none; }
  .dv2-sent { margin: 0; font: 600 16px/1.35 var(--font-text); color: var(--text); text-wrap: balance; }
  .dv2-mk { flex: none; display: grid; place-items: center; }
  .dv2-top.is-sheet { display: grid; gap: 16px; }
  /* KEEP: Sheet form: the hero is the heading, the ending word holds the top right at every width, the hero wrapping beside it. */
  .dv2-sh-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .dv2-heroh { margin: 0; font: 700 34px/1.1 var(--font-heading); color: var(--text); }
  @container dv2 (max-width: 479.98px) { .dv2-heroh { font-size: 28px; } .dv2-word.is-sm { font-size: 22px; } }
  .dv2-sheet { display: grid; gap: 10px; min-width: 0; }
  .dv2-hero { margin: 0; font: 700 16px/1.2 var(--font-heading); color: var(--text); }
  .dv2-figs { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 28px; }
  @container dv2 (max-width: 559.98px) { .dv2-sheet { flex: 1 1 100%; } .dv2-figs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; } }
  .dv2-fig { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .dv2-fig > span { font: 600 13px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  .dv2-fig > b { font: 700 22px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv2-fig > b small { font: 600 14px/1 var(--font-text); color: var(--muted); }
  .dv2-gear { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font: 600 14px/1.3 var(--font-text); }
  .dv2-gear > span { font-size: 13px; color: var(--muted); }
  .dv2-gear b { font-weight: 600; color: var(--text); } .dv2-gear small { color: var(--muted); font: inherit; font-weight: 400; }
  .dv2-pips { display: grid; grid-auto-flow: column; grid-auto-columns: 6px; gap: 2px; justify-content: start; }
  .dv2-pips > i { display: block; height: 14px; background: color-mix(in srgb, var(--text) 16%, var(--card)); }
  .dv2-pips > i.is-on { background: var(--off-white); }
  .dv2-pips.is-big { grid-auto-columns: 8px; gap: 3px; } .dv2-pips.is-big > i { height: 56px; }
  .dv2-mk.is-bad .dv2-pips.is-big > i.is-on { background: var(--warning); }

  .dv2-dbtn { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; display: grid; place-items: center; color: inherit; }
  .dv2-dbtn:focus-visible, .dv2-mom:focus-visible { outline: 2px solid var(--focus-ring, var(--off-white)); outline-offset: 2px; }
  .dv2-die { display: block; overflow: visible; flex: none; }
  /* KEEP: a miss is an empty hex with a visible edge, so it holds 3:1 against the card as a shape. */
  .dv2-die .hx { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .dv2-die.is-strong .hx { fill: var(--success); stroke: none; }
  .dv2-die.is-weak .hx { fill: var(--warning); stroke: none; }
  .dv2-die .nm { font: 700 15px var(--font-heading); fill: var(--muted); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .dv2-die.is-strong .nm { fill: var(--success-on); } .dv2-die.is-weak .nm { fill: var(--warning-on); }
  .dv2-die .rim { fill: none; stroke: var(--success); stroke-width: 1.75; vector-effect: non-scaling-stroke; }
  /* KEEP: a natural 1 is a miss with a red edge, heavier than a miss's grey one; no rim, so only the natural 20 has one. */
  .dv2-die.is-fumble .hx { stroke: var(--error); stroke-width: 2.25; }
  .dv2-die.is-fumble .nm { fill: var(--error); }
  /* KEEP: under 64px a two-d20 roll shows a second hex behind its die; from 64px the small numbered die at its corner. */
  .dv2-die .gh { fill: var(--card); stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .dv2-die .tw polygon { fill: var(--card); stroke: var(--muted); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
  .dv2-die .tw text { font: 700 17px var(--font-heading); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  /* KEEP: the picked die gets an off-white ring outside its own rim, so a natural's rim still shows. */
  .dv2-die .sl { fill: none; stroke: var(--off-white); stroke-width: 2.5; vector-effect: non-scaling-stroke; display: none; transform: scale(1.12); transform-origin: 18px 20px; }
  .dv2-die.is-sel .sl { display: inline; }

  .dv2-moms { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
  .dv2-mom { appearance: none; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px; background: none; border: 1px solid var(--line); color: var(--text); cursor: pointer; min-width: 0; font: inherit; }
  .dv2-mom[aria-pressed="true"] { border-color: var(--off-white); box-shadow: inset 0 0 0 1px var(--off-white); }
  .dv2-mom-t { display: grid; gap: 2px; min-width: 0; }
  .dv2-mom-k { font: 700 16px/1.2 var(--font-heading); color: var(--text); }
  .dv2-mom-h { font: 600 14px/1.3 var(--font-text); color: var(--text); }
  .dv2-mom-r { font: 400 13px/1.3 var(--font-text); color: var(--muted); }
  /* KEEP: on a phone the moment tiles go two by two, smaller, without the room. */
  @container dv2 (max-width: 719.98px) { .dv2-moms { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .dv2-mom { padding: 8px; gap: 8px; } .dv2-mom .dv2-mom-r { display: none; } .dv2-mom-k { font-size: 14px; } .dv2-mom-h { font-size: 13px; } .dv2-mom svg { width: 32px; height: 35px; } }
  .dv2-mom.is-c { flex-direction: column; align-items: flex-start; padding: 16px; }
  .dv2-mom.is-c .dv2-mom-k { font-size: 20px; }
  @container dv2 (max-width: 719.98px) { .dv2-mom.is-c { flex-direction: row; align-items: center; padding: 8px; } .dv2-mom.is-c .dv2-mom-k { font-size: 14px; } }
  .dv2-mom.is-chip { padding: 6px 10px 6px 6px; gap: 8px; } .dv2-mom.is-chip .dv2-mom-r, .dv2-mom.is-chip .dv2-mom-h { display: none; } .dv2-mom.is-chip .dv2-mom-k { font-size: 14px; }
  .dv2-mom.is-chip svg { width: 28px; height: 30px; }

  .dv2-held { display: flex; gap: 16px; align-items: center; min-width: 0; min-height: 64px; }
  .dv2-held-t { display: grid; gap: 2px; min-width: 0; }
  .dv2-held-k { margin: 0; font: 700 16px/1.25 var(--font-heading); color: var(--text); }
  .dv2-held-k span { font: 400 14px/1 var(--font-text); color: var(--muted); }
  .dv2-held-h { margin: 0; font: 600 15px/1.3 var(--font-text); color: var(--text); }
  /* KEEP: each fact is kept whole, so a long line breaks between facts, never inside one. */
  .dv2-facts { margin: 0; display: flex; flex-wrap: wrap; gap: 0 6px; font: 400 14px/1.45 var(--font-text); color: var(--muted); }
  .dv2-facts span { white-space: nowrap; } .dv2-facts span:not(:last-child)::after { content: ' ·'; }
  .dv2-facts span:first-child { color: var(--text); font-weight: 600; }
  .dv2-held.is-big { flex-direction: column; align-items: flex-start; padding: 16px; border: 1px solid var(--line); min-height: 240px; box-sizing: border-box; }
  .dv2-held.is-big .dv2-held-k { font-size: 22px; }
  /* KEEP: the held roll pinned to the foot of the screen while the picture is in view, so the roll you light is never out of sight. */
  .dv2-held.is-bar { position: sticky; bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)); z-index: 2; margin: 0 calc(-1 * var(--pad)) calc(-1 * var(--pad)); padding: 12px var(--pad); background: var(--card); border-top: 1px solid var(--line); }

  .dv2-num { position: relative; z-index: 1; flex: none; min-width: 28px; height: 28px; padding: 0 4px; box-sizing: border-box; display: inline-flex; gap: 2px; align-items: center; justify-content: center; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--control-edge); font: 700 14px/1 var(--font-heading); color: var(--text); }
  .dv2-num i { font-style: normal; font-weight: 600; }
  .dv2-num.is-back { box-shadow: inset 0 0 0 1.5px var(--muted); background: var(--card); color: var(--muted); }
  .dv2-sname { font: 600 12px/1.3 var(--font-text); color: var(--muted); text-wrap: balance; }
  .dv2-pass { display: block; width: 6px; height: 6px; background: var(--control-edge); margin-top: 8px; }

  /* ---- A · Route, fixed. ---- */
  .dvA2 { display: grid; gap: 20px; min-width: 0; }
  .dvA2-route { display: flex; min-width: 0; }
  /* KEEP: every stop starts 8px above its room number, and a picked last die's ring ends about 8px above the stop's foot, so the highlight overlaps both ends alike. */
  .dvA2-stop { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: auto 1fr; justify-items: center; gap: 10px; padding: 8px 0 9px; }
  .dvE-mom:last-child { margin-bottom: 0; }
  .dvA2-stop.is-on { background: color-mix(in srgb, var(--text) 5%, var(--card)); }
  .dvA2-stop.is-on .dv2-num { background: var(--off-white); color: var(--page); box-shadow: none; }
  .dvA2-head { position: relative; width: 100%; display: grid; justify-items: center; gap: 4px; text-align: center; padding: 0 4px; box-sizing: border-box; }
  .dvA2-head::before { content: ''; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--control-edge); }
  .dvA2-stop:first-child .dvA2-head::before { left: 50%; } .dvA2-stop:last-child .dvA2-head::before { right: 50%; }
  .dvA2-dice { display: grid; gap: 4px; align-content: start; justify-items: center; }
  /* KEEP: on a phone the route keeps room numbers (↩ marks going back) and the held roll names the room; dice shrink to fit eight across. */
  @container dv2 (max-width: 719.98px) { .dvA2-head .dv2-sname { display: none; } .dvA2-dice svg { width: 30px; height: 33px; } .dv2-num { min-width: 24px; padding: 0 2px; font-size: 13px; } }

  /* ---- C · Moments, fixed. ---- */
  .dvC2 { display: grid; gap: 20px; min-width: 0; }
  .dvC2-run { display: grid; gap: 16px; min-width: 0; }
  @container dv2 (min-width: 800px) { .dvC2-run { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; } .dvC2-bar { display: none; } }
  @container dv2 (max-width: 799.98px) { .dvC2-side { display: none; } }
  .dvC2-strip { display: flex; flex-wrap: wrap; gap: 16px 0; align-items: flex-end; }
  .dvC2-seg { display: grid; gap: 8px; padding: 0 12px; border-left: 1px solid var(--line); min-width: 0; }
  .dvC2-seg:first-child { border-left: 0; padding-left: 0; }
  .dvC2-segh { display: flex; gap: 6px; align-items: center; }
  .dvC2-seg.is-on .dv2-num { background: var(--off-white); color: var(--page); box-shadow: none; }
  .dvC2-seg.is-on .dv2-sname { color: var(--text); }
  .dvC2-segd { display: flex; gap: 3px; align-items: flex-end; }
  .dvC2-cell { position: relative; padding-top: 6px; }
  /* A moment's die on the strip carries a bar over it, the link to its tile. */
  .dvC2-cell.is-mom::before { content: ''; position: absolute; top: 0; left: 4px; right: 4px; height: 3px; background: var(--off-white); }
  /* KEEP: on a phone the strip becomes one row per room stood in, room on the left, its dice wrapping on the right, so going back never breaks the order mid-row. */
  @container dv2 (max-width: 719.98px) {
    .dvC2-strip { display: grid; gap: 0; }
    .dvC2-seg { grid-template-columns: 96px minmax(0, 1fr); align-items: center; padding: 8px 0; border-left: 0; border-top: 1px solid var(--line); }
    .dvC2-seg:first-child { border-top: 0; }
    .dvC2-segh { align-items: flex-start; flex-direction: column; gap: 4px; }
    .dvC2-segd { flex-wrap: wrap; }
  }

  /* ---- E · Route, the moments in it. ---- */
  .dvE { display: grid; gap: 16px; min-width: 0; }
  .dvE-chips { display: none; flex-wrap: wrap; gap: 6px; }
  .dvE-main { display: grid; gap: 16px; min-width: 0; }
  @container dv2 (min-width: 800px) { .dvE-main { grid-template-columns: minmax(0, 1fr) 260px; align-items: stretch; } }
  /* KEEP: E's held roll is as tall as the route beside it, so the two end level; its large die sits centred at the top, the words under it. */
  .dvE-side { display: grid; }
  .dvE-side > .dv2-held.is-big { height: 100%; align-items: center; justify-content: flex-start; text-align: center; background: var(--popup); border-color: var(--control-edge); }
  .dvE-side > .dv2-held.is-big .dv2-facts { justify-content: center; }
  /* KEEP: under 800px E is its desktop design stacked: the held roll above the route, so a tap never sends you scrolling to read it.
     It opens on the last roll (the winning blow on a win); you tap a die to change it. */
  @container dv2 (max-width: 799.98px) {
    .dvE-side { order: -1; }
    .dvE-side > .dv2-held.is-big { min-height: 144px; padding: 8px 12px; gap: 6px; }
    .dvE-side > .dv2-held.is-big svg { width: 56px; height: 61px; }
    .dvE-side > .dv2-held.is-big .dv2-held-k { font-size: 18px; }
    .dvE-k { display: none; }
  }
  .dvE-mom { display: grid; justify-items: center; gap: 4px; margin: 4px 0; }
  .dvE-k { font: 700 12px/1.2 var(--font-heading); color: var(--text); text-align: center; text-wrap: balance; max-width: 80px; }
  /* KEEP: on a phone every die takes one fixed row slot, the height of a moment's die, so dice in neighbouring columns sit on the same rows. */
  @container dv2 (max-width: 719.98px) { .dvE-mom svg { width: 40px; height: 43px; } .dvA2-route.is-e .dvA2-dice { grid-auto-rows: 46px; gap: 2px; align-items: center; } .dvA2-route.is-e .dvE-mom { margin: 0; } }

  /* ---- F · One line. ---- */
  .dvF { display: grid; gap: 16px; min-width: 0; }
  .dvE-chips.is-f { display: none; }
  .dvF-line { display: flex; gap: 0; min-width: 0; align-items: stretch; }
  .dvF-band { flex-basis: 0; min-width: 76px; display: grid; grid-template-rows: 1fr auto; gap: 8px; padding: 0 6px; border-left: 1px solid var(--line); }
  .dvF-band:first-child { border-left: 0; padding-left: 0; }
  .dvF-band.is-on .dv2-num { background: var(--off-white); color: var(--page); box-shadow: none; } .dvF-band.is-on .dv2-sname { color: var(--text); }
  .dvF-dice { display: flex; gap: 2px; align-items: flex-end; padding-top: 52px; }
  .dvF-cell { position: relative; display: grid; justify-items: center; }
  /* Two lanes for callouts, so two moments close together never overlap. The stem runs down to the die. */
  .dvF-call { position: absolute; left: 50%; bottom: calc(100% + 4px); white-space: nowrap; font: 700 13px/1 var(--font-heading); color: var(--text); padding: 4px 6px; border: 1px solid var(--control-edge); background: var(--card); transform: translateX(-12px); }
  .dvF-call.is-l1 { bottom: calc(100% + 28px); }
  .dvF-call::after { content: ''; position: absolute; left: 11px; top: 100%; width: 1.5px; height: 5px; background: var(--control-edge); }
  .dvF-call.is-l1::after { height: 29px; }
  .dvF-call.is-on { background: var(--off-white); color: var(--page); border-color: var(--off-white); }
  .dvF-head { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; }
  /* KEEP: a room's name wraps under a narrow band, never clipped. */
  .dvF-head .dv2-sname { min-width: 0; }
  /* KEEP: in the last band a callout hangs left from its die, so it never runs past the card's edge. */
  .dvF-band:last-child .dvF-call { left: auto; right: 50%; transform: translateX(12px); }
  .dvF-band:last-child .dvF-call::after { left: auto; right: 11px; }
  .dvF > .dv2-held.is-big { min-height: 0; flex-direction: row; align-items: center; }
  .dvF-bar { display: none; }
  /* KEEP: on a phone the line becomes one row per room stood in, the callouts move to chips above, and the held roll pins to the foot. */
  @container dv2 (max-width: 719.98px) {
    .dvE-chips.is-f { display: flex; } .dvF > .dv2-held.is-big { display: none; } .dvF-bar { display: block; }
    .dvF-line { display: grid; }
    .dvF-band { grid-template-columns: 96px minmax(0, 1fr); grid-template-rows: auto; padding: 8px 0; border-left: 0; border-top: 1px solid var(--line); align-items: center; }
    .dvF-band:first-child { border-top: 0; }
    .dvF-dice { order: 2; padding-top: 0; flex-wrap: wrap; } .dvF-head { order: 1; flex-direction: column; align-items: flex-start; }
    .dvF-head .dv2-sname { padding-top: 0; } .dvF-call { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = ['docs/specs/1236-session-pages/playground/pg-dv-seed.jsx', 'docs/specs/1236-session-pages/playground/pg-dv2.jsx'];
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
