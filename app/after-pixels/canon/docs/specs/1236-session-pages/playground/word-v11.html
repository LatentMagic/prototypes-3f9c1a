<!doctype html>
<!-- Playground (1236): Daily Word's now card, v11: C2 with the plain word, and three ideas on it. The main build, loaded live
     from index.html (its styles and scripts, in its order), with pg-wd11.jsx before app/main.jsx. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily Word’s now card, v11, C2 ideas (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, v11). ---- */
  body { padding-top: 56px; }
  .gs-root > .gs-top { top: 56px; }
  /* KEEP: inside the phone frame the screen scrolls on its own, so the top bar sticks to its top, not under the playground bar. */
  .kit-phone-clip .gs-root > .gs-top { top: 0; }
  .gs-nav { display: none !important; }
  /* KEEP: the phone frame fits under the bar. */
  .kit-stage { min-height: calc(100vh - 56px); box-sizing: border-box; }
  .kit-phone { height: min(872px, calc(100vh - 56px - 48px)); }
  .pg11-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 400; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 16px; overflow-x: auto; background: #0E0D0C; border-bottom: 1px dashed #FF2EC4; font-family: var(--font-text); color: var(--text); }
  .pg11-eyebrow { flex: none; font: 600 11px/1 var(--font-text); letter-spacing: .06em; color: #FF2EC4; }
  .pg11-grp { flex: none; display: flex; align-items: center; gap: 4px; }
  .pg11-lab { font: 600 12px/1 var(--font-text); color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .pg11-chip { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 14px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
  .pg11-chip[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }

  /* One concept shows, as the bar picks. Every piece is rendered; the class on <html> shows the concept's. */
  html:not(.v11-concept-now) .wd11-said.is-now, html:not(.v11-concept-D3) .wd11-said.is-head,
  html:not(.v11-concept-D1) .wd11-stat, html.v11-concept-D2 .wd11-trail.is-played, html:not(.v11-concept-D2) .wd11-trail.is-six { display: none; }
  .v11-tile-52 { --pg-t: 52px; } .v11-tile-56 { --pg-t: 56px; }
  /* KEEP: the card is its own container, so it lays out by the card's width, not the window's. */
  .wd11 { container: wd11 / inline-size; }
  .wd11-in { display: grid; gap: 16px; min-width: 0; }
  .wd11-in > .lb-top { flex-wrap: nowrap; }
  .wd11-in > .lb-top > .gs-stack-xs { flex: 1 1 0; }
  .wd11-in > .lb-top > .wd11-r { flex: 0 1 auto; max-width: 50%; text-align: right; }
  /* The picture: the earlier guesses as a trail of 10px blocks, centred on the last guess at full tile size. */
  .wd11-pic { display: grid; gap: 12px; justify-self: center; justify-items: center; text-align: center; }
  .wd11-line { display: flex; align-items: center; gap: 16px; }
  .wd11-trail { display: grid; gap: 3px; }
  .wd11-tr { display: grid; grid-template-columns: repeat(5, 10px); gap: 2px; }
  .wd11-tr > i { display: block; aspect-ratio: 1; box-sizing: border-box; }
  .wd11-tr > i.is-hit { background: #4CC38A; }
  .wd11-tr > i.is-near { background: #E5A63B; }
  /* KEEP: the trail's misses at a 1px outline, so the small blocks read lighter than the big tiles. */
  .wd11-tr > i.is-miss { border: 1px solid #918B80; }
  /* D2: a guess not used is a flat block in the line colour, so it never reads as a miss. */
  .wd11-tr > i.is-empty { background: var(--line); }
  /* KEEP: the hint at trail size, as v10: its row a 10px square under the letter it gave, edged in 1px dots 3px apart (a dot at
     each corner, four a side) so it reads as dotted at this size; the rest of the row empty. */
  .wd11-tr.is-h > i.is-hint { background:
    linear-gradient(90deg, #ABA79E 1px, transparent 0) top / 3px 1px repeat-x,
    linear-gradient(90deg, #ABA79E 1px, transparent 0) bottom / 3px 1px repeat-x,
    linear-gradient(180deg, #ABA79E 1px, transparent 0) left / 1px 3px repeat-y,
    linear-gradient(180deg, #ABA79E 1px, transparent 0) right / 1px 3px repeat-y; }
  .wd11-big { --t: 56px; --g: 6px; }
  @container wd11 (max-width: 479.98px) { .wd11-big { --t: 44px; } }
  /* KEEP: stacked (a narrow card, a phone): the gap below the picture matches the gap above it as seen. The title's line box ends
     about 6px under its figures, so the picture gets 6px more below it than the 16px gap gives. And the trail's gap is 12px with
     the tiles fitted to the card, so the row never runs past the card's right padding. */
  @container wd11 (max-width: 599.98px) { .wd11-in > .wd11-pic { margin-bottom: 6px; } }
  @container wd11 (max-width: 479.98px) { .wd11-line { gap: 12px; } .wd11-big { --t: min(44px, calc((100cqi - 96px) / 5)); } }
  /* KEEP: D1 on a narrow card or a phone: the count drops under the word, so the row never runs past the card. */
  @container wd11 (max-width: 599.98px) { .v11-concept-D1 .wd11-line { flex-wrap: wrap; justify-content: center; row-gap: 12px; } .v11-concept-D1 .wd11-stat { flex-basis: 100%; justify-items: center; text-align: center; } }
  .wd11-row { display: grid; grid-template-columns: repeat(5, var(--t)); gap: var(--g); }
  .wd11-said { margin: 0; font: 400 14px/1.4 var(--font-text); color: var(--muted); text-wrap: pretty; }
  /* KEEP: D3's sentence wraps in the head, so the head gives way and the picture never spills into the gutters. */
  .wd11-said.is-head { max-width: 22ch; }
  /* D1: the count as data beside the word, its figure one tile high. */
  .wd11-stat { display: grid; gap: 4px; justify-items: start; text-align: left; }
  .wd11-stat > b { font: 700 32px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .wd11-stat > span { font: 600 13px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  /* C2: on a card 600px wide or more (a laptop's two-column page is about 700), the label and title, the picture and the result
     share the top row (the result stays top right); the foot below. Narrower, canon's stack, the picture centred. */
  @container wd11 (min-width: 600px) {
    .wd11-in { grid-template-columns: minmax(0, auto) minmax(max-content, 1fr) auto; grid-template-areas: "head pic res" "foot foot foot" "next next next"; column-gap: 24px; row-gap: 24px; }
    .wd11-in > .lb-top { display: contents; }
    .wd11-in > .lb-top > .gs-stack-xs { grid-area: head; align-self: start; }
    .wd11-in > .lb-top > .wd11-r { grid-area: res; align-self: start; max-width: none; }
    .wd11-in > .wd11-pic { grid-area: pic; align-self: start; }
    .wd11-in > .lb-foot { grid-area: foot; }
    .wd11-in > .gs-pu-nextlink { grid-area: next; }
    .wd11-big { --t: var(--pg-t, 48px); }
  }
</style>
<script>window.KIT_STATE_KEY = "kit_1236_word-now_playground-v11";</script>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = 'docs/specs/1236-session-pages/playground/pg-wd11.jsx';
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') await babel(PG); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
