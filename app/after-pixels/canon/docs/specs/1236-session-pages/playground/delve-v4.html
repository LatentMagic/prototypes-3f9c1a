<!doctype html>
<!-- Playground (1236): Delve's session page, v4 — the character sheet as its own card (E4). The main build, loaded live from
     index.html, with delve-v3.html's styles and pg-dv-seed.jsx, pg-dv3.jsx and pg-dv4.jsx before app/main.jsx. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s character sheet, v4 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- The sheet card: the session card's surface. ---- */
  .dv4-lay { display: grid; gap: 16px; min-width: 0; }
  .dv4-lay.is-side { grid-template-columns: minmax(0, 1fr) 304px; align-items: start; }
  .dv4 { container: dv4 / inline-size; display: grid; gap: 16px; align-content: start; min-width: 0; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); padding: 16px; }
  @container gs (min-width: 720px) { .dv4 { padding: 24px; } }
  .dv4-h { margin: 0; font: 600 13px/1.2 var(--font-text); color: var(--muted); }
  .dv4-hero { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
  .dv4-hero b { font: 700 24px/1.1 var(--font-heading); letter-spacing: -.01em; color: var(--text); }
  .dv4-hero span { font: 600 14px/1.2 var(--font-text); color: var(--muted); }
  .dv4-lab { font: 600 13px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  .dv4-cell { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .dv4-big { font: 700 22px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv4-big small { font: 600 14px/1 var(--font-text); color: var(--muted); }
  .dv4-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 600 14px/1.3 var(--font-text); color: var(--text); }
  .dv4-row > span:last-child { color: var(--muted); }
  .dv4-stack { display: grid; gap: 16px; }
  .dv4-meters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
  @container dv4 (max-width: 479.98px) { .dv4-meters { gap: 12px; } }
  .dv4-meter { display: grid; gap: 6px; }
  /* KEEP: the bar's own label is hidden; the row above it carries the name and the count. */
  .dv4-meter .mcp-prog-top { display: none; }

  /* Glyph boxes: a square per thing, line-drawn; a used one goes grey and struck; an empty slot is a faint outline. */
  .dv4-g { position: relative; flex: none; width: 32px; height: 32px; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--control-edge); color: var(--text); }
  .dv4-g.is-lg { width: 44px; height: 44px; }
  .dv4-g.is-used { box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
  .dv4-g.is-used::after { content: ''; position: absolute; left: 3px; right: 3px; top: 50%; height: 1.5px; background: var(--muted); transform: rotate(-45deg); }
  .dv4-g.is-empty { box-shadow: inset 0 0 0 1px var(--line); }
  .dv4-g.is-bare { box-shadow: none; }
  .dv4-uses { display: flex; gap: 3px; }
  .dv4-uses i { display: block; width: 10px; height: 10px; box-sizing: border-box; border: 1px solid var(--control-edge); }
  .dv4-uses i.is-on { background: var(--off-white); border-color: var(--off-white); }
  /* KEEP: inspiration is the die's hex, rimmed green as a natural 20 is (a natural 20 gives it back); spent, an empty hex. */
  .dv4-insp { display: block; overflow: visible; flex: none; }
  .dv4-insp .hx { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .dv4-insp.is-on .hx { fill: var(--off-white); stroke: none; }
  .dv4-insp .rim { fill: none; stroke: var(--success); stroke-width: 1.75; vector-effect: non-scaling-stroke; }
  .dv4-ins { display: inline-flex; align-items: center; gap: 8px; }
  .dv4-ins b { font: 700 22px/1 var(--font-heading); color: var(--text); }
  .dv4-items { display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .dv4-item { display: flex; align-items: center; gap: 8px; min-width: 0; font: 600 14px/1.25 var(--font-text); color: var(--text); }
  .dv4-item small { display: block; font: 400 13px/1.25 var(--font-text); color: var(--muted); }
  .dv4-item.is-used { color: var(--muted); }
  .dv4-item.is-row > span:not(.dv4-g) { flex: 1 1 auto; } .dv4-item.is-row > small { text-align: right; }
  .dv4-stats { margin: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px 8px; }
  .dv4-stats.is-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @container dv4 (max-width: 559.98px) { .dv4-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .dv4-stats > div { display: grid; gap: 4px; min-width: 0; }
  .dv4-stats dt { font: 600 13px/1.2 var(--font-text); color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .dv4-stats dd { margin: 0; font: 700 20px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }

  /* 1 · Strip */
  .dv4-strip { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-start; }
  @container dv4 (max-width: 559.98px) { .dv4-strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; } .dv4-strip > .is-wide { grid-column: 1 / -1; } }

  /* 2 · Rail */
  .dv4-sec { display: grid; gap: 10px; padding-top: 16px; border-top: 1px solid var(--line); }

  /* 3 · Tokens */
  .dv4-hexw { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: flex-end; }
  .dv4-tracks { display: grid; gap: 4px; min-width: 200px; }
  .dv4-tgrp { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; }
  .dv4-tok { position: relative; min-width: 44px; min-height: 44px; display: grid; justify-items: center; align-content: end; gap: 4px; padding: 2px; background: none; border: 0; cursor: pointer; color: var(--text); font: inherit; }
  .dv4-tok:focus-visible { outline: 2px solid var(--off-white); outline-offset: 2px; }
  .dv4-tok[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--off-white); }
  @media (hover: hover) { .dv4-tok:hover { background: color-mix(in srgb, var(--text) 6%, var(--card)); } }
  .dv4-tok.is-track { grid-template-columns: 32px auto; justify-items: start; align-items: center; justify-content: start; min-height: 32px; }
  .dv4-tn { font: 700 20px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv4-sx { display: block; overflow: visible; }
  .dv4-sx .hx { fill: var(--card); stroke: var(--control-edge); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .dv4-sx text { font: 700 13px var(--font-heading); fill: var(--text); text-anchor: middle; dominant-baseline: central; }
  .dv4-ab { font: 600 12px/1 var(--font-text); color: var(--muted); letter-spacing: .04em; }
  .dv4-cap { margin: 0; min-height: 21px; padding-top: 12px; border-top: 1px solid var(--line); font: 400 14px/1.45 var(--font-text); color: var(--muted); text-wrap: pretty; }
  .dv4-cap b { font-weight: 600; color: var(--text); }

  /* 4 · In hand */
  .dv4-hh { display: grid; gap: 6px; }
  .dv4-slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
  @container dv4 (max-width: 479.98px) { .dv4-slots { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .dv4-slot { display: flex; align-items: center; gap: 12px; min-width: 0; padding: 12px; border: 1px solid var(--line); }
  .dv4-slot > span:last-child { display: grid; gap: 2px; min-width: 0; }
  .dv4-slot b { font: 600 15px/1.25 var(--font-text); color: var(--text); }
  .dv4-slot small { font: 400 13px/1.25 var(--font-text); color: var(--muted); }
  .dv4-slot.is-used b { color: var(--muted); }
  .dv4-line { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 16px; font: 400 14px/1.4 var(--font-text); color: var(--muted); }
  .dv4-line b { font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.DV3_NO_BAR = true;
(async () => {
  const PG = ['docs/specs/1236-session-pages/playground/pg-dv-seed.jsx', 'docs/specs/1236-session-pages/playground/pg-dv3.jsx', 'docs/specs/1236-session-pages/playground/pg-dv4.jsx'];
  const parse = async (u) => new DOMParser().parseFromString(await (await fetch(u, { cache: 'no-store' })).text(), 'text/html');
  const doc = await parse('index.html');
  // KEEP: v3's styles (the bar, the session card, the die, the route) are taken from delve-v3.html itself, never copied here.
  const v3 = await parse('docs/specs/1236-session-pages/playground/delve-v3.html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  v3.head.querySelectorAll('style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
