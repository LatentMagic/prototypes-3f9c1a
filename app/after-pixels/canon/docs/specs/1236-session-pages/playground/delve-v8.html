<!doctype html>
<!-- Playground (1236): Delve v8, three ways to fit the sheet's extras with the streak always shown (3A, 3B, 3C from the low-fi canvas).
     The main build, loaded live from index.html, with delve-v3 to v7's styles and pg-dv-seed, pg-dv3 to pg-dv8 before app/main.jsx. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s sheet extras, v8 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* v8: the band in rows. Every row uses 1H's group and cell anatomy, so a second row reads as more of the same sheet. */
  .dv8-rows { display: grid; gap: 16px; }
  .dv8-r2 { border-top: 1px solid var(--line); padding-top: 16px; }
  /* KEEP: 3A's second row is centred and its groups keep their own width, so one group sits in the middle, never stranded at the left. */
  .dv8-r2.is-centre { justify-content: center; }
  .dv8-r2.is-centre > .dv7-grp { flex: 0 1 auto; padding: 0 28px; }
  .dv8-r2.is-centre > .dv7-grp:first-child { padding-left: 28px; } .dv8-r2.is-centre > .dv7-grp:last-child { padding-right: 28px; }
  .dv8-r2.is-centre > .dv7-grp:first-child { border-left: 1px solid var(--line); } .dv8-r2.is-centre > .dv7-grp:last-child { border-right: 1px solid var(--line); }
  /* 3B: one row, with more height so the denser groups get air: taller padding, wider gaps inside groups. */
  .dv8.is-3b .dv7-band { padding: 8px 0; }
  .dv8.is-3b .dv7-grp { padding: 0 6px; gap: 12px; min-width: min-content; }
  /* KEEP: 3B's cells never shrink below their label, so a squeezed band wraps (below) instead of labels running together. */
  .dv8.is-3b .dv7-cells { gap: 8px; grid-auto-columns: minmax(min-content, 1fr); }
  /* KEEP: no cell shrinks below its own label (1H's 32px floor would let it), so names never run together. */
  .dv8.is-3b .dv7-cell { min-width: min-content; }
  .dv8.is-3b .dv7-cell .dv7-fig > svg { width: 24px; height: auto; }
  .dv8.is-3b .dv8-stats .dv7-cells { gap: 2px; }
  /* KEEP: the stat hexes are one fixed size, so all six match; they step up to v7's 32px once the card has the room. */
  .dv8.is-3b .dv8-stats .dv7-cell .dv7-fig > svg { width: 28px; }
  @container dv4 (min-width: 960px) { .dv8.is-3b .dv8-stats .dv7-cell .dv7-fig > svg { width: 32px; } .dv8.is-3b .dv8-stats .dv7-cells { gap: 6px; } }
  .dv8.is-3b .dv7-band { min-width: 0; }
  .dv8.is-3b .dv7-cell .dv4-g { width: 28px; height: 28px; }
  .dv8.is-3b .dv7-cell .dv4-sx text { font-size: 18px; }
  /* KEEP: the meters share one grid, so every label, bar and count starts at the same x and every bar is the same length; labels never wrap. */
  .dv8-meters { display: grid !important; grid-template-columns: max-content minmax(32px, 1fr) max-content; gap: 12px 6px; align-content: center; align-items: center; justify-items: stretch !important; }
  .dv8-meters .dv6-bar { display: contents; font-size: 13px; }
  .dv8-meters .dv6-bar > span { white-space: nowrap; }
  .dv8-meters .dv6-bar small { text-align: left; }
  /* The streak is a count, not slots: a figure in the cell's 36px row. */
  .dv8-num { font: 700 22px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  /* KEEP: 3B's end groups take only their own width, so the hero sits at the card's left edge and the last group at its right; the slack goes between groups. Like 1H, the band never wraps on a desktop card. */
  .dv8.is-3b .dv7-band { flex-wrap: nowrap; }
  /* KEEP: even space at every hairline. Every group grows by the same px and centres its content, so both sides of each rule get the same space;
     the two end groups grow by half as much and hug the card's edge, so their one inner side matches the rest. Inside an end group the lines stay centred on each other. */
  .dv8.is-3b .dv7-grp { flex: 1 1 auto; }
  .dv8.is-3b .dv7-grp.is-hero { flex: .5 1 auto; padding-left: 0; grid-template-columns: auto; justify-content: start; justify-items: center; }
  .dv8.is-3b .dv7-grp:last-child { flex: .5 1 auto; padding-right: 0; grid-template-columns: auto; justify-content: end; justify-items: center; }
  .dv8-meters .dv8-clues { justify-self: center; }
  .dv8-tog { display: none; }
  .dv8-cost { position: relative; display: grid; place-items: center; width: 34px; height: 34px; color: var(--warning); }
  .dv8-cost svg { position: absolute; inset: 0; }
  .dv8-cost b { position: relative; margin-top: -4px; font: 700 12px/1 var(--font-text); color: var(--warning); font-variant-numeric: tabular-nums; }
  .dv8-cost.is-none { color: var(--muted); }
  /* KEEP: a pack name wraps to two lines at most, so its cell never narrows below the width two lines need. */
  .dv8.is-3b .dv8-pack .dv7-cell { min-width: 44px; }
  /* KEEP: Advantage's two cells take their own widths, not equal columns, since "Inspiration" would double the streak's cell. */
  .dv8.is-3b .dv8-adv .dv7-cells { grid-auto-columns: auto; }
  /* Clues: use-style squares, smaller than an ability's, so more clues still fit one line. */
  .dv8 .dv8-clues .dv4-uses { gap: 3px; } .dv8 .dv8-clues .dv4-uses i { width: 10px; height: 10px; }
  .dv8 .dv7-cell.is-new .dv7-lb { color: var(--text); }
  /* Phone card: the rows wrap into a grid of groups, hero across the top. A first pass; M1's fold is not carried over yet. */
  @container dv4 (max-width: 559.98px) {
    .dv8 .dv7-band { flex-wrap: wrap; }
    .dv8 .dv7-grp, .dv8 .dv8-r2.is-centre > .dv7-grp { flex: 1 1 40%; padding: 12px 6px !important; border: 0 !important; border-top: 1px solid var(--line) !important; }
    .dv8 .dv7-grp.is-hero { flex-basis: 100%; border-top: 0 !important; padding-top: 0 !important; }
    .dv8 .dv8-r2 { border-top: 0; padding-top: 0; }
    .dv8-meters { min-width: 0; flex-basis: 100% !important; }
    /* KEEP: 3B on a phone card: hero, meters and stats each take the full width; the smaller groups pair up two to a row; a lone last group takes the full row. */
    .dv8.is-3b .dv7-band { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; padding: 0; }
    .dv8.is-3b .dv7-grp, .dv8.is-3b .dv7-grp.is-hero, .dv8.is-3b .dv7-grp:last-child { min-width: 0; margin: 0; padding: 12px 0 !important; border: 0 !important; border-top: 1px solid var(--line) !important; justify-content: center; justify-items: center; }
    .dv8.is-3b .dv7-grp.is-hero { grid-column: 1; border-top: 0 !important; padding-top: 0 !important; justify-content: start; justify-items: start; }
    /* KEEP: on a phone the name and class share one line, wrapping only when the name needs the room. */
    .dv8.is-3b .dv7-hero { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; text-align: left; }
    /* KEEP: as M1, the phone sheet opens folded to the hero and the meters; the control opens the rest. */
    .dv8.is-3b .dv8-tog { display: grid; grid-column: 2; grid-row: 1; justify-self: end; align-self: start; place-items: center; width: 44px; height: 44px; margin: -10px -10px 0 0; background: none; border: 0; color: var(--text); cursor: pointer; }
    .dv8.is-3b .dv8-tog svg { transform: rotate(-90deg); transition: transform var(--dur-fast, .15s); }
    .dv8.is-3b .dv8-tog[aria-expanded="false"] svg { transform: rotate(90deg); }
    .dv8.is-3b .dv8-tog:focus-visible { outline: 2px solid var(--off-white); outline-offset: -2px; }
    .dv8.is-3b.is-shut .dv7-grp:not(.is-hero):not(.dv8-meters) { display: none; }
    .dv8.is-3b .dv8-meters, .dv8.is-3b .dv8-stats, .dv8.is-3b .dv7-grp:nth-child(odd):last-child { grid-column: 1 / -1; }
    .dv8.is-3b .dv8-meters { justify-items: stretch !important; grid-template-columns: max-content minmax(0, 1fr) max-content; }
    .dv8.is-3b .dv8-stats .dv7-cells { gap: 6px; }
    .dv8.is-3b .dv7-cell .dv7-fig > svg { width: 28px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.DV3_NO_BAR = true; window.DV4_NO_BAR = true; window.DV5_NO_BAR = true; window.DV6_NO_BAR = true; window.DV7_NO_BAR = true; window.DV_NO_TWO = true;
(async () => {
  const D = 'docs/specs/1236-session-pages/playground/';
  const PG = [D + 'pg-dv-seed.jsx', D + 'pg-dv3.jsx', D + 'pg-dv4.jsx', D + 'pg-dv5.jsx', D + 'pg-dv6.jsx', D + 'pg-dv7.jsx', D + 'pg-dv8.jsx'];
  const parse = async (u) => new DOMParser().parseFromString(await (await fetch(u, { cache: 'no-store' })).text(), 'text/html');
  const doc = await parse('index.html');
  // KEEP: v3's to v7's styles are taken from their own pages, never copied here.
  const prev = await Promise.all(['delve-v3.html', 'delve-v4.html', 'delve-v5.html', 'delve-v6.html', 'delve-v7.html'].map((f) => parse(D + f)));
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  prev.forEach((d) => d.head.querySelectorAll('style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine)));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
