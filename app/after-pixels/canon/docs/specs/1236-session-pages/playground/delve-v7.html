<!doctype html>
<!-- Playground (1236): Delve v7, the session card's result statement on the settled sheet (1H, M1). The main build, loaded live from index.html,
     with delve-v3/v4/v5/v6.html's styles and pg-dv-seed, pg-dv3 to pg-dv7 before app/main.jsx. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s result statement, v7 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* v7: the result statement. 3 · Band: the word and its line on one row, split by a hairline (3g: a space instead). */
  .dv7r-band { display: flex; align-items: center; gap: 0; min-width: 0; }
  .dv7r-word { margin: 0; font: 700 34px/1.05 var(--font-heading); letter-spacing: -.01em; text-wrap: balance; }
  .dv7r-word.is-ok { color: var(--success); } .dv7r-word.is-bad { color: var(--warning); } .dv7r-word.is-live { color: var(--text); }
  /* KEEP: the line takes the system's 20px heading, so word and line read as one statement, not a heading over small print. */
  .dv7r-line { margin: 0; font: 700 20px/1.25 var(--font-heading); letter-spacing: -.01em; color: var(--text); text-wrap: balance; min-width: 0; }
  .dv7r-band .dv7r-word { padding-right: 24px; flex: none; font-size: 28px; }
  /* KEEP: in the band the line is body text at label weight (Hanken 600), so only the word is display type. */
  .dv7r-band .dv7r-line { padding-left: 24px; border-left: 1px solid var(--line); align-self: stretch; display: flex; align-items: center; font: 600 16px/1.35 var(--font-text); letter-spacing: 0; }
  .dv7r-band.is-gap .dv7r-line { border-left: 0; padding-left: 0; }
  @container dv2 (max-width: 559.98px) {
    .dv7r-band { flex-direction: column; align-items: flex-start; gap: 4px; }
    .dv7r-band .dv7r-word { padding-right: 0; }
    .dv7r-band .dv7r-line { padding-left: 0; border-left: 0; }
    .dv7r-word { font-size: 28px; } .dv7r-line { font-size: 18px; }
    .dv7r-band .dv7r-word { font-size: 24px; } .dv7r-band .dv7r-line { font-size: 16px; }
  }
  /* 2A · Roll box: the result is the held box at rest; the roll it ended on sits at its foot and opens that roll. */
  .dv7r-box { align-content: space-between; gap: 16px; }
  .dv7r-bw { display: grid; gap: 6px; }
  .dv7r-last { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; padding: 12px 0 0; background: none; border: 0; border-top: 1px solid var(--line); color: var(--muted); text-align: left; cursor: pointer; font: inherit; }
  .dv7r-last .dv3-k { font-size: 17px; }
  .dv7r-last:focus-visible { outline: 2px solid var(--off-white); outline-offset: 2px; }
  @media (hover: hover) { .dv7r-last:hover { color: var(--text); } }
  .dvE-side:has(.dv7r-back) { grid-template-rows: auto 1fr; gap: 8px; }
  .dv7r-back { display: flex; }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.DV3_NO_BAR = true; window.DV4_NO_BAR = true; window.DV5_NO_BAR = true; window.DV6_NO_BAR = true;
(async () => {
  const D = 'docs/specs/1236-session-pages/playground/';
  const PG = [D + 'pg-dv-seed.jsx', D + 'pg-dv3.jsx', D + 'pg-dv4.jsx', D + 'pg-dv5.jsx', D + 'pg-dv6.jsx', D + 'pg-dv7.jsx'];
  const parse = async (u) => new DOMParser().parseFromString(await (await fetch(u, { cache: 'no-store' })).text(), 'text/html');
  const doc = await parse('index.html');
  // KEEP: v3's to v6's styles are taken from their own pages, never copied here.
  const prev = await Promise.all(['delve-v3.html', 'delve-v4.html', 'delve-v5.html', 'delve-v6.html'].map((f) => parse(D + f)));
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  prev.forEach((d) => d.head.querySelectorAll('style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine)));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
