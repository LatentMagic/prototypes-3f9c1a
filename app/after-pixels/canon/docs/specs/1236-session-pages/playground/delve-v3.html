<!doctype html>
<!-- Playground (1236): Delve's session page, v3 — concept E made better. The main build, loaded live from index.html (its
     styles and scripts, in its order), with pg-dv-seed.jsx and pg-dv3.jsx before app/main.jsx. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s session page, v3 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, Delve v3). ---- */
  body { padding-top: 56px; }
  .gs-root > .gs-top { top: 56px; }
  /* KEEP: inside the phone frame the screen scrolls on its own, so the top bar sticks to its top, not under the playground bar. */
  .kit-phone-clip .gs-root > .gs-top { top: 0; }
  .gs-nav { display: none !important; }
  .kit-stage { min-height: calc(100vh - 56px); box-sizing: border-box; }
  .kit-phone { height: min(872px, calc(100vh - 56px - 48px)); }
  .dv1b { position: fixed; top: 0; left: 0; right: 0; z-index: 400; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 12px; overflow-x: auto; background: #0E0D0C; border-bottom: 1px dashed #FF2EC4; font-family: var(--font-text); color: var(--text); }
  .dv1b-grp { flex: none; display: flex; align-items: center; gap: 4px; }
  .dv1b-lab { font: 600 12px/1 var(--font-text); color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .dv1b-chip { flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 9px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 13px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
  .dv1b-chip[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
  .dv1b-why { position: fixed; top: 64px; right: 12px; z-index: 400; width: min(380px, calc(100vw - 24px)); box-sizing: border-box; padding: 16px; background: #0E0D0C; border: 1px dashed #FF2EC4; color: var(--muted); font: 400 14px/1.45 var(--font-text); display: grid; gap: 8px; }
  .dv1b-why p { margin: 0; }

  /* ---- The card and its top: result statement, character sheet (v2's, with its heading). ---- */
  .dv2 { container: dv2 / inline-size; display: grid; gap: 24px; min-width: 0; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); padding: 16px; }
  @container gs (min-width: 720px) { .dv2 { padding: 24px; } }
  .dv2-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 32px; }
  .dv2-res { display: flex; gap: 16px; align-items: center; min-width: 0; flex: 1 1 260px; }
  .dv2-rw { display: grid; gap: 4px; min-width: 0; }
  .dv2-word { margin: 0; font: 700 44px/1 var(--font-heading); letter-spacing: -.01em; }
  @container dv2 (max-width: 479.98px) { .dv2-word { font-size: 36px; } }
  .dv2-word.is-ok { color: var(--success); } .dv2-word.is-bad { color: var(--warning); } .dv2-word.is-live { color: var(--text); }
  .dv2-sent { margin: 0; font: 600 16px/1.35 var(--font-text); color: var(--text); text-wrap: balance; }
  .dv3-sub { margin: 0; font: 400 14px/1.4 var(--font-text); color: var(--muted); text-wrap: pretty; }
  .dv2-sheet { display: grid; gap: 10px; min-width: 0; }
  .dv3-shh { margin: 0; font: 600 13px/1.2 var(--font-text); color: var(--muted); }
  .dv2-hero { margin: 0; font: 700 16px/1.2 var(--font-heading); color: var(--text); }
  .dv2-figs { display: grid; grid-template-columns: repeat(2, auto); gap: 8px 28px; justify-content: start; }
  @container dv2 (max-width: 559.98px) { .dv2-sheet { flex: 1 1 100%; } .dv2-figs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 12px; } }
  .dv2-fig { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .dv2-fig > span { font: 600 13px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  .dv2-fig > b { font: 700 22px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv2-fig > b small { font: 600 14px/1 var(--font-text); color: var(--muted); }
  .dv2-gear { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font: 600 14px/1.3 var(--font-text); }
  .dv2-gear > span { font-size: 13px; color: var(--muted); }
  .dv2-gear b { font-weight: 600; color: var(--text); } .dv2-gear small { color: var(--muted); font: inherit; font-weight: 400; }
  .dv2-pips { display: grid; grid-auto-flow: column; grid-auto-columns: 6px; gap: 2px; justify-content: start; }
  .dv2-pips > i { display: block; height: 14px; background: color-mix(in srgb, var(--text) 16%, var(--card)); }
  .dv2-pips > i.is-on { background: var(--off-white); }

  /* ---- The die (v2, agreed). ---- */
  .dv2-dbtn { position: relative; z-index: 1; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; display: grid; place-items: center; color: inherit; }
  .dv2-dbtn:focus-visible { outline: 2px solid var(--focus-ring, var(--off-white)); outline-offset: 2px; }
  .dv2-die { display: block; overflow: visible; flex: none; }
  /* KEEP: a miss is an empty hex with a visible edge, so it holds 3:1 against the card as a shape. */
  .dv2-die .hx { fill: var(--card); stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .dv2-die.is-strong .hx { fill: var(--success); stroke: none; }
  .dv2-die.is-weak .hx { fill: var(--warning); stroke: none; }
  .dv2-die .nm { font: 700 15px var(--font-heading); fill: var(--muted); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .dv2-die.is-strong .nm { fill: var(--success-on); } .dv2-die.is-weak .nm { fill: var(--warning-on); }
  .dv2-die .rim { fill: none; stroke: var(--success); stroke-width: 1.75; vector-effect: non-scaling-stroke; }
  /* KEEP: a natural 1 is a miss with a red edge, heavier than a miss's grey one; no rim, so only the natural 20 has one. */
  .dv2-die.is-fumble .hx { stroke: var(--error); stroke-width: 2.25; }
  .dv2-die.is-fumble .nm { fill: var(--error); }
  /* KEEP: under 64px a two-d20 roll shows a second hex behind its die; from 64px the small numbered die at its corner. */
  .dv2-die .gh { fill: var(--card); stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .dv2-die .tw polygon { fill: var(--card); stroke: var(--muted); stroke-width: 1.25; vector-effect: non-scaling-stroke; }
  .dv2-die .tw text { font: 700 17px var(--font-heading); fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  /* KEEP: the picked die gets an off-white ring outside its own rim, so a natural's rim still shows. */
  .dv2-die .sl { fill: none; stroke: var(--off-white); stroke-width: 2.5; vector-effect: non-scaling-stroke; display: none; transform: scale(1.12); transform-origin: 18px 20px; }
  .dv2-die.is-sel .sl { display: inline; }
  /* KEEP: inside the held roll, which sits on the pop-up fill, a miss's hex takes that fill so it reads as empty there too. */
  .dv3-held .dv2-die .hx, .dv3-held .dv2-die .gh, .dv3-held .dv2-die .tw polygon { fill: var(--popup); }
  .dv3-held .dv2-die.is-strong .hx { fill: var(--success); } .dv3-held .dv2-die.is-weak .hx { fill: var(--warning); }

  /* ---- The route (v2's E). ---- */
  .dv2-num { position: relative; z-index: 1; flex: none; min-width: 28px; height: 28px; padding: 0 4px; box-sizing: border-box; display: inline-flex; gap: 2px; align-items: center; justify-content: center; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--control-edge); font: 700 14px/1 var(--font-heading); color: var(--text); }
  .dv2-num i { font-style: normal; font-weight: 600; }
  .dv2-num.is-back { box-shadow: inset 0 0 0 1.5px var(--muted); color: var(--muted); }
  .dv2-sname { font: 600 12px/1.3 var(--font-text); color: var(--muted); text-wrap: balance; }
  .dv2-pass { position: relative; z-index: 1; display: block; width: 6px; height: 6px; background: var(--control-edge); margin-top: 8px; }
  .dvA2-route { display: flex; min-width: 0; }
  .dvA2-stop { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: auto 1fr; justify-items: center; gap: 10px; padding: 8px 0 9px; }
  .dvA2-stop.is-on { background: color-mix(in srgb, var(--text) 5%, var(--card)); }
  .dvA2-stop.is-on .dv2-num { background: var(--off-white); color: var(--page); box-shadow: none; }
  .dvA2-head { position: relative; width: 100%; display: grid; justify-items: center; gap: 4px; text-align: center; padding: 0 4px; box-sizing: border-box; }
  .dvA2-head::before { content: ''; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--control-edge); }
  .dvA2-stop:first-child .dvA2-head::before { left: 50%; } .dvA2-stop:last-child .dvA2-head::before { right: 50%; }
  .dvA2-dice { position: relative; display: grid; gap: 4px; align-content: start; justify-items: center; }
  .dvE-mom { display: grid; justify-items: center; margin: 4px 0; }
  .dvE-mom:last-child { margin-bottom: 0; }
  /* Column lines, the study (brief item 0): a rule between rooms, or a line down each room behind its dice. */
  .dvA2-route.is-cols-between .dvA2-stop + .dvA2-stop { box-shadow: inset 1px 0 0 var(--line); }
  .dvA2-route.is-cols-lanes .dvA2-dice::before { content: ''; position: absolute; left: 50%; top: -6px; bottom: -9px; width: 1px; transform: translateX(-.5px); background: color-mix(in srgb, var(--text) 20%, var(--card)); }
  /* KEEP: on a phone the route keeps room numbers (↩ marks going back) and the held roll names the room; every die takes one fixed row slot so neighbouring columns line up. */
  @container dv2 (max-width: 719.98px) {
    .dvA2-head .dv2-sname { display: none; } .dvA2-dice svg { width: 30px; height: 33px; }
    .dv2-num { min-width: 24px; padding: 0 2px; font-size: 13px; }
    .dvE-mom svg { width: 40px; height: 43px; }
    .dvA2-route.is-e .dvA2-dice { grid-auto-rows: 46px; gap: 2px; align-items: center; } .dvA2-route.is-e .dvE-mom { margin: 0; }
  }
  .dvE-main { display: grid; gap: 16px; min-width: 0; }
  /* KEEP: on desktop the held roll is as tall as the route beside it, so the two end level. Under 800px it sits above the route. */
  @container dv2 (min-width: 800px) { .dvE-main { grid-template-columns: minmax(0, 1fr) 272px; align-items: stretch; } }
  .dvE-side, .dv3-live { display: grid; min-width: 0; }
  @container dv2 (max-width: 799.98px) { .dvE-side { order: -1; } }

  /* ---- The held roll, three designs. Shared: the pop-up fill and edge, the name of the roll, the moment line. ---- */
  .dv3-held { box-sizing: border-box; min-width: 0; display: grid; align-content: start; gap: 12px; padding: 16px; background: var(--popup); border: 1px solid var(--control-edge); }
  .dv3-hk { display: grid; gap: 2px; min-width: 0; }
  .dv3-k { margin: 0; font: 700 20px/1.2 var(--font-heading); color: var(--text); text-wrap: balance; }
  .dv3-n { margin: 0; font: 600 13px/1.3 var(--font-text); color: var(--muted); }
  .dv3-line { margin: 0; font: 600 15px/1.3 var(--font-text); color: var(--text); }
  .dv3-lht { display: grid; gap: 4px; min-width: 0; }
  .is-strong { --tc: var(--success); } .is-weak { --tc: var(--warning); } .is-miss { --tc: var(--text); } .is-fumble { --tc: var(--error); }
  /* 1 · Ledger: the die and its name centred, then a labelled row per fact. */
  .dv3-lh { display: grid; justify-items: center; gap: 10px; text-align: center; }
  .dv3-dl { margin: 0; display: grid; border-top: 1px solid var(--line); }
  .dv3-dl > div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .dv3-dl dt { font: 600 13px/1.4 var(--font-text); color: var(--muted); }
  .dv3-dl dd { margin: 0; font: 600 14px/1.4 var(--font-text); color: var(--text); min-width: 0; }
  .dv3-dl dd span { font-weight: 400; color: var(--muted); }
  .dv3-dl dd[class*="is-"] { color: var(--tc); }
  /* 2 · Sum: the roll as its sum, the bar to the target, the outcome. */
  .dv3-eye { margin: 0; font: 600 13px/1.35 var(--font-text); color: var(--muted); }
  .dv3-eq { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .dv3-eq .op { font: 600 20px/1 var(--font-heading); color: var(--muted); white-space: nowrap; }
  .dv3-eq b { font: 700 40px/1 var(--font-heading); color: var(--text); }
  .dv3-cap { margin: 0; font: 400 14px/1.4 var(--font-text); color: var(--muted); }
  .dv3-gauge { position: relative; height: 8px; margin: 4px 0 20px; background: color-mix(in srgb, var(--text) 12%, var(--popup)); }
  .dv3-gauge > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tc); }
  .dv3-gauge.is-miss > i { background: var(--muted); }
  .dv3-gauge > b { position: absolute; top: -5px; width: 2px; height: 18px; transform: translateX(-1px); background: var(--off-white); }
  .dv3-gauge > b span { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); font: 600 12px/1 var(--font-text); color: var(--text); white-space: nowrap; }
  .dv3-tier { margin: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font: 700 22px/1.15 var(--font-heading); color: var(--tc); }
  .dv3-tier span { font: 600 14px/1.2 var(--font-text); color: var(--text); }
  /* 3 · Scoreboard: rolled against needed, large, the outcome under. */
  .dv3-bh { display: flex; gap: 12px; align-items: center; }
  .dv3-sb { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .dv3-sb > div { display: grid; gap: 6px; justify-items: center; padding: 16px 0 14px; }
  .dv3-sb > div + div { box-shadow: inset 1px 0 0 var(--line); }
  .dv3-sb b { font: 700 48px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv3-sb > div + div b { color: var(--muted); }
  .dv3-sb span { font: 600 13px/1 var(--font-text); color: var(--muted); }
  .dv2-facts { margin: 0; display: flex; flex-wrap: wrap; gap: 0 6px; font: 400 14px/1.45 var(--font-text); color: var(--muted); }
  /* KEEP: each fact is kept whole, so a long line breaks between facts, never inside one. */
  .dv2-facts span { white-space: nowrap; } .dv2-facts span:not(:last-child)::after { content: ' ·'; }
  /* KEEP: under 800px the held roll sits above the route, so it is kept short: the ledger's die moves beside its name, the big figures shrink. */
  @container dv2 (max-width: 799.98px) {
    .dv3-held { padding: 12px; gap: 8px; }
    .dv3-lh { grid-template-columns: auto minmax(0, 1fr); justify-items: start; align-items: center; text-align: left; gap: 12px; }
    .dv3-lh svg { width: 52px; height: 57px; }
    .dv3-dl > div { padding: 6px 0; }
    .dv3-k { font-size: 18px; }
    .dv3-eq b { font-size: 32px; } .dv3-eq svg { width: 44px; height: 48px; }
    .dv3-sb > div { padding: 10px 0; } .dv3-sb b { font-size: 36px; }
    .dv3-tier { font-size: 20px; }
  }
  /* ---- A key moment picked: an off-white diamond in the held box's top right. ---- */
  .dv3-held { position: relative; }
  .dv3-mk { position: absolute; top: 16px; right: 16px; width: 10px; height: 10px; background: var(--off-white); transform: rotate(45deg); }
  @container dv2 (max-width: 799.98px) { .dv3-mk { top: 12px; right: 12px; } }
</style>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = ['docs/specs/1236-session-pages/playground/pg-dv-seed.jsx', 'docs/specs/1236-session-pages/playground/pg-dv3.jsx'];
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
