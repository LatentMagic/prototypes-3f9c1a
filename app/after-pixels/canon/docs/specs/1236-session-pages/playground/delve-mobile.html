<!doctype html>
<!-- Playground (1236): 1H on a phone. The desktop as the owner left it (a screenshot), then the live page in four phone frames:
     today's band and three folds. Each frame is delve-v6.html pinned by its address (?fold=…&bare=1). -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Delve's character sheet on a phone (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/fonts.css" />
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/colors.css" />
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/typography.css" />
<link rel="stylesheet" href="_ds/mcp-game-store-design-system-ef1abd5b-7567-4e3c-8294-c78583fbe929/tokens/base.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--text); font: 400 16px/1.5 var(--font-text); }
  a { color: var(--off-white); } a:hover { color: #fff; }
  .pg { padding: 36px 24px 72px; display: grid; gap: 32px; }
  h1 { margin: 0; font: 700 34px/1.1 var(--font-heading); letter-spacing: -.01em; }
  .sub { margin: 8px 0 0; color: var(--muted); max-width: 72ch; }
  .lab { font: 600 13px/1.3 var(--font-text); color: var(--muted); margin: 0 0 8px; }
  .ref img { display: block; width: 100%; max-width: 1186px; height: auto; border: 1px solid var(--line); }
  .phones { display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start; }
  .ph { display: grid; gap: 10px; width: 390px; }
  .ph b { font: 700 20px/1.2 var(--font-heading); }
  .ph p { margin: 0; font: 400 14px/1.45 var(--font-text); color: var(--muted); min-height: 62px; }
  .ph iframe { display: block; width: 390px; height: 780px; border: 1px solid var(--control-edge); background: var(--page); }
</style>
</head>
<body>
<main class="pg">
  <header><h1>The character sheet on a phone</h1>
    <p class="sub">1H at 390px, the live page in each frame. Every fold keeps the cells, their figures and their sizes; only how the groups are arranged changes. Each frame scrolls to the sheet; scroll on to see the session card under it.</p></header>
  <section class="ref"><p class="lab">Desktop, as agreed (screenshot, 29 Oct)</p><img src="docs/specs/1236-session-pages/playground/ref-1h-desktop.png" alt="1H on desktop: one row of hero, hit points, threat, stats, pack, abilities and inspiration." /></section>
  <section class="phones" id="phones"></section>
</main>
<script>
const F = [
  ['none', 'Today', 'The desktop band, unchanged. It squeezes into one line.'],
  ['m1', 'M1 · Rows', 'The band breaks into four rows: hero, hit points, threat; the six stats; the pack; abilities and inspiration. It opens folded to the top row; tap the row (or its chevron) for the rest.'],
  ['m2', 'M2 · Scroll', 'No rearranging at all. The band stays the desktop row and the whole of it scrolls sideways.'],
  ['m3', 'M3 · Switch', 'M1\'s top row, then one group at a time: Stats, Pack, or Abilities with inspiration, picked by a switch. It opens folded to the top row, as M1 does.'],
];
const D = 'docs/specs/1236-session-pages/playground/delve-v6.html';
document.getElementById('phones').innerHTML = F.map(([k, b, t]) => `<div class="ph"><b>${b}</b><p>${t}</p><iframe title="${b}" src="${D}?concept=1h&fold=${k}&bare=1"></iframe></div>`).join('');
// KEEP: each frame scrolls itself to the sheet once the app has put it there.
document.querySelectorAll('.ph iframe').forEach((f) => f.addEventListener('load', () => { let n = 0; const t = setInterval(() => { n += 1;
  try { const s = f.contentDocument.querySelector('.dv7'); if (s) { f.contentWindow.scrollTo(0, s.getBoundingClientRect().top + f.contentWindow.scrollY - 12); if (n > 12) clearInterval(t); } } catch (e) { clearInterval(t); }
  if (n > 60) clearInterval(t); }, 400); }));
</script>
</body>
</html>
