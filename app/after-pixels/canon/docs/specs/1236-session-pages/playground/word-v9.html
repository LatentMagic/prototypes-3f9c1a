<!doctype html>
<!-- Playground (1236): Daily Word's session card, v9. The main build, loaded live from index.html (its styles and scripts, in
     its order), with pg-wd9.jsx before app/main.jsx: three Config rows that switch the styles below. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily Word’s session card, v9 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, v9). Each Config row sets a v9-<row>-<pick> class on <html>. ---- */
  /* The bar: fixed at the top, 56px; the app's sticky top bar sits under it. The top bar's Discover / Library / History go. */
  body { padding-top: 56px; }
  .gs-root > .gs-top { top: 56px; }
  .gs-nav { display: none !important; }
  /* KEEP: the phone frame fits under the bar. */
  .kit-stage { min-height: calc(100vh - 56px); box-sizing: border-box; }
  .kit-phone { height: min(872px, calc(100vh - 56px - 48px)); }
  .pg9-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 400; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 16px; overflow-x: auto; background: #0E0D0C; border-bottom: 1px dashed #FF2EC4; font-family: var(--font-text); color: var(--text); }
  .pg9-eyebrow { flex: none; font: 600 11px/1 var(--font-text); letter-spacing: .06em; color: #FF2EC4; }
  .pg9-grp { flex: none; display: flex; align-items: center; gap: 4px; }
  .pg9-lab { font: 600 12px/1 var(--font-text); color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .pg9-chip { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 14px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
  .pg9-chip[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
  /* The hint tile in the grey of a letter not in the word (owner, 2026-10-28). */
  .wd-t.is-hint { border-color: #918B80; color: #ABA79E; }
  /* A touch more room between the hint tile's edge and its letter and "Hint": 2px more padding each side. On a phone, where they
     stack, the row keeps the main build's height and the letter sits 1px over "Hint", so it stays a rectangle. */
  .wd-t.is-hint { padding: 0 calc(clamp(4px, calc(var(--t) * .09), 10px) + 2px); }
  @container gs (max-width: 639px) { .wd-t.is-hint { padding: 0; gap: 1px; } }
  /* Phone: chip above, a faint rule under it. The card keeps its 16px padding and the app's tile size; --x is only chip to rule
     and rule to board. */
  .v9-phone-P16 { --v9x: 16px; } .v9-phone-P20 { --v9x: 20px; } .v9-phone-P24 { --v9x: 24px; } .v9-phone-P32 { --v9x: 32px; }
  html.v9-mode-one { --v9x: 24px; } html.v9-mode-one20 { --v9x: 20px; }
  @container gs (max-width: 639px) {
    .wd-card { gap: var(--v9x); }
    .wd-res { margin: 0; padding-bottom: var(--v9x); border-bottom: 1px solid var(--line); }
  }
  /* Desktop: a faint upright rule the board's height, the same space either side; the chip stays centred on it. */
  @container gs (min-width: 900px) {
    :is(.v9-side-S2, .v9-side-S3, .v9-side-S5, .v9-side-S6, .v9-mode-one, .v9-mode-one20) .wd-res { align-self: stretch; border-left: 1px solid var(--line); }
    html.v9-mode-one .wd-card { column-gap: 24px; } html.v9-mode-one .wd-res { padding-left: 24px; }
    html.v9-mode-one20 .wd-card { column-gap: 20px; } html.v9-mode-one20 .wd-res { padding-left: 20px; }
    .v9-side-S2 .wd-card { column-gap: 20px; } .v9-side-S2 .wd-res { padding-left: 20px; }
    .v9-side-S3 .wd-card { column-gap: 24px; } .v9-side-S3 .wd-res { padding-left: 24px; }
    .v9-side-S5 .wd-card { column-gap: 32px; } .v9-side-S5 .wd-res { padding-left: 32px; }
    .v9-side-S6 .wd-card { column-gap: 40px; } .v9-side-S6 .wd-res { padding-left: 40px; }
  }
  /* The hint row's marks: none (D5), or dots stopping a quarter of a tile short of the board's edges (N2). */
  .v9-dots-D5 .wd-dots { border-bottom-color: transparent; }
  .v9-dots-N2 .wd-dots.is-l { margin-left: calc(var(--t) * .25); width: calc(var(--p) * (var(--t) + var(--g)) - var(--g) - var(--t) * .25); }
  .v9-dots-N2 .wd-dots:not(.is-l) { margin-right: calc(var(--t) * .25); }
</style>
<script>window.KIT_STATE_KEY = "kit_1236_word-session_playground-v9";</script>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = 'docs/specs/1236-session-pages/playground/pg-wd9.jsx';
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') await babel(PG); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
