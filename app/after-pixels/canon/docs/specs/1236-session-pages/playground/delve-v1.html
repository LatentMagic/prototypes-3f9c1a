<!doctype html>
<!-- Playground (1236): Delve's session page, v1, four concepts. The main build, loaded live from index.html (its styles and
     scripts, in its order), with pg-dv1.jsx before app/main.jsx. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Delve’s session page, v1 (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, Delve v1). ---- */
  body { padding-top: 56px; }
  .gs-root > .gs-top { top: 56px; }
  /* KEEP: inside the phone frame the screen scrolls on its own, so the top bar sticks to its top, not under the playground bar. */
  .kit-phone-clip .gs-root > .gs-top { top: 0; }
  .gs-nav { display: none !important; }
  /* KEEP: the phone frame fits under the bar. */
  .kit-stage { min-height: calc(100vh - 56px); box-sizing: border-box; }
  .kit-phone { height: min(872px, calc(100vh - 56px - 48px)); }
  /* KEEP: the bar fits one row at about 1185px; narrower it scrolls sideways. */
  .dv1b { position: fixed; top: 0; left: 0; right: 0; z-index: 400; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 14px; padding: 0 12px; overflow-x: auto; background: #0E0D0C; border-bottom: 1px dashed #FF2EC4; font-family: var(--font-text); color: var(--text); }
  .dv1b-grp { flex: none; display: flex; align-items: center; gap: 4px; }
  .dv1b-lab { font: 600 12px/1 var(--font-text); color: var(--muted); margin-right: 2px; white-space: nowrap; }
  .dv1b-chip { flex: none; min-height: 40px; display: inline-flex; align-items: center; padding: 0 9px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 13px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
  .dv1b-chip[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
  .dv1b-why { position: fixed; top: 64px; right: 12px; z-index: 400; width: min(380px, calc(100vw - 24px)); box-sizing: border-box; padding: 16px; background: #0E0D0C; border: 1px dashed #FF2EC4; color: var(--text); font: 400 14px/1.45 var(--font-text); display: grid; gap: 8px; }
  .dv1b-why p { margin: 0; color: var(--muted); } .dv1b-why b { color: var(--text); }

  /* ---- Shared by every concept: the card, the result statement, the figures, the die, the moment, the detail line. ---- */
  .dv1 { container: dv1 / inline-size; display: grid; gap: 24px; min-width: 0; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); padding: 16px; }
  @container gs (min-width: 720px) { .dv1 { padding: 24px; } }
  .dv1-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 16px 32px; }
  .dv1-res { display: grid; gap: 6px; min-width: 0; flex: 1 1 280px; }
  .dv1-h { margin: 0; font: 700 34px/1.1 var(--font-heading); letter-spacing: -.01em; text-wrap: balance; }
  /* KEEP: a long ending ("Too late: the ritual was completed") steps down a size on a phone and wraps balanced, never clipped. */
  @container dv1 (max-width: 479.98px) { .dv1-h { font-size: 28px; } }
  .dv1-h.is-ok { color: var(--success); } .dv1-h.is-bad { color: var(--warning); } .dv1-h.is-live { color: var(--text); }
  .dv1-sub { margin: 0; font: 600 16px/1.35 var(--font-text); color: var(--muted); }
  .dv1-figs { display: grid; grid-template-columns: repeat(3, auto); gap: 8px 28px; }
  /* KEEP: on a phone the three figures share the card's width in equal columns. */
  @container dv1 (max-width: 559.98px) { .dv1-figs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 12px; flex: 1 1 100%; } }
  .dv1-fig { display: grid; gap: 6px; align-content: start; min-width: 0; }
  .dv1-fig > span { font: 600 13px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  .dv1-fig > b { font: 700 22px/1 var(--font-heading); color: var(--text); font-variant-numeric: tabular-nums; }
  .dv1-fig > b small { font: 600 14px/1 var(--font-text); color: var(--muted); }
  .dv1-pips { display: grid; grid-auto-flow: column; grid-auto-columns: 10px; gap: 3px; justify-content: start; }
  .dv1-pips > i { display: block; height: 10px; box-shadow: inset 0 0 0 1.5px var(--control-edge); }
  .dv1-pips > i.is-on { background: var(--off-white); box-shadow: none; }
  /* KEEP: a long track (threat, hit points) is solid segments, the empty ones a quiet fill: outlines this thin read as a barcode. */
  .dv1-pips.is-thin { grid-auto-columns: 6px; gap: 2px; } .dv1-pips.is-thin > i { height: 14px; box-shadow: none; background: color-mix(in srgb, var(--text) 16%, var(--card)); } .dv1-pips.is-thin > i.is-on { background: var(--off-white); }

  .dv1-dbtn { background: none; border: 0; padding: 0; margin: 0; cursor: pointer; display: grid; place-items: center; color: inherit; }
  .dv1-dbtn:focus-visible, .dv1-mom:focus-visible, .dvB-flag:focus-visible, .dvD-step:focus-visible { outline: 2px solid var(--focus-ring, var(--off-white)); outline-offset: 2px; }
  .dv1-die { display: block; overflow: visible; flex: none; }
  .dv1-die .hx { fill: color-mix(in srgb, var(--text) 13%, var(--card)); }
  .dv1-die.is-strong .hx { fill: var(--success); }
  .dv1-die.is-weak .hx { fill: color-mix(in srgb, var(--warning) 14%, var(--card)); stroke: var(--warning); stroke-width: 2; vector-effect: non-scaling-stroke; }
  .dv1-die .nm { font: 700 15px var(--font-heading); fill: var(--muted); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
  .dv1-die.is-strong .nm { fill: var(--success-on); } .dv1-die.is-weak .nm { fill: var(--warning); }
  /* Mark: the target line, and a total drawn outside its bar keeps the tier's colour on the card. */
  .dv1-die .tl { stroke: var(--muted); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .dv1-die .nm.out { stroke: none; }
  .dv1-die.is-strong .nm.out { fill: var(--success); }
  .dv1-die.st-mark .sl { transform: none; }
  .dv1-die .rim { fill: none; stroke: var(--success); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  .dv1-die .gh { fill: var(--card); stroke: var(--muted); stroke-width: 1; vector-effect: non-scaling-stroke; }
  .dv1-die .ck { fill: none; stroke: var(--text); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  /* KEEP: the picked die gets an off-white ring outside its own rim, so a natural 20's rim still shows. */
  .dv1-die .sl { fill: none; stroke: var(--off-white); stroke-width: 2.5; vector-effect: non-scaling-stroke; display: none; transform: scale(1.1); transform-origin: 18px 20px; }
  .dv1-die.is-sel .sl { display: inline; }

  .dv1-mom { appearance: none; text-align: left; display: flex; gap: 12px; align-items: center; padding: 12px; background: none; border: 1px solid var(--line); color: var(--text); cursor: pointer; min-width: 0; font: inherit; position: relative; }
  .dv1-mom[aria-pressed="true"] { border-color: var(--off-white); box-shadow: inset 0 0 0 1px var(--off-white); }
  .dv1-mom-t { display: grid; gap: 2px; min-width: 0; }
  .dv1-mom-k { font: 600 12px/1.3 var(--font-text); color: var(--muted); }
  .dv1-mom-h { font: 700 16px/1.25 var(--font-heading); color: var(--text); }
  .dv1-mom-f { font: 400 13px/1.35 var(--font-text); color: var(--muted); text-wrap: pretty; }
  .dv1-let { position: absolute; top: 0; right: 0; width: 24px; height: 24px; display: grid; place-items: center; background: var(--off-white); color: var(--page); font: 700 13px/1 var(--font-heading); }
  .dv1-detail { margin: 0; font: 400 14px/1.45 var(--font-text); color: var(--muted); min-height: 2.9em; text-wrap: pretty; }
  .dv1-detail b { color: var(--text); font-weight: 600; }
  .dvA-num { position: relative; z-index: 1; flex: none; width: 28px; height: 28px; display: grid; place-items: center; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--control-edge); font: 700 14px/1 var(--font-heading); color: var(--text); }

  /* ---- A · Route ---- */
  .dvA { display: grid; gap: 20px; min-width: 0; }
  .dvA-moms { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
  /* KEEP: on a phone the moment tiles go two by two and drop their facts, so tiles, route and the line under it share one screen. */
  @container dv1 (max-width: 719.98px) { .dvA-moms { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .dv1-mom.is-a { padding: 8px; gap: 8px; } .dv1-mom.is-a .dv1-mom-f { display: none; } .dv1-mom.is-a .dv1-mom-h { font-size: 14px; } .dv1-mom.is-a svg { width: 32px; height: 35px; } }
  .dvA-route { display: flex; min-width: 0; }
  .dvA-stop { flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: auto 1fr; justify-items: center; gap: 10px; padding-bottom: 8px; }
  .dvA-head { position: relative; width: 100%; display: grid; justify-items: center; gap: 4px; }
  .dvA-head::before { content: ''; position: absolute; top: 13px; left: 0; right: 0; height: 2px; background: var(--control-edge); }
  .dvA-stop:first-child .dvA-head::before { left: 50%; } .dvA-stop:last-child .dvA-head::before { right: 50%; }
  .dvA-stop.is-on .dvA-num { background: var(--off-white); color: var(--page); box-shadow: none; }
  .dvA-stop.is-on { background: color-mix(in srgb, var(--text) 5%, var(--card)); }
  .dvA-name { font: 600 12px/1.3 var(--font-text); color: var(--muted); text-align: center; text-wrap: balance; padding: 0 4px; }
  .dvA-back { font: 600 11px/1.2 var(--font-text); color: var(--muted); }
  .dvA-dice { display: grid; gap: 4px; align-content: start; justify-items: center; }
  .dvA-pass { display: block; width: 6px; height: 6px; background: var(--control-edge); margin-top: 8px; }
  /* KEEP: on a phone the route shows room numbers only (the line under it names the room), and the dice shrink to fit eight rooms across. */
  @container dv1 (max-width: 719.98px) { .dvA-name { display: none; } .dvA-dice svg { width: 30px; height: 33px; } }

  /* ---- B · Descent ---- */
  .dvB { display: grid; gap: 24px; min-width: 0; }
  @container dv1 (min-width: 720px) { .dvB { grid-template-columns: minmax(0, 1fr) 280px; align-items: start; } }
  .dvB-stair { display: grid; gap: 6px; --step: 28px; min-width: 0; }
  @container dv1 (max-width: 479.98px) { .dvB-stair { --step: 12px; } }
  .dvB-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px 12px; align-items: center; margin-left: calc(var(--d) * var(--step)); padding: 8px; border-top: 2px solid var(--control-edge); min-width: 0; }
  .dvB-row.is-on { background: color-mix(in srgb, var(--text) 5%, var(--card)); border-top-color: var(--off-white); }
  .dvB-num { width: 28px; height: 28px; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--control-edge); font: 700 14px/1 var(--font-heading); }
  .dvB-row.is-on .dvB-num { background: var(--off-white); color: var(--page); box-shadow: none; }
  .dvB-name { font: 600 15px/1.3 var(--font-text); color: var(--text); display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; min-width: 0; }
  .dvB-name small { font: 400 13px/1.3 var(--font-text); color: var(--muted); }
  .dvB-dice, .dvB-flags, .dvB-inline { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; min-width: 0; }
  .dvB-flags { gap: 6px; }
  .dvB-flag { appearance: none; min-height: 32px; padding: 0 10px; background: none; border: 1px solid var(--control-edge); color: var(--text); font: 600 12px/1.2 var(--font-text); cursor: pointer; text-align: left; }
  .dvB-flag[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
  .dvB-side { display: none; }
  /* KEEP: on a laptop the picked moment is drawn large beside the stair and stays in view; on a phone it opens under its own step instead. */
  @container dv1 (min-width: 720px) { .dvB-inline { display: none; } .dvB-side { display: grid; gap: 16px; position: sticky; top: 80px; } }
  .dvB-big { display: grid; gap: 6px; justify-items: start; padding: 16px; border: 1px solid var(--line); min-height: 220px; align-content: start; }
  .dvB-bigh { font: 700 24px/1.15 var(--font-heading); color: var(--text); }
  .dvB-list { display: grid; gap: 6px; }
  .dv1-mom.is-b { padding: 6px 8px; } .dv1-mom.is-b .dv1-mom-h { font-size: 14px; }

  /* ---- C · Four rolls ---- */
  .dvC { display: grid; gap: 20px; min-width: 0; }
  .dvC-moms { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
  .dv1-mom.is-c { flex-direction: column; align-items: flex-start; padding: 16px; gap: 12px; }
  .dv1-mom.is-c .dv1-mom-h { font-size: 20px; }
  /* KEEP: on a phone the four go two by two with smaller dice and no facts, so they and the strip share one screen; the line under the strip carries the facts. */
  @container dv1 (max-width: 719.98px) { .dvC-moms { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .dv1-mom.is-c { padding: 10px; gap: 8px; } .dv1-mom.is-c svg { width: 48px; height: 52px; } .dv1-mom.is-c .dv1-mom-f { display: none; } .dv1-mom.is-c .dv1-mom-h { font-size: 15px; } }
  .dvC-strip { display: flex; flex-wrap: wrap; gap: 12px 0; align-items: flex-end; }
  .dvC-seg { display: grid; gap: 6px; padding: 0 10px; border-left: 1px solid var(--line); min-width: 0; }
  .dvC-seg:first-child { border-left: 0; padding-left: 0; }
  .dvC-segh { display: flex; gap: 6px; align-items: baseline; font: 600 12px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  .dvC-segh b { color: var(--text); font: 700 13px/1 var(--font-heading); }
  .dvC-seg.is-on .dvC-segh, .dvC-seg.is-on .dvC-segh b { color: var(--off-white); }
  .dvC-seg.is-on { border-left-color: var(--off-white); }
  .dvC-segd { display: flex; gap: 3px; align-items: flex-end; }
  .dvC-cell { display: grid; justify-items: center; gap: 4px; }
  .dvC-mk { width: 18px; height: 18px; display: grid; place-items: center; font: 700 11px/1 var(--font-heading); }
  .dvC-mk.is-on { background: var(--off-white); color: var(--page); }
  @container dv1 (max-width: 479.98px) { .dvC-segh span { display: none; } }

  /* ---- D · Rooms ---- */
  .dvD { display: grid; gap: 16px; min-width: 0; }
  .dvD-map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  @container dv1 (max-width: 719.98px) { .dvD-map { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } }
  .dvD-room { border: 1px solid var(--line); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
  .dvD-room.is-on { border-color: var(--off-white); }
  .dvD-rh { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .dvD-room.is-on .dvD-rh .dvA-num { background: var(--off-white); color: var(--page); box-shadow: none; }
  .dvD-name { font: 600 14px/1.3 var(--font-text); color: var(--text); min-width: 0; }
  .dvD-visit { display: grid; gap: 6px; justify-items: start; padding-left: 8px; border-left: 2px solid var(--line); }
  .dvD-visit.is-on { border-left-color: var(--off-white); }
  .dvD-vl { font: 600 12px/1.3 var(--font-text); color: var(--muted); }
  .dvD-dice { display: flex; flex-wrap: wrap; gap: 3px; }
  @container dv1 (max-width: 479.98px) { .dvD-dice svg { width: 26px; height: 28px; } .dvD-room { padding: 8px; } }
  .dvD-route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .dvD-step { appearance: none; width: 36px; height: 36px; display: grid; place-items: center; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 700 14px/1 var(--font-heading); cursor: pointer; }
  .dvD-step[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }
  .dvD-arr { color: var(--muted); font: 600 14px/1 var(--font-text); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = ['docs/specs/1236-session-pages/playground/pg-dv-seed.jsx', 'docs/specs/1236-session-pages/playground/pg-dv1.jsx'];
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') for (const p of PG) await babel(p); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
