<!doctype html>
<!-- Playground (1236): Daily Word's session card, v8 canvas. Loads the main build's styles and scripts from index.html, in its
     order, but renders pg-wd8.jsx in place of app/main.jsx. Nothing in app/ is copied or changed. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Word’s session card, v8 canvas (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, v8). ---- */
  body { margin: 0; background: #0E0D0C; }
  .c8 { padding: 32px; color: var(--text); font-family: var(--font-text); min-width: max-content; }
  .c8-head > h1 { margin: 8px 0; font: 700 32px/1.15 var(--font-heading); }
  .c8-eyebrow { margin: 0; font: 600 11px/1 var(--font-text); letter-spacing: .06em; color: #FF2EC4; }
  .c8-note { margin: 0; color: var(--muted); }
  .c8-sec { margin-top: 48px; }
  .c8-sec > h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; font: 700 20px/1.2 var(--font-heading); }
  .c8-id { display: inline-grid; place-items: center; min-width: 32px; height: 32px; border: 1.5px dashed #FF2EC4; color: #FF2EC4; font-size: 16px; }
  .c8-row { display: flex; gap: 32px; align-items: flex-start; }
  .c8-fig { margin: 0; display: grid; gap: 8px; }
  .c8-cap { display: grid; gap: 4px; font: 600 13px/1.3 var(--font-text); } .c8-cap span { color: var(--muted); font-weight: 400; min-height: 17px; }
  .c8-frame { container: gs / inline-size; background: var(--page); outline: 1px dashed #4A453F; }
  .c8-page { padding: 24px 16px; display: grid; gap: 24px; }
  .c8-gap { margin-top: 24px; }
  /* Phone, even: --x is the card's padding (every side), chip to rule and rule to board. The tile size is recomputed for the
     wider padding so the board still fits the column (the app's formula, with 2 * --x + 2 for the card's padding and edge). */
  .c8-ev .wd-card { padding: var(--x); gap: var(--x); --t: min(64px, calc((100cqi - 32px - (2 * var(--x) + 2px) - 2 * 28px - 4 * var(--g)) / 5)); }
  .c8-ev .wd-res { margin: 0; padding-bottom: var(--x); border-bottom: 1px solid var(--line); }
  .c8-x16 { --x: 16px; } .c8-x20 { --x: 20px; } .c8-x24 { --x: 24px; } .c8-x32 { --x: 32px; }
  /* Desktop: an upright faint rule the board's height between board and chip; the chip stays centred on it. */
  .c8-vr .wd-res { align-self: stretch; border-left: 1px solid var(--line); }
  .c8-vr-24 .wd-card { column-gap: 24px; } .c8-vr-24 .wd-res { padding-left: 24px; }
  .c8-vr-32 .wd-card { column-gap: 32px; } .c8-vr-32 .wd-res { padding-left: 32px; }
  .c8-vr-40 .wd-card { column-gap: 40px; } .c8-vr-40 .wd-res { padding-left: 40px; }
  /* In progress: none, or one, of the empty rows left. */
  .c8-none .wd-nrow:has(> .wd-row[aria-hidden="true"]) { display: none; }
  .c8-one .wd-nrow:has(> .wd-row[aria-hidden="true"]) ~ .wd-nrow:has(> .wd-row[aria-hidden="true"]) { display: none; }
  /* The hint row's marks: fainter dots, a faint solid line, dashes, or none. */
  .c8-d-faint .wd-dots { border-bottom-color: var(--line); }
  .c8-d-solid .wd-dots { border-bottom: 1px solid var(--line); }
  .c8-d-dash .wd-dots { border-bottom: 1.5px dashed #4A453F; }
  .c8-d-none .wd-dots { border-bottom-color: transparent; }
  /* The hint tile in the grey of a letter not in the word (owner, 2026-10-28), on every frame. */
  .c8-frame .wd-t.is-hint { border-color: #918B80; color: #ABA79E; }
  /* The hint row's dots, not the full width. N2: inset a quarter of a tile at both ends. N3: one tile's run beside the hint only. */
  .c8-n-inset .wd-dots.is-l { margin-left: calc(var(--t) * .25); width: calc(var(--p) * (var(--t) + var(--g)) - var(--g) - var(--t) * .25); }
  .c8-n-inset .wd-dots:not(.is-l) { margin-right: calc(var(--t) * .25); }
  .c8-n-short .wd-dots:not(.is-l) { flex: 0 0 var(--t); }
  .c8-n-short .wd-dots.is-l { position: relative; align-self: stretch; border-bottom-color: transparent; }
  .c8-n-short .wd-dots.is-l::after { content: ''; position: absolute; right: 0; top: 50%; width: var(--t); border-bottom: 2px dotted #4A453F; }
  /* Staging only: moves the hard play's hint to letter 3 so the left-hand dots show. */
  .c8-mid .wd-hrow { --p: 2 !important; }
  .c8-mid .wd-hrow:not(:has(.is-l))::before { content: ''; flex: none; width: calc(var(--p) * (var(--t) + var(--g)) - var(--g)); border-bottom: 2px dotted #4A453F; }
  .c8-mid.c8-n-inset .wd-hrow:not(:has(.is-l))::before { margin-left: calc(var(--t) * .25); width: calc(var(--p) * (var(--t) + var(--g)) - var(--g) - var(--t) * .25); }
  .c8-mid.c8-n-short .wd-hrow:not(:has(.is-l))::before { margin-left: calc(var(--p) * (var(--t) + var(--g)) - var(--g) - var(--t)); width: var(--t); }
</style>
<script>window.KIT_STATE_KEY = "kit_1236_word-session_playground-v8";</script>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = 'docs/specs/1236-session-pages/playground/pg-wd8.jsx';
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') { await babel(PG); break; } await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
