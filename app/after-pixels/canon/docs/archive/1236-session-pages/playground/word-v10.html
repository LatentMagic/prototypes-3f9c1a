<!doctype html>
<!-- Playground (1236): Daily Word's now card, v10, three concepts. The main build, loaded live from index.html (its styles and
     scripts, in its order), with pg-wd10.jsx before app/main.jsx. Nothing in app/ changes. -->
<html lang="en">
<head>
<base href="../../../../" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily Word’s now card, v10, concept C (playground)</title>
<link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
<style>
  /* ---- Playground only (1236, v10). ---- */
  body { padding-top: 56px; }
  .gs-root > .gs-top { top: 56px; }
  .gs-nav { display: none !important; }
  /* KEEP: the phone frame fits under the bar. */
  .kit-stage { min-height: calc(100vh - 56px); box-sizing: border-box; }
  .kit-phone { height: min(872px, calc(100vh - 56px - 48px)); }
  .pg10-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 400; height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 16px; padding: 0 16px; overflow-x: auto; background: #0E0D0C; border-bottom: 1px dashed #FF2EC4; font-family: var(--font-text); color: var(--text); }
  .pg10-eyebrow { flex: none; font: 600 11px/1 var(--font-text); letter-spacing: .06em; color: #FF2EC4; }
  .pg10-grp { flex: none; display: flex; align-items: center; gap: 4px; }
  .pg10-lab { font: 600 12px/1 var(--font-text); color: var(--muted); margin-right: 4px; white-space: nowrap; }
  .pg10-chip { flex: none; min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; background: none; border: 1.5px solid var(--control-edge); color: var(--text); font: 600 14px/1 var(--font-text); cursor: pointer; white-space: nowrap; }
  .pg10-chip[aria-pressed="true"] { background: var(--off-white); border-color: var(--off-white); color: var(--page); }

  /* One concept and one result treatment show, as the bar picks. */
    html:not(.v10-res-tag) .wd10-r.is-tag, html:not(.v10-res-text) .wd10-r.is-text { display: none; }
  /* The Tag at card size: one 40px tile high, its type and icon scaled from it (the session page's rule). */
  .wd10 .wd10-r.is-tag { --t: 40px; }
  .wd10 .wd10-r.is-tag .wd-tag svg { width: 18px; height: 18px; }
  /* KEEP: the card is its own container, so C2 lays out by the card's width, not the window's. */
  .wd10 { container: wd10 / inline-size; }
  .wd10-in { display: grid; gap: 16px; min-width: 0; }
  .wd10-in > .lb-top:has(> .wd10-r) { flex-wrap: nowrap; }
  .wd10-in > .lb-top:has(> .wd10-r) > .gs-stack-xs { flex: 1 1 0; }
  .wd10-in > .lb-top > .wd10-r { flex: 0 1 auto; max-width: 50%; text-align: right; }
  /* C · The word: canon's frame at every width (head, picture, foot). The last guess at the session page's tile size, the earlier
     ones a trail of 10px blocks at its left, centred on the tiles; the sentence under both. */
  .wd10-pic.is-C { display: grid; gap: 12px; justify-items: start; }
  .wd10-line { display: flex; align-items: center; gap: 16px; }
  .wd10-trail { display: grid; gap: 3px; }
  .wd10-tr > i { display: block; aspect-ratio: 1; box-sizing: border-box; }
  .wd10-tr > i.is-hit { background: #4CC38A; }
  .wd10-tr > i.is-near { background: #E5A63B; }
  .wd10-tr > i.is-miss { border: 2px solid #918B80; }
  /* KEEP: the trail's misses at a 1px outline, so the small blocks read lighter than the big tiles. */
  .wd10-tr > i.is-miss { border-width: 1px; }
  .wd10-tr { display: grid; grid-template-columns: repeat(5, 10px); gap: 2px; }
  .wd10-tr.is-h > i.is-hint { border: 1px dashed #918B80; }
  .wd10-big { --t: 56px; --g: 6px; }
  @container wd10 (max-width: 479.98px) { .wd10-big { --t: 44px; } }
  .wd10-row { display: grid; grid-template-columns: repeat(5, var(--t)); gap: var(--g); }
  .wd10-said { margin: 0; font: 400 14px/1.4 var(--font-text); color: var(--muted); }
  /* C1 · Centred: canon's frame; the picture centred across the card, the sentence centred under it. */
  .wd10-pic.is-C { justify-self: center; justify-items: center; text-align: center; }
  /* C2 · Beside the head: on a card 600px wide or more (a laptop's two-column page is about 700), the label and title, the picture and the result share the top row (the
     result stays top right); the foot below. Narrower, canon's stack, as C1. */
  @container wd10 (min-width: 600px) {
    .v10-concept-C2 .wd10-in { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "head pic res" "foot foot foot" "next next next"; column-gap: 24px; row-gap: 24px; }
    .v10-concept-C2 .wd10-in > .lb-top { display: contents; }
    .v10-concept-C2 .wd10-in > .lb-top > .gs-stack-xs { grid-area: head; align-self: start; }
    .v10-concept-C2 .wd10-in > .lb-top > .wd10-r { grid-area: res; align-self: start; max-width: none; }
    .v10-concept-C2 .wd10-in > .wd10-pic { grid-area: pic; align-self: start; }
    .v10-concept-C2 .wd10-in > .lb-foot { grid-area: foot; }
    .v10-concept-C2 .wd10-in > .gs-pu-nextlink { grid-area: next; }
    .v10-concept-C2 .wd10-big { --t: 48px; }
  }
</style>
<script>window.KIT_STATE_KEY = "kit_1236_word-now_playground-v10";</script>
</head>
<body>
<div id="root"></div>
<script>
(async () => {
  const PG = 'docs/specs/1236-session-pages/playground/pg-wd10.jsx';
  const doc = new DOMParser().parseFromString(await (await fetch('index.html', { cache: 'no-store' })).text(), 'text/html');
  const mine = document.head.querySelector('style');
  doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach((n) => document.head.insertBefore(n.cloneNode(true), mine));
  const plain = (s) => new Promise((ok, no) => { const e = document.createElement('script');
    if (s.src) { e.src = s.getAttribute('src'); if (s.integrity) e.integrity = s.integrity; if (s.crossOrigin) e.crossOrigin = s.crossOrigin; e.onload = ok; e.onerror = no; document.body.appendChild(e); }
    else { e.textContent = s.textContent; document.body.appendChild(e); ok(); } });
  const babel = async (src) => { const code = await (await fetch(src, { cache: 'no-store' })).text();
    const e = document.createElement('script'); e.textContent = Babel.transform(code, { presets: ['react'], filename: src }).code + '\n//# sourceURL=' + src; document.body.appendChild(e); };
  for (const s of doc.body.querySelectorAll('script')) {
    const src = s.getAttribute('src');
    if (s.type === 'text/babel') { if (src === 'app/main.jsx') await babel(PG); await babel(src); }
    else await plain(s);
  }
})();
</script>
</body>
</html>
