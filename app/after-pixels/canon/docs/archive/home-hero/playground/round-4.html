<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--color-canvas); color: var(--color-fg-1); font-family: var(--font-sans); }
  body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }

  /* ---- focus rings: first-class ---- */
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: var(--ring-width) solid var(--color-accent);
    outline-offset: var(--ring-offset);
  }
  input:focus-visible {
    outline-offset: 0; border-color: var(--color-accent) !important;
  }

  /* ---- placeholder screen (app/main.jsx) — the product's screens replace it ---- */
  .kit-placeholder { max-width: 720px; margin: 0 auto; padding: var(--space-6) var(--space-5) 96px; }
  .kit-placeholder-eyebrow { font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-fg-3); }
  .kit-placeholder-title { font: 600 28px/1.15 var(--font-sans); letter-spacing: -0.02em; margin: 10px 0 0; }
  .kit-placeholder-lede { font: 400 15px/1.6 var(--font-sans); color: var(--color-fg-2); margin: 12px 0 var(--space-5); }
  .kit-placeholder-empty { font: 400 15px/1.6 var(--font-sans); color: var(--color-fg-3); border: 1px dashed var(--color-border-1); border-radius: var(--radius-lg); padding: var(--space-6); text-align: center; }
  .kit-placeholder-items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .kit-placeholder-items[data-mobile] { grid-template-columns: 1fr; }
  .kit-placeholder-items li { font: 500 15px/1.4 var(--font-sans); background: var(--color-surface); border: 1px solid var(--color-border-1); border-left: 3px solid var(--color-accent); border-radius: var(--radius-md); padding: var(--space-4); }
  :root[data-kit-density="compact"] .kit-placeholder-items { gap: 4px; }
  :root[data-kit-density="compact"] .kit-placeholder-items li { padding: var(--space-2) var(--space-3); }

  /* ---- Config pill (prototype aid) ---- */
  .kit-config-wrap { position: fixed; right: 16px; bottom: 60px; z-index: 300; }
  /* One pill, two halves: settings you HOLD (Config) and states you GO to
     (States, app/states-ui.jsx). Icon-only keeps it out of the way; each half
     keeps its own 44px hit target, and the whole pill still drags. */
  .kit-launcher { display: inline-flex; align-items: stretch; background: #FF2EC4; border-radius: var(--radius-pill); box-shadow: var(--shadow-overlay); overflow: hidden; }
  .kit-launcher-half { display: inline-flex; align-items: center; justify-content: center; width: 46px; min-height: 44px; padding: 0; background: transparent; border: 0; color: #000; cursor: inherit; }
  .kit-launcher-half + .kit-launcher-half { box-shadow: inset 1px 0 0 rgba(27,25,23,0.25); }
  .kit-launcher-half:hover { background: rgba(27,25,23,0.1); }
  .kit-launcher-half[data-open] { color: #000; background: rgba(27,25,23,0.18); }
  .kit-launcher-half:focus-visible { outline-offset: -3px; }
  .kit-qa-work + .kit-qa-work { margin-top: 20px; }
  .kit-qa-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .kit-qa-stale { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); }

  /* ---- config modal (prototype aid) ---- */
  .kit-config-scrim {
    position: fixed; inset: 0; z-index: 400;
    background: color-mix(in srgb, var(--color-scrim) 52%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    transition: opacity var(--duration-slow) ease-in-out;
    overscroll-behavior: contain;
  }
  .kit-config-modal {
    width: min(760px, 100%); max-height: min(84vh, 720px);
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--color-surface) 74%, transparent);
    backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid var(--color-border-1);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay);
    transition: opacity var(--duration-base) var(--ease-quiet), transform var(--duration-base) var(--ease-quiet);
  }
  /* Below 640px the aids are panels, so bottom sheets (CLAUDE.md, overlay kinds). */
  @media (max-width: 639px) {
    .kit-config-scrim { align-items: flex-end; padding: 0; }
    .kit-config-modal {
      width: 100%; max-height: 84vh;
      border-width: 1px 0 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: none !important; translate: 0 100%;
      transition: opacity var(--duration-base) var(--ease-quiet), translate var(--duration-slow) var(--ease-quiet);
    }
    .kit-config-modal[data-shown] { translate: 0 0; }
  }
  @media (max-width: 639px) and (prefers-reduced-motion: reduce) { .kit-config-modal { translate: none; transition: none; } }
  .kit-config-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: var(--space-5) var(--space-5) var(--space-4);
    border-bottom: 1px solid var(--color-border-2); flex-shrink: 0;
  }
  .kit-config-title {
    font-family: var(--font-sans); font-weight: 600; font-size: var(--text-xl);
    letter-spacing: -0.01em; color: var(--color-fg-1);
  }
  .kit-config-subtitle {
    font-family: var(--font-sans); font-weight: 400; font-size: var(--text-sm);
    color: var(--color-fg-3); margin-top: 2px;
  }
  .kit-config-close {
    background: transparent; border: 0; padding: 8px; margin: -8px; cursor: pointer;
    color: var(--color-fg-2); border-radius: var(--radius-sm); display: inline-flex; flex-shrink: 0;
  }
  .kit-config-close:hover { background: var(--color-surface-sunken); color: var(--color-fg-1); }
  .kit-config-body { padding: var(--space-5); overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
  .kit-config-eyebrow {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-3);
    margin-bottom: var(--space-3);
  }
  .kit-config-row {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 44px; padding: 6px 0;
  }
  .kit-config-row-label {
    font-family: var(--font-sans); font-weight: 500; font-size: var(--text-sm); color: var(--color-fg-1);
  }
  .kit-config-hint {
    font-family: var(--font-sans); font-weight: 400; font-size: 12.5px; line-height: 1.5;
    color: var(--color-fg-3); margin: -2px 0 var(--space-3); overflow-wrap: anywhere;
  }
  .kit-config-sep { height: 1px; background: var(--color-border-2); margin: var(--space-2) 0 var(--space-5); }
  .kit-config-btn-secondary {
    background: var(--color-surface); color: var(--color-fg-1); border: 1px solid var(--color-border-1);
    font-family: var(--font-sans); font-weight: 500; font-size: 13px; cursor: pointer;
    padding: 8px 14px; border-radius: var(--radius-md); min-height: 36px;
  }
  .kit-config-btn-secondary:hover { background: var(--color-surface-sunken); }
  .kit-config-seg {
    display: inline-flex; padding: 3px; gap: 2px;
    background: var(--color-surface-sunken); border-radius: var(--radius-md); flex-shrink: 0;
  }
  .kit-config-seg-btn {
    background: transparent; border: 0; cursor: pointer; border-radius: var(--radius-sm);
    padding: 7px 12px; min-height: 30px;
    font-family: var(--font-sans); font-weight: 500; font-size: 13px; color: var(--color-fg-2);
    transition: background var(--duration-base), color var(--duration-base);
  }
  .kit-config-seg-btn[data-active] { background: var(--color-accent); color: #fff; }
  .kit-config-seg-btn:not([data-active]):hover { background: var(--color-border-2); }
  .kit-config-group-title {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-3);
    padding: 4px 0 6px;
  }

  /* ---- states palette + index (prototype aid; register in app/states.jsx) ----
     Both are derived views of the register and share their row: the label, the
     address under it, and the copy-a-link control. The palette borrows the config
     modal's shell so the two aids read as siblings. */
  .kit-states-search { width: 100%; background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 10px 12px; min-height: 40px; font: 400 13.5px var(--font-sans); color: var(--color-fg-1); margin-bottom: var(--space-4); }
  .kit-states-groups { display: flex; flex-direction: column; gap: 4px; }
  .kit-states-group { border-bottom: 1px solid var(--color-border-2); }
  .kit-states-group-head { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; background: transparent; border: 0; border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--color-fg-3); }
  .kit-states-group-head:hover { background: var(--color-surface-sunken); }
  .kit-states-group-head .kit-config-group-title { margin: 0; flex: 1; }
  .kit-states-group-count { font: 400 11px var(--font-mono); color: var(--color-fg-3); }
  .kit-states-group-chev { display: inline-flex; transition: transform var(--duration-base) var(--ease-quiet); }
  .kit-states-group-body { columns: 260px 2; column-gap: 28px; padding-bottom: var(--space-3); }
  .kit-states-notes { margin: var(--space-2) 10px var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--color-border-2); }
  .kit-states-notes-title { font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-3); margin-bottom: 6px; }
  .kit-states-notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .kit-states-notes li { font: 400 13px/1.45 var(--font-sans); color: var(--color-fg-2); }
  @media (prefers-reduced-motion: reduce) { .kit-states-group-chev { transition: none; } }
  .kit-states-item { break-inside: avoid; }
  .kit-states-row { display: flex; align-items: center; gap: 4px; }
  .kit-states-jump { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: transparent; border: 0; cursor: pointer; padding: 7px 10px; border-radius: var(--radius-sm); }
  .kit-states-jump:hover { background: var(--color-surface-sunken); }
  .kit-states-label { font: 500 13.5px/1.3 var(--font-sans); color: var(--color-fg-1); }
  .kit-states-id { font: 400 11px/1.3 var(--font-mono); color: var(--color-fg-3); }
  .kit-states-copy { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex-shrink: 0; background: transparent; border: 0; border-radius: var(--radius-sm); color: var(--color-fg-3); cursor: pointer; }
  .kit-states-copy:hover { background: var(--color-surface-sunken); color: var(--color-fg-1); }
  .kit-states-copied { display: flex; align-items: center; gap: 8px; padding: 0 10px 8px; }
  .kit-states-copied > span { font: 500 11px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg-3); flex-shrink: 0; }
  .kit-states-copied > input { flex: 1; min-width: 0; background: var(--color-surface-sunken); border: 1px solid var(--color-border-2); border-radius: var(--radius-sm); padding: 5px 7px; font: 400 11px var(--font-mono); color: var(--color-fg-2); }
  .kit-states-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--color-border-2); margin-top: var(--space-4); padding-top: var(--space-4); }
  .kit-index { min-height: 100vh; background: var(--color-canvas); padding: clamp(32px, 7vh, 72px) 20px 96px; }
  .kit-index-inner { max-width: 860px; margin: 0 auto; }
  .kit-index-eyebrow { font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-fg-3); }
  .kit-index-title { font: 600 clamp(28px, 5vw, 38px)/1.1 var(--font-sans); letter-spacing: -0.02em; color: var(--color-fg-1); margin: 10px 0 0; }
  .kit-index-lede { font: 400 15px/1.6 var(--font-sans); color: var(--color-fg-2); margin: 12px 0 0; max-width: 62ch; text-wrap: pretty; }
  .kit-index-note { font: 400 14px/1.6 var(--font-sans); color: var(--color-fg-2); background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 12px 14px; margin: var(--space-4) 0 0; max-width: 62ch; overflow-wrap: anywhere; }
  .kit-index code { font: 400 0.92em var(--font-mono); color: var(--color-fg-1); background: var(--color-surface-sunken); border-radius: 3px; padding: 1px 5px; }
  .kit-index-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: var(--space-5) 0 var(--space-4); }
  .kit-index-bar > .kit-states-search { flex: 1; min-width: 200px; margin: 0; }

  /* ---- mobile phone frame (forced-mobile posture) ---- */
  .kit-stage {
    min-height: 100vh; width: 100%;
    background: #1c1c1a;
    background-image: radial-gradient(circle at 50% 0%, #2a2a27 0%, #161614 70%);
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .kit-phone {
    width: 402px; max-width: 100%;
    height: min(872px, calc(100vh - 48px));
    background: #050505; border-radius: 52px; padding: 11px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 2px #2c2c2c, inset 0 0 0 2px #000;
    overflow: hidden;
  }
  .kit-phone-clip {
    position: relative; width: 100%; height: 100%;
    border-radius: 42px; overflow: hidden; background: var(--color-canvas);
    transform: translateZ(0); /* containing block for position:fixed overlays — a
       NON-scrolling wrapper with exactly the screen's bounds + corner radius, so
       sheets/scrims pin to the phone screen (and get clipped by its corners)
       instead of bleeding onto the bezel or riding the scrolled page */
  }
  .kit-phone-screen {
    width: 100%; height: 100%;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .kit-phone-screen::-webkit-scrollbar { width: 0; height: 0; }

  /* ==== [Platform] product. Values come from the design system's tokens; layout
     adapts to the width it is handed (container queries on .gs-root). ==== */
  html, body { background: var(--page); color: var(--text); font-family: var(--font-text); }
  .gs-root { container: gs / inline-size; min-height: 100vh; background: var(--page); color: var(--text); font: 400 16px/1.5 var(--font-text); padding-bottom: 44px; }
  .kit-phone-clip .gs-root { min-height: 100%; }
  .gs-root p, .gs-root ol, .gs-root ul, .gs-root figure { margin: 0; }
  .gs-root :focus-visible { outline: 2px solid var(--off-white); outline-offset: 2px; }
  .gs-root input:focus-visible { outline-offset: 2px; border-color: var(--off-white) !important; }
  .gs-root b { font-weight: 600; }
  .gs-wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding-inline: 16px; }
  .gs-main { display: grid; gap: 36px; padding-top: 36px; padding-bottom: 36px; }
  .gs-stack-xs { display: grid; gap: 4px; }
  .gs-stack-sm { display: grid; gap: 8px; }
  .gs-stack-md { display: grid; gap: 16px; align-content: start; }
  .gs-muted { color: var(--muted); }
  .gs-small { font: 400 13px/1.4 var(--font-text); color: var(--muted); }
  .gs-strong { font-weight: 600; }
  .gs-num-text { font-variant-numeric: tabular-nums; }
  .gs-label { font: 600 13px/1.3 var(--font-text); letter-spacing: .06em; color: var(--off-white); }
  .gs-h1 { margin: 0; font: 700 clamp(28px, 8cqi, 34px)/1.08 var(--font-heading); letter-spacing: -.01em; text-wrap: balance; }
  .gs-figure { font: 700 24px/1.15 var(--font-heading); letter-spacing: -.01em; }
  .gs-measure { max-width: 68ch; }
  .gs-center { display: flex; justify-content: center; text-align: center; }
  .gs-ico-row { display: inline-flex; align-items: center; gap: 8px; }
  .gs-rule { height: 1px; background: var(--line); }
  .gs-foot { padding-top: 16px; border-top: 1px solid var(--line); }
  .gs-inlink { background: none; border: 0; padding: 0; font: inherit; color: var(--off-white); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; cursor: pointer; transition: opacity var(--time-press) var(--ease); }
  .gs-inlink:active { opacity: .55; }
  .gs-plain { list-style: none; padding: 0; display: grid; }
  .gs-plain > li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 44px; padding: 8px 0; border-top: 1px solid var(--line); }
  .gs-plain > li:first-child { border-top: 0; }
  .gs-reached { font-weight: 600; }

  /* grids */
  .gs-grid2, .gs-grid3 { display: grid; gap: 16px; }
  .gs-cols2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
  .gs-head-split, .gs-pitch { display: grid; gap: 24px; }
  .gs-chats { display: grid; gap: 16px; }
  .gs-pz-head, .gs-sess-head { display: grid; gap: 16px; }
  .gs-top-align { align-items: start; }
  .gs-sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  .gs-title-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }

  /* tags: long ones may wrap rather than run off a phone */
  .gs-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .gs-root .mcp-tag { white-space: normal; height: auto; min-height: 26px; padding-top: 4px; padding-bottom: 4px; line-height: 1.3; }
  .gs-tagbtn { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center; cursor: pointer; color: inherit; }
  .gs-tagbtn:active { opacity: .55; }
  .gs-dot { width: 6px; height: 6px; background: var(--off-white); flex: none; }
  .gs-coverbtn, .gs-titlebtn { background: none; border: 0; padding: 0; margin: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; display: block; width: 100%; }
  .gs-coverbtn:active, .gs-titlebtn:active { opacity: .55; }
  .gs-titlebtn { width: auto; }

  /* top bar */
  .gs-top { border-bottom: 1px solid var(--line); background: var(--page); }
  .gs-top-in { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 64px; }
  .gs-brand { font: 700 20px/1.2 var(--font-heading); letter-spacing: -.01em; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer; min-height: 44px; white-space: nowrap; display: inline-flex; align-items: center; gap: 12px; }
  .gs-brand-mark { width: 32px; height: 32px; display: block; flex: none; }
  .gs-brand:active { opacity: .55; }
  .gs-nav { display: none; flex: 1; align-items: center; gap: 24px; }
  .gs-top-end { display: flex; align-items: center; gap: 16px; margin-left: auto; }
  .gs-wide-only { display: none; align-items: center; gap: 16px; }
  .gs-navlink { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; padding: 0; min-height: 44px; cursor: pointer; color: var(--text); font: 600 16px/1.2 var(--font-text); white-space: nowrap; }
  .gs-navlink[aria-current="page"] { box-shadow: inset 0 -2px 0 var(--off-white); }
  .gs-navlink:active { opacity: .55; }
  .gs-acct { position: relative; }
  .gs-acct-btn .mcp-ico { transition: transform var(--time-dropdown) var(--ease); }
  .gs-acct-btn[aria-expanded="true"] .mcp-ico { transform: rotate(180deg); }
  .gs-pop { position: absolute; right: 0; top: calc(100% + 8px); min-width: 200px; background: var(--popup); border: 1px solid var(--control-edge); box-shadow: var(--shadow-card); display: grid; padding: 4px 0; z-index: 50; }
  .gs-pop .gs-menu-item { padding: 0 16px; }
  .gs-menu-list { display: grid; }
  .gs-menu-item { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); min-height: 48px; padding: 0; color: var(--text); font: 600 16px/1.2 var(--font-text); cursor: pointer; }
  .gs-pop .gs-menu-item { border-bottom: 0; }
  .gs-menu-item:active { background: color-mix(in srgb, var(--text) 16%, var(--popup)); }

  /* demo bar (prototype control, not product) */
  .gs-demo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 90; background: var(--page); border-top: 1px dashed var(--control-edge); }
  .gs-demo-in { display: flex; align-items: center; justify-content: center; gap: 4px; min-height: 44px; padding: 0 8px; font: 600 13px/1.3 var(--font-text); color: var(--muted); white-space: nowrap; }
  .gs-demo-sep { width: 1px; height: 20px; background: var(--control-edge); margin: 0 12px; }
  .gs-demo-in { flex-wrap: nowrap; overflow-x: auto; justify-content: safe center; }
  .gs-demo-in > * { flex: none; }
  .gs-demo-opt { min-height: 44px; padding: 0 8px; background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; }
  .gs-demo-opt[aria-pressed="true"] { color: var(--text); box-shadow: inset 0 -2px 0 var(--off-white); }

  /* home */
  .gs-home { padding-top: 0; }
  .gs-hero2 { display: grid; gap: 24px; padding-top: 24px; }
  .gs-hero-copy { display: grid; gap: 16px; align-content: center; justify-items: start; }
  .gs-hero-sub { max-width: 40ch; }
  .gs-hero-art { position: relative; overflow: hidden; padding: 36px 16px; display: grid; }
  .gs-hero-shapes { position: absolute; inset: 0; }
  .gs-hero-shapes > svg { width: 100%; height: 100%; display: block; }
  .gs-hero-art > .gs-chat { position: relative; width: 100%; max-width: 440px; justify-self: center; }
  .gs-band { display: grid; gap: 24px; padding-top: 36px; border-top: 1px solid var(--line); }
  .gs-how { list-style: none; padding: 0; display: grid; gap: 24px; }
  .gs-how > li { display: grid; gap: 8px; align-content: start; }
  .gs-how-num { font: 700 34px/1 var(--font-heading); color: var(--off-white); font-variant-numeric: tabular-nums; }
  .gs-lead { font-size: 16px; line-height: 1.5; max-width: 44ch; }
  .gs-hero { display: grid; gap: 16px; max-width: 760px; padding-top: 12px; }
  .gs-hero-act { display: grid; gap: 12px; width: 100%; }
  .gs-hero-act > .mcp-btn { width: 100%; }
  .gs-steps { list-style: none; padding: 0; display: grid; gap: 16px; }
  .gs-step { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; align-items: start; }
  .gs-num { width: 32px; height: 32px; display: grid; place-items: center; border: 1.5px solid var(--control-edge); font: 700 16px/1 var(--font-heading); font-variant-numeric: tabular-nums; }
  .gs-step > div { padding-top: 4px; }

  /* chat window */
  .gs-chat { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); min-width: 0; }
  .gs-chat-bar { padding: 12px 16px; border-bottom: 1px solid var(--line); font: 600 13px/1.3 var(--font-text); color: var(--muted); }
  .gs-chat-body { flex: 1; padding: 16px; display: grid; gap: 12px; align-content: start; }
  .gs-chat-cap { padding: 12px 16px; border-top: 1px solid var(--line); font: 400 13px/1.4 var(--font-text); color: var(--muted); }
  .gs-me { justify-self: end; max-width: 85%; background: var(--popup); border: 1px solid var(--line); padding: 8px 12px; }
  .gs-ai { max-width: 96%; }
  .gs-panel { border: 1px solid var(--control-edge); background: var(--page); padding: 12px; display: grid; gap: 8px; justify-items: start; font-variant-numeric: tabular-nums; }
  .gs-panel .mcp-lnk { min-height: 44px; }
  .gs-panel-label { display: inline-flex; align-items: center; gap: 8px; font: 600 13px/1.3 var(--font-text); letter-spacing: .06em; color: var(--off-white); }
  .gs-panel-label img { width: 16px; height: 16px; display: block; flex: none; }
  .gs-chat.is-framed { background: var(--card); border: 1px solid var(--control-edge); box-shadow: var(--shadow-card); }
  .gs-chat.is-framed .gs-chat-bar { display: flex; align-items: center; gap: 12px; background: var(--popup); border-bottom-color: var(--control-edge); }
  .gs-win-dots { display: inline-flex; gap: 6px; }
  .gs-win-dots > i { width: 10px; height: 10px; background: var(--control-edge); }
  .gs-composer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 16px 16px; min-height: 48px; padding: 0 4px 0 12px; border: 1px solid var(--control-edge); background: var(--page); color: var(--muted); }
  .gs-composer-send { width: 40px; height: 40px; display: grid; place-items: center; background: var(--off-white); color: var(--page); }
  .gs-pair { display: flex; flex-wrap: wrap; gap: 4px 24px; font-weight: 600; }
  .gs-roll { display: flex; align-items: center; gap: 12px; }
  .gs-badge { width: 56px; height: 56px; flex: none; display: grid; place-content: center; text-align: center; gap: 2px; background: var(--warning); color: var(--warning-on); }
  .gs-badge b { font: 700 24px/1 var(--font-heading); font-variant-numeric: tabular-nums; }
  .gs-badge small { font: 600 11px/1 var(--font-text); letter-spacing: .06em; }
  .gs-threat { display: inline-flex; align-items: center; gap: 4px; color: var(--error); }
  .gs-tiles { display: flex; gap: 4px; }
  .gs-tiles > span { width: 32px; height: 32px; display: grid; place-items: center; border: 1.5px solid var(--control-edge); font: 700 18px/1 var(--font-heading); }
  .gs-tiles > span.is-on { background: var(--off-white); border-color: var(--off-white); color: var(--page); }

  /* delve */
  .gs-hero-cover { position: relative; }
  .gs-cover-over { position: absolute; left: 0; bottom: 0; padding: 16px; display: grid; gap: 4px; }
  .gs-cover-title { margin: 0; font: 700 34px/1.08 var(--font-heading); letter-spacing: -.01em; color: var(--text); }
  .gs-track { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .gs-track > i { height: 12px; background: var(--line); }
  .gs-track > i.is-on { background: var(--off-white); }
  .gs-track > i.is-threat { background: var(--error); }

  /* puzzles */
  .gs-rows { display: grid; }
  .gs-day-row { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line); }
  .gs-pz-items { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
  .gs-pz-item { display: grid; gap: 2px; text-align: left; min-height: 56px; padding: 8px 12px; background: var(--card); border: 1px solid var(--line); color: var(--text); font: inherit; cursor: pointer; transition: transform var(--time-press) var(--ease); }
  .gs-pz-item:active { transform: scale(.97); background: color-mix(in srgb, var(--text) 16%, var(--card)); }
  .gs-streak { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .gs-days { display: flex; gap: 4px; }
  .gs-days > i { width: 24px; height: 24px; border: 1.5px solid var(--control-edge); }
  .gs-days > i.is-on { background: var(--off-white); border-color: var(--off-white); }
  .gs-act { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .gs-act-end { justify-content: flex-end; }

  /* session + history */
  .gs-note { padding: 12px; border: 1px solid var(--control-edge); background: var(--card); }
  .gs-figs { display: flex; flex-wrap: wrap; gap: 8px; }
  .gs-fig { padding: 8px 12px; border: 1px solid var(--line); font-weight: 600; font-variant-numeric: tabular-nums; }
  .gs-fig-quiet { font-weight: 400; color: var(--muted); }
  .gs-pairwrap { width: 100%; max-width: 400px; }
  .gs-lines { list-style: none; padding: 0; display: grid; font-variant-numeric: tabular-nums; }
  .gs-lines > li { padding: 12px 0; border-top: 1px solid var(--line); }
  .gs-share-card { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; background: var(--card); border: 1px solid var(--line); }
  .gs-hist { list-style: none; padding: 0; display: grid; border-top: 1px solid var(--line); }
  .gs-hrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 0; color: var(--text); text-align: left; font: inherit; cursor: pointer; }
  .gs-hrow:active { background: color-mix(in srgb, var(--text) 10%, var(--page)); }
  .gs-hdate { text-align: right; }
  .gs-loss { color: var(--error); font-weight: 600; }
  .gs-status { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
  .gs-buy { display: grid; gap: 12px; padding-top: 8px; }
  .gs-buy > .mcp-btn { width: 100%; }

  /* auth, connect, checkout */
  .gs-auth { min-height: calc(100vh - 44px); display: flex; flex-direction: column; }
  .gs-auth-col { width: 100%; max-width: 440px; margin: 0 auto; padding: 8px 16px 36px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
  .gs-auth-foot { margin-top: auto; padding-top: 24px; }
  .gs-auth-head { display: grid; gap: 8px; text-align: center; }
  .gs-auth-foot { display: grid; gap: 12px; text-align: center; color: var(--muted); }
  .gs-auth-foot .gs-small { text-wrap: balance; }
  .gs-sugg { display: flex; flex-wrap: wrap; gap: 8px; }
  .gs-code .mcp-in { letter-spacing: .4em; font-variant-numeric: tabular-nums; }
  .gs-stop { font-weight: 600; outline: none; text-wrap: balance; }
  .gs-wait { min-height: 60vh; display: grid; place-content: center; justify-items: center; gap: 16px; }
  .gs-choice { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gs-copy { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
  .gs-waiting { display: flex; align-items: center; gap: 12px; padding-top: 4px; }


  /* home proposal (review candidate) */
  .gs-hero3 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 24px; }
  .gs-works { display: grid; gap: 4px; width: 100%; max-width: 44ch; padding-top: 16px; border-top: 1px solid var(--line); }
  .gs-br-wide { display: none; }
  .gs-hero-art3 { position: relative; display: grid; padding: 36px 16px; overflow: hidden; }
  .gs-hero-covers { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 4px; }
  .gs-hero-covers > span { overflow: hidden; }
  .gs-hero-covers svg { width: 100%; height: 100%; display: block; }
  .gs-shot { margin: 0; min-width: 0; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
  .gs-shot > img { display: block; width: 100%; height: auto; }
  .gs-shot > img.is-crop { object-fit: cover; object-position: top left; }
  .gs-hero-art3 > .gs-shot { position: relative; width: 100%; max-width: 600px; justify-self: center; align-self: center; border-color: var(--control-edge); }
  .gs-feats { display: grid; gap: 24px; grid-auto-flow: column; grid-auto-columns: min(280px, 82%); overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-inline: 4px; padding: 4px 4px 12px; margin: -4px -4px 0; }
  @container gs (min-width: 560px) { .gs-feats { grid-auto-columns: clamp(220px, calc((100% - 72px) / 3.4), 280px); } }
  .gs-feats > * { scroll-snap-align: center; }
  .gs-feats:focus-visible { outline: 2px solid var(--accent, #EDE8DF); outline-offset: 2px; }
  .gs-feat { display: grid; gap: 16px; align-content: start; }
  .gs-feat-body { display: grid; gap: 16px; align-content: start; justify-items: start; }
  .gs-today { display: grid; gap: 4px; width: 100%; padding-top: 16px; border-top: 1px solid var(--line); }
  .gs-today-list { list-style: none; padding: 0; display: grid; grid-auto-rows: 1fr; }
  .gs-card-eq .gs-plain { align-content: start; }
  .gs-feat .mcp-cover-art { aspect-ratio: 2 / 1; }
  @container gs (min-width: 1100px) { .gs-feats { grid-auto-flow: row; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: visible; } }
  .gs-today-list > li + li { border-top: 1px solid var(--line); }
  .gs-gdaily { display: grid; gap: 16px; }
  .gs-gdaily .mcp-cover-art { aspect-ratio: 2 / 1; }
  .gs-gcard .mcp-cover-art { aspect-ratio: 3 / 1; }
  @container gs (min-width: 720px) {
    .gs-gdaily { grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
    .gs-gdaily .mcp-cover-art { aspect-ratio: 4 / 3; }
  }
  @container gs (min-width: 1100px) {
    .gs-today-list.is-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .gs-today-list.is-row > li + li { border-top: 0; }
    .gs-today-list.is-row .gs-today-item { align-items: start; height: 100%; }
    .gs-today-list.is-row .gs-today-cover { align-self: center; }
  }
  .gs-today-item { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; min-height: 56px; padding: 12px 0; background: none; border: 0; color: var(--text); font: inherit; text-align: left; cursor: pointer; transition: opacity var(--time-press) var(--ease); }
  .gs-today-item:active { opacity: .55; }
  .gs-today-cover svg { width: 64px; height: 48px; display: block; }
  .gs-who2 { display: grid; gap: 24px; }
  .gs-who2 > div { display: grid; gap: 8px; align-content: start; }
  .gs-card-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
  @container gs (min-width: 720px) {
    .gs-who2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 36px; }
    .gs-who2 > div + div { border-left: 1px solid var(--line); padding-left: 36px; }
  }
  @container gs (min-width: 900px) {
    .gs-hero3 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; padding-top: 36px; align-items: stretch; }
    .gs-hero3 > .gs-hero-copy { gap: 24px; }
    .gs-h1.gs-h1-home { font-size: clamp(34px, calc(4.6cqi - 4px), 52px); text-wrap: initial; }
    .gs-h1.gs-h1-home > span { display: block; white-space: nowrap; }
    .gs-hero-art3 { padding: 36px 16px; align-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { .gs-today-item { transition: none; } }

  @container gs (min-width: 720px) {
    .gs-wrap { padding-inline: 24px; }
    .gs-grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    .gs-grid3 { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .gs-steps.is-row { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .gs-hero-act { display: flex; width: auto; gap: 12px; }
    .gs-hero-act > .mcp-btn { width: auto; }
    .gs-how { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 36px; }
    .gs-hero-art { padding: 36px; }
    .gs-pz-head { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 24px; align-items: end; }
    .gs-sess-head { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 24px; align-items: center; }
    .gs-choice { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .gs-buy { grid-auto-flow: column; justify-content: space-between; align-items: center; }
    .gs-buy > .mcp-btn { width: auto; }
    .gs-cover-over { padding: 24px; }
  }
  @container gs (min-width: 820px) {
    .gs-nav { display: flex; }
    .gs-wide-only { display: flex; }
    .gs-narrow-only { display: none; }
  }
  @container gs (min-width: 900px) {
    .gs-head-split { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }
    .gs-hero2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 36px; align-items: stretch; padding-top: 36px; }
    .gs-pitch { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  }
  @container gs (min-width: 1000px) {
    .gs-chats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ==== circlists-match-1..3 and first-release-games ==== */
  .gs-root { --gs-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .gs-vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .gs-iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; flex: none; background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; }
  .gs-iconbtn:active { opacity: .55; }
  .gs-iconbtn-space { width: 44px; height: 44px; flex: none; }
  .gs-auth-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px 0; }
  .gs-auth-h1 { margin: 0; display: flex; justify-content: center; align-items: center; gap: 12px; font: 700 24px/1.15 var(--font-heading); letter-spacing: -.01em; }
  .gs-auth-h1 .gs-brand-mark { width: 28px; height: 28px; }
  .gs-root .gs-btn-apple { background: #000; color: #fff; border-color: var(--control-edge); }
  .gs-root .gs-btn-apple:active, .gs-root .gs-btn-apple.is-pressed { background: #262626; }
  .gs-xline { display: flex; gap: 8px; align-items: flex-start; margin: 0; color: var(--text); font: 600 15px/1.35 var(--font-text); }
  .gs-xline.is-center { justify-content: center; text-align: center; }
  .gs-xline .mcp-ico { margin-top: 1px; }
  .gs-code .mcp-in { text-align: center; font: 600 22px/1 var(--gs-mono); letter-spacing: .4em; font-variant-numeric: tabular-nums; }
  .gs-code.gs-code-sm .mcp-in { text-align: left; font-size: 20px; }
  .gs-label-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .gs-field-label { font: 600 14px/1.2 var(--font-text); color: var(--text); }
  .gs-link-slot { min-height: 48px; align-items: center; }

  /* loader + load failed */
  .gs-full { min-height: 100vh; display: grid; place-items: center; align-content: center; padding: 24px 16px; background: var(--page); }
  .kit-phone-clip .gs-full { min-height: 100%; }
  .gs-spin-slot { width: 100px; height: 100px; display: grid; place-items: center; }
  .gs-inplace { display: grid; place-items: center; min-height: 320px; padding: 72px 16px; }
  .gs-failed { display: grid; gap: 8px; justify-items: center; text-align: center; }
  .gs-failed > .mcp-btn { margin-top: 8px; }

  /* footer */
  .gs-ft { padding: 0 0 24px; color: var(--muted); font: 500 13px/1.4 var(--font-text); }
  .gs-ft-h { margin: 0; font: 500 12px/1.2 var(--gs-mono); color: var(--text); text-transform: lowercase; }
  .gs-ft-link { background: none; border: 0; padding: 0; min-height: 44px; display: inline-flex; align-items: center; font: 500 13px/1.4 var(--font-text); color: var(--muted); cursor: pointer; text-align: left; }
  .gs-ft-link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 4px; }
  .gs-ft-link:active { opacity: .55; }
  .gs-ft-mail { color: var(--muted); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; font: 500 13px/1.4 var(--font-text); min-height: 44px; display: inline-flex; align-items: center; }
  .gs-ft-mail:hover { color: var(--text); }
  .gs-ft-copy { margin: 0; white-space: nowrap; color: var(--muted); }
  .gs-ft-wide { display: none; }
  .gs-ft-narrow { display: grid; gap: 12px; }
  .gs-ft-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .gs-ft-top .gs-ft-mail { font-family: var(--gs-mono); font-size: 12px; }
  .gs-ft-bottom { display: flex; justify-content: space-between; align-items: center; gap: 4px 16px; flex-wrap: wrap; }
  .gs-ft-run { display: flex; flex-wrap: wrap; align-items: center; gap: 0 8px; }
  .gs-ft-dot { color: var(--muted); }
  @container gs (min-width: 721px) {
    .gs-ft-wide { display: grid; grid-template-columns: minmax(0, 1fr) repeat(2, clamp(9rem, 16cqi, 200px)); column-gap: 24px; align-items: start; }
    .gs-ft-narrow { display: none; }
    .gs-ft-brand, .gs-ft-col { display: grid; grid-template-rows: 44px auto; align-content: start; justify-items: start; }
    .gs-ft-h { align-self: center; }
    .gs-ft-col { grid-template-rows: 44px; grid-auto-rows: auto; }
    .gs-ft-col .gs-ft-link, .gs-ft-col .gs-ft-mail { min-height: 32px; }
    .gs-ft-brand .gs-ft-copy { padding-top: 6px; }
  }
  @container gs (max-width: 420px) {
    .gs-ft-bottom { flex-direction: column; align-items: flex-start; }
  }
  @container gs (max-width: 300px) {
    .gs-ft-mark { display: none; }
    .gs-ft-top { justify-content: flex-start; }
  }

  /* legal */
  .gs-legal { padding-top: 36px; }
  .gs-legal-col { max-width: 720px; margin: 0 auto; display: grid; gap: 24px; }
  .gs-legal-h1 { margin: 0; font: 700 clamp(28px, 8cqi, 40px)/1.05 var(--font-heading); letter-spacing: -.015em; text-wrap: balance; }
  .gs-legal-rev { font: 400 12px/1.3 var(--gs-mono); color: var(--muted); }
  .gs-legal-sec, .gs-legal-sub { display: grid; gap: 8px; max-width: 64ch; }
