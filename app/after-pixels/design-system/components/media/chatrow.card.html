<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted);margin:24px 0 8px}</style></head><body><div id="root"></div>
<script type="text/babel">
const {ChatPicture,CardRow}=window.MCPGameStoreDesignSystem_ef1abd;
const mark='../../assets/logo.svg';
const ai=(text)=>({from:'ai',tool:'mystery',text});
const chats=[
{cap:'A body, four suspects and an inspector who answers yes or no.',turns:[{from:'user',text:'I want to play Daily Mystery.'},ai(['Daily Mystery No. 64. A storm-bound weekend at Hollowmere House. Madame Odette Varga, the medium, is dead.','The body was found in the dining room. Read the clues, ask the inspector, then make one accusation.'])]},
{cap:'Each question goes to the engine, which answers it and keeps count.',turns:[ai('The inspector says yes. One question left today.'),{from:'user',text:'Did Arthur Penhallow have the paper knife?'},ai('Yes. That was your last question.')]},
{cap:'One accusation, checked by the engine.',turns:[{from:'user',text:'It was Sebastian Wyle, with the iron poker, in the dining room.'},ai('Accuse Sebastian Wyle of the murder, with the iron poker, in the dining room? This is the one accusation today.')]}];
const Row=()=><CardRow kind="chat" title="How it looks in your chat">{chats.map(c=><figure key={c.cap} className="mcp-chatfig"><ChatPicture turns={c.turns} mark={mark} toolBy="After Pixels"/><figcaption>{c.cap}</figcaption></figure>)}</CardRow>;
ReactDOM.createRoot(document.getElementById('root')).render(<div>
<p className="cap" style={{marginTop:0}}>WIDE: THE THREE FIT AND SHARE THE WIDTH</p><Row/>
<p className="cap">NARROW (390PX): THE SAME ROW SCROLLS, PREVIOUS AND NEXT APPEAR</p><div style={{width:390}}><Row/></div>
</div>);
</script></body></html>
