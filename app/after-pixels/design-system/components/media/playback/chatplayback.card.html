<!-- @dsCard group="Components · Media" viewport="860x600" name="ChatPlayback" subtitle="Casebook hero turns playing; the right one shown at a given time" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted);margin:8px 0 0}.wrap{display:flex;gap:24px;flex-wrap:wrap;align-items:start}.seek{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;margin-top:12px;font:600 13px/1 var(--font-text);color:var(--text)}.seek input{width:100%;margin:0;min-height:44px;accent-color:var(--off-white)}a{color:var(--link)}a:hover{color:var(--text)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {ChatPlayback}=window.MCPGameStoreDesignSystem_ef1abd;
const mark='../../../assets/logo.svg';
// GS_HERO_CHAT: the three GS_CHATS.casebook chats joined (product app/gs-chats.jsx), copied as sample data.
const u=text=>({from:'user',text});
const ai=(tool,text,blocks)=>({from:'ai',tool,text,blocks});
const turns=[u('I want to play Casebook.'),
ai('casebook',['The Last Night at Gull Point. The hotel’s owner was found at the foot of the cliff stair at midnight. Three guests were still up.','You have sixteen turns. Where do you start?']),
u('Ask Maeve Doyle where she was at ten.'),
ai('casebook','“In the bar, all evening. Ask anyone.” Maeve doesn’t look up from her glass.'),
u('Search the bar.'),
ai('casebook','The last drink on Maeve’s tab was poured at 9.40.',[{type:'clues',groups:[{kind:'Evidence',facts:[{text:'The bar ledger',new:true}]}]},{type:'stats',items:[{label:'Turn',value:'4 of 16'}]}]),
u('Show Maeve the bar ledger.'),
ai('casebook','“Fine. I stepped out at quarter to ten. I went to the cliff stair, but he was already gone.”',[{type:'clues',groups:[{kind:'Evidence',facts:['The bar ledger']},{kind:'Statements',facts:[{text:'Maeve Doyle: lie exposed',new:true}]}]},{type:'stats',items:[{label:'Turn',value:'5 of 16'}]}])];
const end=ChatPlayback.duration(turns);
const fmt=ms=>(ms/1000).toFixed(1)+'s';
const Seek=()=>{const [t,setT]=React.useState(Math.round(end*.42));return <div style={{width:'min(100%,440px)'}}>
<ChatPlayback turns={turns} time={t} width={440} height={380} mark={mark} toolBy="After Pixels" label="Casebook being played in a chat"/>
<label className="seek"><input type="range" min="0" max={Math.ceil(end)} step="10" value={t} onChange={e=>setT(+e.target.value)} aria-label="Time"/><span>{fmt(t)} of {fmt(end)}</span></label>
<p className="cap">SHOWN AT A GIVEN TIME, 440PX: DRAG TO SEEK</p></div>;};
ReactDOM.createRoot(document.getElementById('root')).render(<div className="wrap">
<div style={{width:'min(100%,300px)'}}><ChatPlayback turns={turns} width={300} height={436} mark={mark} toolBy="After Pixels" label="Casebook being played in a chat"/><p className="cap">PLAYING, PHONE 300PX</p></div>
<Seek/></div>);
</script></body></html>
