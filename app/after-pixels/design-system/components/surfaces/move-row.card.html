<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:28px;background:var(--page);margin:0;color:var(--text);font:400 16px/1.5 var(--font-text)}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}.h{margin:0;font:600 13px/1.3 var(--font-text);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}</style></head><body><div id="root"></div>
<script type="text/babel">
const {MoveRow,MoveList,Disclosure}=window.MCPGameStoreDesignSystem_ef1abd;
const DELVE=[['Wisdom',['d20 1 + 1 = 2 vs 12','Search the lock-keeper\u2019s niche: natural 1, HP 10/11']],['Room',['Entered The chime run']],['Dexterity',['d20 8 + 3 = 11 vs 12','Miss, HP 9/11']],['Dexterity',['d20 9 + 3 = 12 vs 12','Weak hit']],['Dexterity',['d20 16 + 3 = 19 vs 12','Hit']],['Room',['Entered The warren']],['Turn',['As the sentries come at you, a scrawny goblin chained to the wall wrenches free and turns on his masters.','The turncoat joins']],['Dexterity',['d20 14 + 3 = 17 vs 12','Hit']],['Strength',['d20 5 + 1 = 6 vs 12','Miss, HP 7/11']]];
const WORD=[['Guess 1',['CRANE','1 in place, 1 elsewhere']],['Guess 2',['SLOTH','2 in place']],['Hint',['Letter 3 is O.']],['Guess 3',['SHORT','4 in place']],['Guess 4',['SHOUT','Solved']]];
const List=({title,lines})=><Disclosure title={title} defaultOpen><MoveList label={title}>{lines.map(([l,p],i)=><MoveRow key={i} label={l} parts={p}/>)}</MoveList></Disclosure>;
function App(){return <div style={{display:'grid',gap:28,maxWidth:760}}>
<div style={{display:'grid',gap:8}}><p className="h">Delve</p><List title="Every roll" lines={DELVE}/></div>
<div style={{display:'grid',gap:8}}><p className="h">Daily Word No. 212</p><List title="Every guess" lines={WORD}/></div>
<span className="cap">Label in ink, 600. The first part in ink, the rest muted. A part that doesn’t fit beside the one before starts a new line. No chevron, no hover: the row opens nothing. ListRow’s measure, 760px.</span>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
