<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}.cell{display:grid;gap:8px;align-content:start;min-width:0}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.MCPGameStoreDesignSystem_ef1abd;
const {Popup,Button,Heading,ListRow,RowList}=NS;
const Frame=({w,children})=><div style={{position:'relative',overflow:'hidden',height:340,width:w,background:'var(--page)',border:'1px solid var(--line)'}}>{children}</div>;
function App(){const [open,setOpen]=React.useState(true);const [busy,setBusy]=React.useState(false);
const del=()=>{setBusy(true);setTimeout(()=>{setBusy(false);setOpen(false);},1500);};
const list=<RowList label="Saves"><ListRow title="Daily Puzzles"/><ListRow title="Casebook"/><ListRow title="Dungeon Quest"/></RowList>;
return <div style={{display:'grid',gridTemplateColumns:'1.2fr 1fr',gap:12}}>
<div className="cell"><Frame><div style={{padding:12,display:'grid',gap:10,justifyItems:'start'}}><Heading level="card">Daily Puzzles</Heading><Button variant="secondary" onClick={()=>setOpen(true)}>Open the dialog</Button></div>
<Popup contained open={open} busy={busy} onClose={()=>setOpen(false)} title="Delete this save?" actions={<><Button variant="secondary" onClick={()=>setOpen(false)}>Keep it</Button><Button variant="danger" loading={busy} loadingLabel="Deleting" onClick={del}>Delete save</Button></>}><p style={{fontSize:15}}>Your progress in Daily Puzzles is removed.</p></Popup></Frame><span className="cap">kind="dialog"</span></div>
<div className="cell"><Frame><Popup contained open kind="panel" posture="sheet" title="Choose a save">{list}</Popup></Frame><span className="cap">kind="panel", phone: bottom sheet</span></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
