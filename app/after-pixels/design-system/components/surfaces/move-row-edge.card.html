<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0;color:var(--text);font:400 16px/1.5 var(--font-text)}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}.cell{display:grid;gap:8px;align-content:start;min-width:0}.box{background:var(--card);border:1px solid var(--line)}.key{margin:0;padding-left:20px;display:grid;gap:2px;font-size:14px;color:var(--muted);max-width:90ch}.key b{color:var(--text);font-weight:600}.check{font:600 13px/1.3 var(--font-text)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {MoveRow,MoveList,ListRow,RowList,Disclosure}=window.MCPGameStoreDesignSystem_ef1abd;
const LINES=[['Turn',['As the sentries come at you, a scrawny goblin chained to the wall wrenches free and turns on his masters.','The turncoat joins']],['Wisdom',['d20 1 + 1 = 2 vs 12','Search the lock-keeper\u2019s niche: natural 1, HP 10/11']],['Dexterity',['d20 16 + 3 = 19 vs 12','Hit']],['Room',['Entered The chime run']],['Guess 1',['CRANE','1 in place, 1 elsewhere']],['Hint',['Letter 3 is O.']]];
const Col=()=><div style={{display:'grid',gap:8}}>
<div className="box"><RowList label="Reference"><ListRow title="#211" result="Solved in 4 of 6" when="5 Oct"/></RowList></div>
<Disclosure title="Every move" defaultOpen><MoveList label="Every move">{LINES.map(([l,p],i)=><MoveRow key={i} label={l} parts={p}/>)}</MoveList></Disclosure>
</div>;
function Check(){
  const [msg,setMsg]=React.useState('Checking…');
  React.useEffect(()=>{const t=setTimeout(()=>{
    const rows=[...document.querySelectorAll('.mcp-move')];const ref=document.querySelector('.mcp-row.is-slots');const rc=getComputedStyle(ref);
    const pad=rows.filter((r)=>{const c=getComputedStyle(r);return c.paddingTop!==rc.paddingTop||c.paddingLeft!==rc.paddingLeft||c.paddingRight!==rc.paddingRight;});
    const over=rows.filter((r)=>r.scrollWidth>r.clientWidth+0.5||[...r.querySelectorAll('.mcp-move-parts>span')].some((s)=>s.getBoundingClientRect().right>r.getBoundingClientRect().right-15.5));
    const one=rows.filter((r)=>r.querySelector('.mcp-move-parts').getBoundingClientRect().height<=21);const off=one.filter((r)=>Math.round(r.getBoundingClientRect().height)!==62);
    const go=document.querySelectorAll('.mcp-moves .mcp-row-go,.mcp-moves svg').length;
    setMsg(rows.length+' rows · '+(pad.length?pad.length+' off ListRow padding':'ListRow padding')+' · '+(over.length?over.length+' overflow':'no overflow')+' · '+(off.length?off.length+' one-line rows not 62px':'one-line rows 62px')+' · '+(go?go+' chevrons':'no chevrons'));
  },600);return()=>clearTimeout(t);},[]);
  return <span className="check">{msg}</span>;
}
function App(){return <div style={{display:'grid',gap:16}}>
<ol className="key">
<li><b>#211</b>: a ListRow, for padding, type and separators.</li>
<li><b>Turn</b>: a long first part wraps at spaces; the second starts its own line.</li>
<li><b>Wisdom</b>: a short first part, a long second that drops under it on a phone.</li>
<li><b>Dexterity</b>, <b>Guess 1</b>: both parts on one line, 62px like a ListRow.</li>
<li><b>Room</b>, <b>Hint</b>: one part, in ink.</li>
</ol>
<Check/>
<div style={{display:'flex',flexWrap:'wrap',gap:16,alignItems:'start'}}>
<div className="cell" style={{width:320,flex:'none'}}><Col/><span className="cap">320</span></div>
<div className="cell" style={{width:442,flex:'none'}}><Col/><span className="cap">440</span></div>
<div className="cell" style={{width:760,flex:'none',flexBasis:'100%',maxWidth:760}}><Col/><span className="cap">760 (a 1024 page’s list measure)</span></div>
</div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
