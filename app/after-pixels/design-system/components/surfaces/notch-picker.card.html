<!-- @dsCard group="Components · Layout" viewport="700x520" name="NotchPicker" subtitle="Tiles, one pressed; the panel below has a notch under it" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--page);margin:0}.cap{font:400 13px/1.3 var(--font-text);color:var(--muted);margin:0 0 8px}.cell{display:grid;gap:8px;align-content:start;min-width:0;max-width:560px}.row{display:grid;gap:32px}.themed{--np-ink:#2a1f14;--np-edge:#8a6a3c;--np-on:#2a1f14;--np-on-ink:#f4ead8;--np-panel:#f4ead8;--np-panel-line:#8a6a3c;padding:16px;background:#e8d9bd;color:#2a1f14}.themed .mcp-np-panel{color:#2a1f14}</style></head><body><div id="root"></div>
<script type="text/babel">
const NS=window.MCPGameStoreDesignSystem_ef1abd;
const {NotchPicker}=NS;
const mark=(d)=><svg viewBox="6 6 28 28" width="32" height="32" focusable="false"><path d={d} fill="none" stroke="currentColor" strokeWidth="2.5"/></svg>;
const WITH_ICONS=[{id:'a',label:'Claude',icon:mark('M10 30 L20 10 L30 30 Z')},{id:'b',label:'ChatGPT',icon:mark('M12 12 H28 V28 H12 Z')},{id:'c',label:'Other apps',icon:mark('M20 10 A10 10 0 1 0 20.01 10 Z')}];
const PLAIN=[{id:'delve',label:'Game Master'},{id:'guess',label:'Host'},{id:'accuse',label:'Thinking partner'}];
function App(){
  const [v,setV]=React.useState('b');
  return <div className="row">
    <div className="cell"><p className="cap">With marks, keeping its own state</p>
      <NotchPicker label="Which app do you use?" defaultValue="a" options={WITH_ICONS}>{(id)=><p style={{margin:0}}>Setup steps for {WITH_ICONS.find(o=>o.id===id).label}.</p>}</NotchPicker></div>
    <div className="cell"><p className="cap">Names only, controlled, a fourth option</p>
      <NotchPicker label="Who the AI is" value={v} onChange={setV} options={[{id:'a',label:'Game Master'},{id:'b',label:'Host'},{id:'c',label:'Thinking partner'},{id:'d',label:'Judge'}]}><p style={{margin:0}}>Panel for {v}.</p></NotchPicker></div>
    <div className="cell"><p className="cap">Nothing pressed yet: the panel is closed</p>
      <NotchPicker label="Pick one" options={PLAIN}>{(id)=><p style={{margin:0}}>{id}</p>}</NotchPicker></div>
    <div className="cell themed"><p className="cap" style={{color:'#2a1f14'}}>A surface that recolours it through the --np-* hooks</p>
      <NotchPicker label="Themed" defaultValue="guess" options={PLAIN}>{(id)=><p style={{margin:0}}>On a light, themed surface: {id}.</p>}</NotchPicker></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
