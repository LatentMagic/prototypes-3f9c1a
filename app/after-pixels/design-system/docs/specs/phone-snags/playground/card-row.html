<!doctype html>
<html lang="en"><head><meta charset="utf-8"><base href="../../../../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Playground - Card Row</title>
<link rel="stylesheet" href="styles.css">
<style>
*{box-sizing:border-box}html,body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.5 var(--font-text);-webkit-font-smoothing:antialiased}
a{color:var(--off-white)}a:hover{color:#fff}
p{margin:0}
.pg{max-width:1280px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:40px}
.pg-lede{display:grid;gap:8px;max-width:64ch}.pg-lede h1{margin:0;font:700 28px/1.1 var(--font-heading);letter-spacing:-.01em}.pg-lede p{color:var(--muted)}
.pg-case{display:grid;gap:16px}
.pg-case>h2{margin:0;font:600 13px/1.3 var(--font-text);letter-spacing:.06em;color:var(--off-white)}
.pg-pair{display:grid;gap:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),390px))}
.pg-frame{display:grid;gap:12px;align-content:start}
.pg-tag{font:600 13px/1.3 var(--font-text);color:var(--muted)}
.pg-tag b{color:var(--text)}
.pg-screen{border:1px solid var(--line);padding:24px 16px;display:grid;gap:16px;overflow:hidden;min-width:0}
.pg-guide{position:relative}
.pg-guides .pg-guide::after{content:'';position:absolute;left:-2000px;right:-16px;top:var(--gy,0);height:1px;background:var(--error);opacity:.8;pointer-events:none}
.pg-note{font:400 14px/1.45 var(--font-text);color:var(--muted);text-wrap:pretty}
.pg-ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.pg-ctl label{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600}
.pg-ctl input{width:18px;height:18px;accent-color:var(--off-white)}
/* cards (same for both) */
.cr-card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);padding:16px;display:grid;gap:16px;align-content:start}
.cr-art{aspect-ratio:2/1;background:repeating-linear-gradient(135deg,var(--line) 0 8px,var(--card) 8px 16px);display:grid;place-items:center;font:400 12px ui-monospace,monospace;color:var(--muted)}
.cr-name{margin:0;font:700 20px/1.2 var(--font-heading)}
.cr-tags{display:flex;flex-wrap:wrap;gap:8px}
.cr-tags .mcp-tag{white-space:normal;height:auto;min-height:26px;padding-top:4px;padding-bottom:4px;line-height:1.3}
.cr-track{display:grid;gap:24px;grid-auto-flow:column;grid-auto-columns:min(280px,82%);overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:4px;padding:4px 4px 12px;margin:-4px -4px 0;scrollbar-width:none}
.cr-track::-webkit-scrollbar{display:none}
.cr-track>*{scroll-snap-align:center}
.cr-btn{width:44px;height:44px;display:inline-grid;place-items:center;flex:none;background:none;border:0;padding:0;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cr-btn:active{opacity:.55}.cr-btn svg{width:20px;height:20px}
.cr-btn:focus-visible{outline:2px solid var(--off-white);outline-offset:2px}
.cr-nav{display:flex;gap:4px}
/* today: copied from the build (.gs-rowhead / .gs-rownav) */
.is-today .cr-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px}
.is-today .cr-nav{margin-left:auto}
.is-today .cr-titles{display:grid;gap:8px}
/* proposed: the heading line is its own row; the sentence sits under both */
.is-new .cr-head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:8px;align-items:start}
.is-new .cr-title{display:block;min-height:44px;padding-block:calc((44px - 1.15em) / 2)}
.is-new .cr-nav{grid-column:2;grid-row:1}
.is-new .cr-sub{grid-column:1/-1}
.is-new .cr-titles{display:contents}
</style></head>
<body>
<main class="pg">
<header class="pg-lede"><h1>Card row: arrows on the heading line</h1><p>Each case is shown at phone width, today on the left and the proposal on the right. The cards and arrows are the same in both; only the heading line changes. The arrows work, and each one hides when you reach its end of the row.</p>
<div class="pg-ctl"><label><input type="checkbox" id="pg-guides">Show a line through the centre of the arrows</label></div></header>
<div id="pg-cases"></div>
</main>
<template id="pg-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"><path d="M20 12H5"></path><path d="M11 5L4 12L11 19"></path></g></svg></template>
<script>
const BACK=document.getElementById('pg-ico').innerHTML;
const NEXT=BACK.replace('<svg ','<svg style="transform:rotate(180deg)" ');
const GAMES=[['Casebook',['Weekly','30 minutes']],['Word',['Daily','5 minutes']],['Groups',['Daily','10 minutes']],['Delve',['Weekly','20 minutes']],['Hunter',['Daily','10 minutes']]];
const CASES=[
 {h:'Heading only',where:'Home: Available games. Discover: Just added.',title:'Available games',sub:null,
  today:'The arrows line up with the bottom of the heading, so the heading sits about 7px lower than the arrows.',
  next:'The heading and the arrows are centred on one line.'},
 {h:'Heading and a sentence',where:'Discover: Free to play.',title:'Free to play',sub:'Casebook’s first case and Delve’s first scene are free.',
  today:'The sentence takes the full width, so the arrows drop to a line of their own below it.',
  next:'The arrows stay on the heading line; the sentence runs under both at full width.'},
 {h:'A long heading on a narrow screen',where:'Not in the build yet: a test of the edge case.',title:'Free this week in every game',sub:'Each game’s free edition, for one more week.',
  today:'The heading wraps and the arrows drop below everything.',
  next:'The heading wraps beside the arrows, which stay level with its first line.'}
];
const card=([n,t])=>'<article class="cr-card"><div class="cr-art">cover</div><h3 class="cr-name">'+n+'</h3><div class="cr-tags">'+t.map(x=>'<span class="mcp-tag mcp-tag-daily">'+x+'</span>').join('')+'</div></article>';
const row=(c,kind)=>'<div class="pg-screen is-'+kind+'"><div class="cr-head"><div class="cr-titles"><h3 class="mcp-t-sec cr-title">'+c.title+'</h3>'+(c.sub?'<p class="gs-muted cr-sub" style="color:var(--muted)">'+c.sub+'</p>':'')+'</div><div class="cr-nav pg-guide"><button type="button" class="cr-btn" data-d="-1" aria-label="Previous, '+c.title+'">'+BACK+'</button><button type="button" class="cr-btn" data-d="1" aria-label="Next, '+c.title+'">'+NEXT+'</button></div></div><div class="cr-track" role="region" tabindex="0" aria-label="'+c.title+'">'+GAMES.map(card).join('')+'</div></div>';
document.getElementById('pg-cases').innerHTML=CASES.map((c,i)=>'<section class="pg-case"><h2>'+(i+1)+' · '+c.h.toUpperCase()+'</h2><p class="pg-note">'+c.where+'</p><div class="pg-pair">'+
'<div class="pg-frame"><span class="pg-tag"><b>Today</b></span>'+row(c,'today')+'<p class="pg-note">'+c.today+'</p></div>'+
'<div class="pg-frame"><span class="pg-tag"><b>Proposed</b></span>'+row(c,'new')+'<p class="pg-note">'+c.next+'</p></div></div></section>').join('');
document.querySelectorAll('.pg-screen').forEach(s=>{
 const tr=s.querySelector('.cr-track'),[p,n]=s.querySelectorAll('.cr-btn');
 const read=()=>{const st=tr.scrollLeft<=1,en=tr.scrollLeft+tr.clientWidth>=tr.scrollWidth-1;p.style.visibility=st?'hidden':'';n.style.visibility=en?'hidden':'';
  if(en&&document.activeElement===n)p.focus({preventScroll:true});if(st&&document.activeElement===p)n.focus({preventScroll:true});};
 tr.addEventListener('scroll',read,{passive:true});read();
 s.querySelectorAll('.cr-btn').forEach(b=>b.addEventListener('click',()=>{const w=tr.firstElementChild.getBoundingClientRect().width+24;tr.scrollBy({left:+b.dataset.d*w,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}));
});
const g=document.getElementById('pg-guides');
const place=()=>document.querySelectorAll('.pg-guide').forEach(el=>el.style.setProperty('--gy',(el.offsetHeight/2)+'px'));
g.addEventListener('change',()=>{document.body.classList.toggle('pg-guides',g.checked);place();});
</script>
</body></html>
