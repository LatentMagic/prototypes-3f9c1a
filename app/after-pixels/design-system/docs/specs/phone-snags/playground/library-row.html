<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><base href="../../../../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Playground - Library Row</title>
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;background:var(--page);color:var(--text);font:400 16px/1.5 var(--font-text);-webkit-font-smoothing:antialiased}
a{color:var(--off-white)}a:hover{color:#fff}p{margin:0}
.pg{max-width:1280px;margin:0 auto;padding:32px 16px 64px;display:grid;gap:32px}
.pg-lede{display:grid;gap:12px;max-width:66ch}.pg-lede h1{margin:0;font:700 28px/1.1 var(--font-heading);letter-spacing:-.01em}.pg-lede p{color:var(--muted);text-wrap:pretty}.pg-lede b{color:var(--text)}
.pg-seg{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.pg-seg span{font:600 14px/1.2 var(--font-text);color:var(--muted);margin-right:8px}
.pg-seg button{min-height:44px;padding:0 14px;background:transparent;border:1.5px solid var(--control-edge);color:var(--text);font:600 15px/1 var(--font-text);cursor:pointer}
.pg-seg button[aria-pressed="true"]{background:var(--off-white);border-color:var(--off-white);color:var(--page)}
.pg-grid{display:grid;gap:40px 24px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.pg-opt{display:grid;gap:12px;align-content:start;min-width:0}
.pg-num{font:600 13px/1.3 var(--font-text);letter-spacing:.06em;color:var(--off-white)}
.pg-name{margin:0;font:700 20px/1.2 var(--font-heading)}
.pg-q{margin:0;font:600 15px/1.4 var(--font-text);color:var(--text)}
.pg-claim,.pg-cost{margin:0;font:400 14px/1.45 var(--font-text);color:var(--muted);text-wrap:pretty}.pg-cost b{color:var(--text);font-weight:600}
.pg-phone{max-width:390px;width:100%;border:1px solid var(--line);padding:16px 0 0;background:var(--page)}
.pg-phone h2{margin:0 16px 12px;font:700 24px/1.15 var(--font-heading);letter-spacing:-.01em}
.pg-box{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.pg-box .mcp-row{padding-left:16px;padding-right:16px}
.pg-lead{width:40px;height:30px;display:block;background:repeating-linear-gradient(135deg,var(--line) 0 4px,var(--popup) 4px 8px)}
.pg-meta{color:var(--muted);font:400 13px/1.4 var(--font-text)}
</style></head><body><div id="root"></div>
<script type="text/babel">
const {RowList,ListRow}=window.MCPGameStoreDesignSystem_ef1abd;
const GAMES=[['word','Daily Word','Puzzle'],['groups','Daily Groups','Puzzle'],['mystery','Daily Mystery','Mystery'],['escape','Escape Room','Puzzle'],['casebook','Casebook','Mystery'],['delve','Delve','Adventure'],['hunter','Hunter','Adventure']];
// Per player: [today's line in the build, A result, A tone, B result, B tone, last played]
const D={
 free:{word:['Played today','Done today','ok','3 days running','ok','Today'],
  groups:['Not played today','Today’s groups are ready',null,'No run yet','none','9 Oct'],
  mystery:['Not played today','Today’s case is ready',null,'Best run 4 days','none','8 Oct'],
  escape:['Not played this week','This week’s room is ready',null,'No run yet','none','27 Sep'],
  casebook:['First case played','Free case done','ok','1 case solved','ok','13 Sep'],
  delve:['First scene played','Free scene done','ok','1 scene played','ok','14 Sep'],
  hunter:['Only with the Pass','Pass only','none','Not played','none',null]},
 pass:{word:['Played today','Done today','ok','12 days running','ok','Today'],
  groups:['Played today','Done today','ok','5 days running','ok','Today'],
  mystery:['Played today','Done today','ok','3 days running','ok','Today'],
  escape:['Played this week','Done this week','ok','4 weeks running','ok','7 Oct'],
  casebook:['In progress','In progress',null,'1 week running','ok','10 Oct'],
  delve:['Played this week','Done this week','ok','3 weeks running','ok','6 Oct'],
  hunter:['Last played 5 October','Today’s hunt is ready',null,'Best run 4 days','none','5 Oct']}
};
const lead=k=><span className="pg-lead" aria-hidden="true"></span>;
const OPTS=[
 {n:'0',name:'Today: genre and a status',q:'four different questions, one per row.',row:(g,d)=>({meta:<span className="pg-meta">{g[2]+' · '+d[0]}</span>}),
  claim:'The build’s line: genre, then whichever status applies. Shown here in the system’s row so all four compare like for like.',
  cost:<><b>Problem:</b> the line means something different on each row (when you played, what you haven’t, how far you got, whether you can). The genre repeats a filter.</>},
 {n:'A',name:'What’s waiting',q:'Is there something for me to play now?',row:(g,d)=>({result:d[1],tone:d[2]||undefined,when:d[5]||undefined}),
  claim:'One question on every row: is today’s or this week’s game done, started or ready? A tick marks the finished ones. When you last played sits on the right.',
  cost:<><b>Cost:</b> each game needs its own “ready” line (word, groups, case, room). Your record lives on the game’s page only.</>},
 {n:'B',name:'Your record',q:'How am I doing?',row:(g,d)=>({result:d[3],tone:d[4],when:d[5]||undefined}),
  claim:'Shows the run you’re on, or your best one. Rewarding for games you play often.',
  cost:<><b>Cost:</b> says nothing about whether something is waiting, and little for games you haven’t started. Repeats the game page.</>},
 {n:'C',name:'Last played only',q:'When did I last play this?',row:(g,d)=>({when:d[5]||'Not played'}),
  claim:'Just the date, matching the list’s “Last played” order. The calmest row.',
  cost:<><b>Cost:</b> never tells you something is ready. “Today” on two rows says nothing about what’s left.</>}
];
function App(){
 const [who,setWho]=React.useState(()=>localStorage.getItem('pg_libraryrow_v1')||'free');
 React.useEffect(()=>{localStorage.setItem('pg_libraryrow_v1',who);},[who]);
 return <main className="pg">
  <header className="pg-lede"><h1>Library row</h1>
   <p>The same Library list four times at phone width, for one player on <b>Sunday 11 October</b>. Only the line under each game’s name changes. Switch the player to see how each option copes with a free player and a Pass member.</p>
   <div className="pg-seg" role="group" aria-label="Player"><span>Player</span>{[['free','Free player'],['pass','Pass member']].map(([v,l])=><button key={v} type="button" aria-pressed={who===v} onClick={()=>setWho(v)}>{l}</button>)}</div>
  </header>
  <div className="pg-grid">{OPTS.map(o=><section key={o.n} className="pg-opt">
   <span className="pg-num">{o.n}</span><h2 className="pg-name">{o.name}</h2><p className="pg-q">The row answers: {o.q}</p>
   <div className="pg-phone"><h2>Library</h2><div className="pg-box"><RowList label={'Library, option '+o.n}>
    {GAMES.map(g=><ListRow key={g[0]} onClick={()=>{}} lead={lead(g[0])} title={g[1]} {...o.row(g,D[who][g[0]])}/>)}
   </RowList></div></div>
   <p className="pg-claim">{o.claim}</p><p className="pg-cost">{o.cost}</p>
  </section>)}</div>
 </main>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
