<!-- @dsCard group="Icons" viewport="700x120" name="UI glyphs" subtitle="Check, warning, error, chevron. Used in states and messages" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="display:grid;gap:8px;justify-items:center;padding:14px 0 10px;border:1px solid var(--line)"><img src="../../assets/icons/ui/check.svg" width="28" height="28" style="filter:invert(96%) sepia(6%) saturate(200%) brightness(102%)"><span class="cap">check</span></div><div style="display:grid;gap:8px;justify-items:center;padding:14px 0 10px;border:1px solid var(--line)"><img src="../../assets/icons/ui/warn.svg" width="28" height="28" style="filter:invert(96%) sepia(6%) saturate(200%) brightness(102%)"><span class="cap">warn</span></div><div style="display:grid;gap:8px;justify-items:center;padding:14px 0 10px;border:1px solid var(--line)"><img src="../../assets/icons/ui/err.svg" width="28" height="28" style="filter:invert(96%) sepia(6%) saturate(200%) brightness(102%)"><span class="cap">err</span></div><div style="display:grid;gap:8px;justify-items:center;padding:14px 0 10px;border:1px solid var(--line)"><img src="../../assets/icons/ui/down.svg" width="28" height="28" style="filter:invert(96%) sepia(6%) saturate(200%) brightness(102%)"><span class="cap">down</span></div></div></body></html>
