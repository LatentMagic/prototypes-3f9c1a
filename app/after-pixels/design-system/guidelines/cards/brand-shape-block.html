<!-- @dsCard group="Brand" viewport="700x150" name="Shape block" subtitle="Screens with no cover get a small block of cover shapes in the panel corner" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div class="row" style="gap:24px"><div style="position:relative;width:300px;height:110px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card)"><img src="../../assets/shape-blocks/panel-corner.svg" style="position:absolute;top:0;right:0;width:120px;height:76px"><p class="mcp-t-card" style="position:absolute;left:16px;top:28px;color:var(--text)">Sign in</p></div><span class="cap" style="max-width:240px">120×76 block, flush to the top-right corner. Teal, off-white and amber.</span></div></body></html>
