<!-- @dsCard group="Patterns" viewport="700x230" name="Scrolling card row" subtitle="Scrolls whenever the cards don't fit; light snap to centre. Component: CardRow" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page);margin:0}
.row{display:grid;gap:16px;grid-auto-flow:column;grid-auto-columns:220px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:4px;padding:4px 4px 12px;margin:-4px -4px 0}
.row>*{scroll-snap-align:center}
.row:focus-visible{outline:2px solid var(--off-white);outline-offset:2px}
.c{height:110px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);display:grid;align-content:end;padding:12px;font:600 14px/1.3 var(--font-text);color:var(--text)}
.cap{margin:8px 0 0;font:400 13px/1.4 var(--font-text);color:var(--muted)}
</style></head><body><div class="row" role="region" aria-label="Example card row" tabindex="0"><div class="c">Card 1</div><div class="c">Card 2</div><div class="c">Card 3</div><div class="c">Card 4</div><div class="c">Card 5</div></div><p class="cap">Scroll sideways. Cards keep their width and the next one peeks in. The row sits still only when every card fits.</p></body></html>
