<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}

.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;font:400 15px/1.45 var(--font-text);color:var(--text)">
<div style="display:grid;gap:6px;align-content:start"><span class="lab">Colour appears in</span><span>Covers and shape blocks</span><span>Status colours</span><span>Off-white for links, selected-tab line, small labels, progress and ticks</span></div>
<div style="display:grid;gap:6px;align-content:start"><span class="lab">Ruled out</span><span>Blue anywhere, and navy as a background</span><span>A player-chosen colour</span><span>Colour on the shop's own parts</span></div></div></body></html>
