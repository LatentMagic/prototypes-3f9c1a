<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="Six regular steps; every gap and padding takes one" -->
<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{padding:20px;background:var(--page)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.s{border:1px solid var(--line)}.s i{display:block;height:56px}.s span{display:grid;gap:2px;padding:8px 12px;background:var(--card);font:600 13px/1.3 var(--font-text)}.s b{font-weight:400;color:var(--muted)}
.cap{font:400 13px/1.3 var(--font-text);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lab{font:600 14px/1.2 var(--font-text);color:var(--muted)}
</style></head><body><div style="display:grid;gap:12px"><div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;font:400 14px/1.2 var(--font-text);color:var(--text)"><span>--space-1 · <span class="cap">4px</span></span><i style="display:block;height:16px;width:var(--space-1);background:var(--off-white)"></i></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;font:400 14px/1.2 var(--font-text);color:var(--text)"><span>--space-2 · <span class="cap">8px</span></span><i style="display:block;height:16px;width:var(--space-2);background:var(--off-white)"></i></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;font:400 14px/1.2 var(--font-text);color:var(--text)"><span>--space-3 · <span class="cap">12px</span></span><i style="display:block;height:16px;width:var(--space-3);background:var(--off-white)"></i></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;font:400 14px/1.2 var(--font-text);color:var(--text)"><span>--space-4 · <span class="cap">16px</span></span><i style="display:block;height:16px;width:var(--space-4);background:var(--off-white)"></i></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;font:400 14px/1.2 var(--font-text);color:var(--text)"><span>--space-5 · <span class="cap">24px</span></span><i style="display:block;height:16px;width:var(--space-5);background:var(--off-white)"></i></div><div style="display:grid;grid-template-columns:120px 1fr;align-items:center;gap:12px;font:400 14px/1.2 var(--font-text);color:var(--text)"><span>--space-6 · <span class="cap">36px</span></span><i style="display:block;height:16px;width:var(--space-6);background:var(--off-white)"></i></div></div></body></html>
