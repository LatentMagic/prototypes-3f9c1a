<!doctype html>
<!--
  Session pages 2. Mounts canon's real app by path: <base> points every relative URL at ../../canon/, and the loader reads
  canon/index.html live (styles and script tags, in canon's order), so a canon re-export is picked up with no edit here.
  Nothing from canon/ is copied or changed. See README.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Session pages 2</title>
<base href="../../canon/" />
<link rel="icon" href="assets/logo-32.png" sizes="32x32" />
<script src="../playgrounds/session-pages-2/harness/games.js"></script>
<script src="../playgrounds/session-pages-2/harness/store.js"></script>
<script>
  // Synchronous on purpose: the head must carry canon's CSS, and the body canon's script tags, before Babel scans the page.
  (function () {
    var x = new XMLHttpRequest(); x.open('GET', 'index.html', false); x.send();
    var canon = new DOMParser().parseFromString(x.responseText, 'text/html');
    canon.head.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) { document.head.appendChild(document.importNode(n, true)); });
    var css = ['harness/harness.css'];
    window.SP2.games.forEach(function (g) { css = css.concat(g.css || []); });
    css.forEach(function (f) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = window.SP2.base + f; document.head.appendChild(l); });
    window.SP2_CANON_SCRIPTS = Array.prototype.slice.call(canon.body.querySelectorAll('script')).map(function (s) { return s.outerHTML; });
  })();
</script>
</head>
<body>
<div id="sp2-shell">
  <aside id="sp2-dock" aria-label="Playground options"></aside>
  <div id="sp2-app"><div id="root"></div></div>
</div>
<script>
  (function () {
    var B = window.SP2.base;
    var tag = function (src) { return '<script type="text/babel" src="' + B + src + '"><\/script>'; };
    var mine = [];
    window.SP2.games.forEach(function (g) { g.files.forEach(function (f) { mine.push(tag(f)); }); });
    mine.push(tag('harness/page.jsx'), tag('harness/rail.jsx'), tag('harness/stage.jsx'));
    // Everything canon loads, in its order; ours go just before its main.jsx, which mounts the app and finds our hooks on window.
    window.SP2_CANON_SCRIPTS.forEach(function (s) {
      if (/app\/main\.jsx/.test(s)) { document.write(mine.join('\n')); document.write(s); document.write(tag('harness/boot.jsx')); }
      else document.write(s);
    });
  })();
</script>
</body>
</html>
