<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Native UI opportunities</title>
<link rel="stylesheet" href="../../design-system/styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../design-system/_ds_bundle.js"></script>
<script src="art.js"></script>
<style>
body{margin:0;background:var(--page);color:var(--text);font:var(--type-body);padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--link)}
.pg-top{padding:20px 16px 8px;max-width:430px;margin:0 auto}
.pg-top h1{font:var(--type-section-title);margin:0 0 6px}
.pg-top p{margin:0;color:var(--muted);text-wrap:pretty}
.pg-list{list-style:none;margin:12px auto 32px;padding:0 16px;max-width:430px;display:grid;gap:8px}
.pg-list a{display:flex;align-items:center;min-height:48px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--text);text-decoration:none;font-weight:600}
.pg-bar{display:flex;align-items:center;gap:12px;max-width:430px;margin:0 auto;padding:8px 16px;min-height:48px}
.pg-bar a{display:inline-flex;align-items:center;min-height:44px;font-weight:600}
.pg-bar span{color:var(--muted);font-size:13px;min-width:0}
.pg-stage{max-width:430px;margin:0 auto 24px;padding:0 16px}
.pg-bare .pg-stage{max-width:none;margin:0;padding:0}
.pg-bare .mcp-chat{border-radius:0;border:0;min-height:100dvh}

/* Local chat shell: the same classes ChatPicture uses, so the real parts can sit beside parts that do not exist yet. */
.pg-chat{width:100%}
.pg-chat .mcp-chat-body{padding:14px 16px 6px;gap:14px;-webkit-mask-image:none;mask-image:none;overflow:visible}
.pg-chat .mcp-chat-body>:first-child{margin-top:0}
.pg-chat .mcp-chat-ai{max-width:100%}
.pg-chat .mcp-chat-me{font-size:15px}

/* ---- New parts. Built from the design system's tokens (the --cb-* set the chat parts define). ---- */
.pg-plain{font:400 15px/1.45 var(--font-text);margin:0}
.pg-title{display:grid;gap:4px}
.pg-title p{margin:0;font-size:15px;line-height:1.45}

/* Today shelf: two slim cards */
.pg-today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;width:100%}
.pg-tcard{position:relative;display:grid;gap:6px;align-content:start;padding:10px 12px 10px;min-height:44px;border:1px solid var(--cb-edge);background:var(--cb-panel);color:var(--cb-ink);text-align:left;font:inherit;cursor:pointer;margin:0}
.pg-tcard b{font:700 15px/1.2 var(--font-heading);letter-spacing:-.01em}
.pg-tcard .pg-tno{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--cb-ink2)}.pg-tcard .pg-tno .mcp-ico{color:var(--cb-ink)}
.pg-tcard .mcp-cb-status{justify-self:start}
.pg-tcard .pg-tgo{display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--font-text);margin-top:2px}
.pg-tcard::before{content:"";position:absolute;inset:-3px 0}

/* Streak squares */
.pg-streak{display:flex;align-items:center;gap:10px;font:600 13px/1.3 var(--font-text);color:var(--cb-ink)}
.pg-days{display:flex;gap:3px}
.pg-days i{width:14px;height:14px;border:1px solid var(--cb-line);display:block}
.pg-days i.is-on{background:var(--cb-ink);border-color:var(--cb-ink)}

/* Filter chips: the control looks of a choice button, one size smaller; the picked one is pressed (ink fill). */
.pg-chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.pg-chip{position:relative;display:inline-flex;align-items:center;min-height:34px;padding:0 12px;margin:0;border:1px solid var(--cb-line);background:var(--cb-panel);color:var(--cb-ink);font:600 13px/1 var(--font-text);cursor:pointer;white-space:nowrap}
.pg-chip::before{content:"";position:absolute;inset:-5px -1px}
.pg-chip[aria-pressed="true"]{background:var(--cb-ink);border-color:var(--cb-ink);color:var(--cb-panel)}
.pg-foot{font-size:14px;color:var(--cb-ink2);margin:0}
.pg-foot a,.pg-link{color:var(--cb-ink);font-weight:600;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font:inherit;font-weight:600;cursor:pointer}

/* Thin object buttons: choice-button look, one row each, led by an icon */
.pg-objs{display:grid;gap:4px;width:100%}
.pg-obj{position:relative;display:flex;align-items:center;gap:10px;min-height:36px;padding:0 12px;margin:0;border:1px solid var(--cb-line);background:var(--cb-panel);color:var(--cb-ink);font:600 14px/1.25 var(--font-text);text-align:left;cursor:pointer}
.pg-obj::before{content:"";position:absolute;inset:-4px 0}
.pg-obj .mcp-ico{flex:none}
.pg-line{margin:0;font-size:13.5px;color:var(--cb-ink2)}
.pg-statusline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13.5px;font-weight:600}

/* Hint ladder: three rungs, filled from the bottom as hints are used */
.pg-ladder{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--cb-edge);background:var(--cb-panel)}
.pg-rungs{display:flex;align-items:flex-end;gap:3px;flex:none}
.pg-rungs i{width:14px;border:1px solid var(--cb-line);display:block}
.pg-rungs i:nth-child(1){height:10px}.pg-rungs i:nth-child(2){height:16px}.pg-rungs i:nth-child(3){height:22px}
.pg-rungs i.is-on{background:var(--cb-ink);border-color:var(--cb-ink)}
.pg-ladder-t{display:grid;gap:2px;min-width:0}
.pg-ladder-t b{font:600 14px/1.25 var(--font-text)}
.pg-ladder-t small{font-size:12.5px;color:var(--cb-ink2)}

/* A blocked exit: a statement, not a greyed-out button */
.pg-block{display:flex;align-items:center;gap:10px;min-height:40px;padding:8px 14px;border:1px dashed var(--cb-line);color:var(--cb-ink2);font:400 14px/1.3 var(--font-text);width:100%}
.pg-block .mcp-ico{flex:none}
.pg-more{width:100%;border:1px solid var(--cb-edge);background:var(--cb-panel)}
.pg-more>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;padding:0 12px;font:600 14px/1.25 var(--font-text);cursor:pointer}
.pg-more>summary::-webkit-details-marker{display:none}
.pg-more[open]>summary .mcp-ico{transform:rotate(180deg)}
.pg-more>.mcp-cb{padding:0 12px 10px}

/* Share block with Copy */
.pg-share{display:grid;gap:6px;width:100%}
.pg-share pre{margin:0;font:400 14px/1.45 var(--font-mono,ui-monospace,Menlo,monospace);background:var(--cb-panel);border:1px solid var(--cb-edge);padding:10px 12px;white-space:pre}
.pg-sharebar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pg-copy{position:relative;display:inline-flex;align-items:center;min-height:34px;padding:0 14px;margin:0;border:1px solid var(--cb-line);background:var(--cb-panel);color:var(--cb-ink);font:600 13px/1 var(--font-text);cursor:pointer}
.pg-copy::before{content:"";position:absolute;inset:-5px 0}

/* Reveal table */
.pg-reveal{width:100%;border:1px solid var(--cb-edge);background:var(--cb-panel);overflow:hidden}
.pg-reveal table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px;line-height:1.3}
.pg-reveal th{font:600 12px/1.3 var(--font-text);color:var(--cb-ink2);text-align:left;padding:8px 8px 6px;border-bottom:1px solid var(--cb-edge)}
.pg-reveal td{padding:9px 8px;vertical-align:top;border-top:1px solid color-mix(in srgb,var(--cb-edge) 70%,transparent)}
.pg-reveal tr:first-child td{border-top:0}
.pg-reveal th:nth-child(1),.pg-reveal td:nth-child(1){width:38%}
.pg-reveal tr.is-culprit td{background:var(--cb-tone);font-weight:700}
.pg-reveal .pg-who{display:block;font:600 11px/1 var(--font-text);margin-top:4px;color:var(--cb-ink)}
.pg-mark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:5px;vertical-align:-4px;flex:none}
.pg-mark.is-right{background:var(--success);color:var(--success-on)}
.pg-mark.is-wrong{background:var(--error);color:var(--error-on)}
.pg-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--cb-ink2);margin:0}
.pg-legend span{display:inline-flex;align-items:center}
.pg-legend .pg-mark{margin:0 5px 0 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const DS = window.MCPGameStoreDesignSystem_ef1abd;
const { MenuRows, StatRow, StatusTag, NavButtons, ClueCards, ResultCard, FactRows, Icon } = DS;
const ART = window.PG_ART;
const MARK = '../../design-system/assets/logo.svg';
const { useState } = React;

/* ---------- chat shell: same classes as ChatPicture; lets new parts sit beside the real ones ---------- */
const Call = ({tool}) => <span className="mcp-chat-call"><img src={MARK} alt="" width="16" height="16"/>Called {tool}<em>After Pixels</em></span>;
const Me = ({children}) => <p className="mcp-chat-me">{children}</p>;
const Ai = ({tool, children}) => <div className="mcp-chat-ai">{tool && <Call tool={tool}/>}{children}</div>;
const Chat = ({label, children}) => <div className="mcp-chat pg-chat" role="group" aria-label={label}><div className="mcp-chat-body is-auto">{children}</div></div>;
const Part = ({children, className=''}) => <div className={'mcp-cb '+className} style={{width:'100%'}}>{children}</div>;

/* ---------- new parts (local to this playground) ---------- */
function TodayShelf({cards}) {
  return <Part><div className="pg-today" role="group" aria-label="Today">{cards.map(c =>
    <button type="button" key={c.name} className={'pg-tcard'+(c.tone==='live'?' is-live':'')}>
      <b>{c.name}</b>
      <span className="pg-tno"><span>{c.no}</span><Icon name="play" size={14} label={c.go}/></span>
      <StatusTag tone={c.tone}>{c.status}</StatusTag>
    </button>)}</div></Part>;
}
function Streak({days, on}) {
  return <Part><div className="pg-streak" role="img" aria-label={days+'-day streak, '+on.filter(Boolean).length+' of 7 days played this week'}>
    <span>{days}-day streak</span>
    <span className="pg-days" aria-hidden="true">{on.map((d,i) => <i key={i} className={d?'is-on':''}/>)}</span>
  </div></Part>;
}
function Chips({items, initial}) {
  const [sel, setSel] = useState(initial);
  return <Part><div className="pg-chips" role="group" aria-label="Filter the games">{items.map(t =>
    <button type="button" key={t} className="pg-chip" aria-pressed={sel===t} onClick={() => setSel(t)}>{t}</button>)}</div></Part>;
}
function ObjectButtons({items, icon='search'}) {
  return <Part><div className="pg-objs" role="group" aria-label="Things to examine">{items.map(t =>
    <button type="button" key={t} className="pg-obj"><Icon name={icon} size={16}/>{t}</button>)}</div></Part>;
}
function HintLadder({used, label, names}) {
  return <Part><div className="pg-ladder" role="img" aria-label={label+': '+used+' of 3 used. '+names.map((n,i)=>n+(i<used?', used':', not used')).join('. ')}>
    <span className="pg-rungs" aria-hidden="true">{[0,1,2].map(i => <i key={i} className={i<used?'is-on':''}/>)}</span>
    <span className="pg-ladder-t"><b>{label}: {used} of 3 used</b><small>{names.map((n,i) => i<used ? n+' ✓' : n).join(' · ')}</small></span>
  </div></Part>;
}
function Blocked({children}) {
  return <Part><div className="pg-block"><Icon name="lock" size={16}/><span>{children}</span></div></Part>;
}
function RevealTable({rows}) {
  const Mark = ({ok}) => <span className={'pg-mark '+(ok?'is-right':'is-wrong')}><Icon name={ok?'check':'close'} size={12} label={ok?'You named this, and it was right':'You named this, and it was wrong'}/></span>;
  return <Part className="pg-reveal-wrap"><div className="pg-reveal"><table>
    <caption className="mcp-cb-sr">Where each suspect was, and what they held</caption>
    <thead><tr><th scope="col">Suspect</th><th scope="col">Room</th><th scope="col">Weapon</th></tr></thead>
    <tbody>{rows.map(r => <tr key={r.who} className={r.culprit?'is-culprit':''}>
      <td>{r.who}{r.mark.who!=null && <Mark ok={r.mark.who}/>}{r.culprit && <span className="pg-who">The murderer</span>}</td>
      <td>{r.room}{r.mark.room!=null && <Mark ok={r.mark.room}/>}</td>
      <td>{r.weapon}{r.mark.weapon!=null && <Mark ok={r.mark.weapon}/>}</td>
    </tr>)}</tbody></table></div></Part>;
}

/* ---------- the six screens ---------- */
function Screen1() {
  const rows = [
    {name:'Escape', line:'Find the way out of a locked room.', art:ART.escape, meta:'Weekly · 10 min · Pass', action:{label:'Play',icon:'play'}},
    {name:'Casebook', line:'Question the suspects.', art:ART.casebook, meta:'Episodic · 25–40 min · Pass', action:{label:'Play',icon:'play'}},
    {name:'Delve', line:'Get her out before the drums stop.', art:ART.delve, meta:'Weekly · 25–40 min · Pass', action:{label:'Play',icon:'play'}},
    {name:'The Barrow of Hollowmere', line:'Go down into the barrow.', art:ART.barrow, meta:'Episodic · Several sessions', action:{label:'Play',icon:'play'}},
    {name:'The Drowned Light', line:'A sea adventure.', art:ART.derelict, meta:'Episodic · Several sessions · Pass', action:{label:'Play',icon:'play'}},
    {name:'The Lantern Keepers', line:'Choices the story remembers.', art:ART.hunter, meta:'Episodic · 20–30 min · Pass', action:{label:'Play',icon:'play'}},
  ];
  return <Chat label="The games list, opening with today">
    <Me>What can I play?</Me>
    <Ai tool="games_library">
      <p className="pg-plain">Two dailies are waiting.</p>
      <TodayShelf cards={[
        {name:'Daily Word', no:'No. 11', status:'Not started', tone:'idle', go:'Play'},
        {name:'Daily Mystery', no:'No. 8', status:'In progress', tone:'live', go:'Continue'}]}/>
      <Streak days={4} on={[false,true,true,true,true,false,false]}/>
      <MenuRows search="Find a game" items={[]} label="Search the games"/>
      <Chips items={['All','In progress','Daily','Weekly','Episodic']} initial="All"/>
      <MenuRows items={rows} label="More games"/>
      <p className="pg-foot">Or type a game’s name · <a href="#" onClick={e=>e.preventDefault()}>What’s the Pass?</a></p>
    </Ai>
  </Chat>;
}

function Screen2() {
  return <Chat label="Daily Mystery mid-game, with notes on request">
    <Me>Was Delphine Rooke in the dining room?</Me>
    <Ai tool="games_move">
      <p className="pg-plain">The inspector says no.</p>
      <StatRow grid items={[{label:'Questions',value:1},{label:'Hints',value:2},{label:'Accusation',value:1}]}/>
      <NavButtons items={[{label:'My notes', icon:'next'},{label:'Make the accusation', icon:'next'}]}/>
    </Ai>
    <Me>My notes</Me>
    <Ai tool="games_read">
      <ClueCards groups={[
        {kind:'Who was where', facts:[{text:'Was Delphine Rooke in the dining room? **No.**', new:true}]},
        {kind:'Who had what', facts:['Delphine Rooke had the iron poker.','Colonel Rufus Hale did not have the marble bust.']},
        {kind:'Which weapon was where', facts:['The iron poker was in the library.','The vial of foxglove was in the morning room.']}]}/>
      <p className="pg-plain">In short: Delphine has the poker, the poker was in the library, Hale didn’t have the bust, and Delphine wasn’t in the dining room.</p>
    </Ai>
  </Chat>;
}

function Screen3() {
  return <Chat label="Escape, room state with thin object buttons">
    <Me>Look around the study.</Me>
    <Ai tool="games_look">
      <div className="pg-statusline"><StatusTag tone="live">In progress</StatusTag><span>18 min of 30 · 2 wrong tries · Locks 1 of 3</span></div>
      <p className="pg-plain">The Clockmaker’s Study. A safe sits behind the portrait. Three things here are still untouched.</p>
      <ObjectButtons items={['Examine the mantel clock','Examine the writing desk','Examine the portrait']}/>
      <p className="pg-line">Examined: bookcase, rug</p>
      <HintLadder used={1} label="Hints for the safe" names={['Nudge','Clue','Answer']}/>
      <ObjectButtons items={['Take the next hint']} icon="next"/>
    </Ai>
  </Chat>;
}

function Screen4() {
  return <Chat label="Adventure, where you stand">
    <Me>I push open the chapel door.</Me>
    <Ai tool="games_move">
      <div className="pg-title">
        <b className="mcp-cb-title" style={{fontSize:19}}>The Flooded Chapel</b>
        <p>Black water laps at the pews, ankle-deep and cold. A pale light falls through the broken rose window onto an altar nobody has dusted in years.</p>
      </div>
      <details className="pg-more mcp-cb" open>
        <summary><span>HP 9/12 · AC 13 · 3 items</span><Icon name="down" size={16}/></summary>
        <FactRows plain items={[{label:'HP',value:'9 of 12'},{label:'AC',value:'13'},{label:'Pack',value:'lantern, rope, silver key'}]}/>
      </details>
      <NavButtons stack items={[{label:'North: the Crypt', icon:'next'},{label:'East: the Bell Tower', icon:'next'}]}/>
      <Blocked>West: blocked by a rusted gate</Blocked>
    </Ai>
  </Chat>;
}

const SHARE = 'Daily Word No. 11  4/6\n⬛🟨⬛⬛⬛\n⬛⬛🟨🟩⬛\n🟩⬛🟩🟩⬛\n🟩🟩🟩🟩🟩';
function Screen5() {
  return <Chat label="The end of a daily, with what comes next">
    <Me>Flare.</Me>
    <Ai tool="games_move">
      <p className="pg-plain">That’s it. Solved on guess four.</p>
      <ResultCard title="Daily Word No. 11" status="Solved" stats={[
        {label:'Guesses',value:'4/6'},{label:'Hints',value:0},{label:'Streak',value:5},{label:'Next word in',value:'9 h'}]}/>
      <div className="pg-share mcp-cb">
        <pre aria-label="Spoiler-free result">{SHARE}</pre>
        <div className="pg-sharebar"><span className="pg-line">Spoiler-free. Safe to post anywhere.</span><button type="button" className="pg-copy">Copy</button></div>
      </div>
      <NavButtons items={[{label:'Back to the games', icon:'list'},{label:'Game page', out:true}]}/>
      <p className="pg-foot">Missed Tuesday’s Mystery? <button type="button" className="pg-link">Play No. 6</button></p>
    </Ai>
  </Chat>;
}

function Screen6() {
  return <Chat label="Mystery solved: the reveal grid">
    <Me>Accuse Delphine Rooke, with the marble bust, in the study.</Me>
    <Ai tool="games_move">
      <StatusTag tone="lost">Not this time</StatusTag>
      <p className="pg-plain">It was Ivy Marchbank, in the study, with the marble bust. Delphine was in the library with the iron poker.</p>
      <RevealTable rows={[
        {who:'Delphine Rooke', room:'Library', weapon:'Iron poker', mark:{who:false}},
        {who:'Ivy Marchbank', room:'Study', weapon:'Marble bust', culprit:true, mark:{room:true, weapon:true}},
        {who:'Dr Helena Strand', room:'Morning room', weapon:'Foxglove vial', mark:{}},
        {who:'Colonel Rufus Hale', room:'Dining room', weapon:'Letter opener', mark:{}}]}/>
      <p className="pg-legend"><span><span className="pg-mark is-right"><Icon name="check" size={12}/></span>You named it, right</span><span><span className="pg-mark is-wrong"><Icon name="close" size={12}/></span>You named it, wrong</span></p>
      <NavButtons items={[{label:'Back to the games', icon:'list'},{label:'Game page', out:true}]}/>
      <p className="pg-foot">Missed Tuesday’s Mystery? <button type="button" className="pg-link">Play No. 6</button></p>
    </Ai>
  </Chat>;
}

const SCREENS = [
  {n:1, label:'1 · Games list, opening with today', C:Screen1},
  {n:2, label:'2 · Daily Mystery, notes on request', C:Screen2},
  {n:3, label:'3 · Escape, thin object buttons', C:Screen3},
  {n:4, label:'4 · Adventure, where you stand', C:Screen4},
  {n:5, label:'5 · End of a daily, what comes next', C:Screen5},
  {n:6, label:'6 · Mystery solved, the reveal grid', C:Screen6},
];

function App() {
  const read = () => { const m = /^#(\d)$/.exec(location.hash); return m ? +m[1] : 0; };
  const [n, setN] = useState(read());
  React.useEffect(() => { const f = () => setN(read()); window.addEventListener('hashchange', f); return () => window.removeEventListener('hashchange', f); }, []);
  const bare = /[?&]bare\b/.test(location.search);
  document.body.classList.toggle('pg-bare', bare && n > 0);
  const s = SCREENS.find(x => x.n === n);
  if (!s) return <div>
    <div className="pg-top"><h1>Native UI opportunities</h1><p>Six chat turns drawn from the design system’s chat parts, at phone width. Pick one.</p></div>
    <ul className="pg-list">{SCREENS.map(x => <li key={x.n}><a href={'#'+x.n}>{x.label}</a></li>)}</ul>
  </div>;
  return <div>
    {!bare && <div className="pg-bar"><a href="#">← All six</a><span>{s.label}</span></div>}
    <div className="pg-stage"><s.C/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
