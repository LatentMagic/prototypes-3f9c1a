<!doctype html>
<!--
  Session-pages playground. Mounts canon's REAL app by path: <base> points every relative URL at ../../canon/, and the loader below
  reads canon/index.html live (styles and script tags, in canon's order) so a canon re-export is picked up with no edit here.
  Nothing from canon/ is copied. See README.md for the option contract.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Session pages playground</title>
<base href="../../canon/" />
<link rel="icon" href="assets/logo-32.png" sizes="32x32" />
<script src="../playgrounds/session-pages/pg/games.js"></script>
<script src="../playgrounds/session-pages/pg/share-data.js"></script>
<script src="../playgrounds/session-pages/pg/store.js"></script>
<script src="../playgrounds/session-pages/seeds/editions.js"></script>
<script src="../playgrounds/session-pages/shared/outcome.js"></script>
<script>
  // Loader. Synchronous on purpose: the head must carry canon's CSS, and the body must carry canon's script tags, before Babel scans the page.
  (function () {
    var x = new XMLHttpRequest(); x.open('GET', 'index.html', false); x.send();
    var canon = new DOMParser().parseFromString(x.responseText, 'text/html');
    canon.head.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) { document.head.appendChild(document.importNode(n, true)); });
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = window.PG_BASE + 'pg/pg.css'; document.head.appendChild(l);
    ['shared/game-tokens.css', 'shared/kit.css'].forEach(function (f) { var c = document.createElement('link'); c.rel = 'stylesheet'; c.href = window.PG_BASE + f; document.head.appendChild(c); });
    window.PG_CANON_SCRIPTS = Array.prototype.slice.call(canon.body.querySelectorAll('script')).map(function (s) { return s.outerHTML; });
  })();
</script>
</head>
<body>
<div id="pg-shell">
  <aside id="pg-dock" aria-label="Playground options"></aside>
  <div id="pg-app"><div id="root"></div></div>
</div>
<script>
  (function () {
    var B = window.PG_BASE;
    var tag = function (src) { return '<script type="text/babel" src="' + src + '"><\/script>'; };
    // A listed model file that does not exist yet is skipped, not loaded (a missing babel script would log an error and could stall the options).
    var modelExists = function (src) {
      try { var x = new XMLHttpRequest(); x.open('HEAD', src, false); x.send(); return x.status === 200; } catch (e) { return false; }
    };
    var mine = [tag(B + 'seeds/failures.jsx'), tag(B + 'pg/rail.jsx'), tag(B + 'pg/share.jsx'), tag(B + 'pg/notes.jsx'), tag(B + 'pg/stage.jsx'), tag(B + 'shared/session-kit.jsx')];
    // A game's optional reader (options/<game>-model.jsx: PgCb, PgMystery, EsModel, DvModel) loads before the game's options, so it need not sit in option 1.
    // Games listed in PG_MODELS have one; a missing file is simply not listed (a 404 on a babel script would log an error).
    window.PG_GAMES.forEach(function (g) {
      if ((window.PG_MODELS || []).indexOf(g.id) > -1 && modelExists(B + 'options/' + g.id + '-model.jsx')) mine.push(tag(B + 'options/' + g.id + '-model.jsx'));
      for (var n = 1; n <= window.PG_OPTION_COUNT; n++) mine.push(tag(B + 'options/' + g.id + '-' + n + '.jsx'));
    });
    // Everything canon loads, in its order; mine go just before its main.jsx (which mounts the app and finds our hooks on window).
    window.PG_CANON_SCRIPTS.forEach(function (s) {
      if (/app\/main\.jsx/.test(s)) { document.write(mine.join('\n')); document.write(s); document.write(tag(B + 'pg/boot.jsx')); }
      else document.write(s);
    });
  })();
</script>
</body>
</html>
