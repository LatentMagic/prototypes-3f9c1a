<!doctype html>
<html lang="en">

<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="gsa.css" />

<link rel="stylesheet" href="gsa-queue.css" />
<link rel="stylesheet" href="gsa-auth.css" />
<link rel="stylesheet" href="gsa-account.css" />
<link rel="stylesheet" href="gsa-billing.css" />
<link rel="stylesheet" href="gsa-checkout.css" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--color-canvas); color: var(--color-fg-1); font-family: var(--font-sans); }
  body { min-height: 100vh; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }

  /* ---- focus rings: first-class ---- */
  button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: var(--ring-width) solid var(--color-accent);
    outline-offset: var(--ring-offset);
  }
  input:focus-visible {
    outline-offset: 0; border-color: var(--color-accent) !important;
  }

  /* ---- config launcher (prototype aid) ---- */
  .kit-config-wrap { position: fixed; right: 16px; bottom: 16px; z-index: 300; }
  /* One pill, two halves: settings you HOLD (Config) and states you GO to
     (States, app/states-ui.jsx). Icon-only keeps it out of the way; each half
     keeps its own 44px hit target, and the whole pill still drags. */
  .kit-launcher { display: inline-flex; align-items: stretch; background: var(--color-fg-1); border-radius: var(--radius-pill); box-shadow: var(--shadow-overlay); overflow: hidden; }
  .kit-launcher-half { display: inline-flex; align-items: center; justify-content: center; width: 46px; min-height: 44px; padding: 0; background: transparent; border: 0; color: #fff; cursor: inherit; }
  .kit-launcher-half + .kit-launcher-half { box-shadow: inset 1px 0 0 rgba(255,255,255,0.2); }
  .kit-launcher-half:hover { background: rgba(255,255,255,0.1); }
  .kit-launcher-half[data-open] { color: var(--color-accent); background: rgba(255,255,255,0.08); }
  .kit-launcher-half:focus-visible { outline-offset: -3px; }
  .kit-qa-work + .kit-qa-work { margin-top: 20px; }
  .kit-qa-steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .kit-qa-stale { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border: 1px dashed var(--color-border-strong); border-radius: var(--radius-md); }

  /* ---- config modal (prototype aid; app/config.jsx) ----
     A rail of sections beside the selected section's rows; below 640px a
     bottom sheet that drills in. Its shell is .kit-config-dialog-*: the plain
     .kit-config-scrim / -modal / -head shell further down is the States and QA
     palettes'. */
  /* KEEP: an opaque surface and a plain dim scrim; no blur, so every control
     reads at full contrast over any screen behind it. */
  .kit-config-dialog-scrim {
    position: fixed; inset: 0; z-index: 400;
    background: color-mix(in srgb, var(--color-scrim) 70%, transparent);
    display: flex; align-items: center; justify-content: center; padding: var(--space-6);
    transition: opacity var(--duration-slow) ease-in-out; overscroll-behavior: contain;
  }
  .kit-config-dialog {
    width: min(960px, 100%); height: min(720px, calc(100vh - 48px));
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--color-surface); border: 1px solid var(--color-border-1);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay);
    opacity: 0; transform: scale(0.98);
    transition: opacity var(--duration-base) var(--ease-quiet), transform var(--duration-base) var(--ease-quiet);
  }
  .kit-config-dialog[data-shown] { opacity: 1; transform: none; }

  .kit-config-dialog-head {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    min-height: 64px; padding: var(--space-3) var(--space-4) var(--space-3) var(--space-6);
    border-bottom: 1px solid var(--color-border-2); flex-shrink: 0;
  }
  .kit-config-dialog-title { font: 600 var(--text-lg)/var(--leading-tight) var(--font-sans); letter-spacing: -0.01em; color: var(--color-fg-1); }
  .kit-config-dialog-subtitle { font: 400 var(--text-sm)/var(--leading-tight) var(--font-sans); color: var(--color-fg-2); margin-top: 3px; }
  .kit-config-dialog-close, .kit-config-back {
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    min-width: 44px; min-height: 44px; background: transparent; border: 0; border-radius: var(--radius-md);
    color: var(--color-fg-1); cursor: pointer;
  }
  .kit-config-dialog-close:hover, .kit-config-back:hover { background: var(--color-surface-sunken); }
  .kit-config-back { gap: 2px; padding: 0 var(--space-3) 0 var(--space-1); margin-left: calc(-1 * var(--space-2)); font: 600 var(--text-md) var(--font-sans); }

  /* Two panes: the section rail, then the selected section. */
  .kit-config-main { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 228px 1fr; }
  .kit-config-rail {
    display: flex; flex-direction: column; gap: 2px; padding: var(--space-4) var(--space-3);
    background: var(--color-page); border-right: 1px solid var(--color-border-2); overflow-y: auto;
  }
  .kit-config-rail-label {
    padding: var(--space-5) var(--space-3) var(--space-2);
    font: 600 var(--text-xs) var(--font-sans); color: var(--color-fg-3);
  }
  .kit-config-rail-btn {
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    width: 100%; min-height: 40px; padding: var(--space-2) var(--space-3); text-align: left; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: var(--radius-md); color: var(--color-fg-2);
  }
  .kit-config-rail-btn:hover { background: var(--color-surface-sunken); color: var(--color-fg-1); }
  /* The current section is lifted onto the surface: white, a hairline, a soft
     shadow, darker and heavier text. No colour bar, no fill. */
  .kit-config-rail-btn[aria-current="true"] {
    background: var(--color-surface); border-color: var(--color-border-2); color: var(--color-fg-1);
    box-shadow: 0 1px 2px rgba(24, 24, 27, 0.06);
  }
  .kit-config-rail-btn[aria-current="true"] .kit-config-rail-name { font-weight: 600; }
  .kit-config-rail-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .kit-config-rail-name { font: 500 14px/1.3 var(--font-sans); }
  .kit-config-rail-sub { font: 400 var(--text-xs)/1.3 var(--font-sans); color: var(--color-fg-3); }
  .kit-config-rail-chev { display: none; color: var(--color-fg-3); }

  .kit-config-pane { overflow-y: auto; overscroll-behavior: contain; padding: var(--space-5) var(--space-8) var(--space-6); min-width: 0; }
  .kit-config-pane-title { margin: 0 0 var(--space-2); font: 600 var(--text-xl)/var(--leading-tight) var(--font-sans); letter-spacing: -0.01em; color: var(--color-fg-1); }
  .kit-config-group + .kit-config-group { margin-top: var(--space-6); }
  .kit-config-group-heading { margin: var(--space-4) 0 0; font: 600 var(--text-sm) var(--font-sans); color: var(--color-fg-2); }

  /* A row: label column, then its choices aligned on one edge; the hint opens
     under both. Rows are divided by hairlines, nothing else. */
  .kit-config-rows { display: flex; flex-direction: column; }
  .kit-config-row {
    display: grid; grid-template-columns: 176px minmax(0, 1fr); align-items: start; column-gap: var(--space-6);
    padding: 10px 0;
  }
  .kit-config-row + .kit-config-row, .kit-config-row + .kit-config-note, .kit-config-note + .kit-config-row, .kit-config-note + .kit-config-note { border-top: 1px solid var(--color-border-2); }
  .kit-config-row-head { display: flex; align-items: center; gap: var(--space-1); min-height: 34px; min-width: 0; }
  .kit-config-row-label { font: 500 14px/1.35 var(--font-sans); color: var(--color-fg-1); }
  .kit-config-info {
    position: relative; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 24px; height: 24px; padding: 0; border: 0; border-radius: var(--radius-pill);
    background: transparent; color: var(--color-fg-3); cursor: pointer;
  }
  /* KEEP: the mark is 16px but its hit area is 44px. */
  .kit-config-info::after { content: ''; position: absolute; inset: -10px; }
  .kit-config-info:hover, .kit-config-info[aria-expanded="true"] { color: var(--color-fg-1); background: var(--color-surface-sunken); }
  .kit-config-tip {
    grid-column: 1 / -1; margin-top: var(--space-2); padding: var(--space-2) var(--space-3); max-width: 64ch;
    border-radius: var(--radius-md); background: var(--color-surface-sunken);
    font: 400 var(--text-sm)/var(--leading-body) var(--font-sans); color: var(--color-fg-1); overflow-wrap: anywhere;
  }

  /* KEEP: options are separate bordered chips straight on the surface (no
     track around them), wrapping when they run out of room, never scrolling
     sideways. The chosen one is filled near-black: unmistakable, no accent. */
  .kit-config-seg { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
  .kit-config-seg-btn {
    min-height: 34px; padding: 0 var(--space-3); max-width: 100%; cursor: pointer;
    background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md);
    font: 500 14px/1.2 var(--font-sans); color: var(--color-fg-1); text-align: center;
    transition: background var(--duration-base), color var(--duration-base), border-color var(--duration-base);
  }
  .kit-config-seg-btn:not([data-active]):hover { border-color: var(--color-fg-3); background: var(--color-page); }
  .kit-config-seg-btn[data-active] { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-on-primary); }

  .kit-config-note { padding: var(--space-3) 0; font: 400 var(--text-sm)/var(--leading-body) var(--font-sans); color: var(--color-fg-2); }

  /* Events: one-shot acts, set apart from the settings by a rule and a heading,
     not a box. Pill-shaped with a play mark, so they never read as choices. */
  .kit-config-events { margin-top: var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--color-border-2); }
  .kit-config-events-head { display: flex; align-items: center; gap: var(--space-2); min-height: 24px; margin-bottom: var(--space-3); }
  .kit-config-events-title { font: 600 var(--text-sm) var(--font-sans); color: var(--color-fg-1); }
  .kit-config-events-sub { font: 400 var(--text-xs) var(--font-sans); color: var(--color-fg-3); }
  .kit-config-events .kit-config-tip { margin: 0 0 var(--space-3); }
  .kit-config-events-list { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .kit-config-action {
    display: inline-flex; align-items: center; gap: var(--space-2); min-height: 34px; max-width: 100%;
    padding: 0 var(--space-4) 0 var(--space-3); cursor: pointer;
    background: var(--color-surface); color: var(--color-fg-1);
    border: 1px solid var(--color-border-1); border-radius: var(--radius-pill);
    font: 500 14px/1.2 var(--font-sans); text-align: left;
  }
  .kit-config-action svg { flex-shrink: 0; color: var(--color-fg-3); fill: currentColor; }
  .kit-config-action:hover { background: var(--color-surface-sunken); border-color: var(--color-fg-3); }
  .kit-config-action:hover svg { color: var(--color-fg-1); }

  /* Below 640px: a bottom sheet that drills in. The section list, then one
     section under a back control. Nothing scrolls sideways. */
  @media (max-width: 639px) {
    .kit-config-dialog-scrim { align-items: flex-end; padding: 0; }
    .kit-config-dialog {
      width: 100%; height: 92vh; height: 92dvh; /* fixed, so drilling in never resizes the sheet */
      border-width: 1px 0 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: none; translate: 0 100%;
      transition: opacity var(--duration-base) var(--ease-quiet), translate var(--duration-slow) var(--ease-quiet);
    }
    .kit-config-dialog[data-shown] { translate: 0 0; }
    .kit-config-dialog-head { min-height: 60px; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); }
    .kit-config-dialog[data-view="section"] .kit-config-dialog-head { padding-left: var(--space-2); }
    .kit-config-main { display: block; overflow: hidden; }
    .kit-config-dialog[data-view="list"] .kit-config-pane, .kit-config-dialog[data-view="section"] .kit-config-rail { display: none; }
    .kit-config-rail, .kit-config-pane { height: 100%; overflow-y: auto; overflow-x: hidden; }
    /* KEEP: the sheet's last rows clear the home indicator. */
    .kit-config-rail { gap: 0; background: var(--color-surface); border: 0;
      padding: var(--space-2) var(--space-4) calc(var(--space-6) + env(safe-area-inset-bottom)); }
    .kit-config-rail-label { padding: var(--space-6) 0 var(--space-2); }
    .kit-config-rail-btn { min-height: 56px; padding: var(--space-2) 0; border: 0; border-radius: 0; border-bottom: 1px solid var(--color-border-2); color: var(--color-fg-1); }
    .kit-config-rail-btn:hover { background: transparent; }
    .kit-config-rail-name { font-size: var(--text-base); }
    .kit-config-rail-chev { display: inline-flex; }
    .kit-config-pane { padding: var(--space-4) var(--space-4) calc(var(--space-8) + env(safe-area-inset-bottom)); }
    .kit-config-row { grid-template-columns: minmax(0, 1fr); row-gap: var(--space-2); padding: var(--space-3) 0; }
    .kit-config-row-head { min-height: 24px; }
    .kit-config-row-label { font-size: var(--text-base); }
    .kit-config-seg-btn, .kit-config-action { min-height: 44px; }
    .kit-config-seg-btn { padding: 6px 14px; }
  }
  @media (max-width: 639px) and (prefers-reduced-motion: reduce) { .kit-config-dialog { translate: none; transition: none; } }

  /* ---- palette shell (prototype aid): the States and QA palettes share it
     (app/states-ui.jsx, app/qa.jsx), so the two read as siblings. ---- */
  .kit-config-scrim {
    position: fixed; inset: 0; z-index: 400;
    background: color-mix(in srgb, var(--color-scrim) 52%, transparent);
    display: flex; align-items: center; justify-content: center; padding: 24px;
    transition: opacity var(--duration-slow) ease-in-out;
    overscroll-behavior: contain;
  }
  .kit-config-modal {
    width: min(760px, 100%); max-height: min(84vh, 720px);
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--color-surface) 74%, transparent);
    backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
    border: 1px solid var(--color-border-1);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-overlay);
    transition: opacity var(--duration-base) var(--ease-quiet), transform var(--duration-base) var(--ease-quiet);
  }
  /* Below 640px the palettes are panels, so bottom sheets (CLAUDE.md, overlay kinds). */
  @media (max-width: 639px) {
    .kit-config-scrim { align-items: flex-end; padding: 0; }
    .kit-config-modal {
      width: 100%; max-height: 84vh;
      border-width: 1px 0 0; border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: none !important; translate: 0 100%;
      transition: opacity var(--duration-base) var(--ease-quiet), translate var(--duration-slow) var(--ease-quiet);
    }
    .kit-config-modal[data-shown] { translate: 0 0; }
  }
  @media (max-width: 639px) and (prefers-reduced-motion: reduce) { .kit-config-modal { translate: none; transition: none; } }
  .kit-config-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: var(--space-5) var(--space-5) var(--space-4);
    border-bottom: 1px solid var(--color-border-2); flex-shrink: 0;
  }
  .kit-config-title {
    font-family: var(--font-sans); font-weight: 600; font-size: var(--text-xl);
    letter-spacing: -0.01em; color: var(--color-fg-1);
  }
  .kit-config-subtitle {
    font-family: var(--font-sans); font-weight: 400; font-size: var(--text-sm);
    color: var(--color-fg-3); margin-top: 2px;
  }
  .kit-config-close {
    background: transparent; border: 0; padding: 8px; margin: -8px; cursor: pointer;
    color: var(--color-fg-2); border-radius: var(--radius-sm); display: inline-flex; flex-shrink: 0;
  }
  .kit-config-close:hover { background: var(--color-surface-sunken); color: var(--color-fg-1); }
  .kit-config-body { padding: var(--space-5); overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1 1 auto; min-height: 0; overscroll-behavior: contain; }
  .kit-config-hint {
    font-family: var(--font-sans); font-weight: 400; font-size: 12.5px; line-height: 1.5;
    color: var(--color-fg-3); margin: -2px 0 var(--space-3); overflow-wrap: anywhere;
  }
  .kit-config-btn-secondary {
    background: var(--color-surface); color: var(--color-fg-1); border: 1px solid var(--color-border-1);
    font-family: var(--font-sans); font-weight: 500; font-size: 13px; cursor: pointer;
    padding: 8px 14px; border-radius: var(--radius-md); min-height: 36px;
  }
  .kit-config-btn-secondary:hover { background: var(--color-surface-sunken); }
  .kit-config-group-title {
    font-family: var(--font-mono); font-weight: 500; font-size: 11px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-3);
    padding: 4px 0 6px;
  }

  /* ---- states palette + index (prototype aid; register in app/states.jsx) ----
     Both are derived views of the register and share their row: the label, the
     address under it, and the copy-a-link control. The palette sits in the
     palette shell above. */
  .kit-states-search { width: 100%; background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 10px 12px; min-height: 40px; font: 400 13.5px var(--font-sans); color: var(--color-fg-1); margin-bottom: var(--space-4); }
  .kit-states-groups { display: flex; flex-direction: column; gap: 4px; }
  .kit-states-group { border-bottom: 1px solid var(--color-border-2); }
  .kit-states-group-head { width: 100%; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; background: transparent; border: 0; border-radius: var(--radius-sm); cursor: pointer; text-align: left; color: var(--color-fg-3); }
  .kit-states-group-head:hover { background: var(--color-surface-sunken); }
  .kit-states-group-head .kit-config-group-title { margin: 0; flex: 1; }
  .kit-states-group-count { font: 400 11px var(--font-mono); color: var(--color-fg-3); }
  .kit-states-group-chev { display: inline-flex; transition: transform var(--duration-base) var(--ease-quiet); }
  .kit-states-group-body { columns: 260px 2; column-gap: 28px; padding-bottom: var(--space-3); }
  .kit-states-notes { margin: var(--space-2) 10px var(--space-4); padding-top: var(--space-3); border-top: 1px solid var(--color-border-2); }
  .kit-states-notes-title { font: 500 11px var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--color-fg-3); margin-bottom: 6px; }
  .kit-states-notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
  .kit-states-notes li { font: 400 13px/1.45 var(--font-sans); color: var(--color-fg-2); }
  @media (prefers-reduced-motion: reduce) { .kit-states-group-chev { transition: none; } }
  .kit-states-item { break-inside: avoid; }
  .kit-states-row { display: flex; align-items: center; gap: 4px; }
  .kit-states-jump { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; background: transparent; border: 0; cursor: pointer; padding: 7px 10px; border-radius: var(--radius-sm); }
  .kit-states-jump:hover { background: var(--color-surface-sunken); }
  .kit-states-label { font: 500 13.5px/1.3 var(--font-sans); color: var(--color-fg-1); }
  .kit-states-id { font: 400 11px/1.3 var(--font-mono); color: var(--color-fg-3); }
  .kit-states-copy { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; flex-shrink: 0; background: transparent; border: 0; border-radius: var(--radius-sm); color: var(--color-fg-3); cursor: pointer; }
  .kit-states-copy:hover { background: var(--color-surface-sunken); color: var(--color-fg-1); }
  .kit-states-copied { display: flex; align-items: center; gap: 8px; padding: 0 10px 8px; }
  .kit-states-copied > span { font: 500 11px var(--font-mono); letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-fg-3); flex-shrink: 0; }
  .kit-states-copied > input { flex: 1; min-width: 0; background: var(--color-surface-sunken); border: 1px solid var(--color-border-2); border-radius: var(--radius-sm); padding: 5px 7px; font: 400 11px var(--font-mono); color: var(--color-fg-2); }
  .kit-states-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--color-border-2); margin-top: var(--space-4); padding-top: var(--space-4); }
  .kit-index { min-height: 100vh; background: var(--color-canvas); padding: clamp(32px, 7vh, 72px) 20px 96px; }
  .kit-index-inner { max-width: 860px; margin: 0 auto; }
  .kit-index-eyebrow { font: 500 11px var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-fg-3); }
  .kit-index-title { font: 600 clamp(28px, 5vw, 38px)/1.1 var(--font-sans); letter-spacing: -0.02em; color: var(--color-fg-1); margin: 10px 0 0; }
  .kit-index-lede { font: 400 15px/1.6 var(--font-sans); color: var(--color-fg-2); margin: 12px 0 0; max-width: 62ch; text-wrap: pretty; }
  .kit-index-note { font: 400 14px/1.6 var(--font-sans); color: var(--color-fg-2); background: var(--color-surface); border: 1px solid var(--color-border-1); border-radius: var(--radius-md); padding: 12px 14px; margin: var(--space-4) 0 0; max-width: 62ch; overflow-wrap: anywhere; }
  .kit-index code { font: 400 0.92em var(--font-mono); color: var(--color-fg-1); background: var(--color-surface-sunken); border-radius: 3px; padding: 1px 5px; }
  .kit-index-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: var(--space-5) 0 var(--space-4); }
  .kit-index-bar > .kit-states-search { flex: 1; min-width: 200px; margin: 0; }

  /* ---- mobile phone frame (forced-mobile posture) ---- */
  .kit-stage {
    min-height: 100vh; width: 100%;
    background: #1c1c1a;
    background-image: radial-gradient(circle at 50% 0%, #2a2a27 0%, #161614 70%);
    display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  }
  .kit-phone {
    width: 402px; max-width: 100%;
    height: min(872px, calc(100vh - 48px));
    background: #050505; border-radius: 52px; padding: 11px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.5), 0 0 0 2px #2c2c2c, inset 0 0 0 2px #000;
    overflow: hidden;
  }
  .kit-phone-clip {
    position: relative; width: 100%; height: 100%;
    border-radius: 42px; overflow: hidden; background: var(--color-canvas);
    transform: translateZ(0); /* containing block for position:fixed overlays — a
       NON-scrolling wrapper with exactly the screen's bounds + corner radius, so
       sheets/scrims pin to the phone screen (and get clipped by its corners)
       instead of bleeding onto the bezel or riding the scrolled page */
  }
  .kit-phone-screen {
    width: 100%; height: 100%;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .kit-phone-screen::-webkit-scrollbar { width: 0; height: 0; }
  /* ---- app posture (Config → Platform: Mobile) only: the system bars ----
     Drawn over the screen, as a phone draws them over an app that fills it. The
     clip sets the space they take; content reads it as
     var(--safe-area-inset-top, env(safe-area-inset-top, 0px)), so on a real phone,
     where nothing sets the variables, env() answers (viewport-fit=cover above).
     Mobile web (Viewport: Mobile) sets nothing and draws nothing. Icons take
     --kit-status-fg, which a product sets wherever its top chrome is dark. */
  .kit-phone-clip[data-app] { --safe-area-inset-top: 59px; --safe-area-inset-bottom: 34px; }
  .kit-phone-status, .kit-phone-home { position: absolute; left: 0; right: 0; z-index: 2147483000; pointer-events: none; color: var(--kit-status-fg, var(--color-fg-1)); }
  .kit-phone-status {
    top: 0; height: var(--safe-area-inset-top); padding: 0 30px 0 36px;
    display: flex; align-items: center; justify-content: space-between;
    font: 600 16px/1 var(--font-sans); letter-spacing: -0.01em;
  }
  .kit-phone-island { position: absolute; top: 11px; left: 50%; width: 120px; height: 35px; margin-left: -60px; border-radius: 20px; background: #000; }
  .kit-phone-home { bottom: 0; height: var(--safe-area-inset-bottom); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; }
  .kit-phone-home::after { content: ''; width: 134px; height: 5px; border-radius: 3px; background: currentColor; }

  /* ---- candidate-only (remove-button): the Remove panel under the queue ---- */
  .cand-remove-button-panel { max-width: var(--width-read); margin: var(--space-5) auto 0; padding: 0 var(--space-5) 96px; }
  .cand-remove-button-count { font: 500 13px var(--font-mono); color: var(--color-fg-3); margin: 0 0 var(--space-2); }
  .cand-remove-button-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .cand-remove-button-row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); }
</style>
